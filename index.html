<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>
*{box-sizing:border-box}
html,body,#root{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{background:#050505;color:#eee}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}

:root{
 --bg:#050505;
 --card:#101010;
 --card2:#171717;
 --line:#292929;
 --muted:#888;
 --white:#fff;
 --blue:#6da8ff;
 --red:#ff5b75;
 --green:#62dc8a;
}

.app{min-height:100vh;background:var(--bg)}

.topbar{
 height:60px;
 position:sticky;
 top:0;
 z-index:100;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 18px;
 background:#080808ee;
 backdrop-filter:blur(14px);
 border-bottom:1px solid #222
}

.brand{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:900}
.logo{
 width:34px;height:34px;border-radius:9px;
 display:grid;place-items:center;
 background:#fff;color:#000;font-weight:1000
}

.layout{
 width:min(1250px,100%);
 margin:auto;
 padding:14px;
 display:grid;
 grid-template-columns:205px minmax(0,1fr) 255px;
 gap:15px
}

.sticky{position:sticky;top:75px;height:max-content}

.card,.post,.composer{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:15px
}

.card{padding:14px}
.post,.composer{padding:14px;margin-bottom:11px}

.nav button{
 width:100%;
 border:0;
 background:transparent;
 color:#888;
 padding:11px;
 border-radius:9px;
 text-align:left;
 margin-bottom:3px
}

.nav button:hover,.nav button.active{
 background:#1c1c1c;
 color:#fff
}

input,textarea{
 width:100%;
 background:#151515;
 color:#fff;
 border:1px solid #333;
 border-radius:9px;
 padding:10px;
 outline:none
}

textarea{resize:vertical}

.primary{
 background:#fff;
 color:#000;
 border:0;
 border-radius:9px;
 padding:9px 13px;
 font-weight:800
}

.secondary{
 background:#171717;
 color:#fff;
 border:1px solid #333;
 border-radius:9px;
 padding:8px 11px
}

.danger{
 background:#210d11;
 color:#ff9aaa;
 border:1px solid #5a2630;
 border-radius:9px;
 padding:8px 11px
}

.row{display:flex;align-items:center;gap:7px}
.between{display:flex;align-items:center;justify-content:space-between}
.muted{color:var(--muted);font-size:11px}
.empty{text-align:center;color:#666;padding:45px 15px}

.avatar{

 background:linear-gradient(135deg,#fff,#777);
 color:#000;

 font-weight:900;

}

.avatar.sm{width:34px;height:34px;font-size:11px}

.tabs{
 display:flex;
 gap:6px;
 overflow:auto;
 margin-bottom:11px
}

.tabs button{
 white-space:nowrap;
 padding:8px 12px;
 border-radius:9px;
 border:1px solid #292929;
 background:#111;
 color:#888
}

.tabs button.active{
 background:#fff;
 color:#000
}

/* Composer */

.composer textarea{
 min-height:85px;
 border:0;
 background:#151515;
 margin-bottom:7px
}

/* Posts */

.posthead{
 display:flex;
 align-items:center;
 gap:9px
}

.postname{font-weight:800}
.postcontent{
 margin:12px 0;

 white-space:pre-wrap;

.tag,.mention{color:var(--blue)}

.action{

 color:#888;
 border:0;
 border-radius:8px;
 padding:7px 9px
}

.action:hover{background:#1c1c1c;color:#fff}
.action.active{color:var(--red)}

.postactions{
 border-top:1px solid #242424;
 padding-top:6px;
 display:flex;
 flex-wrap:wrap
}

/* Poll */

.poll{
 background:#181818;
 border:1px solid #303030;
 border-radius:11px;
 padding:10px;
 margin:9px 0
}

.polloption{
 width:100%;
 position:relative;
 overflow:hidden;
 background:#202020;
 color:#fff;
 border:1px solid #333;
 border-radius:8px;
 padding:9px;
 text-align:left;
 margin:3px 0
}

.pollbar{
 position:absolute;
 top:0;left:0;bottom:0;
 background:#393939
}

.polltext{position:relative}

/* Comments */

.comments{
 border-top:1px solid #242424;
 margin-top:8px;
 padding-top:8px
}

.comment{
 display:flex;
 gap:7px;
 margin:8px 0
}

.comment.reply{margin-left:38px}

.commentbody{
 flex:1;
 background:#191919;
 border-radius:10px;
 padding:8px
}

/* People */

.person{
 display:flex;
 align-items:center;
 gap:8px;
 padding:8px 0;
 border-bottom:1px solid #222
}

.personinfo{
 flex:1;
 min-width:0
}

.personinfo b,.personinfo div{
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis
}

.followbtn{
 background:#fff;
 color:#000;
 border:0;
 border-radius:8px;
 padding:6px 9px;
 font-size:11px;
 font-weight:800
}

/* Stories */

.storycomposer{
 display:flex;
 gap:6px;
 margin-bottom:10px
}

.storycomposer input{flex:1}

.storyrow{
 display:flex;
 gap:9px;
 overflow:auto;
 margin-bottom:11px
}

.storyitem{
 min-width:70px;
 text-align:center;
 font-size:10px;
 color:#aaa;
 cursor:pointer
}

.storybubble{
 background:#181818;
 border:1px solid #303030;
 border-radius:11px;
 padding:10px;
 margin:6px 0
}

/* Profile */

.cover{
 height:120px;
 background:linear-gradient(135deg,#333,#080808);
 border-radius:10px
}

.profilebody{padding:0 18px 18px}

.bigavatar{
 width:80px;height:80px;
 margin-top:-40px;
 border:4px solid #101010;
 border-radius:50%;
 background:#fff;
 color:#000;
 display:grid;
 place-items:center;
 font-size:25px;
 font-weight:900
}

.bio{
 color:#bbb;
 line-height:1.45;
 margin:8px 0
}

.stats{
 display:flex;
 gap:28px;
 margin:14px 0
}

.stats b{display:block;font-size:18px}
.stats span{font-size:10px;color:#777}

/* Messaging */

.chat{
 height:680px;
 display:grid;
 grid-template-columns:235px 1fr;
 overflow:hidden;
 background:#101010;
 border:1px solid #292929;
 border-radius:15px
}

.chatlist{
 border-right:1px solid #292929;
 overflow:auto
}

.chatlisthead{
 padding:11px;
 border-bottom:1px solid #222
}

.chatitem{
 width:100%;
 display:flex;
 align-items:center;
 gap:8px;
 background:transparent;
 border:0;
 color:#fff;
 text-align:left;
 padding:10px
}

.chatitem:hover,.chatitem.active{background:#1b1b1b}

.chatinfo{flex:1;min-width:0}
.preview{
 color:#666;
 font-size:11px;
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis
}

.chatwindow{
 min-width:0;
 display:flex;
 flex-direction:column
}

.chatheader{
 display:flex;
 align-items:center;
 gap:8px;
 padding:10px;
 border-bottom:1px solid #222
}

.messages{
 flex:1;
 overflow:auto;
 padding:11px;
 display:flex;
 flex-direction:column;
 gap:6px
}

.msgrow{display:flex}
.msgrow.mine{justify-content:flex-end}

.bubble{
 max-width:76%;
 background:#202020;
 border-radius:12px;
 padding:9px 10px;
 word-break:break-word
}

.mine .bubble{
 background:#fff;
 color:#000
}

.quote{
 border-left:2px solid #777;
 padding-left:6px;
 opacity:.6;
 font-size:10px;
 margin-bottom:5px
}

.msgtools{
 display:flex;
 gap:1px;
 margin-top:3px
}

.msgtools button{
 background:transparent;
 border:0;
 padding:3px;
 font-size:12px
}

.msgmeta{
 font-size:9px;
 opacity:.5;
 text-align:right;
 margin-top:3px
}

.chatinput{
 display:flex;
 gap:6px;
 padding:8px;
 border-top:1px solid #222
}

.chatinput input{flex:1}

.chatinput button{
 border:0;
 background:#fff;
 color:#000;
 border-radius:9px;
 padding:0 14px;
 font-weight:800
}

/* Online */

.online{
 color:var(--green);
 font-size:10px
}

.offline{color:#777;font-size:10px}

/* Modal */

.modalbg{
 position:fixed;
 inset:0;
 z-index:300;
 display:grid;
 place-items:center;
 padding:15px;
 background:#000c
}

.modal{
 width:min(560px,100%);
 max-height:90vh;
 overflow:auto;
 background:#111;
 border:1px solid #333;
 border-radius:15px;
 padding:18px
}

.field{margin:10px 0}
.field label{
 display:block;
 color:#777;
 font-size:11px;
 margin-bottom:4px
}

/* Mobile */

.mobilebar{display:none}

@media(max-width:1000px){
 .layout{grid-template-columns:185px minmax(0,1fr)}
 .rightbar{display:none}
}

@media(max-width:700px){
 .layout{
  display:block;
  padding:9px 8px 70px
 }

 .leftbar{display:none}

 .mobilebar{
  display:flex;
  position:fixed;
  left:0;right:0;bottom:0;
  z-index:200;
  justify-content:space-around;
  background:#080808;
  border-top:1px solid #222
 }

 .mobilebar button{
  border:0;
  background:transparent;
  color:#777;
  padding:8px;
  font-size:10px
 }

 .mobilebar button.active{color:#fff}

 .chat{
  display:block;
  height:calc(100vh - 125px)
 }

 .chatwindow{display:none}
 .chat.open .chatlist{display:none}
 .chat.open .chatwindow{display:flex}

 .bubble{max-width:86%}
}

<body>

<div id="root"></div>

<script type="text/babel">

const {
 useState,
 useEffect
}=React;

/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig={
 apiKey:"AIzaSyDTrvD7c1UtPUUOSX7_-0VV9itC28LOg0",
 authDomain:"nexus-37600.firebaseapp.com",
 projectId:"nexus-37600",
 storageBucket:"nexus-37600.firebasestorage.app",
 messagingSenderId:"61496309341",
 appId:"1:61496309341:web:fdb3711264df47f318bfb4",
 measurementId:"G-41S50YF5RF"
};

const APP_ID="nexus-37600";

if(!firebase.apps.length){
 firebase.initializeApp(firebaseConfig);
}

const auth=firebase.auth();
const db=firebase.firestore();

function C(name){
 return db
  .collection("artifacts")
  .doc(APP_ID)
  .collection("public")
  .doc("data")
  .collection(name);
}

const TS=()=>firebase.firestore.FieldValue.serverTimestamp();

function ms(value){
 if(!value)return 0;
 if(typeof value.toMillis==="function")return value.toMillis();
 if(value.seconds)return value.seconds*1000;
 const n=new Date(value).getTime();
 return Number.isNaN(n)?0:n;
}

function ago(value){
 const diff=Date.now()-ms(value);

 if(diff<60000)return"now";
 if(diff<3600000)return Math.floor(diff/60000)+"m";
 if(diff<86400000)return Math.floor(diff/3600000)+"h";
 return Math.floor(diff/86400000)+"d";
}

function initials(name){
 return String(name||"N")
  .trim()
  .split(/\s+/)
  .slice(0,2)
  .map(x=>x[0])
  .join("")
  .toUpperCase()||"N";
}

function hashtags(text){
 return [...new Set(
  (String(text).match(/#[A-Za-z0-9_]+/g)||[])
  .map(x=>x.toLowerCase())
 )];
}

function mentions(text){
 return [...new Set(
  (String(text).match(/@[A-Za-z0-9_]+/g)||[])
  .map(x=>x.substring(1).toLowerCase())
 )];
}

function uidOf(x){
 return x?.uid||x?.userId||"";
}

function dmId(a,b){
 return [a,b].sort().join("_");
}

function errorMessage(e){
 console.error(e);
 return e?.message||"Something went wrong.";
}

window.addEventListener("error",e=>{
 console.error("Nexus error:",e.error||e.message);
});

window.addEventListener("unhandledrejection",e=>{
 console.error("Nexus promise error:",e.reason);
});

/* =========================================================
   AUTH
========================================================= */

function useAuth(){

 const[user,setUser]=useState(null);
 const[profile,setProfile]=useState(null);
 const[ready,setReady]=useState(false);

 useEffect(()=>{

  let mounted=true;

  const off=auth.onAuthStateChanged(async u=>{

   try{

    if(!u){
     await auth.signInAnonymously();
     return;
    }

    if(!mounted)return;

    setUser(u);

    const ref=C("users").doc(u.uid);
    const snap=await ref.get();

    if(!snap.exists){

     const p={
      uid:u.uid,
      displayName:"Nexus User",
      username:"user_"+u.uid.slice(0,7),
      bio:"Welcome to Nexus 👋",
      followersCount:0,
      followingCount:0,
      postsCount:0,
      createdAt:TS()
     };

     await ref.set(p);
     setProfile(p);

    }else{

     setProfile({
      uid:u.uid,
      ...snap.data()
     });

    }

    setReady(true);

   }catch(e){

    console.error("Auth:",e);
    setReady(true);

   }

  });

  return()=>{
   mounted=false;
   off();
  };

 },[]);

 return{user,profile,setProfile,ready};
}

/* =========================================================
   DATA
========================================================= */

const COLLECTIONS=[
 "users",
 "posts",
 "comments",
 "likes",
 "follows",
 "bookmarks",
 "reposts",
 "notifications",
 "messages",
 "stories",
 "polls",
 "pollVotes",
 "blocks",
 "mutes",
 "presence",
 "settings",
 "chats",
 "messageReactions"
];

function useData(uid){

 const[data,setData]=useState({});

 useEffect(()=>{

  if(!uid)return;

  const offs=[];

  COLLECTIONS.forEach(name=>{

   let q=C(name);

   if(name==="notifications"){
    q=q.where("uid","==",uid).limit(300);
   }else if(name==="messages"){
    q=q.where("members","array-contains",uid).limit(700);
   }else{
    q=q.limit(700);
   }

   const off=q.onSnapshot(
    snap=>{
     setData(old=>({
      ...old,
      [name]:snap.docs.map(d=>({
       id:d.id,
       ...d.data()
      }))
     }));
    },
    err=>{
     console.warn("Listener:",name,err.message);
    }
   );

   offs.push(off);

  });

  /*
   Compatibility with direct messages created by older
   versions of the application.
  */

  const sent=C("messages")
   .where("senderId","==",uid)
   .limit(700)
   .onSnapshot(snap=>{

    setData(old=>{

     const map=new Map(
      (old.messages||[]).map(x=>[x.id,x])
     );

     snap.docs.forEach(d=>{
      map.set(d.id,{id:d.id,...d.data()});
     });

     return{
      ...old,
      messages:[...map.values()]
     };

    });

   },()=>{});

  const received=C("messages")
   .where("receiverId","==",uid)
   .limit(700)
   .onSnapshot(snap=>{

    setData(old=>{

     const map=new Map(
      (old.messages||[]).map(x=>[x.id,x])
     );

     snap.docs.forEach(d=>{
      map.set(d.id,{id:d.id,...d.data()});
     });

     return{
      ...old,
      messages:[...map.values()]
     };

    });

   },()=>{});

  offs.push(sent,received);

  return()=>{
   offs.forEach(x=>x());
  };

 },[uid]);

 return data;
}

/* =========================================================
   NOTIFICATION
========================================================= */

async function notify(target,actor,type,extra={}){

 if(!target||!actor||target===actor)return;

 try{

  await C("notifications").add({
   uid:target,
   actorId:actor,
   type,
   read:false,
   createdAt:TS(),
   ...extra
  });

 }catch(e){
  console.warn("Notification:",e);
 }
}

/* =========================================================
   AVATAR
========================================================= */

function Avatar({name,small=false,onClick}){

 return(
  <div
   className={"avatar"+(small?" sm":"")}
   onClick={onClick}
  >
   {initials(name)}
  </div>
 );

}

/* =========================================================
   FOLLOW
========================================================= */

function FollowButton({me,target,follows}){

 if(!target||me.uid===target.uid)return null;

 const existing=follows.find(x=>
  (x.followerId||x.uid)===me.uid&&
  x.followingId===target.uid
 );

 async function toggle(){

  try{

   if(existing){

    await C("follows").doc(existing.id).delete();

   }else{

    await C("follows").add({
     followerId:me.uid,
     followingId:target.uid,
     createdAt:TS()
    });

    await notify(
     target.uid,
     me.uid,
     "follow"
    );

   }

  }catch(e){
   alert(errorMessage(e));
  }

 }

 return(
  <button
   className="followbtn"
   onClick={toggle}
  >
   {existing?"Following":"Follow"}
  </button>
 );

}

/* =========================================================
   COMPOSER
========================================================= */

function Composer({user,profile}){

 const[text,setText]=useState("");
 const[poll,setPoll]=useState(false);
 const[options,setOptions]=useState(["",""]);

 function updateOption(i,value){

  setOptions(old=>{
   const next=[...old];
   next[i]=value;
   return next;
  });

 }

 async function publish(){

  const content=text.trim();

  if(!content)return;

  try{

   const ref=C("posts").doc();

   await ref.set({
    authorId:user.uid,
    authorName:profile.displayName,
    authorUsername:profile.username,
    content,
    hashtags:hashtags(content),
    mentions:mentions(content),
    pinned:false,
    pollId:poll?ref.id:null,
    createdAt:TS()
   });

   if(poll){

    const clean=options
     .map(x=>x.trim())
     .filter(Boolean)
     .slice(0,4);

    if(clean.length>=2){

     await C("polls").doc(ref.id).set({
      postId:ref.id,
      question:content,
      options:clean.map((x,i)=>({
       id:String(i),
       text:x
      })),
      createdAt:TS()
     });

    }

   }

   for(const username of mentions(content)){

    const snap=await C("users")
     .where("username","==",username)
     .limit(1)
     .get();

    if(!snap.empty){

     await notify(
      snap.docs[0].id,
      user.uid,
      "mention",
      {postId:ref.id}
     );

    }

   }

   setText("");
   setPoll(false);
   setOptions(["",""]);

  }catch(e){
   alert(errorMessage(e));
  }

 }

 return(
  <div className="composer">

   <textarea
    value={text}
    onChange={e=>setText(e.target.value)}
    maxLength={1000}
    placeholder="What's happening on Nexus?"
   />

   {poll&&(
    <div className="poll">

     <div className="muted">
      Poll options
     </div>

     {options.map((x,i)=>(
      <input
       key={i}
       style={{marginTop:5}}
       value={x}
       onChange={e=>updateOption(i,e.target.value)}
       placeholder={"Option "+(i+1)}
      />
     ))}

     {options.length<4&&(
      <button
       className="secondary"
       style={{marginTop:6}}
       onClick={()=>setOptions([...options,""])}
      >
       + Option
      </button>
     )}

    </div>
   )}

   <div className="between">

    <button
     className="secondary"
     onClick={()=>setPoll(!poll)}
    >
     📊 Poll
    </button>

    <div className="row">

     <span className="muted">
      {text.length}/1000
     </span>

     <button
      className="primary"
      disabled={!text.trim()}
      onClick={publish}
     >
      Post
     </button>

    </div>

   </div>

  </div>
 );
}

/* =========================================================
   POLL
========================================================= */

function Poll({poll,votes,user}){

 const mine=votes.find(
  x=>x.uid===user.uid
 );

 async function vote(optionId){

  if(mine)return;

  try{

   await C("pollVotes")
    .doc(poll.id+"_"+user.uid)
    .set({
     pollId:poll.id,
     postId:poll.postId,
     uid:user.uid,
     optionId,
     createdAt:TS()
    });

  }catch(e){
   alert(errorMessage(e));
  }

 }

 const total=votes.length;

 return(
  <div className="poll">

   {poll.question&&(
    <b>{poll.question}</b>
   )}

   {poll.options.map(option=>{

    const count=votes.filter(
     x=>x.optionId===option.id
    ).length;

    const percent=total
     ?Math.round(count/total*100)
     :0;

    return(
     <button
      className="polloption"
      key={option.id}
      disabled={!!mine}
      onClick={()=>vote(option.id)}
     >

      <span
       className="pollbar"
       style={{width:percent+"%"}}
      />

      <span className="polltext">
       {option.text} — {percent}%
      </span>

     </button>
    );

   })}

   <div className="muted">
    {total} vote{total===1?"":"s"}
   </div>

  </div>
 );
}

/* =========================================================
   COMMENTS
========================================================= */

function CommentTree({
 comments,
 parentId,
 onReply,
 level=0
}){

 const children=comments
  .filter(x=>
   (x.parentId||null)===(parentId||null)
  )
  .sort((a,b)=>ms(a.createdAt)-ms(b.createdAt));

 return(
  <>
   {children.map(comment=>(
    <div
     className={"comment"+(level?" reply":"")}
     key={comment.id}
    >

     <Avatar
      small
      name={comment.userName}
     />

     <div className="commentbody">

      <b>{comment.userName}</b>

      <div style={{marginTop:3}}>
       {comment.text}
      </div>

      <button
       className="action"
       onClick={()=>onReply(comment.id)}
      >
       Reply
      </button>

      <CommentTree
       comments={comments}
       parentId={comment.id}
       onReply={onReply}
       level={level+1}
      />

     </div>

    </div>
   ))}
  </>
 );
}

/* =========================================================
   POST
========================================================= */

function Post({
 post,
 user,
 profile,
 data,
 onProfile
}){

 const[commentsOpen,setCommentsOpen]=useState(false);
 const[comment,setComment]=useState("");
 const[reply,setReply]=useState(null);
 const[editing,setEditing]=useState(false);
 const[editText,setEditText]=useState(post.content||"");
 const[report,setReport]=useState(false);

 const likes=(data.likes||[])
  .filter(x=>x.postId===post.id);

 const bookmarks=(data.bookmarks||[])
  .filter(x=>x.postId===post.id);

 const reposts=(data.reposts||[])
  .filter(x=>x.postId===post.id);

 const comments=(data.comments||[])
  .filter(x=>x.postId===post.id);

 const poll=(data.polls||[])
  .find(x=>x.postId===post.id);

 const votes=(data.pollVotes||[])
  .filter(x=>x.postId===post.id);

 const liked=likes.some(x=>x.uid===user.uid);
 const saved=bookmarks.some(x=>x.uid===user.uid);
 const reposted=reposts.some(x=>x.uid===user.uid);

 async function toggle(collection,list){

  try{

   const existing=list.find(
    x=>x.uid===user.uid
   );

   if(existing){

    await C(collection)
     .doc(existing.id)
     .delete();

   }else{

    await C(collection).add({
     postId:post.id,
     uid:user.uid,
     createdAt:TS()
    });

    if(collection==="likes"){
     await notify(
      post.authorId,
      user.uid,
      "like",
      {postId:post.id}
     );
    }

    if(collection==="reposts"){
     await notify(
      post.authorId,
      user.uid,
      "repost",
      {postId:post.id}
     );
    }

   }

  }catch(e){
   alert(errorMessage(e));
  }

 }

 async function addComment(){

  if(!comment.trim())return;

  try{

   await C("comments").add({
    postId:post.id,
    userId:user.uid,
    userName:profile.displayName,
    text:comment.trim(),
    parentId:reply||null,
    createdAt:TS()
   });

   await notify(
    post.authorId,
    user.uid,
    "comment",
    {postId:post.id}
   );

   setComment("");
   setReply(null);

  }catch(e){
   alert(errorMessage(e));
  }

 }

 async function saveEdit(){

  const content=editText.trim();

  if(!content)return;

  try{

   await C("posts").doc(post.id).update({
    content,
    hashtags:hashtags(content),
    mentions:mentions(content),
    editedAt:TS()
   });

   setEditing(false);

  }catch(e){
   alert(errorMessage(e));
  }

 }

 async function pin(){

  if(post.authorId!==user.uid)return;

  await C("posts")
   .doc(post.id)
   .update({
    pinned:!post.pinned
   })
   .catch(e=>alert(errorMessage(e)));

 }

 async function deletePost(){

  if(post.authorId!==user.uid)return;

  if(!confirm("Delete this post?"))return;

  await C("posts")
   .doc(post.id)
   .delete()
   .catch(e=>alert(errorMessage(e)));

 }

 async function submitReport(reason){

  try{

   await C("reports").add({
    reporterId:user.uid,
    targetUid:post.authorId,
    postId:post.id,
    reason,
    status:"open",
    createdAt:TS()
   });

   setReport(false);
   alert("Report submitted.");

  }catch(e){
   alert(errorMessage(e));
  }

 }

 function content(){

  return String(post.content||"")
   .split(/(#[A-Za-z0-9_]+|@[A-Za-z0-9_]+)/g)
   .map((part,i)=>{

    if(part.startsWith("#")){
     return <span className="tag" key={i}>{part}</span>;
    }

    if(part.startsWith("@")){
     return <span className="mention" key={i}>{part}</span>;
    }

    return part;

   });

 }

 return(
  <article className="post">

   <div className="posthead">

    <Avatar
     name={post.authorName}
     onClick={()=>onProfile(post.authorId)}
    />

    <div style={{minWidth:0}}>

     <div className="postname">
      {post.authorName} {post.pinned&&"📌"}
     </div>

     <div className="muted">
      @{post.authorUsername} · {ago(post.createdAt)}
      {post.editedAt&&" · edited"}
     </div>

    </div>

    <div
     className="row"
     style={{marginLeft:"auto"}}
    >

     {post.authorId===user.uid&&(
      <>
       <button
        className="action"
        onClick={()=>setEditing(!editing)}
       >
        ✎
       </button>

       <button
        className="action"
        onClick={pin}
       >
        {post.pinned?"📌":"📍"}
       </button>

       <button
        className="action"
        onClick={deletePost}
       >
        🗑
       </button>
      </>
     )}

     <button
      className="action"
      onClick={()=>setReport(true)}
     >
      🚩
     </button>

    </div>

   </div>

   {editing?(
    <div style={{marginTop:9}}>

     <textarea
      value={editText}
      onChange={e=>setEditText(e.target.value)}
     />

     <div className="row" style={{marginTop:6}}>

      <button
       className="secondary"
       onClick={()=>setEditing(false)}
      >
       Cancel
      </button>

      <button
       className="primary"
       onClick={saveEdit}
      >
       Save
      </button>

     </div>

    </div>
   ):(
    <div className="postcontent">
     {content()}
    </div>
   )}

   {poll&&(
    <Poll
     poll={poll}
     votes={votes}
     user={user}
    />
   )}

   <div className="postactions">

    <button
     className={"action "+(liked?"active":"")}
     onClick={()=>toggle("likes",likes)}
    >
     ❤️ {likes.length}
    </button>

    <button
     className="action"
     onClick={()=>setCommentsOpen(!commentsOpen)}
    >
     💬 {comments.length}
    </button>

    <button
     className={"action "+(reposted?"active":"")}
     onClick={()=>toggle("reposts",reposts)}
    >
     🔁 {reposts.length}
    </button>

    <button
     className={"action "+(saved?"active":"")}
     onClick={()=>toggle("bookmarks",bookmarks)}
    >
     🔖
    </button>

    <button
     className="action"
     onClick={()=>{
      navigator.clipboard?.writeText(post.content||"");
     }}
    >
     ↗
    </button>

   </div>

   {commentsOpen&&(
    <div className="comments">

     <CommentTree
      comments={comments}
      parentId={null}
      onReply={setReply}
     />

     {reply&&(
      <div className="muted">
       Replying to comment
       <button
        className="action"
        onClick={()=>setReply(null)}
       >
        ×
       </button>
      </div>
     )}

     <div className="row">

      <input
       value={comment}
       onChange={e=>setComment(e.target.value)}
       onKeyDown={e=>{
        if(e.key==="Enter")addComment();
       }}
       placeholder={reply?"Write a reply...":"Write a comment..."}
      />

      <button
       className="primary"
       onClick={addComment}
      >
       Send
      </button>

     </div>

    </div>
   )}

   {report&&(
    <div className="modalbg">

     <div className="modal">

      <h3>Report post</h3>

      {[
       "Spam",
       "Harassment",
       "Harmful content",
       "Impersonation",
       "Other"
      ].map(reason=>(
       <button
        className="secondary"
        style={{
         width:"100%",
         margin:"4px 0",
         textAlign:"left"
        }}
        key={reason}
        onClick={()=>submitReport(reason)}
       >
        🚩 {reason}
       </button>
      ))}

      <button
       className="secondary"
       onClick={()=>setReport(false)}
      >
       Cancel
      </button>

     </div>

    </div>
   )}

  </article>
 );
}

   STORIES
========================================================= */

function Stories({user,profile,data}){

 const[text,setText]=useState("");
 const[viewer,setViewer]=useState(null);

 const active=(data.stories||[])
  .filter(x=>ms(x.createdAt)>Date.now()-86400000)
  .sort((a,b)=>ms(b.createdAt)-ms(a.createdAt));

 const groups=[
  ...new Map(
   active.map(x=>[
    x.authorId||x.uid,
    x
   ])
  ).values()
 ];

 async function create(){

  if(!text.trim())return;

  try{

   await C("stories").add({
    authorId:user.uid,
    authorName:profile.displayName,
    authorUsername:profile.username,
    text:text.trim(),
    createdAt:TS(),
    expiresAt:new Date(Date.now()+86400000)
   });

   setText("");

  }catch(e){
   alert(errorMessage(e));
  }

 }

 return(
  <>
   <div className="storycomposer">

    <input
     value={text}
     onChange={e=>setText(e.target.value)}
     placeholder="Text story — expires in 24h"
    />

    <button
     className="primary"
     disabled={!text.trim()}
     onClick={create}
    >
     Story
    </button>

   </div>

   <div className="storyrow">

    {groups.map(s=>(
     <div
      className="storyitem"
      key={s.authorId||s.uid}
      onClick={()=>setViewer(s.authorId||s.uid)}
     >

      <Avatar
       small
       name={s.authorName}
      />

      <div>{s.authorName}</div>

     </div>
    ))}

   </div>

   {viewer&&(
    <div className="modalbg">

     <div className="modal">

      <div className="between">
       <h3>Stories</h3>
       <button
        className="secondary"
        onClick={()=>setViewer(null)}
       >
        ×
       </button>
      </div>

      {active
       .filter(x=>
        (x.authorId||x.uid)===viewer
       )
       .map(s=>(
        <div className="storybubble" key={s.id}>

         <b>{s.authorName}</b>

         <div style={{margin:"8px 0"}}>
          {s.text}
         </div>

         <div className="muted">
          {ago(s.createdAt)}
         </div>

        </div>
       ))
      }

     </div>

    </div>
   )}

  </>
 );
}

/* =========================================================
   FEED
========================================================= */

function Feed({
 user,
 profile,
 data,
 onProfile
}){

 const[tab,setTab]=useState("home");
 const[q,setQ]=useState("");

 const following=new Set(
  (data.follows||[])
   .filter(x=>(x.followerId||x.uid)===user.uid)
   .map(x=>x.followingId)
 );

 const saved=new Set(
  (data.bookmarks||[])
   .filter(x=>x.uid===user.uid)
   .map(x=>x.postId)
 );

 const blocked=new Set(
  (data.blocks||[])
   .filter(x=>x.uid===user.uid)
   .map(x=>x.blockedId)
 );

 const muted=new Set(
  (data.mutes||[])
   .filter(x=>x.uid===user.uid)
   .map(x=>x.mutedId)
 );

 let posts=[...(data.posts||[])];

 posts=posts
  .filter(x=>!blocked.has(x.authorId))
  .filter(x=>!muted.has(x.authorId));

 if(tab==="following"){
  posts=posts.filter(
   x=>x.authorId===user.uid||following.has(x.authorId)
  );
 }

 if(tab==="saved"){
  posts=posts.filter(x=>saved.has(x.id));
 }

 if(q.trim()){

  const query=q.toLowerCase();

  posts=posts.filter(x=>
   (x.content||"").toLowerCase().includes(query)||
   (x.authorName||"").toLowerCase().includes(query)||
   (x.authorUsername||"").toLowerCase().includes(query)||
   (x.hashtags||[]).some(h=>h.includes(query))
  );

 }

 posts.sort((a,b)=>{

  if(a.pinned&&!b.pinned)return-1;
  if(!a.pinned&&b.pinned)return 1;

  return ms(b.createdAt)-ms(a.createdAt);

 });

 return(
  <>

   <input
    value={q}
    onChange={e=>setQ(e.target.value)}
    placeholder="🔎 Search posts, users or hashtags..."
    style={{marginBottom:9}}
   />

   <Stories
    user={user}
    profile={profile}
    data={data}
   />

   <div className="tabs">

    <button
     className={tab==="home"?"active":""}
     onClick={()=>setTab("home")}
    >
     For You
    </button>

    <button
     className={tab==="following"?"active":""}
     onClick={()=>setTab("following")}
    >
     Following
    </button>

    <button
     className={tab==="saved"?"active":""}
     onClick={()=>setTab("saved")}
    >
     Saved
    </button>

   </div>

   <Composer
    user={user}
    profile={profile}
   />

   {posts.map(post=>(
    <Post
     key={post.id}
     post={post}
     user={user}
     profile={profile}
     data={data}
     onProfile={onProfile}
    />
   ))}

   {!posts.length&&(
    <div className="empty">
     No posts found.
    </div>
   )}

  </>
 );
}

function Explore({
 user,
 data,
 onProfile
}){

 const[q,setQ]=useState("");
 const[tab,setTab]=useState("users");

 const query=q.toLowerCase();

 const users=(data.users||[])
  .filter(x=>
   !query||
   (x.displayName||"").toLowerCase().includes(query)||
   (x.username||"").toLowerCase().includes(query)
  );

 const posts=(data.posts||[])
  .filter(x=>
   !query||
   (x.content||"").toLowerCase().includes(query)||
   (x.authorUsername||"").toLowerCase().includes(query)||
   (x.hashtags||[]).some(h=>h.includes(query))
  );

 const trend={};

 (data.posts||[]).forEach(post=>{
  (post.hashtags||[]).forEach(tag=>{
   trend[tag]=(trend[tag]||0)+1;
  });
 });

 const tags=Object.entries(trend)
  .sort((a,b)=>b[1]-a[1]);

 return(
  <>

   <input
    value={q}
    onChange={e=>setQ(e.target.value)}
    placeholder="🔎 Search Nexus..."
   />

   <div className="tabs" style={{marginTop:9}}>

    <button
     className={tab==="users"?"active":""}
     onClick={()=>setTab("users")}
    >
     Users
    </button>

    <button
     className={tab==="posts"?"active":""}
     onClick={()=>setTab("posts")}
    >
     Posts
    </button>

    <button
     className={tab==="hashtags"?"active":""}
     onClick={()=>setTab("hashtags")}
    >
     Hashtags
    </button>

   </div>

   {tab==="users"&&users.map(person=>(
    <div className="person" key={person.uid}>

     <Avatar
      small
      name={person.displayName}
      onClick={()=>onProfile(person.uid)}
     />

      className="personinfo"
      onClick={()=>onProfile(person.uid)}
      style={{cursor:"pointer"}}
     >
      <b>{person.displayName}</b>

       @{person.username}
      </div>
     </div>

     <FollowButton
      me={user}
      target={person}
      follows={data.follows||[]}
     />

    </div>
   ))}

   {tab==="posts"&&posts.map(post=>(
    <Post
     key={post.id}
     post={post}
     user={user}
     profile={{displayName:"Nexus User",username:"user"}}
     data={data}
     onProfile={onProfile}
    />
   ))}

   {tab==="hashtags"&&tags.map(([tag,count])=>(
    <div
     className="card"
     style={{marginBottom:7}}
     key={tag}
    >
     <b className="tag">{tag}</b>
     <div className="muted">
      {count} posts
     </div>
    </div>
   ))}

  </>
 );
}

/* =========================================================
   PROFILE
========================================================= */

function Profile({
 user,
 profile,
 data,
 onProfile
}){

 const[edit,setEdit]=useState(false);
 const[name,setName]=useState(profile.displayName||"");
 const[username,setUsername]=useState(profile.username||"");
 const[bio,setBio]=useState(profile.bio||"");
 const[report,setReport]=useState(false);

 const isMe=profile.uid===user.uid;

 const followers=(data.follows||[])
  .filter(x=>x.followingId===profile.uid)
  .length;

 const following=(data.follows||[])
  .filter(x=>(x.followerId||x.uid)===profile.uid)
  .length;

 const posts=(data.posts||[])
  .filter(x=>x.authorId===profile.uid)
  .sort((a,b)=>{

   if(a.pinned&&!b.pinned)return-1;
   if(!a.pinned&&b.pinned)return 1;

   return ms(b.createdAt)-ms(a.createdAt);

  });

 const blocked=(data.blocks||[])
  .some(x=>x.uid===user.uid&&x.blockedId===profile.uid);

 const muted=(data.mutes||[])
  .some(x=>x.uid===user.uid&&x.mutedId===profile.uid);

 async function save(){

  const uname=username
   .replace(/^@/,"")
   .replace(/\s+/g,"_")
   .toLowerCase();

  try{

   await C("users")
    .doc(user.uid)
    .update({
     displayName:name.trim()||"Nexus User",
     username:uname||"user_"+user.uid.slice(0,7),
     bio
    });

   setEdit(false);

  }catch(e){
   alert(errorMessage(e));
  }

 }

 async function safety(collection,field){

  const existing=(data[collection]||[])
   .find(x=>
    x.uid===user.uid&&
    x[field]===profile.uid
   );

  try{

   if(existing){

    await C(collection)
     .doc(existing.id)
     .delete();

   }else{

    await C(collection).add({
     uid:user.uid,
     [field]:profile.uid,
     createdAt:TS()
    });

   }

  }catch(e){
   alert(errorMessage(e));
  }

 }

 async function reportUser(reason){

  try{

   await C("reports").add({
    reporterId:user.uid,
    targetUid:profile.uid,
    reason,
    status:"open",
    createdAt:TS()
   });

   setReport(false);
   alert("Report submitted.");

  }catch(e){
   alert(errorMessage(e));
  }

 }

 const presence=(data.presence||[])
  .find(x=>x.uid===profile.uid);

 const settings=(data.settings||[])
  .find(x=>x.uid===profile.uid);

 const canShowOnline=settings?.showOnline!==false;

 return(
  <>

   <div className="card">

    <div className="cover"/>

    <div className="profilebody">

     <div className="bigavatar">
      {initials(profile.displayName)}
     </div>

     <h2 style={{marginBottom:0}}>
      {profile.displayName}
     </h2>

     <div className="muted">
      @{profile.username}
     </div>

     {!isMe&&canShowOnline&&(
      presence?.online
       ?<div className="online">● online</div>
       :<div className="offline">
        last seen {ago(presence?.lastSeen)}
       </div>
     )}

     <div className="bio">
      {profile.bio||"No bio yet."}
     </div>

     <div className="stats">

      <div>
       <b>{followers}</b>
       <span>Followers</span>
      </div>

      <div>
       <b>{following}</b>
       <span>Following</span>
      </div>

      <div>
       <b>{posts.length}</b>
       <span>Posts</span>
      </div>

     </div>

     {isMe?(
      <button
       className="secondary"
       onClick={()=>setEdit(true)}
      >
       Edit profile
      </button>
     ):(
      <div className="row">

       <FollowButton
        me={user}
        target={profile}
        follows={data.follows||[]}
       />

       <button
        className="secondary"
        onClick={()=>
         safety("mutes","mutedId")
        }
       >
        {muted?"Unmute":"Mute"}
       </button>

       <button
        className="danger"
        onClick={()=>
         safety("blocks","blockedId")
        }
       >
        {blocked?"Unblock":"Block"}
       </button>

       <button
        className="secondary"
        onClick={()=>setReport(true)}
       >
        🚩
       </button>

      </div>
     )}

    </div>

   </div>

   <div style={{marginTop:11}}>

    {posts.map(post=>(
     <Post
      key={post.id}
      post={post}
      user={user}
      profile={isMe?profile:{
       displayName:"Nexus User",
       username:"user"
      }}
      data={data}
      onProfile={onProfile}
     />
    ))}

   </div>

   {edit&&(
    <div className="modalbg">

     <div className="modal">

      <h2>Edit profile</h2>

      <div className="field">
       <label>Display name</label>
       <input
        value={name}
        onChange={e=>setName(e.target.value)}
       />
      </div>

      <div className="field">
       <label>Username</label>
       <input
        value={username}
        onChange={e=>setUsername(e.target.value)}
       />
      </div>

      <div className="field">
       <label>Bio</label>
       <textarea
        value={bio}
        onChange={e=>setBio(e.target.value)}
       />
      </div>

      <div
       className="row"
       style={{justifyContent:"flex-end"}}
      >

       <button
        className="secondary"
        onClick={()=>setEdit(false)}
       >
        Cancel
       </button>

       <button
        className="primary"
        onClick={save}
       >
        Save
       </button>

      </div>

     </div>

    </div>
   )}

   {report&&(
    <div className="modalbg">

     <div className="modal">

      <h3>Report @{profile.username}</h3>

      {[
       "Spam",
       "Harassment",
       "Impersonation",
       "Harmful content",
       "Other"
      ].map(reason=>(
       <button
        key={reason}
        className="secondary"
        style={{
         width:"100%",
         margin:"4px 0",
         textAlign:"left"
        }}
        onClick={()=>reportUser(reason)}
       >
        🚩 {reason}
       </button>
      ))}

      <button
       className="secondary"
       onClick={()=>setReport(false)}
      >
       Cancel
      </button>

     </div>

    </div>
   )}

  </>
 );
}

/* =========================================================
   NOTIFICATIONS
========================================================= */

function Notifications({user,data}){

 const list=(data.notifications||[])
  .filter(x=>x.uid===user.uid)
  .sort((a,b)=>ms(b.createdAt)-ms(a.createdAt));

 const users=new Map(
  (data.users||[]).map(x=>[x.uid,x])
 );

 useEffect(()=>{

  list
   .filter(x=>!x.read)
   .forEach(x=>{
    C("notifications")
     .doc(x.id)
     .update({read:true})
     .catch(()=>{});
   });

 },[list.length]);

 function text(n){

  const name=users.get(n.actorId)?.displayName||"Someone";

  if(n.type==="like")return`${name} liked your post ❤️`;
  if(n.type==="comment")return`${name} commented on your post 💬`;
  if(n.type==="follow")return`${name} followed you 👤`;
  if(n.type==="mention")return`${name} mentioned you @️⃣`;
  if(n.type==="repost")return`${name} reposted your post 🔁`;

  return`${name} interacted with you`;

 }

 return(
  <div className="card">

   <div className="between">
    <h2>🔔 Notifications</h2>

    <button
     className="secondary"
     onClick={async()=>{
      await Promise.all(
       list.map(x=>
        C("notifications")
         .doc(x.id)
         .update({read:true})
      )
      );
     }}
    >
     Read all
    </button>

   </div>

   {!list.length&&(
    <div className="empty">
     No notifications yet.
    </div>
   )}

   {list.map(n=>(
    <div
     key={n.id}
     style={{
      padding:"11px 0",
      borderBottom:"1px solid #222"
     }}
    >
     <b>{text(n)}</b>
     <div className="muted">
      {ago(n.createdAt)}
     </div>
    </div>
   ))}

  </div>
 );
}

/* =========================================================
   MESSAGES
========================================================= */

function Messages({
 user,
 profile,
 data
}){

 const[selected,setSelected]=useState(null);
 const[search,setSearch]=useState("");
 const[text,setText]=useState("");
 const[reply,setReply]=useState(null);

 const[group,setGroup]=useState(false);
 const[groupName,setGroupName]=useState("");
 const[groupMembers,setGroupMembers]=useState([]);

 const chats=(data.chats||[])
  .filter(x=>x.members?.includes(user.uid))
  .sort((a,b)=>
   ms(b.updatedAt||b.createdAt)-
   ms(a.updatedAt||a.createdAt)
  );

 const active=chats.find(x=>x.id===selected);

 const people=(data.users||[])
  .filter(x=>x.uid!==user.uid)
  .filter(x=>{

   if(!search)return false;

   const q=search.toLowerCase();

   return(
    (x.displayName||"").toLowerCase().includes(q)||
    (x.username||"").toLowerCase().includes(q)
   );

  });

 const messages=(data.messages||[])
  .filter(m=>{

   if(!active)return false;

   if(m.conversationId===active.id)return true;

   if(active.type==="dm"){

    const other=active.members.find(
     x=>x!==user.uid
    );

    return(
     (m.senderId===user.uid&&m.receiverId===other)||
     (m.receiverId===user.uid&&m.senderId===other)
    );

   }

   return false;

  })
  .sort((a,b)=>ms(a.createdAt)-ms(b.createdAt));

 function title(chat){

  if(!chat)return"";

  if(chat.type==="group"){
   return chat.name||"Group";
  }

  const other=chat.members.find(
   x=>x!==user.uid
  );

  return data.users?.find(
   x=>x.uid===other
  )?.displayName||"User";

 }

 async function openPerson(person){

  const id=dmId(user.uid,person.uid);
  const ref=C("chats").doc(id);
  const snap=await ref.get();

  if(!snap.exists){

   await ref.set({
    id,
    type:"dm",
    members:[user.uid,person.uid],
    createdBy:user.uid,
    createdAt:TS(),
    updatedAt:TS()
   });

  }

  setSelected(id);
  setSearch("");

 }

 async function createGroup(){

  if(!groupName.trim()||!groupMembers.length)return;

  try{

   const ref=C("chats").doc();

   await ref.set({
    id:ref.id,
    type:"group",
    name:groupName.trim(),
    members:[user.uid,...groupMembers],
    createdBy:user.uid,
    createdAt:TS(),
    updatedAt:TS()
   });

   setGroup(false);
   setGroupName("");
   setGroupMembers([]);
   setSelected(ref.id);

  }catch(e){
   alert(errorMessage(e));
  }

 }

 async function send(){

  if(!active||!text.trim())return;

  try{

   await C("messages").add({
    conversationId:active.id,
    members:active.members,
    senderId:user.uid,
    senderName:profile.displayName,
    text:text.trim(),
    replyTo:reply,
    deleted:false,
    readBy:[user.uid],
    createdAt:TS()
   });

   await C("chats").doc(active.id).set({
    updatedAt:TS(),
    lastMessage:text.trim()
   },{merge:true});

   setText("");
   setReply(null);

  }catch(e){
   alert(errorMessage(e));
  }

 }

 async function deleteMessage(message){

  if(message.senderId!==user.uid)return;

  await C("messages")
   .doc(message.id)
   .update({
    deleted:true,
    text:""
   })
   .catch(e=>alert(errorMessage(e)));

 }

 async function react(message,emoji){

  const existing=(data.messageReactions||[])
   .find(x=>
    x.messageId===message.id&&
    x.uid===user.uid
   );

  try{

   if(existing){

    if(existing.emoji===emoji){

     await C("messageReactions")
      .doc(existing.id)
      .delete();

    }else{

     await C("messageReactions")
      .doc(existing.id)
      .update({emoji});

    }

   }else{

    await C("messageReactions").add({
     messageId:message.id,
     uid:user.uid,
     emoji,
     createdAt:TS()
    });

   }

  }catch(e){
   alert(errorMessage(e));
  }

 }

 useEffect(()=>{

  if(!active)return;

  messages
   .filter(m=>
    m.senderId!==user.uid&&
    !m.readBy?.includes(user.uid)
   )
   .forEach(m=>{
    C("messages")
     .doc(m.id)
     .update({
      readBy:firebase.firestore.FieldValue.arrayUnion(user.uid)
     })
     .catch(()=>{});
   });

 },[selected,messages.length]);

 return(
  <>

   <div className={"chat "+(selected?"open":"")}>

    <div className="chatlist">

     <div className="chatlisthead">

      <div className="between">

       <b>Messages</b>

       <button
        className="secondary"
        onClick={()=>setGroup(true)}
       >
        ＋ Group
       </button>

      </div>

      <input
       style={{marginTop:7}}
       value={search}
       onChange={e=>setSearch(e.target.value)}
       placeholder="Find people..."
      />

     </div>

     {people.map(person=>(
      <button
       className="chatitem"
       key={person.uid}
       onClick={()=>openPerson(person)}
      >

       <Avatar
        small
        name={person.displayName}
       />

       <div className="chatinfo">
        <b>{person.displayName}</b>
        <div className="preview">
         @{person.username}
        </div>
       </div>

      </button>
     ))}

     {chats.map(chat=>{

      const unread=(data.messages||[])
       .filter(m=>
        m.conversationId===chat.id&&
        m.senderId!==user.uid&&
        !m.readBy?.includes(user.uid)
       ).length;

      return(
       <button
        className={
         "chatitem "+
         (selected===chat.id?"active":"")
        }
        key={chat.id}
        onClick={()=>setSelected(chat.id)}
       >

        <Avatar
         small
         name={
          chat.type==="group"
           ?"G"
           :title(chat)
         }
        />

        <div className="chatinfo">
         <b>{title(chat)}</b>
         <div className="preview">
          {chat.lastMessage||"Start chatting"}
         </div>
        </div>

        {unread>0&&(
         <b>{unread}</b>
        )}

       </button>
      );

     })}

    </div>

    <div className="chatwindow">

     {!active?(
      <div className="empty">
       Select a conversation.
      </div>
     ):(
      <>

       <div className="chatheader">

        <button
         className="secondary"
         onClick={()=>setSelected(null)}
        >
         ←
        </button>

        <Avatar
         small
         name={title(active)}
        />

        <div>
         <b>{title(active)}</b>

         <div className="muted">
          {active.type==="group"
           ?active.members.length+" members"
           :"Direct message"
          }
         </div>
        </div>

       </div>

       <div className="messages">

        {messages.map(message=>{

         const quoted=message.replyTo
          ?messages.find(
           x=>x.id===message.replyTo
          )
          :null;

         const reactions=(data.messageReactions||[])
          .filter(x=>x.messageId===message.id);

         return(
          <div
           className={
            "msgrow "+
            (message.senderId===user.uid?"mine":"")
           }
           key={message.id}
          >

           <div className="bubble">

            {active.type==="group"&&
             message.senderId!==user.uid&&(
             <div className="muted">
              {message.senderName}
             </div>
            )}

            {quoted&&!quoted.deleted&&(
             <div className="quote">
              ↩ {quoted.text}
             </div>
            )}

            <div>
             {message.deleted
              ?"Message deleted"
              :message.text
             }
            </div>

            {reactions.length>0&&(
             <div style={{marginTop:4}}>
              {reactions.map(x=>x.emoji).join(" ")}
             </div>
            )}

            <div className="msgtools">

             {["❤️","😂","👍","🔥"].map(emoji=>(
              <button
               key={emoji}
               onClick={()=>react(message,emoji)}
              >
               {emoji}
              </button>
             ))}

             <button
              onClick={()=>setReply(message.id)}
             >
              ↩
             </button>

             {message.senderId===user.uid&&(
              <button
               onClick={()=>deleteMessage(message)}
              >
               🗑
              </button>
             )}

            </div>

            <div className="msgmeta">
             {ago(message.createdAt)}
             {message.senderId===user.uid&&(
              message.readBy?.some(
               x=>x!==user.uid
              )
               ?" · read"
               :" · sent"
             )}
            </div>

           </div>

          </div>
         );

        })}

       </div>

       {reply&&(
        <div className="muted" style={{padding:"5px 9px"}}>
         Replying to message
         <button
          className="action"
          onClick={()=>setReply(null)}
         >
          ×
         </button>
        </div>
       )}

       <div className="chatinput">

        <input
         value={text}
         onChange={e=>setText(e.target.value)}
         onKeyDown={e=>{
          if(e.key==="Enter"&&!e.shiftKey){
           e.preventDefault();
           send();
          }
         }}
         placeholder="Message..."
        />

        <button
         disabled={!text.trim()}
         onClick={send}
        >
         Send
        </button>

       </div>

      </>
     )}

    </div>

   </div>

   {group&&(
    <div className="modalbg">

     <div className="modal">

      <h2>Create group</h2>

      <div className="field">
       <label>Group name</label>
       <input
        value={groupName}
        onChange={e=>setGroupName(e.target.value)}
       />
      </div>

      <div className="field">

       <label>Members</label>

       {(data.users||[])
        .filter(x=>x.uid!==user.uid)
        .map(person=>(
         <label
          key={person.uid}
          style={{
           display:"block",
           padding:"7px"
          }}
         >

          <input
           type="checkbox"
           checked={groupMembers.includes(person.uid)}
           onChange={()=>{

            setGroupMembers(old=>
             old.includes(person.uid)
              ?old.filter(x=>x!==person.uid)
              :[...old,person.uid]
            );

           }}
          />

          {" "+person.displayName}
          <span className="muted">
           {" "}@{person.username}
          </span>

         </label>
        ))}

      </div>

      <div
       className="row"
       style={{justifyContent:"flex-end"}}
      >

       <button
        className="secondary"
        onClick={()=>setGroup(false)}
       >
        Cancel
       </button>

       <button
        className="primary"
        disabled={!groupName.trim()||!groupMembers.length}
        onClick={createGroup}
       >
        Create
       </button>

      </div>

     </div>

    </div>
   )}

  </>
 );
}

/* =========================================================
   SETTINGS
========================================================= */

function Settings({user,data}){

 const existing=(data.settings||[])
  .find(x=>x.uid===user.uid)||{};

 const[notifications,setNotifications]=useState(
  existing.notifications!==false
 );

 const[online,setOnline]=useState(
  existing.showOnline!==false
 );

 async function update(key,value){

  try{

   await C("settings")
    .doc(user.uid)
    .set({
     uid:user.uid,
     [key]:value,
     updatedAt:TS()
    },{merge:true});

  }catch(e){
   alert(errorMessage(e));
  }

 }

 return(
  <div className="card">

   <h2>⚙️ Settings</h2>

   <div
    className="between"
    style={{
     padding:"14px 0",
     borderBottom:"1px solid #222"
    }}
   >

    <div>
     <b>Notifications</b>
     <div className="muted">
      Social notifications
     </div>
    </div>

    <input
     type="checkbox"
     checked={notifications}
     onChange={e=>{
      setNotifications(e.target.checked);
      update("notifications",e.target.checked);
     }}
    />

   </div>

   <div
    className="between"
    style={{padding:"14px 0"}}
   >

    <div>
     <b>Show online status</b>
     <div className="muted">
      Let other users see your online status
     </div>
    </div>

    <input
     type="checkbox"
     checked={online}
     onChange={e=>{
      setOnline(e.target.checked);
      update("showOnline",e.target.checked);
     }}
    />

   </div>

  </div>
 );
}

/* =========================================================
   RIGHT SIDEBAR
========================================================= */

function RightSidebar({
 user,
 data,
 onProfile
}){

 consttrend={};

 (data.posts||[]).forEach(post=>{
  (post.hashtags||[]).forEach(tag=>{
   trend[tag]=(trend[tag]||0)+1;
  });
 });

 const suggestions=(data.users||[])
  .filter(x=>x.uid!==user.uid)
  .slice(0,6);

 return(
  <aside className="rightbar sticky">

   <div className="card">

    <b>Who to follow</b>

    {suggestions.map(person=>(
     <div className="person" key={person.uid}>

      <Avatar
       small
       name={person.displayName}
       onClick={()=>onProfile(person.uid)}
      />

      <div
       className="personinfo"
       onClick={()=>onProfile(person.uid)}
       style={{cursor:"pointer"}}
      >
       <b>{person.displayName}</b>
       <div className="muted">
        @{person.username}
       </div>
      </div>

      <FollowButton
       me={user}
       target={person}
       follows={data.follows||[]}
      />

     </div>
    ))}

   </div>

   <div className="card" style={{marginTop:10}}>

    <b>🔥 Trending</b>

    {Object.entries(trend)
     .sort((a,b)=>b[1]-a[1])
     .slice(0,10)
     .map(([tag,count])=>(
      <div
       key={tag}
       style={{
        padding:"9px 0",
        borderBottom:"1px solid #222"
       }}
      >
       <b className="tag">{tag}</b>
       <div className="muted">
        {count} posts
       </div>
      </div>
     ))
    }

   </div>

  </aside>
 );
}

/* =========================================================
   APP
========================================================= */

function App(){

 const{
  user,
  profile,
  setProfile,
  ready
 }=useAuth();

 const data=useData(user?.uid);

 const[page,setPage]=useState("home");
 const[selected,setSelected]=useState(null);

 /* Presence heartbeat */

 useEffect(()=>{

  if(!user)return;

  const ref=C("presence").doc(user.uid);

  const online=()=>{

   ref.set({
    uid:user.uid,
    online:true,
    lastSeen:TS()
   },{merge:true}).catch(()=>{});

  };

  const offline=()=>{

   ref.set({
    uid:user.uid,
    online:false,
    lastSeen:TS()
   },{merge:true}).catch(()=>{});

  };

  online();

  const timer=setInterval(
   online,
   30000
  );

  document.addEventListener(
   "visibilitychange",
   ()=>{
    if(document.hidden)offline();
    else online();
   }
  );

  window.addEventListener(
   "beforeunload",
   offline
  );

  return()=>{
   clearInterval(timer);
   window.removeEventListener(
    "beforeunload",
    offline
   );
  };

 },[user?.uid]);

 /* Keep own profile fresh */

 useEffect(()=>{

  if(!user)return;

  const off=C("users")
   .doc(user.uid)
   .onSnapshot(s=>{

    if(s.exists){
     setProfile({
      uid:user.uid,
      ...s.data()
     });
    }

   });

  return off;

 },[user?.uid]);

 if(!ready||!profile){

  return(
   <div
    style={{
     minHeight:"100vh",
     display:"grid",
     placeItems:"center",
     background:"#050505",
     color:"#fff"
    }}
   >
    Connecting to Nexus…
   </div>
  );

 }

 function openProfile(uid){

  const person=(data.users||[])
   .find(x=>x.uid===uid);

  if(person){
   setSelected(person);
   setPage("profile");
  }

 }

 const unread=(data.notifications||[])
  .filter(x=>x.uid===user.uid&&!x.read)
  .length;

 let content=null;

 if(page==="home"){

  content=(
   <Feed
    user={user}
    profile={profile}
    data={data}
    onProfile={openProfile}
   />
  );

 }

 if(page==="explore"){

  content=(
   <Explore
    user={user}
    data={data}
    onProfile={openProfile}
   />
  );

 }

 if(page==="profile"){

  content=(
   <Profile
    user={user}
    profile={selected||profile}
    data={data}
    onProfile={openProfile}
   />
  );

 }

 if(page==="notifications"){

  content=(
   <Notifications
    user={user}
    data={data}
   />
  );

 }

 if(page==="messages"){

  content=(
   <Messages
    user={user}
    profile={profile}
    data={data}
   />
  );

 }

 if(page==="settings"){

  content=(
   <Settings
    user={user}
    data={data}
   />
  );

 }

 const nav=[
  ["home","🏠","Home"],
  ["explore","🔎","Explore"],
  ["notifications","🔔","Notifications"],
  ["messages","💬","Messages"],
  ["profile","👤","Profile"],
  ["settings","⚙️","Settings"]
 ];

 function go(id){

  if(id==="profile"){
   openProfile(user.uid);
  }else{
   setPage(id);
  }

 }

 return(
  <div className="app">

   <header className="topbar">

    <div className="brand">
     <div className="logo">N</div>
     Nexus
    </div>

    <button
     className="secondary"
     onClick={()=>openProfile(user.uid)}
    >
     {initials(profile.displayName)}
    </button>

   </header>

   <div className="layout">

    <aside className="leftbar sticky">

     <div className="card nav">

      {nav.map(([id,icon,label])=>(
       <button
        key={id}
        className={page===id?"active":""}
        onClick={()=>go(id)}
       >

        {icon} {label}

        {id==="notifications"&&unread>0&&(
         <> ({unread})</>
        )}

       </button>
      ))}

     </div>

    </aside>

    <main>
     {content}
    </main>

    <RightSidebar
     user={user}
     data={data}
     onProfile={openProfile}
    />

   </div>

   <nav className="mobilebar">

    {[
     ["home","🏠"],
     ["explore","🔎"],
     ["notifications","🔔"],
     ["messages","💬"],
     ["profile","👤"]
    ].map(([id,icon])=>(
     <button
      key={id}
      className={page===id?"active":""}
      onClick={()=>go(id)}
     >
      {icon}
      <br/>
      {id}
     </button>
    ))}

   </nav>

  </div>
 );
}

ReactDOM
 .createRoot(document.getElementById("root"))
 .render(<App/>);

</script>
</body>
</html>
