const {

  useEffect,  
  useMemo  
} = React;  
  
  
/* =========================================================

========================================================= */  
  
const firebaseConfig = {  
  apiKey:"AIzaSyDTrvD7c1TUtPUUOSX7_-0VV9itC28LOg0",  
  authDomain:"nexus-37600.firebaseapp.com",  
  projectId:"nexus-37600",  
  storageBucket:"nexus-37600.firebasestorage.app",  
  messagingSenderId:"61496309341",  
  appId:"1:61496309341:web:fdb3711264df47f318bfb4",  
  measurementId:"G-41S50YF5RF"  
};  
  
const APP_ID = "nexus-37600";  
  
let auth = null;  
let db = null;  
  
try{  
  
  if(!firebase.apps.length){  
    firebase.initializeApp(firebaseConfig);  
  }  
  
  auth = firebase.auth();  
  db = firebase.firestore();  
  
}catch(error){  
  
  console.error(  
    "Firebase initialization failed:",  
    error  
  );  
  
}  
  
  
function collectionPath(name){  
  
  if(!db){  
    throw new Error(  
      "Firestore is not initialized."  
    );  
  }  
  
  return db  
    .collection("artifacts")  
    .doc(APP_ID)  
    .collection("public")  
    .doc("data")  
    .collection(name);  
}  
  
  
/* =========================================================  
   HELPERS  
========================================================= */  
  
function timestampMillis(value){  
  
  if(!value) return 0;  
  
  try{  
  
    if(typeof value.toMillis === "function"){  
      return value.toMillis();  
    }  
  
    if(typeof value.seconds === "number"){  
      return value.seconds * 1000;  
    }  
  
    if(value instanceof Date){  
      return value.getTime();  
    }  
  
    const date = new Date(value);  
  
    return Number.isFinite(date.getTime())  
      ? date.getTime()  
      : 0;  
  
  }catch{  
  
    return 0;  
  
  }  
}  
  
  
function formatTime(timestamp){  
  
  const time = timestampMillis(timestamp);  
  
  if(!time) return "now";  
  
  const diff = Math.max(  
    0,  
    Date.now() - time  
  );  
  
  const seconds = Math.floor(diff / 1000);  
  
  if(seconds < 60){  
    return `${seconds}s`;  
  }  
  
  const minutes = Math.floor(seconds / 60);  
  
  if(minutes < 60){  
    return `${minutes}m`;  
  }  
  
  const hours = Math.floor(minutes / 60);  
  
  if(hours < 24){  
    return `${hours}h`;  
  }  
  
  const days = Math.floor(hours / 24);  
  
  if(days < 30){  
    return `${days}d`;  
  }  
  
  return new Date(time).toLocaleDateString();  
}  
  
  
function getInitials(name){  
  
  if(!name) return "N";  
  
  return name  
    .trim()  
    .split(/\s+/)  
    .filter(Boolean)  
    .slice(0,2)  
    .map(x => x[0])  
    .join("")  
    .toUpperCase() || "N";  
}  
  
  
function makeHashtags(text){  
  
  if(!text) return [];  
  
  return [  
    ...new Set(  
      (  
        text.match(/#[a-zA-Z0-9_]+/g) || []  
      ).map(x => x.toLowerCase())  
    )  
  ];  
}  
  
  
/* =========================================================  
   AUTH  
========================================================= */  
  
function useAuth(){  
  
  const [user,setUser] = useState(null);  
  
  const [profile,setProfile] = useState(null);  
  
  const [loading,setLoading] = useState(true);  
  
  const [error,setError] = useState(null);  
  
  const [  
    needsProfileSetup,  
    setNeedsProfileSetup  
  ] = useState(false);  
  
  
  useEffect(() => {  
  
    if(!auth || !db){  
  
      setError({  
        code:"firebase/init-failed",  
        message:"Firebase could not initialize."  
      });  
  
      setLoading(false);  
  
      return;  
    }  
  
    let cancelled = false;  
  
    const unsubscribe =  
      auth.onAuthStateChanged(  
        async currentUser => {  
  
          if(cancelled) return;  
  
          try{  
  
            if(!currentUser){  
  
              await auth.signInAnonymously();  
  
              return;  
            }  
  
            setUser(currentUser);  
  
            const userRef =  
              collectionPath("users")  
                .doc(currentUser.uid);  
  
            const snapshot =  
              await userRef.get();  
  
  
            if(!snapshot.exists){  
  
              const shortId =  
                currentUser.uid  
                  .slice(0,6)  
                  .toUpperCase();  
  
              const newProfile = {  
  
                uid:currentUser.uid,  
  
                displayName:  
                  "Nexus User " + shortId,  
  
                username:  
                  "user_" +  
                  currentUser.uid.slice(0,6),  
  
                bio:"Welcome to Nexus 👋",  
  
                followers:0,  
  
                following:0,  
  
                createdAt:  
                  firebase.firestore  
                    .FieldValue  
                    .serverTimestamp()  
  
              };  
  
              await userRef.set(newProfile);  
  
              setProfile({  
                ...newProfile,  
                uid:currentUser.uid  
              });  
  
              setNeedsProfileSetup(true);  
  
            }else{  
  
              const existingProfile = {  
                uid:currentUser.uid,  
                ...snapshot.data()  
              };  
  
              setProfile(existingProfile);  
  
              setNeedsProfileSetup(false);  
  
            }  
  
            setError(null);  
            setLoading(false);  
  
            setTimeout(() => {  
  
              const screen =  
                document.getElementById(  
                  "boot-screen"  
                );  
  
              if(screen){  
                screen.classList.add("hide");  
              }  
  
            },300);  
  
          }catch(error){  
  
            console.error(error);  
  
            setError({  
              code:  
                error.code ||  
                "firebase/error",  
              message:  
                error.message ||  
                "Could not connect to Firebase."  
            });  
  
            setLoading(false);  
  
            const screen =  
              document.getElementById(  
                "boot-screen"  
              );  
  
            if(screen){  
              screen.classList.add("hide");  
            }  
  
          }  
  
        }  
      );  
  
  
    return () => {  
  
      cancelled = true;  
  
      if(unsubscribe){  
        unsubscribe();  
      }  
  
    };  
  
  },[]);  
  
  
  return {  
    user,  
    profile,  
    setProfile,  
    loading,  
    error,  
    needsProfileSetup,  
    setNeedsProfileSetup  
  };  
  
}  
  
  
/* =========================================================  
   REALTIME DATA  
========================================================= */  
  
const COLLECTIONS = [  
  "users",  
  "posts",  
  "comments",  
  "likes",  
  "follows",  
  "notifications",  
  "messages"  
];  
  
  
function useRealtimeData(uid){  
  
  const [data,setData] = useState({  
  
    users:[],  
    posts:[],  
    comments:[],  
    likes:[],  
    follows:[],  
    notifications:[],  
    messages:[]  
  
  });  
  
  const [ready,setReady] = useState(false);  
  
  const [  
    firestoreError,  
    setFirestoreError  
  ] = useState(null);  
  
  
  useEffect(() => {  
  
    if(!uid || !db){  
      return;  
    }  
  
    setReady(false);  
    setFirestoreError(null);  
  
    const loaded = new Set();  
  
    const unsubscribers = [];  
  
  
    COLLECTIONS.forEach(name => {  
  
      const unsubscribe =  
        collectionPath(name)  
          .onSnapshot(  
  
            snapshot => {  
  
              const items =  
                snapshot.docs.map(  
                  doc => ({  
                    id:doc.id,  
                    ...doc.data()  
                  })  
                );  
  
              setData(previous => ({  
                ...previous,  
                [name]:items  
              }));  
  
              loaded.add(name);  
  
              if(  
                loaded.size ===  
                COLLECTIONS.length  
              ){  
                setReady(true);  
              }  
  
            },  
  
            error => {  
  
              console.error(  
                `Firestore ${name} error:`,  
                error  
              );  
  
              setFirestoreError({  
                collection:name,  
                code:error.code,  
                message:error.message  
              });  
  
              loaded.add(name);  
  
              if(  
                loaded.size ===  
                COLLECTIONS.length  
              ){  
                setReady(true);  
              }  
  
            }  
  
          );  
  
      unsubscribers.push(unsubscribe);  
  
    });  
  
  
    return () => {  
  
      unsubscribers.forEach(  
        unsubscribe =>  
          unsubscribe()  
      );  
  
    };  
  
  },[uid]);  
  
  
  return {  
    data,  
    ready,  
    firestoreError  
  };  
  
}

/* =========================================================

========================================================= */  
  
function ProfileSetup({  
  user,  
  profile,  
  onComplete  
}){  
  
  const [name,setName] = useState("");  
  
  const [username,setUsername] = useState("");  
  
  const [bio,setBio] =  
    useState("Welcome to Nexus 👋");  
  
  const [saving,setSaving] = useState(false);  
  
  
  async function saveProfile(){  
  
    const cleanName = name.trim();  
  
    if(!cleanName){  
  
      alert("Please enter your name.");  
  
      return;  
    }  
  
    if(saving) return;  
  
    setSaving(true);  
  
    try{  
  
      let cleanUsername =  
        username  
          .trim()  
          .replace(/^@/,"")  
          .replace(/\s+/g,"_")  
          .replace(/[^a-zA-Z0-9_]/g,"")  
          .toLowerCase();  
  
      if(!cleanUsername){  
  
        cleanUsername =  
          "user_" +  
          user.uid.slice(0,6);  
  
      }  
  
      cleanUsername =  
        cleanUsername.slice(0,30);  
  
  
      const updated = {  
  
        uid:user.uid,  
  
        displayName:cleanName,  
  
        username:cleanUsername,  
  
        bio:bio.trim(),  
  
        followers:profile?.followers || 0,  
  
        following:profile?.following || 0  
  
      };  
  
  
      await collectionPath("users")  
        .doc(user.uid)  
        .update({  
  
          displayName:updated.displayName,  
  
          username:updated.username,  
  
          bio:updated.bio  
  
        });  
  
  
      onComplete(updated);  
  
    }catch(error){  
  
      console.error(error);  
  
      alert(  
        "Could not save your profile:\n\n" +  
        error.message  
      );  
  
    }finally{  
  
      setSaving(false);  
  
    }  
  
  }  
  
  
  return(  
  
    <div className="profile-setup">  
  
      <div className="profile-setup-card">  
  
        <div  
          className="brand"  
          style={{marginBottom:20}}  
        >  
  
          <div className="brand-logo">N</div>  
  
          Nexus  
  
        </div>  
  
        <h1>Welcome to Nexus 👋</h1>  
  
        <p>  
          Create your profile before you  
          start posting and following people.  
        </p>  
  
  
        <div className="field">  
  
          <label>Display name</label>  
  
          <input  
            value={name}  
            onChange={e =>  
              setName(e.target.value)  
            }  
            placeholder="Your name"  
            maxLength={40}  
            autoFocus  
          />  
  
        </div>  
  
  
        <div className="field">  
  
          <label>Username</label>  
  
          <input  
            value={username}  
            onChange={e =>  
              setUsername(e.target.value)  
            }  
            placeholder="@yourusername"  
            maxLength={30}  
          />  
  
        </div>  
  
  
        <div className="field">  
  
          <label>Bio</label>  
  
          <textarea  
            value={bio}  
            onChange={e =>  
              setBio(e.target.value)  
            }  
            placeholder="Tell people about yourself..."  
            maxLength={160}  
          />  
  
        </div>  
  
  
        <button  
          className="primary"  
          style={{  
            width:"100%",  
            marginTop:8  
          }}  
          disabled={  
            saving ||  
            !name.trim()  
          }  
          onClick={saveProfile}  
        >  
          {saving  
            ? "Creating profile..."  
            : "Enter Nexus"}  
        </button>  
  
      </div>  
  
    </div>  
  
  );

/* =========================================================  
   POST CARD  
========================================================= */  
  
function PostCard({  
  post,  
  currentUser,  
  profile,  
  comments,  
  likes,  
  onProfile,  
  onEdit  
}){  
  
  const [  
    commentText,  
    setCommentText  
  ] = useState("");  
  
  const [  
    showComments,  
    setShowComments  
  ] = useState(false);  
  
  const [  
    sending,  
    setSending  
  ] = useState(false);  
  
  
  const postLikes =  
    likes.filter(  
      x => x.postId === post.id  
    );  
  
  
  const liked =  
    postLikes.some(  
      x =>  
        x.userId ===  
        currentUser?.uid  
    );  
  
  
  const postComments =  
    comments  
      .filter(  
        x =>  
          x.postId === post.id  
      )  
      .sort(  
        (a,b) =>  
          timestampMillis(a.createdAt) -  
          timestampMillis(b.createdAt)  
      );  
  
  
  async function toggleLike(){  
  
    if(!currentUser) return;  
  
    try{  
  
      const existing =  
        postLikes.find(  
          x =>  
            x.userId ===  
            currentUser.uid  
        );  
  
  
      if(existing){  
  
        await collectionPath("likes")  
          .doc(existing.id)  
          .delete();  
  
      }else{  
  
        await collectionPath("likes")  
          .add({  
  
            postId:post.id,  
  
            userId:currentUser.uid,  
  
            createdAt:  
              firebase.firestore  
                .FieldValue  
                .serverTimestamp()  
  
          });  
  
  
        if(  
          post.authorId &&  
          post.authorId !== currentUser.uid  
        ){  
  
          await collectionPath(  
            "notifications"  
          ).add({  
  
            userId:post.authorId,  
  
            actorId:currentUser.uid,  
  
            actorName:  
              profile?.displayName ||  
              "Someone",  
  
            type:"like",  
  
            postId:post.id,  
  
            read:false,  
  
            createdAt:  
              firebase.firestore  
                .FieldValue  
                .serverTimestamp()  
  
          });  
  
        }  
  
      }  
  
    }catch(error){  
  
      alert(  
        "Like failed:\n\n" +  
        error.message  
      );  
  
    }  
  
  }  
  
  
  async function addComment(){  
  
    const clean =  
      commentText.trim();  
  
    if(  
      !clean ||  
      !currentUser ||  
      sending  
    ){  
      return;  
    }  
  
    setSending(true);  
  
    try{  
  
      await collectionPath("comments")  
        .add({  
  
          postId:post.id,  
  
          userId:currentUser.uid,  
  
          userName:  
            profile?.displayName ||  
            "Nexus User",  
  
          text:clean,  
  
          createdAt:  
            firebase.firestore  
              .FieldValue  
              .serverTimestamp()  
  
        });  
  
  
      if(  
        post.authorId &&  
        post.authorId !== currentUser.uid  
      ){  
  
        await collectionPath(  
          "notifications"  
        ).add({  
  
          userId:post.authorId,  
  
          actorId:currentUser.uid,  
  
          actorName:  
            profile?.displayName ||  
            "Someone",  
  
          type:"comment",  
  
          postId:post.id,  
  
          read:false,  
  
          createdAt:  
            firebase.firestore  
              .FieldValue  
              .serverTimestamp()  
  
        });  
  
      }  
  
  
      setCommentText("");  
  
    }catch(error){  
  
      alert(  
        "Comment failed:\n\n" +  
        error.message  
      );  
  
    }finally{  
  
      setSending(false);  
  
    }  
  
  }  
  
  
  async function deletePost(){  
  
    if(!confirm("Delete this post?")){  
      return;  
    }  
  
    try{  
  
      await collectionPath("posts")  
        .doc(post.id)  
        .delete();  
  
  
      const relatedLikes =  
        likes.filter(  
          x => x.postId === post.id  
        );  
  
  
      const relatedComments =  
        comments.filter(  
          x => x.postId === post.id  
        );  
  
  
      await Promise.all([  
  
        ...relatedLikes.map(  
          x =>  
            collectionPath("likes")  
              .doc(x.id)  
              .delete()  
        ),  
  
        ...relatedComments.map(  
          x =>  
            collectionPath("comments")  
              .doc(x.id)  
              .delete()  
        )  
  
      ]);  
  
    }catch(error){  
  
      alert(  
        "Delete failed:\n\n" +  
        error.message  
      );  
  
    }  
  
  }  
  
  
  return(  
  
    <article className="post">  
  
      <div className="post-header">  
  
        <div  
          className="avatar"  
          onClick={() =>  
            onProfile?.(post.authorId)  
          }  
          style={{cursor:"pointer"}}  
        >  
          {getInitials(post.authorName)}  
        </div>  
  
  
        <div  
          onClick={() =>  
            onProfile?.(post.authorId)  
          }  
          style={{cursor:"pointer"}}  
        >  
  
          <div className="post-author">  
            {post.authorName || "User"}  
          </div>  
  
          <div className="post-time">  
  
            @{post.authorUsername || "user"}  
  
            {" · "}  
  
            {formatTime(post.createdAt)}  
  
            {post.editedAt  
              ? " · edited"  
              : ""}  
  
          </div>  
  
        </div>  
  
  
        {post.authorId === currentUser?.uid && (  
  
          <div  
            style={{  
              marginLeft:"auto",  
              display:"flex",  
              gap:5  
            }}  
          >  
  
            <button  
              className="post-menu"  
              onClick={() =>  
                onEdit?.(post)  
              }  
              title="Edit"  
            >  
              ✎  
            </button>  
  
            <button  
              className="post-menu"  
              onClick={deletePost}  
              title="Delete"  
            >  
              🗑  
            </button>  
  
          </div>  
  
        )}  
  
      </div>  
  
  
      <div className="post-content">  
  
        {(post.content || "")  
          .split(/(#[a-zA-Z0-9_]+)/)  
          .map(  
            (part,index) =>  
              part.startsWith("#")  
                ? (  
                  <span  
                    className="hashtag"  
                    key={index}  
                  >  
                    {part}  
                  </span>  
                )  
                : part  
          )}  
  
      </div>  
  
  
      <div className="post-actions">  
  
        <button  
          className={  
            "action-btn " +  
            (liked ? "liked" : "")  
          }  
          onClick={toggleLike}  
        >  
          {liked ? "♥" : "♡"} {postLikes.length}  
        </button>  
  
  
        <button  
          className="action-btn"  
          onClick={() =>  
            setShowComments(x => !x)  
          }  
        >  
          💬 {postComments.length}  
        </button>  
  
  
        <button  
          className="action-btn"  
          onClick={() => {  
  
            if(navigator.clipboard){  
  
              navigator.clipboard  
                .writeText(post.content || "")  
                .then(() => {  
                  alert("Post copied.");  
                })  
                .catch(() => {});  
  
            }  
  
          }}  
        >  
          ↗ Share  
        </button>  
  
      </div>  
  
  
      {showComments && (  
  
        <div className="comments">  
  
          {postComments.map(comment => (  
  
            <div  
              className="comment"  
              key={comment.id}  
            >  
  
              <div className="avatar small">  
                {getInitials(comment.userName)}  
              </div>  
  
              <div className="comment-body">  
  
                <div className="comment-name">  
                  {comment.userName || "User"}  
                </div>  
  
                <div className="comment-text">  
                  {comment.text}  
                </div>  
  
              </div>  
  
            </div>  
  
          ))}  
  
  
          <input  
            className="comment-input"  
            value={commentText}  
            onChange={e =>  
              setCommentText(e.target.value)  
            }  
            onKeyDown={e => {  
  
              if(  
                e.key === "Enter" &&  
                !e.shiftKey  
              ){  
  
                e.preventDefault();  
  
                addComment();  
  
              }  
  
            }}  
            placeholder="Write a comment..."  
          />  
  
        </div>  
  
      )}  
  
    </article>  
  
  );  
  
}

              setUsername(e.target.value)  
            }  
          />  
  
        </div>  
  
  
        <div className="field">  
  
          <label>Bio</label>  
  
          <textarea  
            value={bio}  
            onChange={e =>  
              setBio(e.target.value)  
            }  
          />  
  
        </div>  
  
  
        <div className="modal-actions">  
  
          <button  
            className="secondary"  
            onClick={onClose}  
          >  
            Cancel  
          </button>  
  
          <button  
            className="primary"  
            disabled={saving}  
            onClick={save}  
          >  
            {saving ? "Saving..." : "Save"}  
          </button>  
  
        </div>  
  
      </div>  
  
    </div>  
  
  );  
  
}  
  
  
/* =========================================================  
   WHO TO FOLLOW  
========================================================= */  
  
function WhoToFollow({  
  users,  
  currentUser,  
  currentUserProfile,  
  follows  
}){  
  
  const candidates =  
    users  
      .filter(  
        x =>  
          x.uid !== currentUser?.uid  
      )  
      .slice(0,5);  
  
  
  async function toggleFollow(person){  
  
    if(!currentUser) return;  
  
  
    const existing =  
      follows.find(  
        x =>  
          x.followerId === currentUser.uid &&  
          x.followingId === person.uid  
      );  
  
  
    try{  
  
      if(existing){  
  
        await collectionPath("follows")  
          .doc(existing.id)  
          .delete();  
  
      }else{  
  
        await collectionPath("follows")  
          .add({  
  
            followerId:currentUser.uid,  
  
            followingId:person.uid,  
  
            createdAt:  
              firebase.firestore  
                .FieldValue  
                .serverTimestamp()  
  
          });  
  
  
        await collectionPath("notifications")  
          .add({  
  
            userId:person.uid,  
  
            actorId:currentUser.uid,  
  
            actorName:  
              currentUserProfile?.displayName ||  
              "Someone",  
  
            type:"follow",  
  
            read:false,  
  
            createdAt:  
              firebase.firestore  
                .FieldValue  
                .serverTimestamp()  
  
          });  
  
      }  
  
    }catch(error){  
  
      alert(  
        "Follow failed:\n\n" +  
        error.message  
      );  
  
    }  
  
  }  
  
  
  return(  
  
    <div className="side-card">  
  
      <div className="side-title">  
        Who to follow  
      </div>  
  
  
      {candidates.length === 0 && (  
  
        <div  
          style={{  
            color:"#666",  
            fontSize:13  
          }}  
        >  
          No suggestions yet.  
        </div>  
  
      )}  
  
  
      {candidates.map(person => {  
  
        const following =  
          follows.some(  
            x =>  
              x.followerId === currentUser?.uid &&  
              x.followingId === person.uid  
          );  
  
  
        return(  
  
          <div  
            className="person"  
            key={person.uid}  
          >  
  
            <div className="avatar small">  
              {getInitials(person.displayName)}  
            </div>  
  
  
            <div className="person-info">  
  
              <div className="person-name">  
                {person.displayName}  
              </div>  
  
              <div className="person-user">  
                @{person.username}  
              </div>  
  
            </div>  
  
  
            <button  
              className="follow-btn"  
              onClick={() =>  
                toggleFollow(person)  
              }  
            >  
              {following  
                ? "Following"  
                : "Follow"}  
            </button>  
  
          </div>  
  
        );  
  
      })}  
  
    </div>  
  
  );  
  
}  
  
  
/* =========================================================  
   FEED  
========================================================= */  
  
function FeedView({  
  user,  
  profile,  
  data,  
  onProfile,  
  onEdit,  
  firestoreError  
}){  
  
  const [query,setQuery] =  
    useState("");  
  
  
  const posts =  
    useMemo(() => {  
  
      const q =  
        query.trim().toLowerCase();  
  
  
      return [...data.posts]  
        .sort(  
          (a,b) =>  
            timestampMillis(b.createdAt) -  
            timestampMillis(a.createdAt)  
        )  
        .filter(post => {  
  
          if(!q) return true;  
  
  
          return(  
  
            post.content  
              ?.toLowerCase()  
              .includes(q)  
  
            ||  
  
            post.authorName  
              ?.toLowerCase()  
              .includes(q)  
  
            ||  
  
            post.authorUsername  
              ?.toLowerCase()  
              .includes(q)  
  
            ||  
  
            (post.hashtags || [])  
              .some(  
                tag =>  
                  tag  
                    .toLowerCase()  
                    .includes(q)  
              )  
  
          );  
  
        });  
  
    },[  
      data.posts,  
      query  
    ]);  
  
  
  return(  
  
    <div className="feed">  
  
      <FirestoreErrorBanner  
        error={firestoreError}  
      />  
  
  
      <div className="search-box">  
  
        <input  
          placeholder="Search Nexus..."  
          value={query}  
          onChange={e =>  
            setQuery(e.target.value)  
          }  
        />  
  
      </div>  
  
  
      <Composer  
        user={user}  
        profile={profile}  
      />  
  
  
      <div className="status">  
  
        {posts.length} post  
        {posts.length === 1 ? "" : "s"} loaded  
  
      </div>  
  
  
      {posts.length === 0 ? (  
  
        <div className="empty">  
  
          <div style={{fontSize:35}}>  
            ✨  
          </div>  
  
          <div>  
            {query  
              ? "No matching posts."  
              : "No posts yet."}  
          </div>  
  
          <div  
            style={{  
              fontSize:13,  
              marginTop:5  
            }}  
          >  
            {query  
              ? "Try another search."  
              : "Be the first person to post."}  
          </div>  
  
        </div>  
  
      ) : (  
  
        posts.map(post => (  
  
          <PostCard  
            key={post.id}  
            post={post}  
            currentUser={user}  
            profile={profile}  
            comments={data.comments}  
            likes={data.likes}  
            onProfile={onProfile}  
            onEdit={onEdit}  
          />  
  
        ))  
  
      )}  
  
    </div>  
  
  );  
  
}

/* =========================================================  
   MESSAGES  
========================================================= */  
  
function MessagingView({  
  user,  
  profile,  
  data  
}){  
  
  const [recipient,setRecipient] =  
    useState("");  
  
  const [text,setText] =  
    useState("");  
  
  const [sending,setSending] =  
    useState(false);  
  
  
  async function sendMessage(){  
  
    if(  
      !recipient.trim() ||  
      !text.trim() ||  
      sending  
    ){  
      return;  
    }  
  
  
    const username =  
      recipient  
        .trim()  
        .replace(/^@/,"")  
        .toLowerCase();  
  
  
    const target =  
      data.users.find(  
        x =>  
          String(x.username || "")  
            .toLowerCase() === username  
      );  
  
  
    if(!target){  
  
      alert("User not found.");  
  
      return;  
    }  
  
  
    setSending(true);  
  
  
    try{  
  
      await collectionPath("messages")  
        .add({  
  
          senderId:user.uid,  
  
          senderName:  
            profile?.displayName ||  
            "Nexus User",  
  
          receiverId:target.uid,  
  
          receiverName:target.displayName,  
  
          text:text.trim(),  
  
          createdAt:  
            firebase.firestore  
              .FieldValue  
              .serverTimestamp()  
  
        });  
  
  
      setText("");  
  
    }catch(error){  
  
      alert(  
        "Message failed:\n\n" +  
        error.message  
      );  
  
    }finally{  
  
      setSending(false);  
  
    }  
  
  }  
  
  
  const messages =  
    data.messages  
      .filter(  
        message =>  
          message.senderId === user.uid ||  
          message.receiverId === user.uid  
      )  
      .sort(  
        (a,b) =>  
          timestampMillis(a.createdAt) -  
          timestampMillis(b.createdAt)  
      );  
  
  
  return(  
  
    <div className="feed">  
  
      <div className="side-card">  
  
        <h2>Messages</h2>  
  
  
        <div className="field">  
  
          <label>Username</label>  
  
          <input  
            value={recipient}  
            onChange={e =>  
              setRecipient(e.target.value)  
            }  
            placeholder="@username"  
          />  
  
        </div>  
  
  
        <div className="field">  
  
          <textarea  
            value={text}  
            onChange={e =>  
              setText(e.target.value)  
            }  
            placeholder="Write a message..."  
          />  
  
        </div>  
  
  
        <button  
          className="primary"  
          disabled={sending}  
          onClick={sendMessage}  
        >  
          {sending  
            ? "Sending..."  
            : "Send message"}  
        </button>  
  
      </div>  
  
  
      <div  
        className="side-card"  
        style={{marginTop:15}}  
      >  
  
        {messages.length === 0 ? (  
  
          <div className="empty">  
            No messages yet.  
          </div>  
  
        ) : (  
  
          messages.map(message => (  
  
            <div  
              key={message.id}  
              style={{  
                padding:"12px 0",  
                borderBottom:"1px solid #222"  
              }}  
            >  
  
              <strong>  
  
                {message.senderId === user.uid  
                  ? "You"  
                  : message.senderName}  
  
              </strong>  
  
  
              <div  
                style={{  
                  color:"#ccc",  
                  marginTop:5  
                }}  
              >  
                {message.text}  
              </div>  
  
  
              <div  
                style={{  
                  color:"#555",  
                  fontSize:11,  
                  marginTop:5  
                }}  
              >  
                {formatTime(message.createdAt)}  
              </div>  
  
            </div>  
  
          ))  
  
        )}  
  
      </div>  
  
    </div>  
  
  );  
  
}  
  
  
/* =========================================================  
   MAIN NEXUS  
========================================================= */  
  
function Nexus(){  
  
  const {  
    user,  
    profile,  
    setProfile,  
    loading,  
    error,  
    needsProfileSetup,  
    setNeedsProfileSetup  
  } = useAuth();  
  
  
  const {  
    data,  
    ready,  
    firestoreError  
  } = useRealtimeData(user?.uid);  
  
  
  const [page,setPage] =  
    useState("home");  
  
  
  const [  
    selectedProfile,  
    setSelectedProfile  
  ] = useState(null);  
  
  
  const [  
    editingProfile,  
    setEditingProfile  
  ] = useState(false);  
  
  
  const [  
    editingPost,  
    setEditingPost  
  ] = useState(null);  
  
  
  function retry(){  
    window.location.reload();  
  }  
  
  
  function openProfile(uid){  
  
    if(!uid) return;  
  
  
    const target =  
      data.users.find(  
        x => x.uid === uid  
      );  
  
  
    if(!target){  
  
      if(  
        uid === user?.uid &&  
        profile  
      ){  
  
        setSelectedProfile(profile);  
        setPage("profile");  
  
      }  
  
      return;  
    }  
  
  
    setSelectedProfile(target);  
    setPage("profile");  
  
  }  
  
  
  function openMyProfile(){  
  
    if(!profile) return;  
  
    setSelectedProfile(profile);  
    setPage("profile");  
  
  }  
  
  
  if(loading){  
    return null;  
  }  
  
  
  if(error){  
  
    return(  
  
      <FirebaseErrorScreen  
        error={error}  
        retry={retry}  
      />  
  
    );  
  
  }  
  
  
  if(!user || !profile){  
  
    return(  
  
      <FirebaseErrorScreen  
        error={{  
          code:"auth/no-user",  
          message:  
            "Firebase did not return a signed-in user."  
        }}  
        retry={retry}  
      />  
  
    );  
  
  }  
  
  
  if(needsProfileSetup){  
  
    return(  
  
      <ProfileSetup  
        user={user}  
        profile={profile}  
        onComplete={updated => {  
  
          setProfile(updated);  
          setNeedsProfileSetup(false);  
  
        }}  
      />  
  
    );  
  
  }  
  
  
  if(!ready){  
  
    return(  
  
      <div  
        style={{  
          minHeight:"100vh",  
          display:"flex",  
          alignItems:"center",  
          justifyContent:"center",  
          background:"#050505",  
          color:"#777"  
        }}  
      >  
        Loading Nexus data...  
      </div>  
  
    );  
  
  }  
  
  
  let content = null;  
  
  
  if(page === "home"){  
  
    content = (  
  
      <FeedView  
        user={user}  
        profile={profile}  
        data={data}  
        onProfile={openProfile}  
        onEdit={setEditingPost}  
        firestoreError={firestoreError}  
      />  
  
    );  
  
  }  
  
  
  if(page === "profile"){  
  
    content = (  
  
      <ProfileView  
        profile={  
          selectedProfile || profile  
        }  
        user={user}  
        data={data}  
        onEditProfile={() =>  
          setEditingProfile(true)  
        }  
        onProfile={openProfile}  
      />  
  
    );  
  
  }  
  
  
  if(page === "notifications"){  
  
    content = (  
  
      <NotificationsView  
        user={user}  
        data={data}  
      />  
  
    );  
  
  }  
  
  
  if(page === "messages"){  
  
    content = (  
  
      <MessagingView  
        user={user}  
        profile={profile}  
        data={data}  
      />  
  
    );  
  
  }  
  
  
  return(  
  
    <div className="app">  
  
      <header className="topbar">  
  
        <div className="brand">  
  
          <div className="brand-logo">  
            N  
          </div>  
  
          Nexus  
  
        </div>  
  
  
        <button  
          className="icon-btn"  
          onClick={openMyProfile}  
          title="Profile"  
        >  
          {getInitials(profile.displayName)}  
        </button>  
  
      </header>  
  
  
      <div className="layout">  
  
        <aside className="sidebar">  
  
          <div className="nav-card">  
  
            <button  
              className={  
                "nav-item " +  
                (  
                  page === "home"  
                    ? "active"  
                    : ""  
                )  
              }  
              onClick={() => {  
  
                setPage("home");  
                setSelectedProfile(null);  
  
              }}  
            >  
              🏠 Home  
            </button>  
  
  
            <button  
              className={  
                "nav-item " +  
                (  
                  page === "profile"  
                    ? "active"  
                    : ""  
                )  
              }  
              onClick={openMyProfile}  
            >  
              👤 Profile  
            </button>  
  
  
            <button  
              className={  
                "nav-item " +  
                (  
                  page === "notifications"  
                    ? "active"  
                    : ""  
                )  
              }  
              onClick={() =>  
                setPage("notifications")  
              }  
            >  
              🔔 Notifications  
            </button>  
  
  
            <button  
              className={  
                "nav-item " +  
                (  
                  page === "messages"  
                    ? "active"  
                    : ""  
                )  
              }  
              onClick={() =>  
                setPage("messages")  
              }  
            >  
              💬 Messages  
            </button>  
  
          </div>  
  
        </aside>  
  
  
        <main>  
  
          {content}  
  
  
          <div className="mobile-follow">  
  
            <WhoToFollow  
              users={data.users}  
              currentUser={user}  
              currentUserProfile={profile}  
              follows={data.follows}  
            />  
  
          </div>  
  
        </main>  
  
  
        <aside className="right-sidebar">  
  
          <WhoToFollow  
            users={data.users}  
            currentUser={user}  
            currentUserProfile={profile}  
            follows={data.follows}  
          />  
  
  
          <div  
            className="side-card"  
            style={{marginTop:15}}  
          >  
  
            <div className="side-title">  
              Trending  
            </div>  
  
  
            {(() => {  
  
              const counts = {};  
  
  
              data.posts.forEach(post => {  
  
                (post.hashtags || [])  
                  .forEach(tag => {  
  
                    counts[tag] =  
                      (counts[tag] || 0) + 1;  
  
                  });  
  
              });  
  
  
              const trending =  
                Object.entries(counts)  
                  .sort(  
                    (a,b) =>  
                      b[1] - a[1]  
                  )  
                  .slice(0,5);  
  
  
              if(!trending.length){  
  
                return(  
  
                  <div  
                    style={{  
                      color:"#666",  
                      fontSize:13  
                    }}  
                  >  
                    Start posting with  
                    hashtags to create  
                    trends.  
                  </div>  
  
                );  
  
              }  
  
  
              return trending.map(  
                ([tag,count]) => (  
  
                  <div  
                    key={tag}  
                    style={{  
                      padding:"8px 0"  
                    }}  
                  >  
  
                    <div  
                      style={{  
                        color:"#8ab4ff",  
                        fontWeight:700  
                      }}  
                    >  
                      {tag}  
                    </div>  
  
  
                    <div  
                      style={{  
                        color:"#666",  
                        fontSize:12  
                      }}  
                    >  
                      {count} post  
                      {count === 1 ? "" : "s"}  
                    </div>  
  
                  </div>  
  
                )  
              );  
  
            })()}  
  
          </div>  
  
  
          <div  
            style={{  
              color:"#444",  
              fontSize:11,  
              marginTop:20,  
              textAlign:"center"  
            }}  
          >  
            Nexus • Made by Yash  
          </div>  
  
        </aside>  
  
      </div>  
  
  
      {editingProfile && (  
  
        <EditProfileModal  
          user={user}  
          profile={profile}  
          onSave={updated => {  
  
            setProfile(updated);  
            setSelectedProfile(updated);  
  
          }}  
          onClose={() =>  
            setEditingProfile(false)  
          }  
        />  
  
      )}  
  
  
      {editingPost && (  
  
        <EditPostModal  
          post={editingPost}  
          onClose={() =>  
            setEditingPost(null)  
          }  
        />  
  
      )}  
  
    </div>  
  
  );  
  
}  
  
  
/* =========================================================  
   START  
========================================================= */  
  
const root =  
  ReactDOM.createRoot(  
    document.getElementById("root")  
  );  
  
root.render(<Nexus />);  
  
</script>  </body>  
</html>
