<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#080a0d">
<title>Nexus — Social Platform</title>
<style>
*{box-sizing:border-box}
html,body,#root{margin:0;min-height:100%;width:100%}
body{background:#080a0d;color:#f4f6f8;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.3;}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
:root{--bg:#080a0d;--panel:#101318;--panel2:#171b22;--panel3:#1e242d;--line:#292f38;--text:#f4f6f8;--muted:#9099a7;--accent:#7c5cff;--accent2:#a18cff;--green:#38d486;--red:#ff6175;--yellow:#e9bf55;}
.app{min-height:100vh}
.layout{width:min(1380px,100%);margin:auto;display:grid;grid-template-columns:240px minmax(0,680px) 290px;gap:20px;padding:20px;}
.left,.right{position:sticky;top:20px;height:max-content;}
.main{min-width:0}
.logo{font-size:27px;font-weight:950;letter-spacing:-1.5px;padding:5px 10px 25px;}
.logo span{color:var(--accent)}
.nav{display:flex;flex-direction:column;gap:5px;}
.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:13px 15px;border-radius:13px;font-weight:800;}
.nav button:hover,.nav button.active{background:var(--panel2);color:#fff;}
.nav button.active{color:var(--accent2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;}
.pad{padding:18px}
.topbar{display:none;position:sticky;top:0;z-index:30;padding:12px 15px;background:#080a0df2;backdrop-filter:blur(15px);border-bottom:1px solid var(--line);align-items:center;justify-content:space-between;}
.btn{border:1px solid var(--line);background:var(--panel2);color:#fff;border-radius:10px;padding:8px 12px;font-weight:750;}
.btn:hover{background:var(--panel3)}
.btn.primary{background:var(--accent);border-color:var(--accent);}
.btn.danger{color:#ff7e8d}
.muted{color:var(--muted)}
.avatar{width:44px;height:44px;min-width:44px;border-radius:50%;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#7252ff,#ba9eff);color:white;font-weight:950;border:1px solid #ffffff18;}
.avatar.small{width:36px;height:36px;min-width:36px;font-size:12px;}
.avatar.large{width:88px;height:88px;min-width:88px;font-size:27px;}
.feed-tabs{display:flex;gap:5px;padding:5px;margin-bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;}
.feed-tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px;border-radius:10px;font-weight:800;}
.feed-tabs button.active{background:var(--panel3);color:#fff;}
.composer{padding:18px;margin-bottom:13px;}
.composer-row{display:flex;gap:12px;}
textarea,input,select{width:100%;background:#0b0e12;color:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none;}
textarea{min-height:100px;resize:vertical;}
textarea:focus,input:focus{border-color:#6c55d7;}
.composer-tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;}
.post{padding:18px;margin-bottom:12px;}
.post-head{display:flex;gap:10px;align-items:flex-start;}
.post-user{flex:1;min-width:0;}
.name{font-weight:900}
.username,.post-time{color:var(--muted);font-size:14px;}
.post-time{font-size:12px;}
.post-body{margin:13px 0 8px 54px;line-height:1.3;white-space:pre-wrap;word-break:break-word;}
.hashtag,.mention{color:#a693ff;}
.post-actions{margin-left:54px;display:flex;gap:5px;flex-wrap:wrap;}
.action{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:7px 9px;}
.action:hover{background:var(--panel2);color:#fff;}
.action.liked{color:#ff6680}
.action.saved{color:#e4bd54}
.action.reposted{color:#49dc9a}
.poll{margin:13px 0 8px 54px;padding:12px;border:1px solid var(--line);border-radius:14px;}
.poll-option{width:100%;position:relative;overflow:hidden;margin:7px 0;padding:10px;text-align:left;border:1px solid var(--line);background:#0b0e12;color:#fff;border-radius:10px;}
.poll-bar{position:absolute;left:0;top:0;bottom:0;background:#7657ff24;}
.poll-content{position:relative;display:flex;justify-content:space-between;}
.comments{margin:12px 0 0 54px;padding-top:10px;border-top:1px solid var(--line);}
.comment{padding:9px 0;}
.comment-row{display:flex;gap:8px;}
.comment-body{flex:1;min-width:0;}
.reply-list{margin-left:42px;padding-left:10px;border-left:1px solid var(--line);}
.story-box{padding:15px;margin-bottom:12px;}
.story-strip{display:flex;gap:9px;overflow:auto;}
.story{min-width:105px;border:1px solid var(--line);background:var(--panel2);color:#fff;border-radius:14px;padding:10px;text-align:left;}
.story-text{margin-top:7px;height:50px;overflow:hidden;font-size:13px;}
.section-title{font-size:22px;font-weight:950;margin-bottom:14px;}
.empty{padding:45px 15px;text-align:center;color:var(--muted);}
.searchbox{display:flex;gap:8px;}
.searchbox input{flex:1}
.user-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
.user-row:last-child{border-bottom:0}
.user-row-main{flex:1;min-width:0;}
.profile-head{padding:20px;}
.profile-top{display:flex;gap:18px;align-items:center;}
.profile-info{flex:1;min-width:0;}
.profile-name{font-size:25px;font-weight:950;}
.profile-bio{margin-top:8px;color:#c4cad2;white-space:pre-wrap;}
.stats{display:flex;gap:25px;margin-top:15px;}
.stat strong{display:block;font-size:18px;}
.stat span{color:var(--muted);font-size:12px;}
.notification{display:flex;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);}
.notification:last-child{border-bottom:0}
.dot{width:8px;height:8px;min-width:8px;margin-top:7px;border-radius:50%;background:var(--accent);}

/* CHAT */
.message-layout{display:grid;grid-template-columns:225px 1fr;min-height:650px;}
.chat-list{border-right:1px solid var(--line);padding:12px;min-width:0;}
.chat-item{display:flex;gap:9px;padding:10px;border-radius:12px;}
.chat-item:hover,.chat-item.active{background:var(--panel2);}
.chat-main{flex:1;min-width:0;}
.chat-window{display:flex;flex-direction:column;min-width:0;}
.chat-head{padding:14px;border-bottom:1px solid var(--line);}
.messages{flex:1;overflow:auto;min-height:430px;max-height:550px;padding:15px;}
.msg{display:flex;margin:7px 0;}
.msg.mine{justify-content:flex-end;}
.bubble{max-width:75%;padding:9px 12px;border:1px solid var(--line);background:var(--panel2);border-radius:14px;}
.mine .bubble{background:#382d72;border-color:#5543a1;}
.msg-meta{color:var(--muted);font-size:10px;margin-top:4px;}
.chat-compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);}
.chat-compose input{flex:1}

/* ONLINE STATUS */
.online-wrap{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.online-dot{
  width:8px;
  height:8px;
  min-width:8px;
  border-radius:50%;
  background:#707782;
  display:inline-block;
}

.online-dot.online{
  background:var(--green);
  box-shadow:0 0 0 2px rgba(56,212,134,.12);
}

/* CHAT SEARCH */
.chat-search{
  position:relative;
  margin-bottom:10px;
}

.chat-search input{
  padding:9px 10px;
  font-size:13px;
}

.chat-search-results{
  position:absolute;
  z-index:100;
  left:0;
  right:0;
  top:calc(100% + 5px);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 15px 40px rgba(0,0,0,.45);
  max-height:300px;
  overflow-y:auto;
}

.chat-search-user{
  width:100%;
  display:flex;
  align-items:center;
  gap:9px;
  border:0;
  background:transparent;
  color:var(--text);
  padding:10px;
  text-align:left;
}

.chat-search-user:hover{
  background:var(--panel2);
}

.chat-search-info{
  flex:1;
  min-width:0;
}

.chat-search-name{
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-search-username{
  color:var(--muted);
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-search-empty{
  padding:15px 10px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}

/* TYPING */
.typing-indicator{
  display:flex;
  align-items:center;
  gap:7px;
  padding:5px 14px;
  color:var(--muted);
  font-size:12px;
  min-height:25px;
}

.typing-dots{
  display:flex;
  align-items:center;
  gap:3px;
}

.typing-dots span{
  width:5px;
  height:5px;
  border-radius:50%;
  background:var(--muted);
  animation:nexusTyping 1.2s infinite ease-in-out;
}

.typing-dots span:nth-child(2){
  animation-delay:.15s;
}

.typing-dots span:nth-child(3){
  animation-delay:.3s;
}

@keyframes nexusTyping{
  0%,60%,100%{
    transform:translateY(0);
    opacity:.4;
  }
  30%{
    transform:translateY(-3px);
    opacity:1;
  }
}

.right-card{padding:15px;margin-bottom:13px;}
.trend{padding:10px 0;border-bottom:1px solid var(--line);}
.trend:last-child{border-bottom:0}
.loading-screen,.error-screen{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;background:var(--bg);}
.boot-box{width:min(600px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:30px;text-align:center;}
.boot-box h1{font-size:35px;margin:0 0 10px;}
.boot-error{margin:15px 0;padding:13px;background:#38151d;color:#ff9ba7;border-radius:10px;text-align:left;white-space:pre-wrap;word-break:break-word;}
.mobile-nav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#0b0d11f5;border-top:1px solid var(--line);padding:7px;grid-template-columns:repeat(5,1fr);}
.mobile-nav button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:7px 2px;}
.mobile-nav button.active{color:#fff;}
.modal-bg{position:fixed;inset:0;z-index:100;background:#000c;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;}
@media(max-width:1050px){.layout{grid-template-columns:210px minmax(0,1fr);}.right{display:none}}
@media(max-width:760px){
  .layout{display:block;padding:10px 10px 80px;}
  .left{display:none}
  .topbar{display:flex}
  .mobile-nav{display:grid}
  .post-body,.post-actions,.poll,.comments{margin-left:0;}
  .message-layout{grid-template-columns:1fr;}
  .chat-list{
    display:block;
    border-right:0;
    border-bottom:1px solid var(--line);
    max-height:280px;
    overflow:auto;
  }
  .chat-window{min-height:550px;}
  .profile-top{align-items:flex-start;}
  .avatar.large{width:70px;height:70px;min-width:70px;}
}
</style>
</head>

<body>
<div id="root">
  <div class="loading-screen">
    <div class="boot-box">
      <h1>Nex<span style="color:#7c5cff">us</span></h1>
      <p>Loading Nexus…</p>
      <div style="margin-top:28px;padding-top:18px;border-top:1px solid #292f38;color:#9099a7;font-size:13px;">
        Made by <strong style="color:#fff">YASH KISHORE Michalite</strong>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script>
setTimeout(function(){
  const root=document.getElementById("root");

  if(!window.React || !window.ReactDOM){
    root.innerHTML=`<div class="error-screen"><div class="boot-box"><h1>React failed to load</h1><div class="boot-error">The React library could not be loaded. Check your internet connection and reload.</div><button class="btn primary" onclick="location.reload()">Reload</button></div></div>`;
  }

  if(!window.firebase){
    root.innerHTML=`<div class="error-screen"><div class="boot-box"><h1>Firebase failed to load</h1><div class="boot-error">The Firebase SDK could not be loaded.</div><button class="btn primary" onclick="location.reload()">Reload</button></div></div>`;
  }
},3000);

window.addEventListener("error",function(e){
  console.error("Nexus error:",e.error||e.message);
});

window.addEventListener("unhandledrejection",function(e){
  console.error("Nexus promise error:",e.reason);
});
</script>

<script type="text/babel">

const { useState, useEffect, useRef } = React;

const firebaseConfig = {
  apiKey: "AIzaSyDTrvD7c1TUtPUUOSX7_-0VV9itC28LOg0",
  authDomain: "nexus-37600.firebaseapp.com",
  projectId: "nexus-37600",
  storageBucket: "nexus-37600.firebasestorage.app",
  messagingSenderId: "61496309341",
  appId: "1:61496309341:web:fdb3711264df47f318bfb4",
  measurementId: "G-41S50YF5RF"
};

const APP_ID = "nexus-37600";
const ROOT = "artifacts/" + APP_ID + "/public/data";

let db = null;
let auth = null;
let firebaseError = null;

try {
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  auth = firebase.auth();
} catch(e) {
  firebaseError = e;
  console.error(e);
}

function C(name) {
  return db.collection(ROOT + "/" + name);
}

function serverTime() {
  return firebase.firestore.FieldValue.serverTimestamp();
}

function currentUid() {
  return auth?.currentUser?.uid || null;
}

function text(v) {
  return String(v || "").trim();
}

function initials(name) {
  return text(name || "User")
    .split(/\s+/)
    .slice(0,2)
    .map(x => x[0])
    .join("")
    .toUpperCase();
}

function timeAgo(value) {
  if (!value) return "";

  let d;

  if (value.toDate) d = value.toDate();
  else if (value.seconds) d = new Date(value.seconds * 1000);
  else d = new Date(value);

  if (isNaN(d.getTime())) return "";

  const seconds = Math.max(
    1,
    Math.floor((Date.now() - d.getTime()) / 1000)
  );

  if (seconds < 60) return seconds + "s";
  if (seconds < 3600) return Math.floor(seconds / 60) + "m";
  if (seconds < 86400) return Math.floor(seconds / 3600) + "h";
  if (seconds < 604800) return Math.floor(seconds / 86400) + "d";

  return d.toLocaleDateString();
}

function username(v) {
  return text(v)
    .toLowerCase()
    .replace(/^@/,"")
    .replace(/[^a-z0-9_]/g,"")
    .slice(0,24);
}

function hashtags(v) {
  const result = [];
  const re = /(^|\s)#([a-zA-Z0-9_]+)/g;
  let m;

  while ((m = re.exec(v))) {
    result.push(m[2].toLowerCase());
  }

  return [...new Set(result)];
}

function mentions(v) {
  const result = [];
  const re = /(^|\s)@([a-zA-Z0-9_]+)/g;
  let m;

  while ((m = re.exec(v))) {
    result.push(m[2].toLowerCase());
  }

  return [...new Set(result)];
}

function renderText(v) {
  return text(v)
    .split(/(\#[a-zA-Z0-9_]+|\@[a-zA-Z0-9_]+)/)
    .map((p, i) => {
      if (p.startsWith("#")) {
        return <span className="hashtag" key={i}>{p}</span>;
      }

      if (p.startsWith("@")) {
        return <span className="mention" key={i}>{p}</span>;
      }

      return <React.Fragment key={i}>{p}</React.Fragment>;
    });
}

/* -------------------------------------------------------
   REAL-TIME PRESENCE
------------------------------------------------------- */

function isUserOnline(person) {
  if (!person || person.showOnline === false) return false;
  if (!person.lastSeen) return false;

  let lastSeen;

  try {
    if (person.lastSeen.toDate) {
      lastSeen = person.lastSeen.toDate();
    } else if (person.lastSeen.seconds) {
      lastSeen = new Date(person.lastSeen.seconds * 1000);
    } else {
      lastSeen = new Date(person.lastSeen);
    }
  } catch(e) {
    return false;
  }

  if (isNaN(lastSeen.getTime())) return false;

  return Date.now() - lastSeen.getTime() < 30000;
}

function usePresence(profile) {
  useEffect(() => {
    if (!profile?.uid || !db) return;

    let stopped = false;

    async function heartbeat() {
      if (stopped || !currentUid()) return;

      try {
        await C("users").doc(profile.uid).set({
          online: true,
          lastSeen: serverTime()
        }, { merge: true });
      } catch(e) {
        console.error("Presence heartbeat:", e);
      }
    }

    heartbeat();

    const timer = setInterval(heartbeat, 15000);

    return () => {
      stopped = true;
      clearInterval(timer);
    };
  }, [profile?.uid]);
}

/* -------------------------------------------------------
   AUTH
------------------------------------------------------- */

function useAuth() {
  const [profile, setProfile] = useState(null);
  const [user, setUser] = useState(null);
  const [ready, setReady] = useState(false);
  const [error, setError] = useState(null);

  useEffect(() => {
    if (firebaseError) {
      setError(firebaseError);
      setReady(true);
      return;
    }

    let stopped = false;

    const unsubscribe = auth.onAuthStateChanged(async u => {
      try {
        if (!u) {
          await auth.signInAnonymously();
          return;
        }

        if (stopped) return;

        setUser(u);

        const ref = C("users").doc(u.uid);
        const snap = await ref.get();

        if (!snap.exists) {
          const newProfile = {
            uid: u.uid,
            displayName: "Nexus User",
            username: "user_" + u.uid.slice(0, 8),
            bio: "",
            followersCount: 0,
            followingCount: 0,
            postsCount: 0,
            showOnline: true,
            notifyLikes: true,
            notifyMessages: true,
            online: true,
            lastSeen: serverTime(),
            createdAt: serverTime(),
            updatedAt: serverTime()
          };

          await ref.set(newProfile);

          setProfile({
            ...newProfile,
            createdAt: null,
            updatedAt: null,
            lastSeen: null
          });
        } else {
          setProfile({
            uid: u.uid,
            ...snap.data()
          });
        }

        setReady(true);

      } catch(e) {
        console.error(e);

        if (!stopped) {
          setError(e);
          setReady(true);
        }
      }
    }, e => {
      setError(e);
      setReady(true);
    });

    return () => {
      stopped = true;
      unsubscribe();
    };
  }, []);

  return {
    user,
    profile,
    setProfile,
    ready,
    error
  };
}

/* -------------------------------------------------------
   COLLECTION
------------------------------------------------------- */

function useCollection(name, makeQuery, deps = []) {
  const [items, setItems] = useState([]);
  const [error, setError] = useState(null);

  useEffect(() => {
    if (!db) return;

    let query;

    try {
      query = makeQuery(C(name));
    } catch(e) {
      setError(e);
      return;
    }

    const unsubscribe = query.onSnapshot(snap => {

      const result = snap.docs.map(d => ({
        id: d.id,
        ...d.data()
      }));

      result.sort((a, b) => {

        function timestamp(x) {
          if (!x) return 0;

          if (x.toDate) return x.toDate().getTime();
          if (x.seconds) return x.seconds * 1000;

          const d = new Date(x);

          return isNaN(d.getTime()) ? 0 : d.getTime();
        }

        return timestamp(b.createdAt) - timestamp(a.createdAt);
      });

      setItems(result);
      setError(null);

    }, e => {
      console.error("Nexus " + name + " error:", e);
      setError(e);
    });

    return unsubscribe;

  }, deps);

  return {
    items,
    error
  };
}

/* -------------------------------------------------------
   DATA
------------------------------------------------------- */

function useData(profile) {

  const id = profile?.uid;

  const posts = useCollection(
    "posts",
    ref => ref.limit(500),
    []
  );

  const users = useCollection(
    "users",
    ref => ref.limit(500),
    []
  );

  const follows = useCollection(
    "follows",
    ref => ref.where("followerId", "==", id),
    [id]
  );

  const likes = useCollection(
    "likes",
    ref => ref.where("userId", "==", id),
    [id]
  );

  const bookmarks = useCollection(
    "bookmarks",
    ref => ref.where("userId", "==", id),
    [id]
  );

  const reposts = useCollection(
    "reposts",
    ref => ref.where("userId", "==", id),
    [id]
  );

  const blocks = useCollection(
    "blocks",
    ref => ref.where("blockerId", "==", id),
    [id]
  );

  const mutes = useCollection(
    "mutes",
    ref => ref.where("muterId", "==", id),
    [id]
  );

  const notifications = useCollection(
    "notifications",
    ref => ref.where("recipientId", "==", id).limit(100),
    [id]
  );

  const stories = useCollection(
    "stories",
    ref => ref.limit(300),
    []
  );

  return {
    posts: posts.items,
    users: users.items,
    follows: follows.items,

async function notify(recipient, message, type, data = {}) {

  if (!recipient || recipient === currentUid()) return;

  try {

    await C("notifications").add({
      recipientId: recipient,
      actorId: currentUid(),
      message,
      type,
      read: false,
      createdAt: serverTime(),
      ...data
    });

  } catch(e) {
    console.error("Notification:", e);
  }
}

------------------------------------------------------- */

function FollowButton({ targetId, following }) {

  const [busy, setBusy] = useState(false);

  async function toggle() {

    if (busy || !targetId || targetId === currentUid()) return;

    setBusy(true);

    try {

      const snap = await C("follows")
        .where("followerId", "==", currentUid())
        .where("followingId", "==", targetId)
        .limit(1)
        .get();

      if (snap.empty) {

        await C("follows").add({
          followerId: currentUid(),
          followingId: targetId,
          createdAt: serverTime()
        });

        await C("users")
          .doc(targetId)
          .set({
            followersCount:
              firebase.firestore.FieldValue.increment(1)
          }, { merge: true });

        await C("users")
          .doc(currentUid())
          .set({
            followingCount:
              firebase.firestore.FieldValue.increment(1)
          }, { merge: true });

        await notify(
          targetId,
          "started following you",
          "follow"
        );

      } else {

        const batch = db.batch();

        snap.docs.forEach(d => batch.delete(d.ref));

        await batch.commit();

        await C("users")
          .doc(targetId)
          .set({
            followersCount:
              firebase.firestore.FieldValue.increment(-1)
          }, { merge: true });

        await C("users")
          .doc(currentUid())
          .set({
            followingCount:
              firebase.firestore.FieldValue.increment(-1)
          }, { merge: true });
      }

    } catch(e) {
      console.error(e.message);
    }

    setBusy(false);
  }

  return (
    <button
      className={"btn " + (!following ? "primary" : "")}
      onClick={toggle}
      disabled={busy}
    >
      {following ? "Following" : "Follow"}
    </button>
  );
}

/* -------------------------------------------------------
   COMPOSER
------------------------------------------------------- */

function Composer({ profile }) {

  const [value, setValue] = useState("");
  const [poll, setPoll] = useState(false);
  const [question, setQuestion] = useState("");
  const [options, setOptions] = useState(["", ""]);
  const [busy, setBusy] = useState(false);

  async function publish() {

    const body = text(value);

    if (!body && !poll) return;

    setBusy(true);

    try {

      const data = {
        authorId: currentUid(),
        authorName: profile.displayName || "Nexus User",
        authorUsername: profile.username || "user",
        text: body,
        createdAt: serverTime(),
        likesCount: 0,
        commentsCount: 0,
        repostsCount: 0,
        hashtags: hashtags(body),
        mentions: mentions(body)
      };

      if (poll) {

        const clean = options.map(text).filter(Boolean);

        if (!text(question) || clean.length < 2) {
          console.error(
            "A poll needs a question and at least 2 options."
          );

          setBusy(false);
          return;
        }

        data.poll = {
          question: text(question),
          options: clean.map(x => ({
            text: x,
            votes: 0
          }))
        };
      }

      const ref = await C("posts").add(data);

      for (const mention of mentions(body)) {

        const users = await C("users")
          .where("username", "==", mention)
          .limit(1)
          .get();

        if (!users.empty) {
          await notify(
            users.docs[0].id,
            "mentioned you in a post",
            "mention",
            { postId: ref.id }
          );
        }
      }

      await C("users")
        .doc(currentUid())
        .set({
          postsCount:
            firebase.firestore.FieldValue.increment(1)
        }, { merge: true });

      setValue("");
      setPoll(false);
      setQuestion("");
      setOptions(["", ""]);

    } catch(e) {
      console.error(e.message);
    }

    setBusy(false);
  }

  return (
    <div className="card composer">
      <div className="composer-row">
        <Avatar profile={profile} />

        <div style={{ flex: 1 }}>

          <textarea
            value={value}
            onChange={e => setValue(e.target.value)}
            placeholder="What's happening on Nexus?"
          />

          {poll && (
            <div
              style={{
                marginTop: 10,
                border: "1px solid var(--line)",
                borderRadius: 12,
                padding: 10
              }}
            >
              <input
                value={question}
                onChange={e => setQuestion(e.target.value)}
                placeholder="Poll question"
              />

              {options.map((x, i) => (
                <div
                  key={i}
                  style={{
                    display: "flex",
                    gap: 6,
                    marginTop: 7
                  }}
                >
                  <input
                    value={x}
                    onChange={e => {
                      const copy = [...options];
                      copy[i] = e.target.value;
                      setOptions(copy);
                    }}
                    placeholder={"Option " + (i + 1)}
                  />

                  {options.length > 2 && (
                    <button
                      className="btn"
                      onClick={() =>
                        setOptions(
                          options.filter((_, n) => n !== i)
                        )
                      }
                    >
                      ×
                    </button>
                  )}
                </div>
              ))}

              <button
                className="btn"
                style={{ marginTop: 8 }}
                onClick={() => {
                  if (options.length < 6) {
                    setOptions([...options, ""]);
                  }
                }}
              >
                + Option
              </button>
            </div>
          )}

          <div className="composer-tools">

            <button
              className={"btn " + (poll ? "primary" : "")}
              onClick={() => setPoll(!poll)}
            >
              📊 Poll
            </button>

            <span
              className="muted"
              style={{
                padding: "8px 2px",
                fontSize: 12
              }}
            >
              #hashtags · @mentions
            </span>

            <div style={{ marginLeft: "auto" }}>
              <button
                className="btn primary"
                disabled={busy}
                onClick={publish}
              >
                {busy ? "Posting..." : "Post"}
              </button>
            </div>

          </div>
        </div>
      </div>
    </div>
  );
}

/* -------------------------------------------------------
   POLL
------------------------------------------------------- */

function Poll({ post }) {

  const [options, setOptions] = useState(
    post.poll?.options || []
  );

  const [voted, setVoted] = useState(false);

  useEffect(() => {

    C("pollVotes")
      .where("pollId", "==", post.id)
      .where("userId", "==", currentUid())
      .limit(1)
      .get()
      .then(snap => setVoted(!snap.empty))
      .catch(() => {});

  }, [post.id]);

  async function vote(index) {

    if (voted) return;

    try {

      await C("pollVotes").add({
        pollId: post.id,
        postId: post.id,
        userId: currentUid(),
        option: index,
        createdAt: serverTime()
      });

      const next = options.map((x, i) =>
        i === index
          ? {
              ...x,
              votes: Number(x.votes || 0) + 1
            }
          : x
      );

      await C("posts")
        .doc(post.id)
        .set({
          poll: {
            ...post.poll,
            options: next
          }
        }, { merge: true });

      setOptions(next);
      setVoted(true);

    } catch(e) {
      console.error(e.message);
    }
  }

  const total = options.reduce(
    (a, x) => a + Number(x.votes || 0),
    0
  );

  return (
    <div className="poll">

      <strong>{post.poll.question}</strong>

      {options.map((x, i) => {

        const percent = total
          ? Math.round(
              Number(x.votes || 0) * 100 / total
            )
          : 0;

        return (
          <button
            className="poll-option"
            key={i}
            disabled={voted}
            onClick={() => vote(i)}
          >
            <span
              className="poll-bar"
              style={{ width: percent + "%" }}
            />

            <span className="poll-content">
              <span>{x.text}</span>
              <span>{percent}%</span>
            </span>
          </button>
        );
      })}

      <div className="muted">
        {total} votes
        {voted ? " · You voted" : ""}
      </div>

    </div>
  );
}

/* -------------------------------------------------------
   COMMENTS
------------------------------------------------------- */

function Comments({ postId, users }) {

  const [comments, setComments] = useState([]);
  const [value, setValue] = useState("");
  const [reply, setReply] = useState(null);

  useEffect(() => {

    const unsubscribe = C("comments")
      .where("postId", "==", postId)
      .limit(500)
      .onSnapshot(snap => {

        const arr = snap.docs.map(d => ({
          id: d.id,
          ...d.data()
        }));

        arr.sort((a, b) => {

          function t(x) {
            if (!x) return 0;
            if (x.toDate) return x.toDate().getTime();
            if (x.seconds) return x.seconds * 1000;
            return new Date(x).getTime() || 0;
          }

          return t(a.createdAt) - t(b.createdAt);
        });

        setComments(arr);

      }, e => console.error(e));

    return unsubscribe;

  }, [postId]);

  async function send() {

    if (!text(value)) return;

    try {

      await C("comments").add({
        postId,
        authorId: currentUid(),
        text: text(value),
        parentId: reply || null,
        createdAt: serverTime()
      });

      await C("posts")
        .doc(postId)
        .set({
          commentsCount:
            firebase.firestore.FieldValue.increment(1)
        }, { merge: true });

      const post = await C("posts")
        .doc(postId)
        .get();

      if (post.exists) {
        await notify(
          post.data().authorId,
          "commented on your post",
          "comment",
          { postId }
        );
      }

      setValue("");
      setReply(null);

    } catch(e) {
      console.error(e.message);
    }
  }

  function renderComment(c) {

    const author = users.find(
      u => u.uid === c.authorId
    );

    const replies = comments.filter(
      x => x.parentId === c.id
    );

    return (
      <div className="comment" key={c.id}>

        <div className="comment-row">

          <Avatar
            profile={author || { displayName: "User" }}
            size="small"
          />

          <div className="comment-body">

            <strong>
              {author?.displayName || "User"}
            </strong>

            <span className="muted">
              @{author?.username || "user"}
            </span>

            <div
              style={{
                marginTop: 3,
                whiteSpace: "pre-wrap"
              }}
            >
              {renderText(c.text)}
            </div>

            <div
              style={{
                display: "flex",
                gap: 8,
                marginTop: 5
              }}
            >
              <button
                className="btn"
                onClick={() => {
                  setReply(c.id);
                  setValue(
                    "@" +
                    (author?.username || "user") +
                    " "
                  );
                }}
              >
                Reply
              </button>
            </div>

          </div>

        </div>

        {replies.length > 0 && (
          <div className="reply-list">
            {replies.map(renderComment)}
          </div>
        )}

      </div>
    );
  }

  return (
    <div className="comments">

      {comments
        .filter(x => !x.parentId)
        .map(renderComment)}

      <div
        style={{
          display: "flex",
          gap: 7,
          marginTop: 8
        }}
      >

        <input
          value={value}
          onChange={e => setValue(e.target.value)}
          placeholder={
            reply
              ? "Write a reply..."
              : "Write a comment..."
          }
          onKeyDown={e => {
            if (e.key === "Enter") {
              e.preventDefault();
              send();
            }
          }}
        />

        <button
          className="btn primary"
          onClick={send}
        >
          Send
        </button>

      </div>

    </div>
  );
}

/* -------------------------------------------------------
   POST
------------------------------------------------------- */

function Post({
  post,
  users,
  liked,
  saved,
  reposted,
  following
}) {

  const [commentsOpen, setCommentsOpen] = useState(false);
  const [menu, setMenu] = useState(false);

  const authorId =
    post.authorId ||
    post.authorUid ||
    post.uid ||
    null;

  const author = users.find(
    u => u.uid === authorId
  );

  const authorName =
    author?.displayName ||
    post.authorName ||
    post.authorDisplayName ||
    post.displayName ||
    post.name ||
    "Nexus User";

  const authorUsername =
    author?.username ||
    post.authorUsername ||
    post.authorUserName ||
    post.username ||
    "user";

  const authorProfile =
    author || {
      uid: authorId,
      displayName: authorName,
      username: authorUsername
    };

  async function like() {

    try {

      const snap = await C("likes")
        .where("postId", "==", post.id)
        .where("userId", "==", currentUid())
        .limit(1)
        .get();

      if (snap.empty) {

        await C("likes").add({
          postId: post.id,
          userId: currentUid(),
          createdAt: serverTime()
        });

        await C("posts")
          .doc(post.id)
          .set({
            likesCount:
              firebase.firestore.FieldValue.increment(1)
          }, { merge: true });

        await notify(
          authorId,
          "liked your post",
          "like",
          { postId: post.id }
        );

      } else {

        const batch = db.batch();

        snap.docs.forEach(d =>
          batch.delete(d.ref)
        );

        await batch.commit();

        await C("posts")
          .doc(post.id)
          .set({
            likesCount:
              firebase.firestore.FieldValue.increment(-1)
          }, { merge: true });
      }

    } catch(e) {
      console.error(e.message);
    }
  }

  async function save() {

    try {

      const snap = await C("bookmarks")
        .where("postId", "==", post.id)
        .where("userId", "==", currentUid())
        .limit(1)
        .get();

      if (snap.empty) {

        await C("bookmarks").add({
          postId: post.id,
          userId: currentUid(),
          createdAt: serverTime()
        });

      } else {

        const batch = db.batch();

        snap.docs.forEach(d =>
          batch.delete(d.ref)
        );

        await batch.commit();
      }

    } catch(e) {
      console.error(e.message);
    }
  }

  async function repost() {

    try {

      const snap = await C("reposts")
        .where("postId", "==", post.id)
        .where("userId", "==", currentUid())
        .limit(1)
        .get();

      if (snap.empty) {

        await C("reposts").add({
          postId: post.id,
          userId: currentUid(),
          createdAt: serverTime()
        });

        await C("posts")
          .doc(post.id)
          .set({
            repostsCount:
              firebase.firestore.FieldValue.increment(1)
          }, { merge: true });

      } else {

        const batch = db.batch();

        snap.docs.forEach(d =>
          batch.delete(d.ref)
        );

        await batch.commit();

        await C("posts")
          .doc(post.id)
          .set({
            repostsCount:
              firebase.firestore.FieldValue.increment(-1)
          }, { merge: true });
      }

    } catch(e) {
      console.error(e.message);
    }
  }

  async function deletePost() {

    if (authorId !== currentUid()) return;

    try {
      await C("posts").doc(post.id).delete();
    } catch(e) {
      console.error(e.message);
    }
  }

  async function pin() {

    if (authorId !== currentUid()) return;

    try {

      await C("posts")
        .doc(post.id)
        .set({
          pinned: !post.pinned
        }, { merge: true });

    } catch(e) {
      console.error(e.message);
    }
  }

  async function report() {

    try {

      await C("reports").add({
        reporterId: currentUid(),
        targetType: "post",
        targetId: post.id,
        targetAuthorId: authorId,
        reason: "Reported via App",
        status: "open",
        createdAt: serverTime()
      });

      console.log("Report submitted.");

    } catch(e) {
      console.error(e.message);
    }
  }

  return (
    <article className="card post">

      <div className="post-head">

        <Avatar profile={authorProfile} />

        <div className="post-user">

          <div className="name">

            {authorName}

            {post.pinned && (
              <span
                style={{
                  color: "var(--yellow)",
                  fontSize: 11,
                  marginLeft: 7
                }}
              >
                PINNED
              </span>
            )}

          </div>

          <div className="username">
            @{authorUsername}
          </div>

        </div>

        <div className="post-time">
          {timeAgo(post.createdAt)}
        </div>

        <button
          className="btn"
          onClick={() => setMenu(!menu)}
        >
          •••
        </button>

      </div>

      <div className="post-body">
        {renderText(post.text)}
      </div>

      {post.poll && <Poll post={post} />}

      <div className="post-actions">

        <button
          className={"action " + (liked ? "liked" : "")}
          onClick={like}
        >
          ♥ {post.likesCount || 0}
        </button>

        <button
          className="action"
          onClick={() =>
            setCommentsOpen(!commentsOpen)
          }
        >
          💬 {post.commentsCount || 0}
        </button>

        <button
          className={
            "action " +
            (reposted ? "reposted" : "")
          }
          onClick={repost}
        >
          ↻ {post.repostsCount || 0}
        </button>

        <button
          className={
            "action " +
            (saved ? "saved" : "")
          }
          onClick={save}
        >
          🔖
        </button>

        {authorId &&
          authorId !== currentUid() && (
            <FollowButton
              targetId={authorId}
              following={following}
            />
          )}

      </div>

      {menu && (

        <div
          style={{
            display: "flex",
            gap: 7,
            flexWrap: "wrap",
            marginTop: 10,
            paddingTop: 10,
            borderTop: "1px solid var(--line)"
          }}
        >

          {authorId === currentUid() && (
            <>
              <button
                className="btn"
                onClick={pin}
              >
                {post.pinned ? "Unpin" : "Pin"}
              </button>

              <button
                className="btn danger"
                onClick={deletePost}
              >
                Delete
              </button>
            </>
          )}

          {authorId !== currentUid() && (
            <button
              className="btn danger"
              onClick={report}
            >
              Report
            </button>
          )}

        </div>
      )}

      {commentsOpen && (
        <Comments
          postId={post.id}
          users={users}
        />
      )}

    </article>
  );
}

/* -------------------------------------------------------
   FEED
------------------------------------------------------- */

function Feed({ mode, data, profile }) {

  const following = new Set(
    data.follows.map(x => x.followingId)
  );

  const liked = new Set(
    data.likes.map(x => x.postId)
  );

  const saved = new Set(
    data.bookmarks.map(x => x.postId)
  );

  const reposted = new Set(
    data.reposts.map(x => x.postId)
  );

  let posts = [...data.posts];

  if (mode === "following") {

    posts = posts.filter(p => {

      const authorId =
        p.authorId ||
        p.authorUid ||
        p.uid;

      return (
        following.has(authorId) ||
        authorId === currentUid()
      );
    });
  }

  if (mode === "saved") {
    posts = posts.filter(p =>
      saved.has(p.id)
    );
  }

  if (posts.length === 0) {

    return (
      <div className="card empty">
        {mode === "saved"
          ? "No saved posts yet."
          : mode === "following"
          ? "Follow people to see their posts here."
          : "No posts yet. Create the first post!"}
      </div>
    );
  }

  return (
    <>
      {posts.map(post => {

        const authorId =
          post.authorId ||
          post.authorUid ||
          post.uid;

        return (
          <Post
            key={post.id}
            post={post}
            users={data.users}
            liked={liked.has(post.id)}
            saved={saved.has(post.id)}
            reposted={reposted.has(post.id)}
            following={following.has(authorId)}
          />
        );
      })}
    </>
  );
}

function StoryCreator() {

  const [open, setOpen] = useState(false);
  const [value, setValue] = useState("");

  async function publish() {

    if (!text(value)) return;

    try {

      await C("stories").add({
        authorId: currentUid(),
        text: text(value),
        createdAt: serverTime(),
        expiresAt:
          new Date(
            Date.now() +
            24 * 60 * 60 * 1000
          )
      });

      setValue("");
      setOpen(false);

    } catch(e) {
      console.error(e.message);
    }
  }

  if (!open) {

    return (
      <button
        className="btn"
        onClick={() => setOpen(true)}
      >
        + Story
      </button>
    );
  }

  return (
    <div className="modal-bg">

      <div className="modal">

        <h3>Create Story</h3>

        <textarea
          value={value}
          onChange={e =>
            setValue(e.target.value)
          }
          placeholder="Share something..."
        />

        <div
          style={{
            display: "flex",
            gap: 8,
            justifyContent: "flex-end",
            marginTop: 10
          }}
        >

          <button
            className="btn"
            onClick={() => setOpen(false)}
          >
            Cancel
          </button>

          <button
            className="btn primary"
            onClick={publish}
          >
            Publish
          </button>

        </div>

      </div>

    </div>
  );
}

/* =======================================================
   MESSAGES
   FINAL FIXED CHAT SYSTEM
======================================================= */

function Messages({ users }) {

  const [chats, setChats] = useState([]);
  const [activeChat, setActiveChat] = useState(null);
  const [messages, setMessages] = useState([]);
  const [textVal, setTextVal] = useState("");
  const [chatSearch, setChatSearch] = useState("");
  const [typingUsers, setTypingUsers] = useState([]);
  const typingTimer = useRef(null);

  /* -----------------------------------------------------
     REAL-TIME CHAT LIST
  ----------------------------------------------------- */

  useEffect(() => {

    const uid = currentUid();

    if (!uid) return;

    const unsub = C("chats")
      .where(
        "participants",
        "array-contains",
        uid
      )
      .onSnapshot(snap => {

        const list = snap.docs.map(d => ({
          id: d.id,
          ...d.data()
        }));

        list.sort((a, b) => {

          function getTime(v) {

            if (!v) return 0;

            if (v.toDate) {
              return v.toDate().getTime();
            }

            if (v.seconds) {
              return v.seconds * 1000;
            }

            const d = new Date(v);

            return isNaN(d.getTime())
              ? 0
              : d.getTime();
          }

          return (
            getTime(b.updatedAt) -
            getTime(a.updatedAt)
          );
        });

        setChats(list);

      }, e => {
        console.error(
          "Chat list error:",
          e
        );
      });

    return unsub;

  }, []);

  /* -----------------------------------------------------
     REAL-TIME MESSAGES
  ----------------------------------------------------- */

  useEffect(() => {

    if (!activeChat) {
      setMessages([]);
      return;
    }

    const unsub = C("chats")
      .doc(activeChat.id)
      .collection("messages")
      .orderBy("createdAt", "asc")
      .onSnapshot(snap => {

        setMessages(
          snap.docs.map(d => ({
            id: d.id,
            ...d.data()
          }))
        );

      }, e => {
        console.error(
          "Messages error:",
          e
        );
      });

    return unsub;

  }, [activeChat?.id]);

  /* -----------------------------------------------------
     REAL-TIME TYPING
  ----------------------------------------------------- */

  useEffect(() => {

    if (!activeChat) {
      setTypingUsers([]);
      return;
    }

    const unsub = C("chats")
      .doc(activeChat.id)
      .collection("typing")
      .onSnapshot(snap => {

        const now = Date.now();

        const active = snap.docs
          .map(d => ({
            id: d.id,
            ...d.data()
          }))
          .filter(item => {

            if (item.uid === currentUid()) {
              return false;
            }

            if (!item.typing) {
              return false;
            }

            if (!item.updatedAt) {
              return false;
            }

            let updated;

            try {

              if (item.updatedAt.toDate) {
                updated =
                  item.updatedAt.toDate().getTime();
              } else if (item.updatedAt.seconds) {
                updated =
                  item.updatedAt.seconds * 1000;
              } else {
                updated =
                  new Date(
                    item.updatedAt
                  ).getTime();
              }

            } catch(e) {
              return false;
            }

            return (
              !isNaN(updated) &&
              now - updated < 5000
            );
          });

        setTypingUsers(active);

      }, e => {

        console.error(
          "Typing listener error:",
          e
        );

        setTypingUsers([]);

      });

    return unsub;

  }, [activeChat?.id]);

  /* -----------------------------------------------------
     STOP TYPING
  ----------------------------------------------------- */

  async function stopTyping(chatId) {

    if (!chatId || !currentUid()) return;

    try {

      await C("chats")
        .doc(chatId)
        .collection("typing")
        .doc(currentUid())
        .delete();

    } catch(e) {

      console.error(
        "Stop typing:",
        e
      );
    }
  }

  /* -----------------------------------------------------
     SET TYPING
  ----------------------------------------------------- */

  async function updateTyping(value) {

    if (!activeChat || !currentUid()) {
      return;
    }

    const typingRef = C("chats")
      .doc(activeChat.id)
      .collection("typing")
      .doc(currentUid());

    try {

      if (!text(value)) {

        await typingRef.delete();

        return;
      }

      await typingRef.set({
        uid: currentUid(),
        typing: true,
        updatedAt: serverTime()
      }, { merge: true });

      if (typingTimer.current) {
        clearTimeout(typingTimer.current);
      }

      typingTimer.current = setTimeout(() => {
        stopTyping(activeChat.id);
      }, 2000);

    } catch(e) {

      console.error(
        "Typing update:",
        e
      );
    }
  }

  /* -----------------------------------------------------
     CLEANUP
  ----------------------------------------------------- */

  useEffect(() => {

    return () => {

      if (typingTimer.current) {
        clearTimeout(typingTimer.current);
      }

      if (activeChat?.id) {
        stopTyping(activeChat.id);
      }

    };

  }, [activeChat?.id]);

  /* -----------------------------------------------------
     SEARCH USERS
  ----------------------------------------------------- */

  const search = chatSearch
    .trim()
    .toLowerCase();

  const searchResults = search
    ? users
        .filter(u => u.uid !== currentUid())
        .filter(u =>
          String(u.displayName || "")
            .toLowerCase()
            .includes(search) ||
          String(u.username || "")
            .toLowerCase()
            .includes(search)
        )
        .slice(0, 20)
    : [];

  /* -----------------------------------------------------
     OPEN / CREATE CHAT
  ----------------------------------------------------- */

  async function startChat(user) {

    if (!user || user.uid === currentUid()) {
      return;
    }

    try {

      const participants = [
        currentUid(),
        user.uid
      ].sort();

      const snap = await C("chats")
        .where(
          "participants",
          "==",
          participants
        )
        .limit(1)
        .get();

      if (!snap.empty) {

        setActiveChat({
          id: snap.docs[0].id,
          ...snap.docs[0].data()
        });

      } else {

        const ref = await C("chats").add({
          participants,
          updatedAt: serverTime(),
          lastMessage: ""
        });

        setActiveChat({
          id: ref.id,
          participants,
          updatedAt: null,
          lastMessage: ""
        });
      }

      setChatSearch("");

    } catch(e) {

      console.error(
        "Start chat:",
        e
      );

      alert(
        "Could not open chat.\n\n" +
        (e?.message || String(e))
      );
    }
  }

  /* -----------------------------------------------------
     OLD NEW CHAT SUPPORT
  ----------------------------------------------------- */

  async function newChat() {

    if (!text(chatSearch)) return;

    const target = username(chatSearch);

    const user = users.find(
      u => u.username === target
    );

    if (!user) {
      alert("User not found.");
      return;
    }

    await startChat(user);
  }

  /* -----------------------------------------------------
     FINAL MESSAGE SEND
  ----------------------------------------------------- */

  async function send() {

    if (!activeChat) {
      alert("Please select a chat first.");
      return;
    }

    const messageText = text(textVal);

    if (!messageText) {
      return;
    }

    const uid = currentUid();

    if (!uid) {
      alert(
        "You are not signed in. Please reload the app."
      );
      return;
    }

    const chatId = activeChat.id;

    try {

      /*
       * Typing cleanup can never block sending.
       */
      if (typingTimer.current) {
        clearTimeout(typingTimer.current);
        typingTimer.current = null;
      }

      stopTyping(chatId).catch(() => {});

      /*
       * WRITE MESSAGE FIRST
       */
      await C("chats")
        .doc(chatId)
        .collection("messages")
        .add({
          text: messageText,
          senderId: uid,
          createdAt: serverTime()
        });

      /*
       * UPDATE CHAT
       */
      await C("chats")
        .doc(chatId)
        .set({
          participants: activeChat.participants,
          lastMessage: messageText,
          updatedAt: serverTime()
        }, { merge: true });

      /*
       * Clear only after successful message write.
       */
      setTextVal("");

      /*
       * Notification is completely separate.
       * It cannot make the message fail.
       */
      const otherId =
        activeChat.participants.find(
          p => p !== uid
        );

      if (otherId) {

        notify(
          otherId,
          "sent you a message",
          "message"
        ).catch(e => {
          console.error(
            "Message notification failed:",
            e
          );
        });

      }

    } catch(e) {

      console.error(
        "MESSAGE SEND ERROR:",
        e
      );

      alert(
        "Message could not be sent.\n\n" +
        (e?.message || String(e))
      );
    }
  }

  /* -----------------------------------------------------
     CURRENT CHAT USER
  ----------------------------------------------------- */

  const activeOtherId =
    activeChat?.participants?.find(
      p => p !== currentUid()
    );

  const activeOther =
    users.find(
      u => u.uid === activeOtherId
    );

  /* -----------------------------------------------------
     RENDER
  ----------------------------------------------------- */

  return (

    <div className="card message-layout">

      <div className="chat-list">

        <div
          style={{
            display: "flex",
            justifyContent: "space-between",
            marginBottom: 10,
            alignItems: "center"
          }}
        >

          <strong>Chats</strong>

          <span
            className="muted"
            style={{ fontSize: 11 }}
          >
            {chats.length}
          </span>

        </div>

        <div className="chat-search">

          <input
            value={chatSearch}
            onChange={e =>
              setChatSearch(e.target.value)
            }
            placeholder="Search people..."
            onKeyDown={e => {

              if (
                e.key === "Enter" &&
                searchResults.length > 0
              ) {
                e.preventDefault();
                startChat(searchResults[0]);
              }

            }}
          />

          {search && (

            <div className="chat-search-results">

              {searchResults.length === 0 ? (

                <div className="chat-search-empty">
                  No users found
                </div>

              ) : (

                searchResults.map(person => {

                  const online =
                    isUserOnline(person);

                  return (

                    <button
                      key={person.uid}
                      className="chat-search-user"
                      onClick={() =>
                        startChat(person)
                      }
                    >

                      <Avatar
                        profile={person}
                        size="small"
                      />

                      <div className="chat-search-info">

                        <div className="chat-search-name">
                          {person.displayName ||
                            "User"}
                        </div>

                        <div className="chat-search-username">
                          @{person.username ||
                            "user"}
                        </div>

                      </div>

                      <span
                        className={
                          "online-dot " +
                          (online
                            ? "online"
                            : "")
                        }
                      />

                    </button>

                  );
                })

              )}

            </div>
          )}

        </div>

        {chats.length === 0 ? (

          <div
            className="empty"
            style={{
              padding: "25px 5px",
              fontSize: 12
            }}
          >
            Search for someone above to start
            a conversation.
          </div>

        ) : (

          chats.map(c => {

            const otherId =
              c.participants.find(
                p => p !== currentUid()
              );

            const other =
              users.find(
                u => u.uid === otherId
              );

            const online =
              isUserOnline(other);

            const isTyping =
              typingUsers.some(
                t => t.uid === otherId
              );

            return (

              <button
                key={c.id}
                className={
                  "chat-item " +
                  (
                    activeChat?.id === c.id
                      ? "active"
                      : ""
                  )
                }
                style={{
                  width: "100%",
                  border: 0,
                  background:
                    activeChat?.id === c.id
                      ? undefined
                      : "transparent",
                  color: "var(--text)",
                  textAlign: "left",
                  cursor: "pointer"
                }}
                onClick={() => {

                    setActiveChat(c);

                  }

              >

                  >

                      : (

                        "Start chatting"
                      )}

                  </div>

                </div>

              </button>
            );
          })
        )}

      </div>

      <div className="chat-window">

        {activeChat ? (

          <>

            <div className="chat-head">

              <div
                style={{
                  display: "flex",
                  alignItems: "center",
                  gap: 10
                }}

                      (

                    />

                    {isUserOnline(activeOther)
                      ? "Online"
                      : "Offline"}

                  </div>

                </div>

              </div>

            </div>

            <div className="messages">

              {messages.length === 0 && (

                <div
                  className="empty"
                  style={{
                    padding: 25
                  }}
                >
                  No messages yet. Say hello!
                </div>
              )}

              {messages.map(m => {

                const mine =
                  m.senderId === currentUid();

                return (

                  <div
                    key={m.id}
                    className={
                      "msg " +
                      (
                        mine
                          ? "mine"
                          : ""
                      )
                    }
                  >

                    <div className="bubble">

                      <div>
                        {m.text}
                      </div>

                      <div
                        className="msg-meta"
                        style={{
                          textAlign:
                            mine
                              ? "right"
                              : "left"
                        }}
                      >
                        {timeAgo(m.createdAt)}
                      </div>

                    </div>

                  </div>

                );
              })}

            </div>

            <div className="typing-indicator">

              {typingUsers.length > 0 ? (

                <>

                  <div className="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                  </div>

                  <span>
                    {typingUsers.length === 1
                      ? (
                        (activeOther?.displayName ||
                          "Someone") +
                        " is typing…"
                      )
                      : (
                        typingUsers.length +
                        " people are typing…"
                      )}
                  </span>

                </>

              ) : (
                <span>&nbsp;</span>
              )}

            </div>

            <div className="chat-compose">

              <input
                value={textVal}
                onChange={e => {

                  const value =
                    e.target.value;

                  setTextVal(value);

                  updateTyping(value);

                }}
                onBlur={() => {

                  stopTyping(
                    activeChat.id
                  );

                  if (typingTimer.current) {
                    clearTimeout(
                      typingTimer.current
                    );
                  }

                }}
                placeholder="Type a message..."
                onKeyDown={e => {

                  if (e.key === "Enter") {

                    e.preventDefault();

                    send();

                  }

                }}
              />

              <button
                className="btn primary"
                onClick={send}
              >
                Send
              </button>

            </div>

          </>

        ) : (

          <div
            className="empty"
            style={{
              flex: 1,
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              flexDirection: "column",
              gap: 8
            }}
          >

            <div
              style={{
                fontSize: 30
              }}
            >
              💬
            </div>

            <div>
              Select a chat or search for
              someone above.
            </div>

          </div>

        )}

      </div>

    </div>
  );
}

/* -------------------------------------------------------
   SETTINGS
------------------------------------------------------- */

function Settings({
  profile,
  setProfile
}) {

  const [name, setName] =
    useState(profile.displayName || "");

  const [uname, setUname] =
    useState(profile.username || "");

  const [bio, setBio] =
    useState(profile.bio || "");

  const [online, setOnline] =
    useState(profile.showOnline !== false);

  async function save() {

    if (!text(uname)) {
      console.error(
        "Username cannot be empty."
      );
      return;
    }

    try {

      if (
        text(uname) !==
        profile.username
      ) {

        const snap = await C("users")
          .where(
            "username",
            "==",
            text(uname)
          )
          .limit(1)
          .get();

        if (!snap.empty) {
          console.error(
            "Username already taken."
          );
          return;
        }
      }

      const data = {
        displayName: text(name),
        username: text(uname).toLowerCase(),
        bio: text(bio),
        showOnline: online,
        updatedAt: serverTime()
      };

      await C("users")
        .doc(profile.uid)
        .set(data, { merge: true });

      setProfile({
        ...profile,
        ...data,
        updatedAt: null
      });

      console.log(
        "Profile updated."
      );

    } catch(e) {
      console.error(e.message);
    }
  }

  return (
    <div className="card pad">

      <div className="section-title">
        Settings
      </div>

      <div style={{ marginBottom: 15 }}>

        <label
          style={{
            display: "block",
            marginBottom: 5
          }}
        >
          Display Name
        </label>

        <input
          value={name}
          onChange={e =>
            setName(e.target.value)
          }
        />

      </div>

      <div style={{ marginBottom: 15 }}>

        <label
          style={{
            display: "block",
            marginBottom: 5
          }}
        >
          Username
        </label>

        <input
          value={uname}
          onChange={e =>
            setUname(e.target.value)
          }
        />

      </div>

      <div style={{ marginBottom: 15 }}>

        <label
          style={{
            display: "block",
            marginBottom: 5
          }}
        >
          Bio
        </label>

        <textarea
          value={bio}
          onChange={e =>
            setBio(e.target.value)
          }
        />

      </div>

      <div style={{ marginBottom: 15 }}>

        <label
          style={{
            display: "flex",
            alignItems: "center",
            gap: 10
          }}
        >

          <input
            type="checkbox"
            checked={online}
            onChange={e =>
              setOnline(e.target.checked)
            }
            style={{
              width: "auto"
            }}
          />

          Show online status

        </label>

      </div>

      <button
        className="btn primary"
        onClick={save}
      >
        Save Profile
      </button>

      <div
        style={{
          marginTop: 40,
          paddingTop: 20,
          borderTop:
            "1px solid var(--line)"
        }}
      >

        <button
          className="btn danger"
          onClick={() =>
            auth.signOut()
          }
        >
          Log Out
        </button>

      </div>

    </div>
  );
}

/* -------------------------------------------------------
   RIGHT SIDEBAR
------------------------------------------------------- */

function RightSidebar({
  data,
  onProfile
}) {

  const hashtags = {};

  data.posts.forEach(p => {

    (p.hashtags || []).forEach(h => {

      hashtags[h] =
        (hashtags[h] || 0) + 1;

    });
  });

  const trends =
    Object.entries(hashtags)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 5);

  return (
    <aside className="right">

      <div className="card right-card">

        <strong style={{ fontSize: 18 }}>
          Trending
        </strong>

        <div style={{ marginTop: 10 }}>

          {trends.length === 0 ? (

            <div className="muted">
              No trends yet.
            </div>

          ) : trends.map(t => (

            <div
              className="trend"
              key={t[0]}
            >

              <div
                style={{
                  fontWeight: 800
                }}
              >
                #{t[0]}
              </div>

              <div
                className="muted"
                style={{
                  fontSize: 12
                }}
              >
                {t[1]} posts
              </div>

            </div>
          ))}

        </div>

      </div>

      <div className="card right-card">

        <strong style={{ fontSize: 18 }}>
          Suggested Users
        </strong>

        <div style={{ marginTop: 10 }}>

          {data.users
            .slice(0, 5)
            .map(u => (

              <div
                className="user-row"
                key={u.uid}
                style={{
                  cursor: "pointer"
                }}
                onClick={() =>
                  onProfile(u.uid)
                }
              >

                <Avatar
                  profile={u}
                  size="small"
                />

                <div
                  className="user-row-main"
                >

                  <div
                    className="name"
                    style={{
                      fontSize: 14
                    }}
                  >
                    {u.displayName ||
                      "User"}
                  </div>

                  <div
                    className="username"
                    style={{
                      fontSize: 12
                    }}
                  >
                    @{u.username ||
                      "user"}
                  </div>

                </div>

              </div>

            ))}

        </div>

      </div>

      <div
        style={{
          fontSize: 12,
          color: "var(--muted)",
          padding: "0 15px"
        }}
      >
        © 2026 Nexus Social
        <br />
        Made by YASH KISHORE Michalite
      </div>

    </aside>
  );
}

/* -------------------------------------------------------
   APP
------------------------------------------------------- */

function App() {

  const {
    user,
    profile,
    setProfile,
    ready,
    error
  } = useAuth();

  usePresence(profile);

  const [page, setPage] =
    useState("home");

  const [profileId, setProfileId] =
    useState(null);

  const data = useData(profile);

  if (error) {

    return (
      <div className="error-screen">

        <div className="boot-box">

          <h1>Nexus Error</h1>

          <div className="boot-error">
            {error.message ||
              String(error)}
          </div>

          <button
            className="btn primary"
            onClick={() =>
              location.reload()
            }
          >
            Reload App
          </button>

          <div
            style={{
              marginTop: 20,
              color: "var(--muted)",
              fontSize: 12
            }}
          >

            <p>
              If you see a Firestore
              permissions error, you need
              to configure your database
              rules or run in local emulator.
            </p>

            <p>
              If running locally, use a
              local server instead of file://.
            </p>

          </div>

        </div>

      </div>
    );
  }

  if (!ready || !profile) {

    return (
      <div className="loading-screen">

        <div className="boot-box">

          <h1>
            Nex
            <span style={{
              color:"#7c5cff"
            }}>
              us
            </span>
          </h1>

          <p>
            Authenticating...
          </p>

        </div>

      </div>
    );
  }

  const unreadCount =
    data.notifications.filter(
      n => !n.read
    ).length;

  function nav(target) {

    setPage(target);
    setProfileId(null);

    window.scrollTo(0, 0);
  }

  return (

    <div className="app">

      <div className="topbar">

        <div className="logo">
          Nex<span>us</span>
        </div>

        <div
          onClick={() =>
            nav("profile")
          }
          style={{
            cursor: "pointer"
          }}
        >
          <Avatar
            profile={profile}
            size="small"
          />
        </div>

      </div>

      <div className="layout">

        <aside className="left">

          <div
            className="logo"
            style={{
              display:
                window.innerWidth <= 760
                  ? "none"
                  : "block"
            }}
          >
            Nex<span>us</span>
          </div>

          <nav className="nav">

            <button
              className={
                page === "home"
                  ? "active"
                  : ""
              }
              onClick={() =>
                nav("home")
              }
            >
              🏠 Home
            </button>

            <button
              className={
                page === "explore"
                  ? "active"
                  : ""
              }
              onClick={() =>
                nav("explore")
              }
            >
              🔍 Explore
            </button>

            <button
              className={
                page === "notifications"
                  ? "active"
                  : ""
              }
              onClick={() =>
                nav("notifications")
              }
            >
              🔔 Notifications

              {unreadCount > 0 && (
                <span
                  style={{
                    color:
                      "var(--accent)",
                    marginLeft: 5
                  }}
                >
                  ({unreadCount})
                </span>
              )}

            </button>

            <button
              className={
                page === "messages"
                  ? "active"
                  : ""
              }
              onClick={() =>
                nav("messages")
              }
            >
              ✉️ Messages
            </button>

            <button
              className={
                page === "profile"
                  ? "active"
                  : ""
              }
              onClick={() =>
                nav("profile")
              }
            >
              👤 Profile
            </button>

            <button
              className={
                page === "settings"
                  ? "active"
                  : ""
              }
              onClick={() =>
                nav("settings")
              }
            >
              ⚙️ Settings
            </button>

          </nav>

        </aside>

        <main className="main">

          {page === "home" && (
            <Home
              profile={profile}
              data={data}
            />
          )}

          {page === "explore" && (
            <Explore
              data={data}
              onProfile={id => {
                setProfileId(id);
                setPage("profile");
              }}
            />
          )}

          {page === "notifications" && (
            <Notifications
              notifications={
                data.notifications
              }
              users={data.users}
            />
          )}

          {page === "messages" && (
            <Messages
              users={data.users}
            />
          )}

          {page === "profile" && (
            <Profile
              profile={profile}
              users={data.users}
              posts={data.posts}
              follows={data.follows}
              viewedId={
                profileId ||
                profile.uid
              }
              onEdit={() =>
                nav("settings")
              }
            />
          )}

          {page === "settings" && (
            <Settings
              profile={profile}

            />

        </main>

        {page !== "messages" && (

          <RightSidebar

            onProfile={id => {
              setProfileId(id);
              setPage("profile");
            }}

      <div className="mobile-nav">

        <button
          className={
            page === "home"
              ? "active"
              : ""
          }
          onClick={() =>
            nav("home")
          }
        >

        <button
          className={
            page === "explore"
              ? "active"
              : ""
          }
          onClick={() =>
            nav("explore")
          }
        >
          🔍

        <button
          className={
            page === "notifications"
              ? "active"
              : ""
          }
          onClick={() =>
            nav("notifications")
          }
        >
          🔔
        </button>

        <button
          className={
            page === "messages"
              ? "active"
              : ""
          }
          onClick={() =>
            nav("messages")
          }
        >
          ✉️

        <button
          className={
            page === "profile"
              ? "active"
              : ""
          }
          onClick={() =>
            nav("profile")
          }
        >
          👤
        </button>

      </div>

    </div>
  );
}
