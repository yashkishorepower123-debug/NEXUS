<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nexus — Social Platform</title>

<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>

<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
*{box-sizing:border-box}
:root{
 --bg:#08090d;
 --panel:#101219;
 --panel2:#151821;
 --border:#242834;
 --text:#f4f6fb;
 --muted:#8f96a5;
 --accent:#6d5dfc;
 --accent2:#8b7fff;
 --danger:#ff4d67;
 --green:#35d07f;
 --yellow:#ffc857;
}
body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.app{min-height:100vh}
.boot{
 position:fixed;inset:0;background:#08090d;
 display:flex;align-items:center;justify-content:center;
 z-index:9999;
}
.bootBox{text-align:center}
.logo{
 width:54px;height:54px;border-radius:16px;
 display:grid;place-items:center;
 background:linear-gradient(135deg,#6d5dfc,#a394ff);
 color:white;font-weight:900;font-size:25px;
 margin:auto auto 15px;
}
.shell{
 max-width:1400px;margin:auto;
 display:grid;grid-template-columns:240px minmax(0,650px) 330px;
 gap:18px;padding:18px;
}
.sidebar,.rightbar{
 position:sticky;top:18px;height:calc(100vh - 36px);
}
.navLogo{
 font-size:25px;font-weight:900;margin:8px 12px 25px;
}
.navBtn{
 width:100%;border:0;background:none;color:var(--muted);
 padding:13px 15px;border-radius:13px;text-align:left;
 margin-bottom:5px;font-weight:700;
}
.navBtn:hover,.navBtn.active{background:var(--panel2);color:white}
.navBtn span{margin-right:12px}
.userMini{
 position:absolute;bottom:0;left:0;right:0;
 padding:12px;border:1px solid var(--border);
 border-radius:15px;background:var(--panel);
 display:flex;align-items:center;gap:10px;
}
.avatar{
 width:40px;height:40px;border-radius:50%;
 display:grid;place-items:center;
 background:linear-gradient(135deg,#6d5dfc,#40377f);
 font-weight:800;flex:none;
}
.avatar.sm{width:32px;height:32px;font-size:12px}
.avatar.lg{width:70px;height:70px;font-size:25px}
.center{min-width:0}
.topbar{
 position:sticky;top:0;z-index:20;
 background:rgba(8,9,13,.88);
 backdrop-filter:blur(12px);
 border-bottom:1px solid var(--border);
 padding:13px 5px;
 display:flex;align-items:center;justify-content:space-between;
}
.pageTitle{font-weight:850;font-size:20px}
.card{
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:17px;
 margin:12px 0;
}
.composer{padding:15px}
.composeRow{display:flex;gap:12px}
textarea,input,select{
 background:#0b0d12;color:var(--text);
 border:1px solid var(--border);
 border-radius:12px;
 outline:none;
}
textarea{
 resize:none;width:100%;min-height:90px;padding:12px;
}
input{padding:11px 12px;width:100%}
textarea:focus,input:focus,select:focus{border-color:var(--accent)}
.btn{
 border:0;border-radius:11px;padding:9px 14px;
 background:var(--accent);color:white;font-weight:750;
}
.btn.secondary{background:#1d2029}
.btn.danger{background:var(--danger)}
.btn.green{background:#168a52}
.btn.small{padding:7px 10px;font-size:13px}
.actions{
 display:flex;gap:7px;justify-content:space-between;
 margin-top:10px;
}
.iconBtn{
 border:0;background:transparent;color:var(--muted);
 padding:7px 8px;border-radius:9px;
}
.iconBtn:hover{background:#1b1e27;color:white}
.iconBtn.active{color:#a394ff}
.post{padding:15px}
.postHead{display:flex;align-items:center;gap:10px}
.postAuthor{font-weight:800}
.postTime{color:var(--muted);font-size:12px}
.postBody{padding:13px 0;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.tag{color:#9b8fff}
.postActions{
 display:flex;gap:4px;border-top:1px solid var(--border);
 padding-top:8px;
}
.stat{color:var(--muted);font-size:13px}
.replyBox{margin-top:10px}
.comment{
 border-top:1px solid var(--border);
 padding:10px 0;
}
.commentHead{display:flex;gap:8px;align-items:center}
.commentText{padding:4px 0 3px 40px;white-space:pre-wrap}
.commentActions{padding-left:40px}
.rightTitle{font-weight:850;margin:8px 0 10px}
.rightCard{padding:14px}
.person{
 display:flex;align-items:center;gap:10px;
 padding:9px 0;
}
.personInfo{min-width:0;flex:1}
.personName{font-weight:750;overflow:hidden;text-overflow:ellipsis}
.personHandle{color:var(--muted);font-size:12px}
.badge{
 display:inline-block;padding:3px 7px;
 border-radius:7px;background:#242735;color:#aaa;
 font-size:11px;margin-left:5px;
}
.modal{
 position:fixed;inset:0;background:rgba(0,0,0,.7);
 display:grid;place-items:center;z-index:100;
 padding:18px;
}
.modalBox{
 width:min(600px,100%);
 max-height:90vh;overflow:auto;
 background:var(--panel);border:1px solid var(--border);
 border-radius:18px;padding:18px;
}
.modalHead{display:flex;justify-content:space-between;align-items:center}
.close{
 border:0;background:#20232c;color:white;
 width:34px;height:34px;border-radius:50%;
}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tab{
 flex:1;padding:13px;background:none;border:0;
 color:var(--muted);font-weight:700;
}
.tab.active{color:white;border-bottom:2px solid var(--accent)}
.searchBox{padding:10px 0}
.empty{
 padding:40px 15px;text-align:center;color:var(--muted);
}
.storyRow{
 display:flex;gap:10px;overflow-x:auto;padding:12px 2px;
}
.story{
 min-width:75px;text-align:center;cursor:pointer;
}
.storyRing{
 width:58px;height:58px;border-radius:50%;
 padding:2px;background:linear-gradient(135deg,#6d5dfc,#ff4d88);
 margin:auto;
}
.storyRingInner{
 width:100%;height:100%;border-radius:50%;
 background:#0b0d12;display:grid;place-items:center;
 font-weight:800;
}
.storyName{
 font-size:11px;color:var(--muted);
 overflow:hidden;text-overflow:ellipsis;
}
.messageLayout{
 height:calc(100vh - 90px);
 display:grid;grid-template-columns:210px 1fr;
 border:1px solid var(--border);border-radius:17px;
 overflow:hidden;background:var(--panel);
}
.chatList{border-right:1px solid var(--border);overflow:auto}
.chatItem{
 padding:12px;border:0;border-bottom:1px solid var(--border);
 background:none;color:white;width:100%;text-align:left;
 display:flex;gap:9px;align-items:center;
}
.chatItem.active{background:#1b1e28}
.chatArea{display:flex;flex-direction:column;min-width:0}
.chatHead{
 padding:12px;border-bottom:1px solid var(--border);
 display:flex;align-items:center;gap:10px;
}
.messages{
 flex:1;overflow:auto;padding:15px;
 display:flex;flex-direction:column;gap:8px;
}
.msg{
 max-width:75%;padding:9px 11px;border-radius:13px;
 background:#20232d;align-self:flex-start;
 position:relative;
}
.msg.mine{
 align-self:flex-end;background:#5145c7;
}
.msgMeta{font-size:10px;color:#b6bbca;margin-top:4px}
.msgTools{display:flex;gap:4px}
.chatInput{
 display:flex;gap:7px;padding:10px;border-top:1px solid var(--border);
}
.chatInput input{flex:1}
.onlineDot{
 width:8px;height:8px;border-radius:50%;
 background:var(--green);display:inline-block;
}
.poll{
 background:#0c0f15;border:1px solid var(--border);
 border-radius:13px;padding:12px;margin-top:8px;
}
.pollOption{
 width:100%;text-align:left;border:1px solid var(--border);
 background:#151821;color:white;
 padding:9px;border-radius:9px;margin-top:6px;
}
.pollOption.selected{border-color:var(--accent)}
.progress{
 height:5px;background:#252935;border-radius:10px;margin-top:5px;
}
.progress i{display:block;height:100%;background:var(--accent);border-radius:10px}
.notification{
 padding:11px 0;border-bottom:1px solid var(--border);
 display:flex;gap:9px;
}
.profileCover{
 padding:25px 18px;
 border-bottom:1px solid var(--border);
}
.profileTop{display:flex;gap:14px;align-items:center}
.profileBio{color:var(--muted);margin:12px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.setting{
 display:flex;justify-content:space-between;align-items:center;
 padding:14px 0;border-bottom:1px solid var(--border);
}
.mobileNav{display:none}
.toast{
 position:fixed;bottom:25px;left:50%;transform:translateX(-50%);
 background:#20232d;color:white;border:1px solid var(--border);
 padding:10px 15px;border-radius:12px;z-index:500;
}
@media(max-width:1050px){
 .shell{grid-template-columns:75px minmax(0,650px) 270px}
 .navBtn{font-size:0;text-align:center}
 .navBtn span{font-size:20px;margin:0}
 .navLogo{font-size:0;text-align:center}
 .navLogo:first-letter{font-size:25px}
 .userMini .miniText{display:none}
}
@media(max-width:800px){
 .shell{display:block;padding:0 10px 70px}
 .sidebar{display:none}
 .rightbar{display:none}
 .center{max-width:650px;margin:auto}
 .mobileNav{
  display:flex;position:fixed;bottom:0;left:0;right:0;
  background:rgba(12,14,19,.97);border-top:1px solid var(--border);
  z-index:50;justify-content:space-around;padding:7px;
 }
 .mobileNav button{
  background:none;border:0;color:var(--muted);font-size:20px;
  padding:7px 15px;
 }
 .mobileNav button.active{color:white}
 .messageLayout{height:calc(100vh - 100px)}
}
@media(max-width:520px){
 .grid2{grid-template-columns:1fr}
 .msg{max-width:88%}
}
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

const {
 useState,useEffect,useMemo,useRef
}=React;

/* =========================
   FIREBASE
========================= */

const firebaseConfig={
 apiKey:"AIzaSyDTrvD7c1TUtPUUOSX7_-0VV9itC28LOg0",
 authDomain:"nexus-37600.firebaseapp.com",
 projectId:"nexus-37600",
 storageBucket:"nexus-37600.firebasestorage.app",
 messagingSenderId:"61496309341",
 appId:"1:61496309341:web:fdb3711264df47f318bfb4",
 measurementId:"G-41S50YF5RF"
};

if(!firebase.apps.length){
 firebase.initializeApp(firebaseConfig);
}

const auth=firebase.auth();
const db=firebase.firestore();

const APP_ID="nexus-37600";

const rootPath=`artifacts/${APP_ID}/public/data`;

const col=name=>db.collection(`${rootPath}/${name}`);

const serverTime=()=>firebase.firestore.FieldValue.serverTimestamp();

const id=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);

const normalize=s=>(s||"").trim().toLowerCase();

function initials(name){
 const x=(name||"User").trim().split(/\s+/).slice(0,2);
 return x.map(a=>a[0]).join("").toUpperCase()||"U";
}

function timeAgo(ts){
 if(!ts)return "now";
 const d=ts.toDate?ts.toDate():new Date(ts);
 const sec=Math.floor((Date.now()-d.getTime())/1000);
 if(sec<60)return `${sec}s`;
 if(sec<3600)return `${Math.floor(sec/60)}m`;
 if(sec<86400)return `${Math.floor(sec/3600)}h`;
 if(sec<604800)return `${Math.floor(sec/86400)}d`;
 return d.toLocaleDateString();
}

function formatText(text){
 const parts=(text||"").split(/(#[A-Za-z0-9_]+|@[A-Za-z0-9_]+)/g);
 return parts.map((x,i)=>{
  if(/^#[A-Za-z0-9_]+$/.test(x))
   return <span key={i} className="tag">{x}</span>;
  if(/^@[A-Za-z0-9_]+$/.test(x))
   return <span key={i} className="tag">{x}</span>;
  return x;
 });
}

/* =========================
   APP
========================= */

function App(){

 const [user,setUser]=useState(null);
 const [profile,setProfile]=useState(null);
 const [boot,setBoot]=useState(true);

 const [page,setPage]=useState("home");
 const [feedMode,setFeedMode]=useState("forYou");

 const [users,setUsers]=useState([]);
 const [posts,setPosts]=useState([]);
 const [comments,setComments]=useState([]);
 const [likes,setLikes]=useState([]);
 const [follows,setFollows]=useState([]);
 const [bookmarks,setBookmarks]=useState([]);
 const [reposts,setReposts]=useState([]);
 const [notifications,setNotifications]=useState([]);
 const [stories,setStories]=useState([]);
 const [pollVotes,setPollVotes]=useState([]);
 const [messages,setMessages]=useState([]);
 const [groups,setGroups]=useState([]);
 const [groupMembers,setGroupMembers]=useState([]);
 const [messageReactions,setMessageReactions]=useState([]);
 const [blocks,setBlocks]=useState([]);
 const [reports,setReports]=useState([]);

 const [toast,setToast]=useState("");
 const [modal,setModal]=useState(null);
 const [selectedChat,setSelectedChat]=useState(null);

 useEffect(()=>{
   let unsubAuth=auth.onAuthStateChanged(async u=>{
     if(!u){
       try{
         await auth.signInAnonymously();
       }catch(e){
         console.error(e);
         setToast("Firebase Authentication is not enabled.");
       }
       return;
     }

     setUser(u);

     const ref=col("users").doc(u.uid);

     try{
       const snap=await ref.get();

       if(!snap.exists){
         const newUser={
           uid:u.uid,
           username:"user_"+u.uid.slice(0,7),
           displayName:"Nexus User",
           bio:"New on Nexus",
           createdAt:serverTime(),
           updatedAt:serverTime(),
           lastSeen:serverTime(),
           online:true,
           followersCount:0,
           followingCount:0,
           postsCount:0
         };

         await ref.set(newUser);
         setProfile(newUser);
       }else{
         setProfile({id:snap.id,...snap.data()});
       }
     }catch(e){
       console.error(e);
     }

     setBoot(false);
   });

   return()=>unsubAuth();
 },[]);

 /* User listener */
 useEffect(()=>{
   if(!user)return;

   return col("users")
     .orderBy("createdAt","desc")
     .limit(100)
     .onSnapshot(s=>{
       setUsers(s.docs.map(d=>({id:d.id,...d.data()})));
     },e=>console.log("users listener",e));
 },[user]);

 /* Posts listener */
 useEffect(()=>{
   if(!user)return;

   return col("posts")
     .orderBy("createdAt","desc")
     .limit(80)
     .onSnapshot(s=>{
       setPosts(s.docs.map(d=>({id:d.id,...d.data()})));
     },e=>console.log("posts listener",e));
 },[user]);

 /* Comments */
 useEffect(()=>{
   if(!user)return;

   return col("comments")
     .orderBy("createdAt","desc")
     .limit(300)
     .onSnapshot(s=>{
       setComments(s.docs.map(d=>({id:d.id,...d.data()})));
     },()=>{});
 },[user]);

 /* Likes */
 useEffect(()=>{
   if(!user)return;

   return col("likes")
     .where("uid","==",user.uid)
     .limit(300)
     .onSnapshot(s=>{
       setLikes(s.docs.map(d=>({id:d.id,...d.data()})));
     },()=>{});
 },[user]);

 /* Follows */
 useEffect(()=>{
   if(!user)return;

   return col("follows")
     .where("followerId","==",user.uid)
     .limit(300)
     .onSnapshot(s=>{
       setFollows(s.docs.map(d=>({id:d.id,...d.data()})));
     },()=>{});
 },[user]);

 /* Bookmarks */
 useEffect(()=>{
   if(!user)return;

   return col("bookmarks")
     .where("uid","==",user.uid)
     .limit(300)
     .onSnapshot(s=>{
       setBookmarks(s.docs.map(d=>({id:d.id,...d.data()})));
     },()=>{});
 },[user]);

 /* Reposts */
 useEffect(()=>{
   if(!user)return;

   return col("reposts")
     .where("uid","==",user.uid)
     .limit(300)
     .onSnapshot(s=>{
       setReposts(s.docs.map(d=>({id:d.id,...d.data()})));
     },()=>{});
 },[user]);

 /* Notifications */
 useEffect(()=>{
   if(!user)return;

   return col("notifications")
     .where("uid","==",user.uid)
     .orderBy("createdAt","desc")
     .limit(50)
     .onSnapshot(s=>{
       setNotifications(s.docs.map(d=>({id:d.id,...d.data()})));
     },()=>{});
 },[user]);

 /* Stories */
 useEffect(()=>{
   if(!user)return;

   const cutoff=new Date(Date.now()-86400000);

   return col("stories")
     .where("createdAt",">",cutoff)
     .orderBy("createdAt","desc")
     .limit(100)
     .onSnapshot(s=>{
       setStories(s.docs.map(d=>({id:d.id,...d.data()})));
     },()=>{});
 },[user]);

 /* Poll votes */
 useEffect(()=>{
   if(!user)return;

   return col("pollVotes")
     .where("uid","==",user.uid)
     .limit(100)
     .onSnapshot(s=>{
       setPollVotes(s.docs.map(d=>({id:d.id,...d.data()})));
     },()=>{});
 },[user]);

 /* Blocks */
 useEffect(()=>{
   if(!user)return;

   return col("blocks")
     .where("uid","==",user.uid)
     .limit(300)
     .onSnapshot(s=>{
       setBlocks(s.docs.map(d=>({id:d.id,...d.data()})));
     },()=>{});
 },[user]);

 /* Message listener only when messages page/chat selected */
 useEffect(()=>{
   if(!user || page!=="messages")return;

   return col("messages")
     .where("members","array-contains",user.uid)
     .orderBy("createdAt","asc")
     .limit(500)
     .onSnapshot(s=>{
       setMessages(s.docs.map(d=>({id:d.id,...d.data()})));
     },()=>{});
 },[user,page]);

 useEffect(()=>{
   if(!user)return;

   const ref=col("users").doc(user.uid);

   ref.update({
     online:true,
     lastSeen:serverTime()
   }).catch(()=>{});

   const timer=setInterval(()=>{
     ref.update({
       online:true,
       lastSeen:serverTime()
     }).catch(()=>{});
   },60000);

   const leave=()=>{
     ref.update({
       online:false,
       lastSeen:serverTime()
     }).catch(()=>{});
   };

   window.addEventListener("beforeunload",leave);

   return()=>{
     clearInterval(timer);
     window.removeEventListener("beforeunload",leave);
     leave();
   };
 },[user]);

 useEffect(()=>{
   if(!toast)return;
   const t=setTimeout(()=>setToast(""),2600);
   return()=>clearTimeout(t);
 },[toast]);

 async function createNotification(targetUid,type,postId=null,text=""){
   if(!targetUid || targetUid===user.uid)return;

   await col("notifications").add({
     uid:targetUid,
     actorId:user.uid,
     type,
     postId,
     text,
     read:false,
     createdAt:serverTime()
   }).catch(()=>{});
 }

 async function createPost(data){
   const postId=id();

   await col("posts").doc(postId).set({
     ...data,
     authorId:user.uid,
     authorName:profile?.displayName||"Nexus User",
     authorUsername:profile?.username||"user",
     likesCount:0,
     commentsCount:0,
     repostsCount:0,
     viewsCount:0,
     pinned:false,
     createdAt:serverTime(),
     updatedAt:serverTime()
   });

   await col("users").doc(user.uid).update({
     postsCount:firebase.firestore.FieldValue.increment(1)
   }).catch(()=>{});

   setToast("Posted");
 }

 async function likePost(post){
   const existing=likes.find(x=>x.postId===post.id);

   if(existing){
     await col("likes").doc(existing.id).delete();
     await col("posts").doc(post.id).update({
       likesCount:firebase.firestore.FieldValue.increment(-1)
     });
   }else{
     await col("likes").add({
       uid:user.uid,
       postId:post.id,
       createdAt:serverTime()
     });

     await col("posts").doc(post.id).update({
       likesCount:firebase.firestore.FieldValue.increment(1)
     });

     await createNotification(
       post.authorId,
       "like",
       post.id,
       "liked your post"
     );
   }
 }

 async function repost(post){
   const existing=reposts.find(x=>x.postId===post.id);

   if(existing){
     await col("reposts").doc(existing.id).delete();
     await col("posts").doc(post.id).update({
       repostsCount:firebase.firestore.FieldValue.increment(-1)
     });
     return;
   }

   await col("reposts").add({
     uid:user.uid,
     postId:post.id,
     createdAt:serverTime()
   });

   await col("posts").doc(post.id).update({
     repostsCount:firebase.firestore.FieldValue.increment(1)
   });

   await createNotification(
     post.authorId,
     "repost",
     post.id,
     "reposted your post"
   );
 }

 async function bookmarkPost(post){
   const existing=bookmarks.find(x=>x.postId===post.id);

   if(existing){
     await col("bookmarks").doc(existing.id).delete();
     setToast("Removed from bookmarks");
   }else{
     await col("bookmarks").add({
       uid:user.uid,
       postId:post.id,
       createdAt:serverTime()
     });
     setToast("Saved");
   }
 }

 async function follow(uid){
   if(uid===user.uid)return;

   const existing=follows.find(x=>x.followingId===uid);

   if(existing){
     await col("follows").doc(existing.id).delete();

     await col("users").doc(user.uid).update({
       followingCount:firebase.firestore.FieldValue.increment(-1)
     }).catch(()=>{});

     await col("users").doc(uid).update({
       followersCount:firebase.firestore.FieldValue.increment(-1)
     }).catch(()=>{});
   }else{
     await col("follows").add({
       followerId:user.uid,
       followingId:uid,
       createdAt:serverTime()
     });

     await col("users").doc(user.uid).update({
       followingCount:firebase.firestore.FieldValue.increment(1)
     }).catch(()=>{});

     await col("users").doc(uid).update({
       followersCount:firebase.firestore.FieldValue.increment(1)
     }).catch(()=>{});

     await createNotification(uid,"follow",null,"followed you");
   }
 }

 async function deletePost(post){
   if(post.authorId!==user.uid)return;

   if(!confirm("Delete this post?"))return;

   await col("posts").doc(post.id).delete();

   const related=comments.filter(x=>x.postId===post.id);

   const batch=db.batch();

   related.forEach(x=>{
     batch.delete(col("comments").doc(x.id));
   });

   await batch.commit().catch(()=>{});

   setToast("Post deleted");
 }

 async function editPost(post){
   const text=prompt("Edit your post:",post.text||"");

   if(text===null)return;

   const value=text.trim();

   if(!value)return;

   await col("posts").doc(post.id).update({
     text:value,
     edited:true,
     updatedAt:serverTime()
   });

   setToast("Post updated");
 }

 async function pinPost(post){
   if(post.authorId!==user.uid)return;

   const already=!!post.pinned;

   if(already){
     await col("posts").doc(post.id).update({pinned:false});
   }else{
     const old=posts.filter(x=>x.authorId===user.uid && x.pinned);

     const batch=db.batch();

     old.forEach(x=>{
       batch.update(col("posts").doc(x.id),{pinned:false});
     });

     batch.update(col("posts").doc(post.id),{pinned:true});

     await batch.commit();
   }
 }

 async function addComment(post,text,parentId=null){
   if(!text.trim())return;

   await col("comments").add({
     postId:post.id,
     authorId:user.uid,
     authorName:profile?.displayName||"Nexus User",
     text:text.trim(),
     parentId,
     likesCount:0,
     createdAt:serverTime()
   });

   await col("posts").doc(post.id).update({
     commentsCount:firebase.firestore.FieldValue.increment(1)
   });

   await createNotification(
     post.authorId,
     "comment",
     post.id,
     "commented on your post"
   );
 }

 async function deleteComment(comment){
   if(comment.authorId!==user.uid)return;

   await col("comments").doc(comment.id).delete();

   await col("posts").doc(comment.postId).update({
     commentsCount:firebase.firestore.FieldValue.increment(-1)
   }).catch(()=>{});
 }

 async function createStory(text){
   if(!text.trim())return;

   await col("stories").add({
     authorId:user.uid,
     authorName:profile?.displayName||"Nexus User",
     authorUsername:profile?.username||"",
     text:text.trim(),
     createdAt:serverTime()
   });

   setToast("Story published for 24 hours");
 }

 async function createPollPost(text,question,options){
   const pollId=id();

   await col("polls").doc(pollId).set({
     question,
     options:options.map(x=>({text:x,votes:0})),
     authorId:user.uid,
     createdAt:serverTime()
   });

   await createPost({
     text,
     type:"poll",
     pollId
   });
 }

 async function votePoll(pollId,index){
   if(pollVotes.some(x=>x.pollId===pollId))return;

   await col("pollVotes").add({
     uid:user.uid,
     pollId,
     option:index,
     createdAt:serverTime()
   });

   const pollRef=col("polls").doc(pollId);
   const snap=await pollRef.get();

   if(!snap.exists)return;

   const data=snap.data();

   const options=[...(data.options||[])];

   if(!options[index])return;

   options[index]={
     ...options[index],
     votes:(options[index].votes||0)+1
   };

   await pollRef.update({options});
 }

 async function sendMessage(chat,text,replyTo=null){
   if(!text.trim())return;

   const members=chat.members||[user.uid,chat.uid];

   await col("messages").add({
     conversationId:chat.id,
     members,
     senderId:user.uid,
     text:text.trim(),
     replyTo:replyTo||null,
     deleted:false,
     createdAt:serverTime()
   });

   const other=members.find(x=>x!==user.uid);

   if(other){
     await createNotification(
       other,
       "message",
       null,
       "sent you a message"
     );
   }
 }

 async function reactMessage(message,reaction){
   const existing=messageReactions.find(
     x=>x.messageId===message.id && x.uid===user.uid
   );

   if(existing){
     await col("messageReactions").doc(existing.id).delete();
   }else{
     await col("messageReactions").add({
       messageId:message.id,
       uid:user.uid,
       reaction,
       createdAt:serverTime()
     });
   }
 }

 async function markMessagesRead(chatId){
   const list=messages.filter(
     x=>x.conversationId===chatId && x.senderId!==user.uid && !x.readBy?.includes(user.uid)
   );

   const batch=db.batch();

   list.forEach(x=>{
     batch.update(col("messages").doc(x.id),{
       readBy:firebase.firestore.FieldValue.arrayUnion(user.uid)
     });
   });

function Composer({profile,onPost,onStory,onPoll}){

 const [text,setText]=useState("");
 const [poll,setPoll]=useState(false);
 const [question,setQuestion]=useState("");
 const [options,setOptions]=useState(["",""]);

 async function submit(){
   if(!text.trim() && !poll)return;

   if(poll){
     const valid=options.map(x=>x.trim()).filter(Boolean);

     if(!question.trim()||valid.length<2)return;

     await onPoll(text.trim(),question.trim(),valid);

     setText("");
     setQuestion("");
     setOptions(["",""]);
     setPoll(false);
     return;
   }

   await onPost({
     text:text.trim(),
     type:"text"
   });

   setText("");
 }

 return <div className="card composer">

   <div className="composeRow">
     <div className="avatar">{initials(profile?.displayName)}</div>

     <textarea
       id="composer"
       value={text}
       onChange={e=>setText(e.target.value)}
       placeholder="What's happening?"
       maxLength="1000"
     />
   </div>

   {poll &&
     <div className="poll">

       <input
         value={question}
         onChange={e=>setQuestion(e.target.value)}
         placeholder="Poll question"
       />

       {options.map((x,i)=>
         <input
           key={i}
           style={{marginTop:6}}
           value={x}
           onChange={e=>{
             const a=[...options];
             a[i]=e.target.value;
             setOptions(a);
           }}
           placeholder={`Option ${i+1}`}
         />
       )}

       {options.length<4 &&
         <button
           className="btn secondary small"
           style={{marginTop:7}}
           onClick={()=>setOptions([...options,""])}
         >
           + Add option
         </button>
       }

     </div>
   }

   <div className="actions">
     <div>
       <button
         className={"iconBtn "+(poll?"active":"")}
         onClick={()=>setPoll(!poll)}
       >
         📊 Poll
       </button>

       <button
         className="iconBtn"
         onClick={()=>{
           const tag=prompt("Hashtag:");
           if(tag){
             setText(t=>t+" #"+tag.replace(/^#/,""));
           }
         }}
       >
         # Tag
       </button>

       <button
         className="iconBtn"
         onClick={()=>{
           const mention=prompt("Username:");
           if(mention){
             setText(t=>t+" @"+mention.replace(/^@/,""));
           }
         }}
       >
         @ Mention
       </button>
     </div>

     <button className="btn" onClick={submit}>
       Post
     </button>
   </div>
 </div>
}

       <button className="iconBtn" onClick={()=>onDelete(comment)}>

     }
   </div>

   {replies.map(r=>
     <div style={{marginLeft:35}} key={r.id}>
       <Comment
         comment={r}

/* =========================
   POLL
========================= */

function Poll({post,pollVotes,onVote}){

 const [data,setData]=useState(null);

 useEffect(()=>{
   if(!post.pollId)return;

   return col("polls").doc(post.pollId).onSnapshot(s=>{
     if(s.exists)setData(s.data());
   });
 },[post.pollId]);

 if(!data)return null;

 const total=(data.options||[])
   .reduce((a,b)=>a+(b.votes||0),0);

 const voted=pollVotes.some(x=>x.pollId===post.pollId);

 return <div className="poll">

   <b>{data.question}</b>

   {(data.options||[]).map((x,i)=>{

     const percent=total
       ?Math.round(((x.votes||0)/total)*100)
       :0;

     return <button
       key={i}
       className={"pollOption "+(voted?"selected":"")}
       disabled={voted}
       onClick={()=>onVote(post.pollId,i)}
     >
       <div style={{
         display:"flex",
         justifyContent:"space-between"
       }}>
         <span>{x.text}</span>
         {voted&&<span>{percent}%</span>}
       </div>

       {voted&&
         <div className="progress">
           <i style={{width:percent+"%"}}/>
         </div>
       }
     </button>
   })}

   <div style={{fontSize:11,color:"#8f96a5",marginTop:8}}>
     {total} votes
   </div>

 </div>
}

function Explore({
 posts,users,follows,onFollow,onLike,likes,
 onBookmark,bookmarks,comments,onComment,onReport,currentUid
}){

 const [query,setQuery]=useState("");

 const trending=useMemo(()=>{

   const map={};

   posts.forEach(p=>{
     (p.text||"").match(/#[A-Za-z0-9_]+/g)?.forEach(tag=>{
       const t=tag.toLowerCase();
       map[t]=(map[t]||0)+1;
     });
   });

   return Object.entries(map)
     .sort((a,b)=>b[1]-a[1])
     .slice(0,10);

 },[posts]);

 const filtered=posts.filter(p=>
   !query||
   (p.text||"").toLowerCase().includes(query.toLowerCase())
 );

 return <>

   )}
 </>
}

/* =========================
   MESSAGES
========================= */

function Messages({
 user,profile,users,messages,selectedChat,
 setSelectedChat,onSend,onDelete,onReact,reactions,onRead
}){

 const [text,setText]=useState("");
 const [reply,setReply]=useState(null);

 const otherUsers=users.filter(x=>x.id!==user.uid);

 const chats=otherUsers.map(u=>({
   id:[user.uid,u.id].sort().join("_"),
   uid:u.id,
   name:u.displayName,
   username:u.username,
   members:[user.uid,u.id],
   avatar:u
 }));

 const active=chats.find(x=>x.id===selectedChat);

 const chatMessages=active
   ?messages.filter(x=>x.conversationId===active.id)
   :[];

 useEffect(()=>{
   if(active){
     onRead(active.id);
   }
 },[active?.id]);

 async function send(){
   if(!text.trim()||!active)return;

   await onSend(active,text,reply);
   setText("");
   setReply(null);
 }

 return <>

   <div className="topbar">
     <div className="pageTitle">Messages</div>
   </div>

   <div className="messageLayout">

     <div className="chatList">

       <div style={{padding:10}}>
         <b>Chats</b>
       </div>

       {chats.map(c=>
         <button
           className={"chatItem "+(active?.id===c.id?"active":"")}
           key={c.id}
           onClick={()=>setSelectedChat(c.id)}
         >
           <div className="avatar sm">
             {initials(c.name)}
           </div>

           <div style={{minWidth:0}}>
             <div style={{
               fontWeight:750,
               whiteSpace:"nowrap",
               overflow:"hidden",
               textOverflow:"ellipsis"
             }}>
               {c.name}
             </div>
             <div style={{
               color:"#8f96a5",
               fontSize:11
             }}>
               @{c.username}
             </div>
           </div>
         </button>
       )}

     </div>

     <div className="chatArea">

       {!active
         ?<div className="empty">
             Select a chat to start messaging.
           </div>
         :<>
           <div className="chatHead">

             <div className="avatar sm">
               {initials(active.name)}
             </div>

             <div style={{flex:1}}>
               <b>{active.name}</b>
               <div style={{fontSize:11,color:"#8f96a5"}}>
                 @{active.username}
               </div>
             </div>

           </div>

           <div className="messages">

             {chatMessages.map(m=>
               <MessageBubble
                 key={m.id}
                 message={m}
                 mine={m.senderId===user.uid}
                 onDelete={onDelete}
                 onReact={onReact}
                 reactions={reactions}
                 onReply={setReply}
               />
             )}

           </div>

           {reply &&
             <div style={{
               padding:"6px 10px",
               borderTop:"1px solid var(--border)",
               color:"#8f96a5",
               fontSize:12
             }}>
               Replying to: {reply.text}
               <button
                 className="iconBtn"
                 onClick={()=>setReply(null)}
               >×</button>
             </div>
           }

           <div className="chatInput">

             <input
               value={text}
               onChange={e=>setText(e.target.value)}
               onKeyDown={e=>{
                 if(e.key==="Enter")send();
               }}
               placeholder="Message..."
             />

             <button className="btn" onClick={send}>
               Send
             </button>

           </div>
         </>
       }

     </div>

   </div>
 </>
}

/* =========================
   MESSAGE BUBBLE
========================= */

function MessageBubble({
 message,mine,onDelete,onReact,reactions,onReply
}){

 const rx=reactions.filter(x=>x.messageId===message.id);

 return <div
   className={"msg "+(mine?"mine":"")}
 >

   {message.replyTo &&
     <div style={{
       fontSize:11,
       opacity:.7,
       borderLeft:"2px solid #aaa",
       paddingLeft:5,
       marginBottom:5
     }}>
       Reply
     </div>
   }

   <div>{message.text}</div>

   <div className="msgTools">

     <button
       className="iconBtn"
       onClick={()=>onReply(message)}
       style={{color:"white",fontSize:11}}
     >
       ↩
     </button>

     <button
       className="iconBtn"
       onClick={()=>onReact(message,"❤️")}
       style={{color:"white",fontSize:11}}
     >
       ❤️
     </button>

     <button
       className="iconBtn"
       onClick={()=>onReact(message,"👍")}
       style={{color:"white",fontSize:11}}
     >
       👍
     </button>

     {mine &&
       <button
         className="iconBtn"
         onClick={()=>onDelete(message)}
         style={{color:"white",fontSize:11}}
       >
         🗑
       </button>
     }

   </div>

   {rx.length>0 &&
     <div style={{fontSize:11}}>
       {rx.map(x=><span key={x.id}>{x.reaction}</span>)}
     </div>
   }

   <div className="msgMeta">
     {timeAgo(message.createdAt)}
     {mine && message.readBy?.length>1?" · Read":""}
   </div>

 </div>
}
