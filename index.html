<style>

input,textarea,select{

/* profile */

.cover{

}

.profilebody{padding:0 18px 18px}

.bigavatar{

}

.stats{

.chat{

}

}

.chatlisthead{

}

.chatitem{

 display:flex;

.chatinfo{

}

.msgrow{display:flex}
.msgrow.mine{justify-content:flex-end}

.bubble{
 max-width:76%;
 background:#202020;

}

.quote{

.msgtools{

.msgtools button{

.chatinput{

 gap:6px;
 padding:8px;

}

.chatinput input{flex:1}
.chatinput button{

/* modal */

.modalbg{

 inset:0;
 z-index:300;
 background:#000c;
 display:grid;
 place-items:center;

}

.modal{
 width:min(560px,100%);

 background:#111;
 border:1px solid #333;

.field{margin:10px 0}

/* mobile */

.mobilebar{display:none}

@media(max-width:1000px){
 .layout{grid-template-columns:190px minmax(0,1fr)}
 .rightbar{display:none}
}

@media(max-width:700px){
 .layout{
  display:block;
  padding:10px 8px 70px
 }

 .leftbar{display:none}

 .mobilebar{

  height:calc(100vh - 130px);

<body>
<div id="root"></div>

<script type="text/babel">

const {
 useState,
 useEffect,
 useMemo
}=React;

/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig={
 apiKey:"AIzaSyDTrvD7c1TUtPUUOSX7_-0VV9itC28LOg0",
 authDomain:"nexus-37600.firebaseapp.com",
 projectId:"nexus-37600",
 storageBucket:"nexus-37600.firebasestorage.app",
 messagingSenderId:"61496309341",
 appId:"1:61496309341:web:fdb3711264df47f318bfb4",
 measurementId:"G-41S50YF5RF"
};

const APP_ID="nexus-37600";

if(!firebase.apps.length){
 firebase.initializeApp(firebaseConfig);
}

const auth=firebase.auth();
const db=firebase.firestore();

function col(name){
 return db
  .collection("artifacts")
  .doc(APP_ID)
  .collection("public")
  .doc("data")
  .collection(name);
}

const TS=()=>firebase.firestore.FieldValue.serverTimestamp();

function timeMs(x){
 if(!x)return 0;
 if(x.toMillis)return x.toMillis();
 if(x.seconds)return x.seconds*1000;
 const n=new Date(x).getTime();
 return Number.isNaN(n)?0:n;
}

function ago(x){
 const d=Date.now()-timeMs(x);
 if(d<60000)return "now";
 if(d<3600000)return Math.floor(d/60000)+"m";
 if(d<86400000)return Math.floor(d/3600000)+"h";
 return Math.floor(d/86400000)+"d";
}

function initials(name){
 return (name||"N")
  .trim()
  .split(/\s+/)
  .slice(0,2)
  .map(x=>x[0])
  .join("")
  .toUpperCase()||"N";
}

function extractHashtags(text){
 return [...new Set(
  (text.match(/#[A-Za-z0-9_]+/g)||[])
   .map(x=>x.toLowerCase())
 )];
}

function extractMentions(text){
 return [...new Set(
  (text.match(/@[A-Za-z0-9_]+/g)||[])
   .map(x=>x.slice(1).toLowerCase())
 )];
}

function dmId(a,b){
 return [a,b].sort().join("_");
}

function actorId(x){
 return x?.userId||x?.uid||x?.actorId||"";
}

/* =========================================================
   AUTH
========================================================= */

function useAuth(){

 const[user,setUser]=useState(null);
 const[profile,setProfile]=useState(null);
 const[ready,setReady]=useState(false);

 useEffect(()=>{

  return auth.onAuthStateChanged(async u=>{

   if(!u){
    try{
     await auth.signInAnonymously();
    }catch(e){
     console.error(e);
    }
    return;
   }

   setUser(u);

   const ref=col("users").doc(u.uid);
   const snap=await ref.get();

   if(!snap.exists){

    const profile={
     uid:u.uid,
     displayName:"Nexus User",
     username:"user_"+u.uid.slice(0,7),
     bio:"Welcome to Nexus 👋",
     createdAt:TS(),
     followersCount:0,
     followingCount:0,
     postsCount:0
    };

    await ref.set(profile);
    setProfile(profile);

   }else{
    setProfile({
     uid:u.uid,
     ...snap.data()
    });
   }

   setReady(true);

  });

 },[]);

 return{
  user,
  profile,
  setProfile,
  ready
 };

}

/* =========================================================
   DATABASE DATA
========================================================= */

const COLLECTIONS=[
 "users",
 "posts",
 "comments",
 "likes",
 "follows",
 "bookmarks",
 "reposts",
 "notifications",
 "messages",
 "stories",
 "polls",
 "pollVotes",
 "blocks",
 "mutes",
 "presence",
 "settings",
 "chats",
 "messageReactions"
];

function useData(uid){

 const[data,setData]=useState({});

 useEffect(()=>{

  if(!uid)return;

  const unsub=[];

  COLLECTIONS.forEach(name=>{

   let q=col(name);

   /*
      Messages support the new schema.
      Legacy messages are handled separately below.
   */

   if(name==="messages"){
    q=q.where("members","array-contains",uid).limit(500);
   }else if(name==="notifications"){
    q=q.where("uid","==",uid).limit(300);
   }else{
    q=q.limit(700);
   }

   const off=q.onSnapshot(
    snap=>{
     setData(old=>({
      ...old,
      [name]:snap.docs.map(d=>({
       id:d.id,
       ...d.data()
      }))
     }));
    },
    err=>console.warn(name,err)
   );

   unsub.push(off);

  });

  /*
    Legacy DM messages.
  */

  const sent=col("messages")
   .where("senderId","==",uid)
   .limit(500)
   .onSnapshot(snap=>{
    const arr=snap.docs.map(d=>({id:d.id,...d.data()}));

    setData(old=>{
     const current=old.messages||[];
     const map=new Map(current.map(x=>[x.id,x]));
     arr.forEach(x=>map.set(x.id,x));
     return {...old,messages:[...map.values()]};
    });
   },()=>{});

  const received=col("messages")
   .where("receiverId","==",uid)
   .limit(500)
   .onSnapshot(snap=>{
    const arr=snap.docs.map(d=>({id:d.id,...d.data()}));

    setData(old=>{
     const current=old.messages||[];
     const map=new Map(current.map(x=>[x.id,x]));
     arr.forEach(x=>map.set(x.id,x));
     return {...old,messages:[...map.values()]};
    });
   },()=>{});

  unsub.push(sent,received);

  return()=>unsub.forEach(x=>x());

 },[uid]);

 return data;

}

/* =========================================================
   NOTIFICATIONS
========================================================= */

async function notify(targetUid,actorUid,type,extra={}){

 if(!targetUid||!actorUid||targetUid===actorUid)return;

 await col("notifications").add({
  uid:targetUid,
  actorId:actorUid,
  type,
  read:false,
  createdAt:TS(),
  ...extra
 });

}

/* =========================================================
   AVATAR
========================================================= */

function Avatar({name,small=false,onClick}){

 return(
  <div
   className={"avatar"+(small?" sm":"")}
   onClick={onClick}
  >
   {initials(name)}
  </div>
 );

}

/* =========================================================
   FOLLOW
========================================================= */

function FollowButton({me,target,follows}){

 const relation=follows.find(
  x=>
   (x.followerId||x.uid)===me.uid &&
   x.followingId===target.uid
 );

 async function toggle(){

  if(relation){

   await col("follows").doc(relation.id).delete();

  }else{

   await col("follows").add({
    followerId:me.uid,
    followingId:target.uid,
    createdAt:TS()
   });

   await notify(
    target.uid,
    me.uid,
    "follow"
   );

  }

 }

 if(me.uid===target.uid)return null;

 return(
  <button
   className="followbtn"
   onClick={toggle}
  >
   {relation?"Following":"Follow"}
  </button>
 );

}

/* =========================================================
   COMPOSER
========================================================= */

function Composer({user,profile}){

 const[text,setText]=useState("");
 const[makePoll,setMakePoll]=useState(false);
 const[options,setOptions]=useState(["",""]);

 async function publish(){

  const content=text.trim();

  if(!content)return;

  const postRef=col("posts").doc();

  await postRef.set({
   authorId:user.uid,
   authorName:profile.displayName,
   authorUsername:profile.username,
   content,
   hashtags:extractHashtags(content),
   mentions:extractMentions(content),
   pinned:false,
   pollId:makePoll?postRef.id:null,
   repostOf:null,
   createdAt:TS()
  });

  if(makePoll){

   const clean=options
    .map(x=>x.trim())
    .filter(Boolean)
    .slice(0,4);

   if(clean.length>=2){

    await col("polls").doc(postRef.id).set({
     postId:postRef.id,
     question:content,
     options:clean.map((text,i)=>({
      id:String(i),
      text
     })),
     createdAt:TS()
    });

   }

  }

  const mentioned=extractMentions(content);

  for(const username of mentioned){

   const snap=await col("users")
    .where("username","==",username)
    .limit(1)
    .get();

   if(!snap.empty){

    await notify(
     snap.docs[0].id,
     user.uid,
     "mention",
     {postId:postRef.id}
    );

   }

  }

  setText("");
  setOptions(["",""]);
  setMakePoll(false);

 }

 function changeOption(i,v){

  setOptions(old=>{
   const next=[...old];
   next[i]=v;
   return next;
  });

 }

 return(
  <div className="composer">

   <textarea
    value={text}
    maxLength={1000}
    onChange={e=>setText(e.target.value)}
    placeholder="What's happening on Nexus?"
   />

   {makePoll&&(
    <div className="poll">

     <div className="muted">Poll options</div>

     {options.map((x,i)=>(
      <input
       key={i}
       style={{marginTop:5}}
       value={x}
       onChange={e=>changeOption(i,e.target.value)}
       placeholder={"Option "+(i+1)}
      />
     ))}

     {options.length<4&&(
      <button
       className="secondary"
       style={{marginTop:7}}
       onClick={()=>setOptions([...options,""])}
      >
       + Option
      </button>
     )}

    </div>
   )}

   <div className="between">

    <button
     className="secondary"
     onClick={()=>setMakePoll(!makePoll)}
    >
     📊 Poll
    </button>

    <div className="row">

     <span className="muted">
      {text.length}/1000
     </span>

     <button
      className="primary"
      disabled={!text.trim()}
      onClick={publish}
     >
      Post
     </button>

    </div>

   </div>

  </div>
 );

}

/* =========================================================
   POLL
========================================================= */

function Poll({poll,votes,user}){

 const mine=votes.find(
  x=>actorId(x)===user.uid
 );

 async function vote(optionId){

  if(mine)return;

  await col("pollVotes")
   .doc(poll.id+"_"+user.uid)
   .set({
    pollId:poll.id,
    postId:poll.postId,
    uid:user.uid,
    optionId,
    createdAt:TS()
   });

 }

 const total=votes.length;

 return(
  <div className="poll">

   {poll.question&&(
    <b>{poll.question}</b>
   )}

   {poll.options.map(option=>{

    const count=votes.filter(
     v=>v.optionId===option.id
    ).length;

    const percent=total
     ?Math.round(count/total*100)
     :0;

    return(
     <button
      key={option.id}
      className="polloption"
      disabled={!!mine}
      onClick={()=>vote(option.id)}
     >

      <span
       className="pollbar"
       style={{width:percent+"%"}}
      />

      <span className="polltext">
       {option.text} — {percent}%
      </span>

     </button>
    );

   })}

   <div className="muted">
    {total} vote{total===1?"":"s"}
   </div>

  </div>
 );

}

/* =========================================================
   COMMENT TREE
========================================================= */

function CommentTree({
 comments,
 parentId,
 user,
 profile,
 postAuthorId,
 level=0,
 onReply
}){

 const children=comments
  .filter(x=>(x.parentId||null)===(parentId||null))
  .sort((a,b)=>timeMs(a.createdAt)-timeMs(b.createdAt));

 return(
  <>
   {children.map(comment=>(
    <div
     className={"comment"+(level?" reply":"")}
     key={comment.id}
    >

     <Avatar
      small
      name={comment.userName}
     />

     <div className="commentbody">

      <b>{comment.userName}</b>

      <div style={{marginTop:3}}>
       {comment.text}
      </div>

      <button
       className="action"
       onClick={()=>onReply(comment.id)}
      >
       Reply
      </button>

      <CommentTree
       comments={comments}
       parentId={comment.id}
       user={user}
       profile={profile}
       postAuthorId={postAuthorId}
       level={level+1}
       onReply={onReply}
      />

     </div>

    </div>
   ))}
  </>
 );

}

/* =========================================================
   POST
========================================================= */

function Post({
 post,
 user,
 profile,
 data,
 onProfile
}){

 const[commentsOpen,setCommentsOpen]=useState(false);
 const[commentText,setCommentText]=useState("");
 const[replyTo,setReplyTo]=useState(null);
 const[editing,setEditing]=useState(false);
 const[editText,setEditText]=useState(post.content||"");
 const[reportOpen,setReportOpen]=useState(false);

 const likes=(data.likes||[]).filter(
  x=>x.postId===post.id
 );

 const bookmarks=(data.bookmarks||[]).filter(
  x=>x.postId===post.id
 );

 const reposts=(data.reposts||[]).filter(
  x=>x.postId===post.id
 );

 const liked=likes.some(
  x=>actorId(x)===user.uid
 );

 const saved=bookmarks.some(
  x=>actorId(x)===user.uid
 );

 const reposted=reposts.some(
  x=>actorId(x)===user.uid
 );

 const comments=(data.comments||[])
  .filter(x=>x.postId===post.id);

 const poll=(data.polls||[]).find(
  x=>x.postId===post.id
 );

 const votes=(data.pollVotes||[]).filter(
  x=>x.postId===post.id
 );

 async function toggleReaction(collection,list){

  const existing=list.find(
   x=>actorId(x)===user.uid
  );

  if(existing){
   await col(collection).doc(existing.id).delete();
  }else{

   const obj={
    postId:post.id,
    uid:user.uid,
    createdAt:TS()
   };

   await col(collection).add(obj);

   if(collection==="likes"){
    await notify(
     post.authorId,
     user.uid,
     "like",
     {postId:post.id}
    );
   }

   if(collection==="reposts"){
    await notify(
     post.authorId,
     user.uid,
     "repost",
     {postId:post.id}
    );
   }

  }

 }

 async function addComment(){

  if(!commentText.trim())return;

  await col("comments").add({
   postId:post.id,
   userId:user.uid,
   userName:profile.displayName,
   text:commentText.trim(),
   parentId:replyTo||null,
   createdAt:TS()
  });

  await notify(
   post.authorId,
   user.uid,
   "comment",
   {postId:post.id}
  );

  setCommentText("");
  setReplyTo(null);

 }

 async function togglePin(){

  if(post.authorId!==user.uid)return;

  await col("posts")
   .doc(post.id)
   .update({
    pinned:!post.pinned
   });

 }

 async function saveEdit(){

  const content=editText.trim();

  if(!content)return;

  await col("posts")
   .doc(post.id)
   .update({
    content,
    hashtags:extractHashtags(content),
    mentions:extractMentions(content),
    editedAt:TS()
   });

  setEditing(false);

 }

 async function deletePost(){

  if(post.authorId!==user.uid)return;

  if(!confirm("Delete this post?"))return;

  await col("posts")
   .doc(post.id)
   .delete();

 }

 async function report(reason){

  await col("reports").add({
   reporterId:user.uid,
   targetUid:post.authorId,
   postId:post.id,
   reason,
   status:"open",
   createdAt:TS()
  });

  setReportOpen(false);
  alert("Report submitted.");

 }

 function renderContent(){

  const text=post.content||"";

  return text
   .split(/(#[A-Za-z0-9_]+|@[A-Za-z0-9_]+)/g)
   .map((part,i)=>{

    if(part.startsWith("#")){
     return(
      <span className="tag" key={i}>
       {part}
      </span>
     );
    }

    if(part.startsWith("@")){
     return(
      <span className="mention" key={i}>
       {part}
      </span>
     );
    }

    return part;

   });

 }

 return(
  <article className="post">

   <div className="posthead">

    <Avatar
     name={post.authorName}
     onClick={()=>onProfile(post.authorId)}
    />

    <div style={{minWidth:0}}>

     <div className="postname">
      {post.authorName}
      {post.pinned&&" 📌"}
     </div>

     <div className="muted">
      @{post.authorUsername} · {ago(post.createdAt)}
      {post.editedAt&&" · edited"}
     </div>

    </div>

    <div
     className="row"
     style={{marginLeft:"auto"}}
    >

     {post.authorId===user.uid&&(
      <>
       <button
        className="action"
        onClick={()=>setEditing(!editing)}
       >
        ✎
       </button>

       <button
        className="action"
        onClick={togglePin}
       >
        {post.pinned?"📌":"📍"}
       </button>

       <button
        className="action"
        onClick={deletePost}
       >
        🗑
       </button>
      </>
     )}

     <button
      className="action"
      onClick={()=>setReportOpen(true)}
     >
      🚩
     </button>

    </div>

   </div>

   {editing?(
    <div style={{marginTop:10}}>

     <textarea
      value={editText}
      onChange={e=>setEditText(e.target.value)}
     />

     <div className="row" style={{marginTop:6}}>
      <button
       className="secondary"
       onClick={()=>setEditing(false)}
      >
       Cancel
      </button>

      <button
       className="primary"
       onClick={saveEdit}
      >
       Save
      </button>
     </div>

    </div>
   ):(
    <div className="postcontent">
     {renderContent()}
    </div>
   )}

   {poll&&(
    <Poll
     poll={poll}
     votes={votes}
     user={user}
    />
   )}

   <div className="postactions">

    <button
     className={"action "+(liked?"active":"")}
     onClick={()=>toggleReaction("likes",likes)}
    >
     ❤️ {likes.length}
    </button>

    <button
     className="action"
     onClick={()=>setCommentsOpen(!commentsOpen)}
    >
     💬 {comments.length}
    </button>

    <button
     className={"action "+(reposted?"active":"")}
     onClick={()=>toggleReaction("reposts",reposts)}
    >
     🔁 {reposts.length}
    </button>

    <button
     className={"action "+(saved?"active":"")}
     onClick={()=>toggleReaction("bookmarks",bookmarks)}
    >
     🔖
    </button>

    <button
     className="action"
     onClick={()=>{
      navigator.clipboard?.writeText(post.content||"");
     }}
    >
     ↗ Share
    </button>

   </div>

   {commentsOpen&&(
    <div className="comments">

     <CommentTree
      comments={comments}
      parentId={null}
      user={user}
      profile={profile}
      postAuthorId={post.authorId}
      onReply={setReplyTo}
     />

     {replyTo&&(
      <div className="muted">
       Replying to comment
       <button
        className="action"
        onClick={()=>setReplyTo(null)}
       >
        ×
       </button>
      </div>
     )}

     <div className="row">

      <input
       value={commentText}
       onChange={e=>setCommentText(e.target.value)}
       onKeyDown={e=>{
        if(e.key==="Enter")addComment();
       }}
       placeholder={replyTo?"Write a reply...":"Write a comment..."}
      />

      <button
       className="primary"
       onClick={addComment}
      >
       Send
      </button>

     </div>

    </div>
   )}

   {reportOpen&&(
    <div className="modalbg">
     <div className="modal">

      <h3>Report post</h3>

      {[
       "Spam",
       "Harassment",
       "Harmful content",
       "Impersonation",
       "Other"
      ].map(reason=>(
       <button
        className="secondary"
        style={{
         width:"100%",
         margin:"4px 0",
         textAlign:"left"
        }}
        key={reason}
        onClick={()=>report(reason)}
       >
        🚩 {reason}
       </button>
      ))}

      <button
       className="secondary"
       style={{marginTop:10}}
       onClick={()=>setReportOpen(false)}
      >
       Cancel
      </button>

     </div>
    </div>
   )}

  </article>
 );

}

   STORIES
========================================================= */

function Stories({user,profile,data}){

 const[text,setText]=useState("");
 const[viewer,setViewer]=useState(null);

 const active=(data.stories||[])
  .filter(x=>timeMs(x.createdAt)>Date.now()-86400000)
  .sort((a,b)=>timeMs(b.createdAt)-timeMs(a.createdAt));

 const groups=[...new Map(
  active.map(x=>[x.authorId||x.uid,x])
 ).values();

 async function create(){

  if(!text.trim())return;

  await col("stories").add({
   authorId:user.uid,
   authorName:profile.displayName,
   authorUsername:profile.username,
   text:text.trim(),
   createdAt:TS(),
   expiresAt:new Date(Date.now()+86400000)
  });

  setText("");

 }

 return(
  <>

   <div className="storycomposer">

    <input
     value={text}
     onChange={e=>setText(e.target.value)}
     placeholder="Post a text story — expires in 24h"
    />

    <button
     className="primary"
     onClick={create}
     disabled={!text.trim()}
    >
     Story
    </button>

   </div>

   <div className="storyrow">

    {groups.map(s=>(
     <div
      className="storyitem"
      key={s.authorId||s.uid}
      onClick={()=>setViewer(s.authorId||s.uid)}
     >

      <Avatar
       small
       name={s.authorName}
      />

      <div>{s.authorName}</div>

     </div>
    ))}

   </div>

   {viewer&&(
    <div className="modalbg">
     <div className="modal">

      <div className="between">
       <h3>Stories</h3>
       <button
        className="secondary"
        onClick={()=>setViewer(null)}
       >
        ×
       </button>
      </div>

      {active
       .filter(x=>(x.authorId||x.uid)===viewer)
       .map(s=>(
        <div
         className="storybubble"
         key={s.id}
        >
         <b>{s.authorName}</b>
         <div style={{margin:"8px 0"}}>
          {s.text}
         </div>
         <div className="muted">
          {ago(s.createdAt)}
         </div>
        </div>
       ))
      }

     </div>
    </div>
   )}

  </>
 );

}

/* =========================================================
   FEED
========================================================= */

function Feed({
 user,
 profile,
 data,
 onProfile
}){

 const[feed,setFeed]=useState("home");
 const[search,setSearch]=useState("");

 const following=new Set(
  (data.follows||[])
   .filter(x=>(x.followerId||x.uid)===user.uid)
   .map(x=>x.followingId)
 );

 const saved=new Set(
  (data.bookmarks||[])
   .filter(x=>actorId(x)===user.uid)
   .map(x=>x.postId)
 );

 const blocked=new Set(
  (data.blocks||[])
   .filter(x=>actorId(x)===user.uid)
   .map(x=>x.blockedId)
 );

 const muted=new Set(
  (data.mutes||[])
   .filter(x=>actorId(x)===user.uid)
   .map(x=>x.mutedId)
 );

 let posts=[...(data.posts||[])];

 posts=posts
  .filter(p=>!blocked.has(p.authorId))
  .filter(p=>!muted.has(p.authorId));

 if(feed==="following"){
  posts=posts.filter(
   p=>p.authorId===user.uid||following.has(p.authorId)
  );
 }

 if(feed==="saved"){
  posts=posts.filter(p=>saved.has(p.id));
 }

 if(search.trim()){

  const q=search.toLowerCase();

  posts=posts.filter(p=>
   (p.content||"").toLowerCase().includes(q)||
   (p.authorName||"").toLowerCase().includes(q)||
   (p.authorUsername||"").toLowerCase().includes(q)||
   (p.hashtags||[]).some(t=>t.includes(q))
  );

 }

 posts.sort((a,b)=>{

  if(a.pinned&&!b.pinned)return -1;
  if(!a.pinned&&b.pinned)return 1;

  return timeMs(b.createdAt)-timeMs(a.createdAt);

 });

 return(
  <>

   <input
    style={{marginBottom:10}}
    value={search}
    onChange={e=>setSearch(e.target.value)}
    placeholder="🔎 Search posts, users or hashtags..."
   />

   <Stories
    user={user}
    profile={profile}
    data={data}
   />

   <div className="tabs">

    {[
     ["home","For You"],
     ["following","Following"],
     ["saved","Saved"]
    ].map(([id,label])=>(
     <button
      className={feed===id?"active":""}
      onClick={()=>setFeed(id)}
      key={id}
     >
      {label}
     </button>
    ))}

   </div>

   <Composer
    user={user}
    profile={profile}
   />

   {posts.map(post=>(
    <Post
     key={post.id}
     post={post}
     user={user}
     profile={profile}
     data={data}
     onProfile={onProfile}
    />
   ))}

   {!posts.length&&(
    <div className="empty">
     Nothing here yet.
    </div>
   )}

  </>
 );

}

function Explore({
 user,
 data,
 onProfile

 const[q,setQ]=useState("");

  .filter(u=>{

   if(!q)return true;

   const x=q.toLowerCase();

   return(
    (u.displayName||"").toLowerCase().includes(x)||
    (u.username||"").toLowerCase().includes(x)
   );

  });

 const posts=(data.posts||[])
  .filter(p=>{

   if(!q)return true;

   const x=q.toLowerCase();

   return(
    (p.content||"").toLowerCase().includes(x)||
    (p.authorUsername||"").toLowerCase().includes(x)||
    (p.hashtags||[]).some(t=>t.includes(x))
   );

  });

 const trending={};

 (data.posts||[]).forEach(p=>{

 });

 const tags=Object.entries(trending)

     className={tab==="hashtags"?"active":""}

   ))}

}

/* =========================================================
   PROFILE
========================================================= */

function Profile({
 user,
 profile,
 data,
 onProfile
}){

 const[edit,setEdit]=useState(false);
 const[name,setName]=useState(profile.displayName||"");
 const[username,setUsername]=useState(profile.username||"");
 const[bio,setBio]=useState(profile.bio||"");

 const[report,setReport]=useState(false);

 const isMe=profile.uid===user.uid;

 const posts=(data.posts||[])
  .filter(p=>p.authorId===profile.uid)
  .sort((a,b)=>{

   if(a.pinned&&!b.pinned)return -1;
   if(!a.pinned&&b.pinned)return 1;

   return timeMs(b.createdAt)-timeMs(a.createdAt);

  });

 const followers=(data.follows||[])
  .filter(x=>x.followingId===profile.uid).length;

 const following=(data.follows||[])
  .filter(x=>(x.followerId||x.uid)===profile.uid).length;

 const blocked=(data.blocks||[])
  .some(x=>actorId(x)===user.uid&&x.blockedId===profile.uid);

 const muted=(data.mutes||[])
  .some(x=>actorId(x)===user.uid&&x.mutedId===profile.uid);

 async function saveProfile(){

  const cleanUser=username
   .replace(/^@/,"")
   .replace(/\s+/g,"_")
   .toLowerCase();

  await col("users")
   .doc(user.uid)
   .update({
    displayName:name.trim()||"Nexus User",
    username:cleanUser||"user_"+user.uid.slice(0,7),
    bio
   });

  setEdit(false);

 }

 async function toggleSafety(collection,type){

  const field=type==="block"
   ?"blockedId"
   :"mutedId";

  const existing=(data[collection]||[])
   .find(x=>
    actorId(x)===user.uid&&
    x[field]===profile.uid
   );

  if(existing){

   await col(collection)
    .doc(existing.id)
    .delete();

  }else{

   await col(collection).add({
    uid:user.uid,
    [field]:profile.uid,
    createdAt:TS()
   });

  }

 }

 async function submitReport(reason){

  await col("reports").add({
   reporterId:user.uid,
   targetUid:profile.uid,
   reason,
   status:"open",
   createdAt:TS()
  });

  setReport(false);
  alert("Report submitted.");

 }

 return(
  <>

   <div className="card">

    <div className="cover"/>

    <div className="profilebody">

     <div className="bigavatar">
      {initials(profile.displayName)}
     </div>

     <h2 style={{marginBottom:0}}>
      {profile.displayName}
     </h2>

     <div className="muted">
      @{profile.username}
     </div>

     <div className="bio">
      {profile.bio}
     </div>

     <div className="stats">

      <div>
       <b>{followers}</b>
       <span>Followers</span>
      </div>

      <div>
       <b>{following}</b>
       <span>Following</span>
      </div>

      <div>
       <b>{posts.length}</b>
       <span>Posts</span>
      </div>

     </div>

     <div className="row">

      {isMe?(
       <button
        className="secondary"
        onClick={()=>setEdit(true)}
       >
        Edit profile
       </button>
      ):(
       <>
        <FollowButton
         me={user}
         target={profile}
         follows={data.follows||[]}
        />

        <button
         className="secondary"
         onClick={()=>toggleSafety("mutes","mute")}
        >
         {muted?"Unmute":"Mute"}
        </button>

        <button
         className="danger"
         onClick={()=>toggleSafety("blocks","block")}
        >
         {blocked?"Unblock":"Block"}
        </button>

        <button
         className="secondary"
         onClick={()=>setReport(true)}
        >
         🚩 Report
        </button>
       </>
      )}

     </div>

    </div>

   </div>

   <div style={{marginTop:12}}>

    {posts.map(post=>(
     <Post
      key={post.id}
      post={post}
      user={user}
      profile={isMe?profile:{displayName:"Nexus User",username:"user"}}
      data={data}
      onProfile={onProfile}
     />
    ))}

   </div>

   {edit&&(
    <div className="modalbg">

     <div className="modal">

      <h2>Edit profile</h2>

      <div className="field">
       <label>Display name</label>
       <input
        value={name}
        onChange={e=>setName(e.target.value)}
       />
      </div>

      <div className="field">
       <label>Username</label>
       <input
        value={username}
        onChange={e=>setUsername(e.target.value)}
       />
      </div>

      <div className="field">
       <label>Bio</label>
       <textarea
        value={bio}
        onChange={e=>setBio(e.target.value)}
       />
      </div>

      <div className="row" style={{justifyContent:"flex-end"}}>

       <button
        className="secondary"
        onClick={()=>setEdit(false)}
       >
        Cancel
       </button>

       <button
        className="primary"
        onClick={saveProfile}
       >
        Save
       </button>

      </div>

     </div>

    </div>
   )}

   {report&&(
    <div className="modalbg">

     <div className="modal">

      <h3>Report profile</h3>

      {[
       "Spam",
       "Harassment",
       "Impersonation",
       "Harmful content",
       "Other"
      ].map(reason=>(
       <button
        key={reason}
        className="secondary"
        style={{
         width:"100%",
         margin:"4px 0",
         textAlign:"left"
        }}
        onClick={()=>submitReport(reason)}
       >
        🚩 {reason}
       </button>
      ))}

      <button
       className="secondary"
       onClick={()=>setReport(false)}
      >
       Cancel
      </button>

     </div>

    </div>
   )}

  </>
 );

}

/* =========================================================
   NOTIFICATIONS
========================================================= */

function Notifications({user,data}){

 const notifications=(data.notifications||[])
  .filter(x=>x.uid===user.uid)
  .sort((a,b)=>timeMs(b.createdAt)-timeMs(a.createdAt));

 useEffect(()=>{

  notifications
   .filter(n=>!n.read)
   .forEach(n=>{
    col("notifications")
     .doc(n.id)
     .update({read:true})
     .catch(()=>{});
   });

 },[notifications.length]);

 const actorMap=new Map(
  (data.users||[]).map(u=>[u.uid,u])
 );

 function text(n){

  const name=actorMap.get(n.actorId)?.displayName||"Someone";

  const messages={
   like:`${name} liked your post ❤️`,
   comment:`${name} commented on your post 💬`,
   follow:`${name} followed you 👤`,
   repost:`${name} reposted your post 🔁`,
   mention:`${name} mentioned you @️⃣`
  };

  return messages[n.type]||`${name} interacted with you`;

 }

 return(
  <div className="card">

   <div className="between">
    <h2>🔔 Notifications</h2>

    <button
     className="secondary"
     onClick={async()=>{
      await Promise.all(
       notifications
        .filter(x=>!x.read)
        .map(x=>
         col("notifications")
          .doc(x.id)
          .update({read:true})
        )
      );
     }}
    >
     Mark all read
    </button>

   </div>

   {!notifications.length&&(
    <div className="empty">
     No notifications yet.
    </div>
   )}

   {notifications.map(n=>(
    <div
     key={n.id}
     style={{
      padding:"11px 0",
      borderBottom:"1px solid #222"
     }}
    >

     <b>{text(n)}</b>

     <div className="muted">
      {ago(n.createdAt)}
     </div>

    </div>
   ))}

  </div>
 );

}

/* =========================================================
   MESSAGES
========================================================= */

function Messages({
 user,
 profile,
 data
}){

 const[ch,setCh]=useState(null);
 const[text,setText]=useState("");
 const[search,setSearch]=useState("");
 const[reply,setReply]=useState(null);

 const[groupModal,setGroupModal]=useState(false);
 const[groupName,setGroupName]=useState("");
 const[groupMembers,setGroupMembers]=useState([]);

 const chats=(data.chats||[])
  .filter(c=>c.members?.includes(user.uid))
  .sort((a,b)=>timeMs(b.updatedAt||b.createdAt)-timeMs(a.updatedAt||a.createdAt));

 const active=chats.find(c=>c.id===ch);

 const messages=(data.messages||[])
  .filter(m=>{

   if(m.conversationId===ch)return true;

   /*
     Legacy direct-message compatibility.
   */
   if(active?.type==="dm"){

    const other=active.members.find(x=>x!==user.uid);

    return(
     (m.senderId===user.uid&&m.receiverId===other)||
     (m.receiverId===user.uid&&m.senderId===other)
    );

   }

   return false;

  })
  .sort((a,b)=>timeMs(a.createdAt)-timeMs(b.createdAt));

 const people=(data.users||[])
  .filter(u=>u.uid!==user.uid)
  .filter(u=>{

   if(!search)return false;

   const q=search.toLowerCase();

   return(
    (u.username||"").toLowerCase().includes(q)||
    (u.displayName||"").toLowerCase().includes(q)
   );

  });

 function chatTitle(chat){

  if(!chat)return"";

  if(chat.type==="group")return chat.name||"Group";

  const other=chat.members?.find(x=>x!==user.uid);

  return data.users?.find(u=>u.uid===other)?.displayName||"User";

 }

 async function openDM(person){

  const id=dmId(user.uid,person.uid);
  const ref=col("chats").doc(id);
  const snap=await ref.get();

  if(!snap.exists){

   await ref.set({
    id,
    type:"dm",
    members:[user.uid,person.uid],
    createdBy:user.uid,
    createdAt:TS(),
    updatedAt:TS()
   });

  }

  setCh(id);
  setSearch("");

 }

 async function createGroup(){

  if(!groupName.trim()||!groupMembers.length)return;

  const ref=col("chats").doc();

  await ref.set({
   id:ref.id,
   type:"group",
   name:groupName.trim(),
   members:[user.uid,...groupMembers],
   createdBy:user.uid,
   createdAt:TS(),
   updatedAt:TS()
  });

  setGroupModal(false);
  setGroupName("");
  setGroupMembers([]);
  setCh(ref.id);

 }

 async function send(){

  if(!text.trim()||!active)return;

  await col("messages").add({
   conversationId:active.id,
   members:active.members,
   senderId:user.uid,
   senderName:profile.displayName,
   text:text.trim(),
   replyTo:reply,
   deleted:false,
   readBy:[user.uid],
   createdAt:TS()
  });

  await col("chats")
   .doc(active.id)
   .set({
    updatedAt:TS(),
    lastMessage:text.trim()
   },{merge:true});

  setText("");
  setReply(null);

 }

 async function deleteMessage(message){

  if(message.senderId!==user.uid)return;

  await col("messages")
   .doc(message.id)
   .update({
    deleted:true,
    text:""
   });

 }

 async function reactMessage(message,emoji){

  const existing=(data.messageReactions||[])
   .find(x=>
    x.messageId===message.id &&
    actorId(x)===user.uid
   );

  if(existing){

   await col("messageReactions")
    .doc(existing.id)
    .update({emoji});

  }else{

   await col("messageReactions").add({
    messageId:message.id,
    uid:user.uid,
    emoji,
    createdAt:TS()
   });

  }

 }

 useEffect(()=>{

  if(!active)return;

  messages
   .filter(m=>
    m.senderId!==user.uid &&
    !m.readBy?.includes(user.uid)
   )
   .forEach(m=>{
    col("messages")
     .doc(m.id)
     .update({
      readBy:firebase.firestore.FieldValue.arrayUnion(user.uid)
     })
     .catch(()=>{});
   });

 },[ch,messages.length]);

 return(
  <>

   <div className={"chat "+(ch?"open":"")}>

    <div className="chatlist">

     <div className="chatlisthead">

      <div className="between">

       <b>Messages</b>

       <button
        className="secondary"
        onClick={()=>setGroupModal(true)}
       >
        ＋ Group
       </button>

      </div>

      <input
       style={{marginTop:7}}
       value={search}
       onChange={e=>setSearch(e.target.value)}
       placeholder="Find people..."
      />

     </div>

     {search&&people.map(person=>(
      <button
       className="chatitem"
       key={person.uid}
       onClick={()=>openDM(person)}
      >

       <Avatar
        small
        name={person.displayName}
       />

       <div className="chatinfo">

        <b>{person.displayName}</b>

        <div className="preview">
         @{person.username}
        </div>

       </div>

      </button>
     ))}

     {chats.map(chat=>{

      const last=(data.messages||[])
       .filter(m=>m.conversationId===chat.id)
       .sort((a,b)=>timeMs(b.createdAt)-timeMs(a.createdAt))[0];

      const unread=(data.messages||[])
       .filter(m=>
        m.conversationId===chat.id&&
        m.senderId!==user.uid&&
        !m.readBy?.includes(user.uid)
       ).length;

      return(
       <button
        className={
         "chatitem "+
         (ch===chat.id?"active":"")
        }
        key={chat.id}
        onClick={()=>setCh(chat.id)}
       >

        <Avatar
         small
         name={chat.type==="group"?"G":chatTitle(chat)}
        />

        <div className="chatinfo">

         <b>{chatTitle(chat)}</b>

         <div className="preview">
          {last?.deleted
           ?"Message deleted"
           :(last?.text||chat.lastMessage||"Start chatting")
          }
         </div>

        </div>

        {unread>0&&(
         <b>{unread}</b>
        )}

       </button>
      );

     })}

    </div>

    <div className="chatwindow">

     {!active?(
      <div className="empty">
       Select a conversation.
      </div>
     ):(
      <>

       <div className="chatheader">

        <button
         className="secondary"
         onClick={()=>setCh(null)}
        >
         ←
        </button>

        <Avatar
         small
         name={chatTitle(active)}
        />

        <div>

         <b>{chatTitle(active)}</b>

         <div className="muted">
          {active.type==="group"
           ?active.members.length+" members"
           :"Direct message"
          }
         </div>

        </div>

       </div>

       <div className="messages">

        {messages.map(message=>{

         const quote=message.replyTo
          ?messages.find(x=>x.id===message.replyTo)
          :null;

         const reactions=(data.messageReactions||[])
          .filter(x=>x.messageId===message.id);

         return(
          <div
           className={
            "msgrow "+
            (message.senderId===user.uid?"mine":"")
           }
           key={message.id}
          >

           <div className="bubble">

            {active.type==="group"&&
             message.senderId!==user.uid&&(
             <div className="muted">
              {message.senderName}
             </div>
            )}

            {quote&&!quote.deleted&&(
             <div className="quote">
              ↩ {quote.text}
             </div>
            )}

            <div>
             {message.deleted
              ?"Message deleted"
              :message.text
             }
            </div>

            {reactions.length>0&&(
             <div style={{marginTop:4}}>
              {reactions.map(r=>r.emoji).join(" ")}
             </div>
            )}

            <div className="msgtools">

             {["❤️","😂","👍","🔥"].map(emoji=>(
              <button
               key={emoji}
               onClick={()=>reactMessage(message,emoji)}
              >
               {emoji}
              </button>
             ))}

             <button
              onClick={()=>setReply(message.id)}
             >
              ↩
             </button>

             {message.senderId===user.uid&&(
              <button
               onClick={()=>deleteMessage(message)}
              >
               🗑
              </button>
             )}

            </div>

            <div className="msgmeta">
             {ago(message.createdAt)}

             {message.senderId===user.uid&&(
              message.readBy?.some(x=>x!==user.uid)
               ?" · read"
               :" · sent"
             )}

            </div>

           </div>

          </div>
         );

        })}

       </div>

       {reply&&(
        <div
         className="muted"
         style={{padding:"5px 10px"}}
        >
         Replying to message
         <button
          className="action"
          onClick={()=>setReply(null)}
         >
          ×
         </button>
        </div>
       )}

       <div className="chatinput">

        <input
         value={text}
         onChange={e=>setText(e.target.value)}
         onKeyDown={e=>{
          if(e.key==="Enter"&&!e.shiftKey){
           e.preventDefault();
           send();
          }
         }}
         placeholder="Message..."
        />

        <button
         disabled={!text.trim()}
         onClick={send}
        >
         Send
        </button>

       </div>

      </>
     )}

    </div>

   </div>

   {groupModal&&(
    <div className="modalbg">

     <div className="modal">

      <h2>Create group</h2>

      <div className="field">

       <label>Group name</label>

       <input
        value={groupName}
        onChange={e=>setGroupName(e.target.value)}
       />

      </div>

      <div className="field">

       <label>Select members</label>

       {(data.users||[])
        .filter(u=>u.uid!==user.uid)
        .map(person=>(
         <label
          key={person.uid}
          style={{
           display:"block",
           padding:"7px"
          }}
         >

          <input
           type="checkbox"
           checked={groupMembers.includes(person.uid)}
           onChange={()=>{

            setGroupMembers(old=>
             old.includes(person.uid)
              ?old.filter(x=>x!==person.uid)
              :[...old,person.uid]
            );

           }}
          />

          {" "+person.displayName+" "}
          <span className="muted">
           @{person.username}
          </span>

         </label>
        ))}

      </div>

      <div
       className="row"
       style={{justifyContent:"flex-end"}}
      >

       <button
        className="secondary"
        onClick={()=>setGroupModal(false)}
       >
        Cancel
       </button>

       <button
        className="primary"
        disabled={!groupName.trim()||!groupMembers.length}
        onClick={createGroup}
       >
        Create group
       </button>

      </div>

     </div>

    </div>
   )}

  </>
 );

}

/* =========================================================
   SETTINGS
========================================================= */

function Settings({
 user,
 data
}){

 const current=(data.settings||[])
  .find(x=>x.uid===user.uid)||{};

 const[notifications,setNotifications]=useState(
  current.notifications!==false
 );

 const[online,setOnline]=useState(
  current.showOnline!==false
 );

 const[compact,setCompact]=useState(
  current.compactMode===true
 );

 async function update(key,value){

  await col("settings")
   .doc(user.uid)
   .set({
    uid:user.uid,
    [key]:value,
    updatedAt:TS()
   },{merge:true});

 }

 return(
  <div className="card">

   <h2>⚙️ Settings</h2>

   <div
    className="between"
    style={{
     padding:"14px 0",
     borderBottom:"1px solid #222"
    }}
   >

    <div>
     <b>Notifications</b>
     <div className="muted">
      Enable social notifications
     </div>
    </div>

    <input
     type="checkbox"
     checked={notifications}
     onChange={e=>{
      setNotifications(e.target.checked);
      update("notifications",e.target.checked);
     }}
    />

   </div>

   <div
    className="between"
    style={{
     padding:"14px 0",
     borderBottom:"1px solid #222"
    }}
   >

    <div>
     <b>Show online status</b>
     <div className="muted">
      Let others see when you're online
     </div>
    </div>

    <input
     type="checkbox"
     checked={online}
     onChange={e=>{
      setOnline(e.target.checked);
      update("showOnline",e.target.checked);
     }}
    />

   </div>

   <div
    className="between"
    style={{padding:"14px 0"}}
   >

    <div>
     <b>Compact mode</b>
     <div className="muted">
      Reduce spacing in the interface
     </div>
    </div>

    <input
     type="checkbox"
     checked={compact}
     onChange={e=>{
      setCompact(e.target.checked);
      update("compactMode",e.target.checked);
     }}
    />

   </div>

  </div>
 );

}

/* =========================================================
   RIGHT SIDEBAR
========================================================= */

function RightSidebar({
 user,
 data,
 onProfile
}){

 const trending={};

 (data.posts||[]).forEach(post=>{
  (post.hashtags||[]).forEach(tag=>{
   trending[tag]=(trending[tag]||0)+1;
  });
 });

 const suggestions=(data.users||[])
  .filter(u=>u.uid!==user.uid)
  .slice(0,6);

 return(
  <aside className="rightbar sticky">

   <div className="card">

    <b>Who to follow</b>

    {suggestions.map(person=>(
     <div
      className="person"
      key={person.uid}
     >

      <Avatar
       small
       name={person.displayName}
       onClick={()=>onProfile(person.uid)}
      />

      <div
       className="personinfo"
       onClick={()=>onProfile(person.uid)}
       style={{cursor:"pointer"}}
      >
       <b>{person.displayName}</b>
       <div className="muted">
        @{person.username}
       </div>
      </div>

      <FollowButton
       me={user}
       target={person}
       follows={data.follows||[]}
      />

     </div>
    ))}

   </div>

   <div
    className="card"
    style={{marginTop:10}}
   >

    <b>🔥 Trending</b>

    {Object.entries(trending)
     .sort((a,b)=>b[1]-a[1])
     .slice(0,10)
     .map(([tag,count])=>(
      <div
       key={tag}
       style={{
        padding:"9px 0",
        borderBottom:"1px solid #222"
       }}
      >
       <b className="tag">{tag}</b>
       <div className="muted">
        {count} posts
       </div>
      </div>
     ))
    }

   </div>

  </aside>
 );

}

/* =========================================================
   MAIN APP
========================================================= */

function App(){

 const{
  user,
  profile,
  setProfile,
  ready
 }=useAuth();

 const data=useData(user?.uid);

 const[page,setPage]=useState("home");
 const[selected,setSelected]=useState(null);

 /*
   Presence / last seen
 */

 useEffect(()=>{

  if(!user)return;

  const ref=col("presence").doc(user.uid);

  const update=()=>{

   ref.set({
    uid:user.uid,
    online:true,
    lastSeen:TS()
   },{merge:true});

  };

  update();

  const interval=setInterval(
   update,
   30000
  );

  const hide=()=>{

   ref.set({
    uid:user.uid,
    online:false,
    lastSeen:TS()
   },{merge:true});

  };

  window.addEventListener(
   "beforeunload",
   hide
  );

  return()=>{

   clearInterval(interval);

   window.removeEventListener(
    "beforeunload",
    hide
   );

  };

 },[user?.uid]);

 /*
   Keep profile fresh
 */

 useEffect(()=>{

  if(!user)return;

  const off=col("users")
   .doc(user.uid)
   .onSnapshot(s=>{

    if(s.exists){
     setProfile({
      uid:user.uid,
      ...s.data()
     });
    }

   });

  return off;

 },[user?.uid]);

 if(!ready||!profile){

  return(
   <div
    className="empty"
    style={{
     minHeight:"100vh",
     display:"grid",
     placeItems:"center"
    }}
   >
    Connecting to Nexus…
   </div>
  );

 }

 function openProfile(uid){

  const p=(data.users||[])
   .find(x=>x.uid===uid);

  if(p){

   setSelected(p);
   setPage("profile");

  }

 }

 const unread=(data.notifications||[])
  .filter(x=>x.uid===user.uid&&!x.read)
  .length;

 let content;

 if(page==="home"){

  content=(
   <Feed
    user={user}
    profile={profile}
    data={data}
    onProfile={openProfile}
   />
  );

 }else if(page==="explore"){

  content=(
   <Explore
    user={user}
    data={data}
    onProfile={openProfile}
   />
  );

 }else if(page==="profile"){

  content=(
   <Profile
    user={user}
    profile={selected||profile}
    data={data}
    onProfile={openProfile}
   />
  );

 }else if(page==="notifications"){

  content=(
   <Notifications
    user={user}
    data={data}
   />
  );

 }else if(page==="messages"){

  content=(
   <Messages
    user={user}
    profile={profile}
    data={data}
   />
  );

 }else{

  content=(
   <Settings
    user={user}
    data={data}
   />
  );

 }

 const nav=[
  ["home","🏠","Home"],
  ["explore","🔎","Explore"],
  ["notifications","🔔","Notifications"],
  ["messages","💬","Messages"],
  ["profile","👤","Profile"],
  ["settings","⚙️","Settings"]
 ];

 function navigate(id){

  if(id==="profile"){
   openProfile(user.uid);
  }else{
   setPage(id);
  }

 }

 return(
  <div className="app">

   <header className="topbar">

    <div className="brand">

     <div className="logo">
      N
     </div>

     Nexus

    </div>

    <button
     className="secondary"
     onClick={()=>openProfile(user.uid)}
    >
     {initials(profile.displayName)}
    </button>

   </header>

   <div className="layout">

    <aside className="leftbar sticky">

     <div className="card nav">

      {nav.map(([id,icon,label])=>(
       <button
        key={id}
        className={page===id?"active":""}
        onClick={()=>navigate(id)}
       >

        {icon} {label}

        {id==="notifications"&&unread>0&&(
         <span>
          {" "}({unread})
         </span>
        )}

       </button>
      ))}

     </div>

    </aside>

    <main>
     {content}
    </main>

    <RightSidebar
     user={user}
     data={data}
     onProfile={openProfile}
    />

   </div>

   <nav className="mobilebar">

    {[
     ["home","🏠"],
     ["explore","🔎"],
     ["notifications","🔔"],
     ["messages","💬"],
     ["profile","👤"]
    ].map(([id,icon])=>(
     <button
      key={id}
      className={page===id?"active":""}
      onClick={()=>navigate(id)}
     >
      {icon}
      <br/>
      {id}
     </button>
    ))}

   </nav>

  </div>
 );

}

ReactDOM
 .createRoot(document.getElementById("root"))
 .render(<App/>);

</script>
</body>
</html>
