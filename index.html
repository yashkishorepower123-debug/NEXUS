<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nexus — Social Platform</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>

  <style>
    *{
      box-sizing:border-box
    }

    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#f5f7fb;
      color:#172033
    }

    button,input,textarea{
      font:inherit
    }

    button{
      cursor:pointer;
      border:0
    }

    .app{
      min-height:100vh
    }

    .top{
      position:sticky;
      top:0;
      z-index:20;
      background:#fff;
      border-bottom:1px solid #e7eaf0;
      padding:12px 18px;
      display:flex;
      align-items:center;
      gap:16px
    }

    .brand{
      font-weight:900;
      font-size:22px;
      color:#5b5ce2
    }

    .search{
      flex:1;
      max-width:620px;
      margin:auto
    }

    .search input{
      width:100%;
      padding:11px 14px;
      border:1px solid #dfe3eb;
      border-radius:12px;
      outline:none
    }

    .layout{
      max-width:1200px;
      margin:0 auto;
      display:grid;
      grid-template-columns:210px minmax(0,1fr) 280px;
      gap:20px;
      padding:20px
    }

    .card{
      background:#fff;
      border:1px solid #e7eaf0;
      border-radius:16px;
      box-shadow:0 4px 18px rgba(30,40,70,.04)
    }

    .side{
      position:sticky;
      top:82px;
      height:max-content
    }

    .nav button{
      width:100%;
      background:none;
      text-align:left;
      padding:12px 15px;
      border-radius:10px;
      color:#4d5668
    }

    .nav button.active,
    .nav button:hover{
      background:#eef0ff;
      color:#4d50d6;
      font-weight:700
    }

    .profile-mini{
      padding:16px;
      display:flex;
      align-items:center;
      gap:10px;
      border-bottom:1px solid #eee
    }

    .avatar{
      width:44px;
      height:44px;
      border-radius:50%;
      object-fit:cover;
      background:#ddd
    }

    .avatar.sm{
      width:36px;
      height:36px
    }

    .avatar.xs{
      width:30px;
      height:30px
    }

    .muted{
      color:#788294;
      font-size:13px
    }

    .main{
      min-width:0
    }

    .composer{
      padding:16px;
      margin-bottom:14px
    }

    .row{
      display:flex;
      align-items:center;
      gap:10px
    }

    .composer textarea{
      width:100%;
      border:1px solid #e1e5ed;
      border-radius:12px;
      padding:12px;
      resize:vertical;
      min-height:72px;
      outline:none
    }

    .actions{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:10px
    }

    .primary{
      background:#5b5ce2;
      color:#fff;
      padding:10px 15px;
      border-radius:10px;
      font-weight:700
    }

    .secondary{
      background:#eef0f5;
      color:#343b4b;
      padding:9px 13px;
      border-radius:10px
    }

    .danger{
      color:#d34a4a;
      background:#fff0f0;
      padding:8px 10px;
      border-radius:9px
    }

    .post{
      padding:16px;
      margin-bottom:14px
    }

    .post-head{
      display:flex;
      gap:10px;
      align-items:center
    }

    .post-menu{
      margin-left:auto
    }

    .post-body{
      white-space:pre-wrap;
      line-height:1.55;
      margin:13px 0
    }

    .tags{
      color:#5358d9
    }

    .post-actions{
      display:flex;
      gap:7px;
      border-top:1px solid #edf0f4;
      padding-top:10px
    }

    .post-actions button{
      background:none;
      color:#626b7b;
      padding:7px 9px;
      border-radius:8px
    }

    .post-actions button:hover{
      background:#f3f4f7
    }

    .liked{
      color:#d64b69!important
    }

    .comment{
      display:flex;
      gap:8px;
      margin-top:10px
    }

    .comment-body{
      background:#f3f5f8;
      border-radius:11px;
      padding:8px 10px;
      flex:1
    }

    .comment-form{
      display:flex;
      gap:8px;
      margin-top:10px
    }

    .comment-form input{
      flex:1;
      border:1px solid #e0e4eb;
      border-radius:10px;
      padding:9px
    }

    .right-card{
      padding:15px;
      margin-bottom:14px
    }

    .trend{
      padding:9px 0;
      border-bottom:1px solid #edf0f4
    }

    .trend:last-child{
      border-bottom:0
    }

    .person{
      display:flex;
      gap:9px;
      align-items:center;
      padding:9px 0
    }

    .person .grow{
      flex:1
    }

    .follow{
      background:#eef0ff;
      color:#5154d7;
      padding:7px 10px;
      border-radius:8px;
      font-weight:700
    }

    .following{
      background:#e9f7ef;
      color:#20814c
    }

    .page-title{
      margin:0 0 14px
    }

    .profile-cover{
      padding:20px
    }

    .profile-top{
      display:flex;
      gap:14px;
      align-items:center
    }

    .profile-big{
      width:82px;
      height:82px
    }

    .profile-edit{
      margin-left:auto
    }

    /* WhatsApp-style messaging */

    .messages{
      height:620px;
      display:grid;
      grid-template-columns:280px 1fr;
      overflow:hidden
    }

    .users{
      border-right:1px solid #e8ebf0;
      overflow:auto;
      background:#fff
    }

    .messages-title{
      padding:16px;
      font-size:20px;
      font-weight:800;
      border-bottom:1px solid #e8ebf0
    }

    .user-item{
      padding:12px 14px;
      display:flex;
      gap:10px;
      align-items:center;
      cursor:pointer;
      border-bottom:1px solid #f0f1f4
    }

    .user-item.active,
    .user-item:hover{
      background:#f1f3ff
    }

    .user-item-info{
      flex:1;
      min-width:0
    }

    .user-item-name{
      font-weight:700;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis
    }

    .chat-preview{
      color:#788294;
      font-size:13px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      margin-top:3px
    }

    .chat-time{
      font-size:11px;
      color:#929aaa;
      align-self:flex-start;
      white-space:nowrap
    }

    .chat{
      display:flex;
      flex-direction:column;
      min-width:0;
      background:#f8f9fc
    }

    .chat-head{
      padding:12px 16px;
      border-bottom:1px solid #e8ebf0;
      background:#fff;
      display:flex;
      align-items:center;
      gap:10px
    }

    .chat-head-info{
      flex:1
    }

    .chat-list{
      flex:1;
      overflow:auto;
      padding:16px;
      display:flex;
      flex-direction:column
    }

    .bubble{
      max-width:72%;
      padding:9px 12px;
      border-radius:13px;
      margin:4px 0;
      word-wrap:break-word;
      white-space:pre-wrap
    }

    .mine{
      background:#5b5ce2;
      color:#fff;
      margin-left:auto;
      border-bottom-right-radius:4px
    }

    .theirs{
      background:#eef1f5;
      color:#172033;
      margin-right:auto;
      border-bottom-left-radius:4px
    }

    .bubble-time{
      font-size:10px;
      opacity:.7;
      margin-top:4px;
      text-align:right
    }

    .chat-form{
      display:flex;
      gap:8px;
      padding:12px;
      border-top:1px solid #e8ebf0;
      background:#fff
    }

    .chat-form input{
      flex:1;
      border:1px solid #dde2ea;
      border-radius:20px;
      padding:10px 14px;
      outline:none
    }

    .back-chat{
      display:none
    }

    .notice{
      padding:12px;
      border-bottom:1px solid #edf0f4;
      cursor:pointer
    }

    .notice.unread{
      background:#f3f4ff
    }

    .modal-bg{
      position:fixed;
      inset:0;
      background:rgba(15,20,35,.45);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:50;
      padding:18px
    }

    .modal{
      background:#fff;
      width:min(520px,100%);
      border-radius:16px;
      padding:18px
    }

    .modal textarea{
      width:100%;
      min-height:150px;
      border:1px solid #dde2ea;
      border-radius:10px;
      padding:10px
    }

    .modal-actions{
      display:flex;
      justify-content:flex-end;
      gap:8px;
      margin-top:12px
    }

    .empty{
      padding:35px;
      text-align:center;
      color:#7a8495
    }

    .loading{
      padding:50px;
      text-align:center
    }

    .auth{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:20px
    }

    .auth .card{
      width:min(460px,100%);
      padding:28px;
      text-align:center
    }

    @media(max-width:980px){
      .layout{
        grid-template-columns:180px minmax(0,1fr)
      }

      .right{
        display:none
      }
    }

    @media(max-width:700px){
      .layout{
        display:block;
        padding:10px
      }

      .side{
        position:static;
        margin-bottom:10px
      }

      .nav{
        display:flex;
        overflow:auto
      }

      .nav button{
        white-space:nowrap;
        width:auto
      }

      .messages{
        height:70vh;
        display:block
      }

      .users{
        display:block;
        height:100%
      }

      .messages.mobile-chat-open .users{
        display:none
      }

      .messages.mobile-chat-open .chat{
        display:flex
      }

      .messages:not(.mobile-chat-open) .chat{
        display:none
      }

      .back-chat{
        display:block
      }

      .top{
        padding:10px
      }

      .brand{
        font-size:19px
      }

      .search{
        max-width:none
      }

      .bubble{
        max-width:82%
      }
    }
  </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

const {useEffect,useMemo,useState}=React;


/* =========================
   FIREBASE
========================= */

const appId =
  typeof __app_id !== "undefined"
    ? __app_id
    : "nexus-social";

const firebaseConfig =
  typeof __firebase_config !== "undefined"
    ? JSON.parse(__firebase_config)
    : null;

const firebaseReady =
  !!(
    firebaseConfig &&
    firebaseConfig.apiKey &&
    firebaseConfig.projectId &&
    firebaseConfig.appId
  );

if(firebaseReady){
  firebase.initializeApp(firebaseConfig);
}

const auth =
  firebaseReady
    ? firebase.auth()
    : null;

const db =
  firebaseReady
    ? firebase.firestore()
    : null;

const rootPath = name =>
  db
    .collection("artifacts")
    .doc(appId)
    .collection("public")
    .doc("data")
    .collection(name);

const now = () =>
  firebase.firestore.FieldValue.serverTimestamp();

const makeId = () =>
  db.collection("_").doc().id;

const avatarFor = seed =>
  `https://api.dicebear.com/9.x/initials/svg?seed=${encodeURIComponent(
    seed || "User"
  )}`;


/* =========================
   REALTIME DATA
========================= */

function useRealtimeData(uid){

  const [data,setData] = useState({
    users:[],
    posts:[],
    comments:[],
    likes:[],
    follows:[],
    notifications:[],
    messages:[]
  });

  const [ready,setReady] = useState(false);

  useEffect(()=>{

    if(!uid) return;

    const unsubs=[];

    const collections=[
      "users",
      "posts",
      "comments",
      "likes",
      "follows",
      "notifications",
      "messages"
    ];

    collections.forEach(name=>{

      const q =
        name === "notifications"

          ? rootPath(name)
              .where("recipientId","==",uid)
              .limit(100)

          : name === "messages"

          ? rootPath(name)
              .where("participants","array-contains",uid)
              .limit(300)

          : rootPath(name);

      unsubs.push(
        q.onSnapshot(
          s =>
            setData(d => ({
              ...d,
              [name]:
                s.docs.map(x => ({
                  id:x.id,
                  ...x.data()
                }))
            })),
          e =>
            console.error(name,e)
        )
      );

    });

    setReady(true);

    return () =>
      unsubs.forEach(u=>u());

  },[uid]);

  return {
    data,
    ready
  };
}


/* =========================
   AUTH
========================= */

function useAuth(){

  const [user,setUser] = useState(null);
  const [profile,setProfile] = useState(null);
  const [loading,setLoading] = useState(true);

  useEffect(()=>{

    let alive=true;

    const unsub =
      auth.onAuthStateChanged(async u=>{

        if(!alive) return;

        setUser(u);

        if(!u){

          setProfile(null);
          setLoading(false);
          return;

        }

        const ref =
          rootPath("users").doc(u.uid);

        const snap =
          await ref.get();

        if(!snap.exists){

          const handle =
            `user${u.uid.slice(0,7)}`;

          const p={
            uid:u.uid,
            handle,
            displayName:"New User",
            bio:"",
            avatar:avatarFor(handle),
            createdAt:now()
          };

          await ref.set(p);

          setProfile(p);

        }else{

          setProfile({
            id:snap.id,
            ...snap.data()
          });

        }

        setLoading(false);

      });

    (async()=>{

      try{

        if(
          typeof __initial_auth_token !== "undefined" &&
          __initial_auth_token
        ){

          await auth.signInWithCustomToken(
            __initial_auth_token
          );

        }else if(!auth.currentUser){

          await auth.signInAnonymously();

        }

      }catch(e){

        console.error(e);
        setLoading(false);

      }

    })();

    return ()=>{
      alive=false;
      unsub();
    };

  },[]);

  return {
    user,
    profile,
    loading
  };
}


/* =========================
   NOTIFICATIONS
========================= */

function notify(
  recipientId,
  type,
  actor,
  postId,
  extra={}
){

  if(
    !recipientId ||
    recipientId===actor.uid
  ) return;

  return rootPath("notifications").add({

    recipientId,
    type,
    actorId:actor.uid,
    postId:postId||null,
    read:false,
    createdAt:now(),

    ...extra

  });

}


/* =========================
   APP
========================= */

function App(){

  if(!firebaseReady)
    return <SetupScreen/>;

  const {
    user,
    profile,
    loading
  } = useAuth();

  if(loading)
    return (
      <div className="loading">
        Loading Nexus…
      </div>
    );

  if(!user || !profile)
    return <AuthScreen/>;

  return (
    <Nexus
      user={user}
      profile={profile}
    />
  );
}


/* =========================
   SETUP
========================= */

function SetupScreen(){

  return (

    <div className="auth">

      <div className="card">

        <div style={{fontSize:50}}>
          ⚡
        </div>

        <h1>Nexus</h1>

        <p>
          Firebase configuration is missing.
        </p>

        <p className="muted">

          This happens when the HTML file is
          opened directly in Chrome.

          Put your Firebase Web App config
          into the firebaseConfig section
          near the top of this file.

        </p>

        <div
          style={{
            textAlign:"left",
            background:"#f4f6fb",
            padding:14,
            borderRadius:10,
            fontSize:13
          }}
        >

          <b>Firebase setup:</b>

          <br/>

          1. Firebase Console →
          Project settings → Your apps → Web app

          <br/>

          2. Copy the config object

          <br/>

          3. Enable Authentication → Anonymous

          <br/>

          4. Create Cloud Firestore

          <br/>

          5. Paste the config into this file
          and reload.

        </div>

      </div>

    </div>

  );
}


/* =========================
   AUTH SCREEN
========================= */

function AuthScreen(){

  const login=async()=>{

    try{

      if(
        typeof __initial_auth_token !== "undefined" &&
        __initial_auth_token
      ){

        await auth.signInWithCustomToken(
          __initial_auth_token
        );

      }else{

        await auth.signInAnonymously();

      }

    }catch(e){

      alert(e.message);

    }

  };

  return (

    <div className="auth">

      <div className="card">

        <h1>Nexus</h1>

        <p className="muted">
          A realtime social platform.
        </p>

        <button
          className="primary"
          onClick={login}
        >
          Enter Nexus
        </button>

      </div>

    </div>

  );
}


/* =========================
   NEXUS
========================= */

function Nexus({
  user,
  profile
}){

  const {
    data,
    ready
  } = useRealtimeData(user.uid);

  const [view,setView] =
    useState("home");

  const [selectedUser,setSelectedUser] =
    useState(null);

  const [selectedPost,setSelectedPost] =
    useState(null);

  const [search,setSearch] =
    useState("");

  const unread =
    data.notifications.filter(
      n=>!n.read
    ).length;

  const trending =
    useMemo(()=>{

      const map={};

      data.posts.forEach(
        p=>
          (p.hashtags||[]).forEach(
            t=>
              map[t]=(map[t]||0)+1
          )
      );

      return Object.entries(map)
        .sort((a,b)=>b[1]-a[1])
        .slice(0,8);

    },[data.posts]);


  const navigate=(
    v,
    payload=null
  )=>{

    if(v==="profile"){

      setSelectedUser(
        payload || user.uid
      );

      setView("profile");

    }else if(v==="post"){

      setSelectedPost(payload);
      setView("post");

    }else{

      setView(v);
      setSelectedPost(null);

    }

  };


  if(!ready)
    return (
      <div className="loading">
        Connecting to Nexus…
      </div>
    );


  return (

    <div className="app">

      <header className="top">

        <div className="brand">
          Nexus
        </div>

        <div className="search">

          <input
            value={search}
            onChange={
              e=>setSearch(e.target.value)
            }
            placeholder="Search people, posts, #hashtags…"
          />

        </div>

        <button
          className="secondary"
          onClick={()=>auth.signOut()}
        >
          Sign out
        </button>

      </header>


      <div className="layout">


        {/* SIDEBAR */}

        <aside className="side card">

          <div className="profile-mini">

            <img
              className="avatar sm"
              src={
                profile.avatar ||
                avatarFor(profile.handle)
              }
            />

            <div>

              <b>
                {profile.displayName}
              </b>

              <div className="muted">
                @{profile.handle}
              </div>

            </div>

          </div>


          <nav className="nav">

            <button
              className={
                view==="home"
                  ?"active"
                  :""
              }
              onClick={()=>navigate("home")}
            >
              🏠 Home
            </button>


            <button
              className={
                view==="notifications"
                  ?"active"
                  :""
              }
              onClick={()=>
                navigate("notifications")
              }
            >
              🔔 Notifications{" "}
              {unread>0 && `(${unread})`}
            </button>


            <button
              className={
                view==="messages"
                  ?"active"
                  :""
              }
              onClick={()=>
                navigate("messages")
              }
            >
              💬 Messages
            </button>


            <button
              className={
                view==="profile"
                  ?"active"
                  :""
              }
              onClick={()=>
                navigate(
                  "profile",
                  user.uid
                )
              }
            >
              👤 Profile
            </button>

          </nav>

        </aside>


        {/* MAIN */}

        <main className="main">

          {view==="home" && (

            <FeedView
              user={user}
              profile={profile}
              data={data}
              search={search}
              trending={trending}
              navigate={navigate}
            />

          )}


          {view==="profile" && (

            <ProfileView
              user={user}
              profile={profile}
              data={data}
              profileId={
                selectedUser ||
                user.uid
              }
              navigate={navigate}
            />

          )}


          {view==="messages" && (

            <MessagingView
              user={user}
              profile={profile}
              data={data}
            />

          )}


          {view==="notifications" && (

            <NotificationsView
              user={user}
              data={data}
              navigate={navigate}
            />

          )}


          {view==="post" && (

            <PostView
              user={user}
              profile={profile}
              data={data}
              postId={selectedPost}
              navigate={navigate}
            />

          )}

        </main>


        {/* RIGHT SIDEBAR */}

        <aside className="right">

          <div className="card right-card">

            <b>Trending</b>

            {trending.length ? (

              <>

                {trending.map(
                  ([t,c])=>(
                    <div
                      className="trend"
                      key={t}
                    >

                      <span className="tags">
                        #{t}
                      </span>

                      <div className="muted">
                        {c} post
                        {c===1?"":"s"}
                      </div>

                    </div>
                  )
                )}

              </>

            ):(
              <div className="empty">
                No hashtags yet.
              </div>
            )}

          </div>


          <WhoToFollow
            user={user}
            data={data}
          />

        </aside>

      </div>

    </div>

  );

function WhoToFollow({

}){

  const follows =
    data.follows
      .filter(
        f=>f.followerId===user.uid
      )
      .map(
        f=>f.followingId
      );

  const people =
    data.users
      .filter(
        u=>
          u.uid!==user.uid &&
          !follows.includes(u.uid)
      )
      .slice(0,5);


  const toggle=async target=>{

    const id =
      `${user.uid}_${target.uid}`;

    const ref =
      rootPath("follows").doc(id);

    const snap =
      await ref.get();

    if(snap.exists){

      await ref.delete();

    }else{

      await ref.set({

        followerId:user.uid,
        followingId:target.uid,
        createdAt:now()

      });

      await notify(
        target.uid,
        "follow",
        user,
        null
      );

    }

  };


  return (

    <div className="card right-card">

      <b>Who to follow</b>

      )}

  );
}


/* =========================
   FEED
========================= */

function FeedView({
  user,
  profile,
  data,
  search,
  navigate
}){

  const [tab,setTab] =
    useState("all");

  const [draft,setDraft] =
    useState("");

  const [editing,setEditing] =
    useState(null);


  const following =
    new Set(
      data.follows
        .filter(
          f=>f.followerId===user.uid
        )
        .map(
          f=>f.followingId
        )
    );


  const posts =
    data.posts
      .slice()
      .sort(
        (a,b)=>
          (b.createdAt?.seconds||0) -
          (a.createdAt?.seconds||0)
      );


  const filtered =
    posts.filter(p=>{

      if(
        tab==="following" &&
        !following.has(p.authorId) &&
        p.authorId!==user.uid
      )
        return false;


      if(!search.trim())
        return true;


      const q =
        search.toLowerCase();


      return (
        (p.content||"")
          .toLowerCase()
          .includes(q)
        ||
        (p.hashtags||[])
          .some(
            t=>
              t.toLowerCase()
                .includes(
                  q.replace("#","")
                )
          )
      );

    });


  const create=async()=>{

    const text =
      draft.trim();

    if(!text)
      return;

    const hashtags =
      [
        ...new Set(
          (
            text.match(
              /#[\p{L}\p{N}_-]+/gu
            ) || []
          )
          .map(
            x=>x.slice(1).toLowerCase()
          )
        )
      ];


    await rootPath("posts").add({

      authorId:user.uid,
      content:text,
      hashtags,
      createdAt:now(),
      updatedAt:now()

    });


    setDraft("");

  };


  const update=async()=>{

    if(!editing)
      return;

    const text =
      editing.content.trim();

    const hashtags =
      [
        ...new Set(
          (
            text.match(
              /#[\p{L}\p{N}_-]+/gu
            ) || []
          )
          .map(
            x=>x.slice(1).toLowerCase()
          )
        )
      ];


    await rootPath("posts")
      .doc(editing.id)
      .update({

        content:text,
        hashtags,
        updatedAt:now()

      });


    setEditing(null);

  };


  return (

    <>

      <div className="card composer">

        <div className="row">

          <img
            className="avatar sm"
            src={
              profile.avatar ||
              avatarFor(profile.handle)
            }
          />

          <b>
            {profile.displayName}
          </b>

        </div>


        <textarea
          value={draft}
          onChange={
            e=>setDraft(e.target.value)
          }
          placeholder="What's happening? Use #hashtags"
        />


        <div className="actions">

          <span className="muted">
            Posts update in realtime.
          </span>

          <button
            className="primary"
            onClick={create}
          >
            Post
          </button>

        </div>

      </div>


      <div
        className="row"
        style={{marginBottom:12}}
      >

        <button
          className={
            tab==="all"
              ?"primary"
              :"secondary"
          }
          onClick={()=>
            setTab("all")
          }
        >
          All posts
        </button>


        <button
          className={
            tab==="following"
              ?"primary"
              :"secondary"
          }
          onClick={()=>
            setTab("following")
          }
        >
          Following
        </button>

      </div>


      {filtered.map(p=>(

        <PostCard
          key={p.id}
          post={p}
          user={user}
          profile={profile}
          data={data}
          navigate={navigate}
          onEdit={setEditing}
        />

      ))}


      {!filtered.length && (

        <div className="card empty">
          No posts found.
        </div>

      )}


      {editing && (

        <Modal
          title="Edit post"
          onClose={()=>
            setEditing(null)
          }
        >

          <textarea
            value={editing.content}
            onChange={
              e=>
                setEditing({
                  ...editing,
                  content:e.target.value
                })
            }
          />

          <div className="modal-actions">

            <button
              className="secondary"
              onClick={()=>
                setEditing(null)
              }
            >
              Cancel
            </button>

            <button
              className="primary"
              onClick={update}
            >
              Save
            </button>

          </div>

        </Modal>

      )}

    </>

  );
}


/* =========================
   POST CARD
========================= */

function PostCard({
  post,
  user,
  data,
  navigate,
  onEdit
}){

  const author =
    data.users.find(
      u=>u.uid===post.authorId
    ) ||
    {
      uid:post.authorId,
      displayName:"User",
      handle:"user",
      avatar:avatarFor(
        post.authorId
      )
    };


  const liked =
    data.likes.some(
      l=>
        l.postId===post.id &&
        l.userId===user.uid
    );


  const comments =
    data.comments
      .filter(
        c=>c.postId===post.id
      )
      .sort(
        (a,b)=>
          (a.createdAt?.seconds||0) -
          (b.createdAt?.seconds||0)
      );


  const [comment,setComment] =
    useState("");


  const toggleLike=async()=>{

    const id =
      `${post.id}_${user.uid}`;

    const ref =
      rootPath("likes").doc(id);

    const snap =
      await ref.get();


    if(snap.exists){

      await ref.delete();

    }else{

      await ref.set({

        postId:post.id,
        userId:user.uid,
        createdAt:now()

      });

      await notify(
        post.authorId,
        "like",
        user,
        post.id
      );

    }

  };


  const addComment=async()=>{

    const text =
      comment.trim();

    if(!text)
      return;


    await rootPath("comments").add({

      postId:post.id,
      authorId:user.uid,
      content:text,
      createdAt:now()

    });


    await notify(
      post.authorId,
      "comment",
      user,
      post.id
    );


    setComment("");

  };


  const remove=async()=>{

    if(
      !confirm(
        "Delete this post?"
      )
    )
      return;


    await rootPath("posts")
      .doc(post.id)
      .delete();


    const batch =
      db.batch();


    data.likes
      .filter(
        x=>x.postId===post.id
      )
      .forEach(
        x=>
          batch.delete(
            rootPath("likes")
              .doc(x.id)
          )
      );


    data.comments
      .filter(
        x=>x.postId===post.id
      )
      .forEach(
        x=>
          batch.delete(
            rootPath("comments")
              .doc(x.id)
          )
      );


    await batch.commit();

  };


  return (

    <article className="card post">

      <div className="post-head">

        <img
          className="avatar sm"
          src={
            author.avatar ||
            avatarFor(author.handle)
          }
        />


        <div>

          <b
            onClick={()=>
              navigate(
                "profile",
                author.uid
              )
            }
            style={{
              cursor:"pointer"
            }}
          >
            {author.displayName}
          </b>

          <div className="muted">
            @{author.handle}
          </div>

        </div>


        {post.authorId===user.uid && (

          <div className="post-menu">

            <button
              className="secondary"
              onClick={()=>
                onEdit(post)
              }
            >
              Edit
            </button>

            {" "}

            <button
              className="danger"
              onClick={remove}
            >
              Delete
            </button>

          </div>

        )}

      </div>


      <div className="post-body">
        {post.content}
      </div>


      {(post.hashtags||[]).length>0 && (

        <div className="tags">

          {post.hashtags.map(
            t=>(
              <span key={t}>
                #{t}{" "}
              </span>
            )
          )}

        </div>

      )}


      <div className="post-actions">

        <button
          className={
            liked
              ?"liked"
              :""
          }
          onClick={toggleLike}
        >
          ♥{" "}
          {
            data.likes.filter(
              l=>l.postId===post.id
            ).length
          }
        </button>


        <button
          onClick={()=>
            document
              .getElementById(
                `comment-${post.id}`
              )
              ?.focus()
          }
        >
          💬 {comments.length}
        </button>


        <button
          onClick={()=>
            navigate(
              "post",
              post.id
            )
          }
        >
          Open
        </button>

      </div>


      <div>

        {comments
          .slice(-3)
          .map(c=>{

            const u =
              data.users.find(
                x=>x.uid===c.authorId
              ) ||
              {
                displayName:"User",
                avatar:avatarFor(
                  c.authorId
                )
              };


            return (

              <div
                className="comment"
                key={c.id}
              >

                <img
                  className="avatar xs"
                  src={u.avatar}
                />

                <div className="comment-body">

                  <b>
                    {u.displayName}
                  </b>

                  {" "}

                  <span>
                    {c.content}
                  </span>

                </div>

              </div>

            );

          })}

      </div>


      <div className="comment-form">

        <input
          id={`comment-${post.id}`}
          value={comment}
          onChange={
            e=>setComment(e.target.value)
          }
          onKeyDown={
            e=>
              e.key==="Enter" &&
              addComment()
          }
          placeholder="Write a comment…"
        />

        <button
          className="primary"
          onClick={addComment}
        >
          Send
        </button>

      </div>

    </article>

  );
}

/* =====================================================
   WHATSAPP-STYLE MESSAGING
===================================================== */

function MessagingView({
  user,
  data
}){

  const people =
    data.users.filter(
      u=>u.uid!==user.uid
    );


  const [selected,setSelected] =
    useState(null);


  const [text,setText] =
    useState("");


  const [mobileOpen,setMobileOpen] =
    useState(false);


  /*
     Get the latest message between
     the current user and another user.
  */

  const getConversationMessages =
    partnerId => {

      if(!partnerId)
        return [];

      return data.messages
        .filter(
          m=>
            m.participants?.includes(
              user.uid
            ) &&
            m.participants?.includes(
              partnerId
            )
        )
        .sort(
          (a,b)=>
            (a.createdAt?.seconds||0) -
            (b.createdAt?.seconds||0)
        );

    };


  /*
     Create a WhatsApp-style
     conversation list.

     Every person gets their
     own conversation.
  */

  const conversations =
    people
      .map(person=>{

        const messages =
          getConversationMessages(
            person.uid
          );

        const last =
          messages.length
            ? messages[messages.length-1]
            : null;

        return {
          person,
          last
        };

      })
      .sort((a,b)=>{

        const aTime =
          a.last?.createdAt?.seconds || 0;

        const bTime =
          b.last?.createdAt?.seconds || 0;

        return bTime-aTime;

      });


  const partner =
    people.find(
      p=>p.uid===selected
    );


  const messages =
    getConversationMessages(
      selected
    );


  const formatTime =
    timestamp => {

      if(!timestamp?.seconds)
        return "";

      const date =
        new Date(
          timestamp.seconds*1000
        );

      return date.toLocaleTimeString(
        [],
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      );

    };


  const send=async()=>{

    const t =
      text.trim();

    if(
      !t ||
      !selected
    )
      return;


    await rootPath("messages").add({

      senderId:user.uid,

      receiverId:selected,

      participants:[
        user.uid,
        selected
      ],

      content:t,

      createdAt:now(),

      read:false

    });


    setText("");

  };


  const selectPerson =
    uid => {

      setSelected(uid);

      setMobileOpen(true);

    };


  return (

    <div
      className={
        "card messages " +
        (
          mobileOpen
            ?"mobile-chat-open"
            :""
        )
      }
    >


      {/* =========================
          CHAT LIST
      ========================= */}

      <div className="users">

        <div className="messages-title">
          Chats
        </div>


        {conversations.length ? (

          conversations.map(
            ({person,last})=>(

              <div
                className={
                  "user-item " +
                  (
                    person.uid===selected
                      ?"active"
                      :""
                  )
                }
                key={person.uid}
                onClick={()=>
                  selectPerson(
                    person.uid
                  )
                }
              >

                <img
                  className="avatar"
                  src={
                    person.avatar ||
                    avatarFor(
                      person.handle
                    )
                  }
                />


                <div className="user-item-info">

                  <div className="user-item-name">
                    {person.displayName}
                  </div>


                  <div className="chat-preview">

                    {last
                      ? (
                        last.senderId===user.uid
                          ?"You: "
                          :""
                      ) + last.content
                      : "No messages yet"
                    }

                  </div>

                </div>


                {last && (

                  <div className="chat-time">
                    {formatTime(
                      last.createdAt
                    )}
                  </div>

                )}

              </div>

            )
          )

        ):(
          <div className="empty">
            No other users yet.
          </div>
        )}

      </div>


      {/* =========================
          CHAT WINDOW
      ========================= */}

      <div className="chat">

        {partner ? (

          <>

            <div className="chat-head">

              <button
                className="secondary back-chat"
                onClick={()=>{
                  setMobileOpen(false);
                }}
              >
                ←
              </button>


              <img
                className="avatar sm"
                src={
                  partner.avatar ||
                  avatarFor(
                    partner.handle
                  )
                }
              />


              <div className="chat-head-info">

                <b>
                  {partner.displayName}
                </b>

                <div className="muted">
                  @{partner.handle}
                </div>

              </div>

            </div>


            <div className="chat-list">

              {messages.length ? (

                messages.map(m=>(

                  <div
                    key={m.id}
                    className={
                      "bubble " +
                      (
                        m.senderId===user.uid
                          ?"mine"
                          :"theirs"
                      )
                    }
                  >

                    <div>
                      {m.content}
                    </div>


                    <div className="bubble-time">

                      {formatTime(
                        m.createdAt
                      )}

                    </div>

                  </div>

                ))

              ):(
                <div className="empty">
                  Start the conversation.
                </div>
              )}

            </div>


            <div className="chat-form">

              <input
                value={text}
                onChange={
                  e=>setText(e.target.value)
                }
                onKeyDown={
                  e=>
                    e.key==="Enter" &&
                    send()
                }
                placeholder="Type a message…"
              />


              <button
                className="primary"
                onClick={send}
              >
                Send
              </button>

            </div>

          </>

        ):(
          <div className="empty">
            Select a chat to start messaging.
          </div>
        )}

      </div>

    </div>

  );
}

  return (

    <>

      <h2 className="page-title">
        Notifications
      </h2>


      <div className="card">

        {notes.map(n=>{

          const a =
            data.users.find(
              u=>u.uid===n.actorId
            ) ||
            {
              displayName:"Someone",
              avatar:avatarFor(
                n.actorId
              )
            };


          return (

            <div
              className={
                "notice " +
                (
                  !n.read
                    ?"unread"
                    :""
                )
              }
              key={n.id}
              onClick={()=>
                mark(n)
              }
            >

              <div className="row">

                <img
                  className="avatar xs"
                  src={a.avatar}
                />

                <span>

                  <b>
                    {a.displayName}
                  </b>

                  {" "}

                  {text(n)}.

                </span>

              </div>

            </div>

          );

        })}


        {!notes.length && (

          <div className="empty">
            No notifications yet.
          </div>

        )}

      </div>

    </>

  );
}


/* =========================
   MODAL
========================= */

function Modal({
  title,
  onClose,
  children
}){

  return (

    <div
      className="modal-bg"
      onMouseDown={
        e=>
          e.target===e.currentTarget &&
          onClose()
      }
    >

      <div className="modal">

        <div className="row">

          <h3 style={{margin:0}}>
            {title}
          </h3>


          <button
            className="secondary"
            style={{
              marginLeft:"auto"
            }}
            onClick={onClose}
          >
            ✕
          </button>

        </div>


        <div style={{marginTop:14}}>
          {children}
        </div>

      </div>

    </div>

  );
}


/* =========================
   START APP
========================= */

ReactDOM
  .createRoot(
    document.getElementById("root")
  )
  .render(
    <App/>
  );

</script>

</body>
</html>
