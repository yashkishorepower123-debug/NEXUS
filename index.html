<style>
*{box-sizing:border-box}
html,body,#root{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#050505;color:#fff}
body{min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}

.logo{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#fff,#777);color:#000;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;margin:auto auto 16px}
.boot h1{margin:0;font-size:32px}
.boot p{color:#777;margin:7px 0}
.spin{width:25px;height:25px;border:3px solid #333;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin:20px auto 10px}

.app{min-height:100vh;background:radial-gradient(circle at 50% -10%,#1c1c1c,#080808 35%,#050505 70%)}
.top{height:62px;position:sticky;top:0;z-index:100;border-bottom:1px solid #222;background:rgba(5,5,5,.9);backdrop-filter:blur(15px);display:flex;align-items:center;justify-content:space-between;padding:0 18px}

main{min-width:0}

.post{padding:16px;margin-bottom:14px}

.chat{height:650px;display:grid;grid-template-columns:235px 1fr;overflow:hidden;background:#101010;border:1px solid #252525;border-radius:17px}

.chatinfo{min-width:0;flex:1}

.chatbar{height:60px;border-bottom:1px solid #252525;display:flex;align-items:center;gap:9px;padding:9px}
.chatmessages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.msgrow{display:flex}

.bubble{max-width:75%;padding:9px 11px;border-radius:13px;background:#202020;word-break:break-word}

.chatinput{display:flex;gap:7px;padding:9px;border-top:1px solid #252525}

.chatinput button{border:0;background:#fff;color:#000;border-radius:10px;padding:0 14px;font-weight:800}
.replyquote{font-size:11px;opacity:.65;border-left:2px solid #888;padding-left:7px;margin-bottom:5px}
.reactions{font-size:12px;margin-top:4px}
.reactionbar{display:flex;gap:4px;margin-top:5px}
.reactionbar button{border:1px solid #333;background:#161616;color:#fff;border-radius:8px;padding:3px 6px;font-size:12px}

.tabs{display:flex;gap:5px;overflow-x:auto;margin-bottom:15px}
.tabs button{border:1px solid #292929;background:#111;color:#888;border-radius:10px;padding:8px 12px;white-space:nowrap}
.tabs button.active{background:#fff;color:#000}

.storycomposer{display:flex;gap:7px;margin-bottom:15px}
.storycomposer input{flex:1}
.storybubble{background:#171717;border:1px solid #292929;border-radius:12px;padding:10px;margin:7px 0}
.storytime{font-size:10px;color:#666;margin-top:5px}

.settings-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #222}
.settings-row:last-child{border:0}

.modalbg{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:15px}
.modal{width:min(540px,100%);max-height:90vh;overflow:auto;background:#111;border:1px solid #303030;border-radius:18px;padding:19px}
.field{margin:11px 0}
.field label{display:block;color:#888;font-size:11px;margin-bottom:5px}
.field input,.field textarea,.field select{width:100%}
.field textarea{min-height:90px}
.modalactions{display:flex;justify-content:flex-end;gap:7px;margin-top:15px}

.empty{text-align:center;color:#666;padding:45px 15px}
.warn{background:#1b0d0d;border:1px solid #4a2222;color:#ffbaba;padding:11px;border-radius:11px;margin-bottom:13px;font-size:12px}
.online{color:#6fda83;font-size:11px}
.offline{color:#666;font-size:11px}

.mobile-nav{display:none}
@media(max-width:950px){
.layout{grid-template-columns:190px minmax(0,1fr)}
.right{display:none}
}
@media(max-width:700px){
.layout{display:block;padding:12px 9px 75px}
.left{display:none}
.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(5,5,5,.96);border-top:1px solid #222;justify-content:space-around;padding:5px}
.mobile-nav button{border:0;background:transparent;color:#888;padding:7px;font-size:11px}
.mobile-nav button.active{color:#fff}
.chat{height:calc(100vh - 130px);display:block}
.chatlist{height:100%;border:0}

<body>

<div id="boot">
  <div class="boot">
    <div class="logo">N</div>
    <h1>Nexus</h1>
    <p>Made by Yash</p>
    <div class="spin"></div>
    <p>Firebase connecting...</p>
  </div>
</div>

<div id="root"></div>

<script type="text/babel">

const {useState,useEffect,useMemo,useRef}=React;

/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig={
  apiKey:"AIzaSyDTrvD7c1TUtPUUOSX7_-0VV9itC28LOg0",
  authDomain:"nexus-37600.firebaseapp.com",
  projectId:"nexus-37600",
  storageBucket:"nexus-37600.firebasestorage.app",
  messagingSenderId:"61496309341",
  appId:"1:61496309341:web:fdb3711264df47f318bfb4",
  measurementId:"G-41S50YF5RF"
};

const APP_ID="nexus-37600";

if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.firestore();

function col(name){
  return db.collection("artifacts")
    .doc(APP_ID)
    .collection("public")
    .doc("data")
    .collection(name);
}

const ts=()=>firebase.firestore.FieldValue.serverTimestamp();

function ms(v){
  if(!v)return 0;
  if(typeof v.toMillis==="function")return v.toMillis();
  if(typeof v.seconds==="number")return v.seconds*1000;
  const n=new Date(v).getTime();
  return Number.isFinite(n)?n:0;
}

function ago(v){
  const t=ms(v);
  if(!t)return "now";
  const s=Math.floor((Date.now()-t)/1000);
  if(s<60)return s+"s";
  const m=Math.floor(s/60);
  if(m<60)return m+"m";
  const h=Math.floor(m/60);
  if(h<24)return h+"h";
  const d=Math.floor(h/24);
  if(d<30)return d+"d";
  return new Date(t).toLocaleDateString();
}

function initials(n){
  return (n||"N").trim().split(/\s+/).slice(0,2)
    .map(x=>x[0]).join("").toUpperCase()||"N";
}

function tags(text){
  return [...new Set((text.match(/#[a-zA-Z0-9_]+/g)||[]).map(x=>x.toLowerCase()))];
}

function mentions(text){
  return [...new Set((text.match(/@[a-zA-Z0-9_]+/g)||[]).map(x=>x.slice(1).toLowerCase()))];
}

function hideBoot(){
  const b=document.getElementById("boot");
  if(b)b.style.display="none";
}

async function notify(uid,actor,type,extra={}){
  if(!uid||uid===actor)return;
  await col("notifications").add({
    uid,
    actorId:actor,
    type,
    read:false,
    createdAt:ts(),
    ...extra
  });
}

/* =========================================================
   AUTH
========================================================= */

function useAuth(){

  const[user,setUser]=useState(null);
  const[profile,setProfile]=useState(null);
  const[loading,setLoading]=useState(true);
  const[error,setError]=useState(null);
  const[setup,setSetup]=useState(false);

  useEffect(()=>{

    let alive=true;

    const unsub=auth.onAuthStateChanged(async u=>{

      if(!alive)return;

      try{

        if(!u){
          await auth.signInAnonymously();
          return;
        }

        setUser(u);

        const ref=col("users").doc(u.uid);
        const snap=await ref.get();

        if(!snap.exists){

          const p={
            uid:u.uid,
            displayName:"Nexus User",
            username:"user_"+u.uid.slice(0,7),
            bio:"Welcome to Nexus 👋",
            followersCount:0,
            followingCount:0,
            postsCount:0,
            createdAt:ts(),
            lastSeen:ts(),
            online:true
          };

          await ref.set(p);

          if(alive){
            setProfile(p);
            setSetup(true);
          }

        }else{

          if(alive){
            setProfile({uid:u.uid,...snap.data()});
            setSetup(false);
          }

        }

        if(alive){
          setLoading(false);
          setError(null);
          hideBoot();
        }

      }catch(e){

        console.error(e);

        if(alive){
          setError(e);
          setLoading(false);
          hideBoot();
        }

      }

    });

    return()=>{
      alive=false;
      unsub();
    };

  },[]);

  return{
    user,profile,setProfile,
    loading,error,setup,setSetup
  };
}

/* =========================================================
   DATA
========================================================= */

const DATA=[
  "users","posts","comments","likes","follows",
  "bookmarks","reposts","notifications","messages",
  "stories","polls","pollVotes","blocks","mutes",
  "presence","settings","chats","messageReactions"
];

function useData(uid){

  const[data,setData]=useState({});
  const[error,setError]=useState(null);

  useEffect(()=>{

    if(!uid)return;

    const unsubs=[];

    DATA.forEach(name=>{

      let q=col(name);

      /*
       Keep queries simple so the app does not depend
       on a large set of composite Firestore indexes.
      */

      if(name==="notifications")
        q=q.where("uid","==",uid).limit(100);

      else if(name==="messages")
        q=q.where("members","array-contains",uid).limit(300);

      else if(name==="presence")
        q=q.limit(300);

      else
        q=q.limit(500);

      try{

        const unsub=q.onSnapshot(s=>{
          setData(d=>({
            ...d,
            [name]:s.docs.map(x=>({id:x.id,...x.data()}))
          }));
        },e=>{
          console.error(name,e);
          setError({
            collection:name,
            message:e.message
          });
        });

        unsubs.push(unsub);

      }catch(e){
        setError({
          collection:name,
          message:e.message
        });
      }

    });

    return()=>unsubs.forEach(x=>x());

  },[uid]);

  return{data,error};
}

/* =========================================================
   PROFILE SETUP
========================================================= */

function Setup({user,profile,done}){

  const[name,setName]=useState("");
  const[username,setUsername]=useState("");
  const[bio,setBio]=useState("Welcome to Nexus 👋");
  const[saving,setSaving]=useState(false);

  async function save(){

    if(!name.trim()||saving)return;

    setSaving(true);

    try{

      let u=username.trim().replace(/^@/,"")
        .replace(/\s+/g,"_")
        .replace(/[^a-zA-Z0-9_]/g,"")
        .toLowerCase();

      if(!u)u="user_"+user.uid.slice(0,7);

      const p={
        ...profile,
        displayName:name.trim(),
        username:u.slice(0,30),
        bio:bio.trim()
      };

      await col("users").doc(user.uid).update({
        displayName:p.displayName,
        username:p.username,
        bio:p.bio
      });

      done(p);

    }catch(e){
      alert(e.message);
    }finally{
      setSaving(false);
    }
  }

  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div className="card" style={{width:480,padding:25}}>
        <div className="brand"><div className="logo">N</div>Nexus</div>
        <h1>Welcome to Nexus 👋</h1>
        <p style={{color:"#777"}}>Set up your text-based profile.</p>

        <div className="field">
          <label>Display name</label>
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="Your name"/>
        </div>

        <div className="field">
          <label>Username</label>
          <input value={username} onChange={e=>setUsername(e.target.value)} placeholder="@username"/>
        </div>

        <div className="field">
          <label>Bio</label>
          <textarea value={bio} onChange={e=>setBio(e.target.value)}/>
        </div>

        <button className="primary" style={{width:"100%"}} disabled={!name.trim()||saving} onClick={save}>
          {saving?"Creating...":"Enter Nexus"}
        </button>
      </div>
    </div>
  );
}

/* =========================================================
   USER / FOLLOW HELPERS
========================================================= */

function FollowButton({me,target,follows}){

  const existing=follows.find(x=>
    x.followerId===me.uid&&x.followingId===target.uid
  );

  async function toggle(){

    try{

      if(existing){

        await col("follows").doc(existing.id).delete();

      }else{

        await col("follows").add({
          followerId:me.uid,
          followingId:target.uid,
          createdAt:ts()
        });

        await notify(
          target.uid,
          me.uid,
          "follow",
          {text:"followed you"}
        );
      }

    }catch(e){
      alert(e.message);
    }
  }

  return(
    <button className="follow" onClick={toggle}>
      {existing?"Following":"Follow"}
    </button>
  );
}

/* =========================================================
   STORIES
========================================================= */

function Stories({user,profile,data}){

  const[text,setText]=useState("");

  const stories=useMemo(()=>{

    const cutoff=Date.now()-86400000;

    return data.stories
      .filter(x=>ms(x.createdAt)>cutoff)
      .sort((a,b)=>ms(b.createdAt)-ms(a.createdAt));

  },[data.stories]);

  async function add(){

    if(!text.trim())return;

    try{

      await col("stories").add({
        uid:user.uid,
        authorName:profile.displayName,
        authorUsername:profile.username,
        text:text.trim(),
        createdAt:ts()
      });

      setText("");

    }catch(e){
      alert(e.message);
    }
  }

  const grouped=[];

  const seen=new Set();

  for(const s of stories){

    if(seen.has(s.uid))continue;

    seen.add(s.uid);
    grouped.push(s);

  }

  return(
    <>
      <div className="storycomposer">
        <input value={text} onChange={e=>setText(e.target.value)} placeholder="Share a text story..." maxLength={300}/>
        <button className="primary" onClick={add} disabled={!text.trim()}>Story</button>
      </div>

      {grouped.length>0&&(
        <div className="storyrow">
          {grouped.slice(0,12).map(s=>(
            <div className="story" key={s.id}>
              <div className="avatar sm">{initials(s.authorName)}</div>
              <div>{s.authorName}</div>
            </div>
          ))}
        </div>
      )}

      {stories.slice(0,20).map(s=>(
        <div className="storybubble" key={s.id}>
          <b>{s.authorName}</b>
          <div style={{color:"#ddd",marginTop:4}}>{s.text}</div>
          <div className="storytime">{ago(s.createdAt)} · expires after 24h</div>
        </div>
      ))}
    </>
  );
}

/* =========================================================
   POST COMPOSER
========================================================= */

function Composer({user,profile,onPosted}){

  const[text,setText]=useState("");
  const[type,setType]=useState("post");
  const[options,setOptions]=useState(["",""]);
  const[saving,setSaving]=useState(false);

  async function post(){

    const clean=text.trim();

    if(!clean||saving)return;

    setSaving(true);

    try{

      const ref=await col("posts").add({
        authorId:user.uid,
        authorName:profile.displayName,
        authorUsername:profile.username,
        content:clean,
        hashtags:tags(clean),
        mentions:mentions(clean),
        pinned:false,
        repostOf:null,
        createdAt:ts()
      });

      if(type==="poll"){

        const valid=options.map(x=>x.trim()).filter(Boolean);

        if(valid.length>=2){

          await col("polls").doc(ref.id).set({
            postId:ref.id,
            options:valid.map((x,i)=>({
              id:String(i),
              text:x,
              votes:0
            })),
            createdAt:ts()
          });

        }

      }

      const mentioned=mentions(clean);

      for(const username of mentioned){

        const target=await col("users")
          .where("username","==",username)
          .limit(1).get();

        if(!target.empty)
          await notify(
            target.docs[0].id,
            user.uid,
            "mention",
            {postId:ref.id,text:"mentioned you in a post"}
          );
      }

      setText("");
      setOptions(["",""]);
      setType("post");

      onPosted?.();

    }catch(e){
      alert("Could not create post:\n\n"+e.message);
    }finally{
      setSaving(false);
    }
  }

  return(
    <div className="composer">

      <textarea value={text} onChange={e=>setText(e.target.value)} placeholder="What's happening on Nexus?" maxLength={1000}/>

      <div className="row">
        <select value={type} onChange={e=>setType(e.target.value)}>
          <option value="post">Text post</option>
          <option value="poll">Poll</option>
        </select>

        <span style={{color:"#555",fontSize:11,marginRight:"auto"}}>
          {text.length}/1000
        </span>

        <button className="primary" disabled={!text.trim()||saving} onClick={post}>
          {saving?"Posting...":"Post"}
        </button>
      </div>

      {type==="poll"&&(
        <div className="poll">
          <b>Poll options</b>
          {options.map((x,i)=>(
            <input key={i} style={{width:"100%",marginTop:7}} value={x}
              onChange={e=>{
                const n=[...options];
                n[i]=e.target.value;
                setOptions(n);
              }}
              placeholder={"Option "+(i+1)}
            />
          ))}
          {options.length<4&&(
            <button className="secondary" style={{marginTop:7}} onClick={()=>setOptions([...options,""])}>
              + Add option
            </button>
          )}
        </div>
      )}
    </div>
  );
}

/* =========================================================
   POST
========================================================= */

function Post({post,user,profile,data,onProfile,refresh}){

  const[commentsOpen,setCommentsOpen]=useState(false);
  const[comment,setComment]=useState("");
  const[reply,setReply]=useState(null);
  const[editing,setEditing]=useState(false);
  const[editText,setEditText]=useState(post.content||"");

  const likes=data.likes.filter(x=>x.postId===post.id);
  const liked=likes.some(x=>x.uid===user.uid);

  const bookmarks=data.bookmarks.filter(x=>x.postId===post.id);
  const saved=bookmarks.some(x=>x.uid===user.uid);

  const reposts=data.reposts.filter(x=>x.postId===post.id);
  const reposted=reposts.some(x=>x.uid===user.uid);

  const comments=data.comments
    .filter(x=>x.postId===post.id)
    .sort((a,b)=>ms(a.createdAt)-ms(b.createdAt));

  const poll=data.polls.find(x=>x.postId===post.id);
  const votes=data.pollVotes.filter(x=>x.postId===post.id);
  const myVote=votes.find(x=>x.uid===user.uid);

  const pinned=!!post.pinned;

  async function like(){

    const old=likes.find(x=>x.uid===user.uid);

    if(old)
      await col("likes").doc(old.id).delete();
    else{
      await col("likes").add({
        uid:user.uid,
        postId:post.id,
        createdAt:ts()
      });

      await notify(post.authorId,user.uid,"like",{postId:post.id,text:"liked your post"});
    }
  }

  async function bookmark(){

    const old=bookmarks.find(x=>x.uid===user.uid);

    if(old)
      await col("bookmarks").doc(old.id).delete();
    else
      await col("bookmarks").add({
        uid:user.uid,
        postId:post.id,
        createdAt:ts()
      });
  }

  async function repost(){

    const old=reposts.find(x=>x.uid===user.uid);

    if(old){

      await col("reposts").doc(old.id).delete();

    }else{

      await col("reposts").add({
        uid:user.uid,
        postId:post.id,
        authorId:post.authorId,
        createdAt:ts()
      });

      await notify(post.authorId,user.uid,"repost",{postId:post.id,text:"reposted your post"});
    }
  }

  async function pin(){

    if(post.authorId!==user.uid)return;

    await col("posts").doc(post.id).update({
      pinned:!pinned,
      pinnedAt:pinned?null:ts()
    });

    refresh?.();
  }

  async function deletePost(){

    if(!confirm("Delete this post?"))return;

    await col("posts").doc(post.id).delete();

    const related=[
      ...likes,
      ...comments,
      ...bookmarks,
      ...reposts
    ];

    await Promise.all(related.map(x=>
      col(
        x.postId===post.id
          ? (
            x.uid!==undefined
              ? (
                likes.includes(x)?"likes":
                bookmarks.includes(x)?"bookmarks":
                reposts.includes(x)?"reposts":"comments"
              )
              :"comments"
          )
          :"comments"
      ).doc(x.id).delete().catch(()=>{})
    ));

    refresh?.();
  }

  async function saveEdit(){

    if(!editText.trim())return;

    await col("posts").doc(post.id).update({
      content:editText.trim(),
      hashtags:tags(editText),
      mentions:mentions(editText),
      editedAt:ts()
    });

    setEditing(false);
  }

  async function addComment(){

    if(!comment.trim())return;

    await col("comments").add({
      postId:post.id,
      userId:user.uid,
      userName:profile.displayName,
      text:comment.trim(),
      parentId:reply||null,
      createdAt:ts()
    });

    await notify(post.authorId,user.uid,"comment",{
      postId:post.id,
      text:"commented on your post"
    });

    setComment("");
    setReply(null);
  }

  async function vote(optionId){

    if(myVote)return;

    await col("pollVotes").add({
      postId:post.id,
      pollId:poll.id,
      uid:user.uid,
      optionId,
      createdAt:ts()
    });
  }

  const totalVotes=votes.length;

  return(
    <article className="post">

      <div className="posthead">

        <div className="avatar" onClick={()=>onProfile(post.authorId)} style={{cursor:"pointer"}}>
          {initials(post.authorName)}
        </div>

        <div onClick={()=>onProfile(post.authorId)} style={{cursor:"pointer",minWidth:0}}>
          <div className="author">{post.authorName||"User"} {post.pinned&&"📌"}</div>
          <div className="meta">
            @{post.authorUsername||"user"} · {ago(post.createdAt)}
            {post.editedAt&&" · edited"}
          </div>
        </div>

        {post.authorId===user.uid&&(
          <div className="row" style={{marginLeft:"auto"}}>
            <button className="action" onClick={()=>setEditing(!editing)}>✎</button>
            <button className="action" onClick={pin}>{pinned?"📌":"📍"}</button>
            <button className="action" onClick={deletePost}>🗑</button>
          </div>
        )}

      </div>

      {editing?(
        <div style={{marginTop:12}}>
          <textarea style={{width:"100%",minHeight:100}} value={editText} onChange={e=>setEditText(e.target.value)}/>
          <div className="row" style={{justifyContent:"flex-end",marginTop:7}}>
            <button className="secondary" onClick={()=>setEditing(false)}>Cancel</button>
            <button className="primary" onClick={saveEdit}>Save</button>
          </div>
        </div>
      ):(
        <>
          <div className="content">
            {(post.content||"").split(/(#[a-zA-Z0-9_]+|@[a-zA-Z0-9_]+)/g).map((x,i)=>
              x.startsWith("#")
                ?<span className="tag" key={i}>{x}</span>
                :x.startsWith("@")
                ?<span className="mention" key={i}>{x}</span>
                :x
            )}
          </div>

          {poll&&(
            <div className="poll">
              <b>Poll</b>
              <div style={{fontSize:11,color:"#666",margin:"4px 0"}}>
                {totalVotes} vote{totalVotes===1?"":"s"}
              </div>

              {poll.options.map(o=>{

                const count=votes.filter(v=>v.optionId===o.id).length;
                const percent=totalVotes?Math.round(count/totalVotes*100):0;

                return(
                  <button className="poll-option" key={o.id} onClick={()=>vote(o.id)} disabled={!!myVote}>
                    <div className="bar" style={{width:percent+"%"}}/>
                    <span>{o.text} — {percent}%</span>
                  </button>
                );

              })}
            </div>
          )}

          <div className="actions">

            <button className={"action "+(liked?"on":"")} onClick={like}>
              {liked?"♥":"♡"} {likes.length}
            </button>

            <button className="action" onClick={()=>setCommentsOpen(!commentsOpen)}>
              💬 {comments.length}
            </button>

            <button className={"action "+(reposted?"on":"")} onClick={repost}>
              🔁 {reposts.length}
            </button>

            <button className={"action "+(saved?"on":"")} onClick={bookmark}>
              🔖
            </button>

            <button className="action" onClick={()=>{
              navigator.clipboard?.writeText(post.content||"");
            }}>
              ↗
            </button>

          </div>

          {commentsOpen&&(
            <div className="comments">

              {comments.map(c=>{

                const children=comments.filter(x=>x.parentId===c.id);
                if(c.parentId)return null;

                return(
                  <React.Fragment key={c.id}>

                    <div className="comment">

                      <div className="avatar sm">{initials(c.userName)}</div>

                      <div className="commentbox">

                        <div className="commentname">{c.userName}</div>
                        <div className="commenttext">{c.text}</div>

                        <button className="action" style={{fontSize:11}} onClick={()=>setReply(c.id)}>
                          Reply
                        </button>

                      </div>

                    </div>

                    {children.map(r=>(
                      <div className="comment reply" key={r.id}>
                        <div className="avatar sm">{initials(r.userName)}</div>
                        <div className="commentbox">
                          <div className="commentname">{r.userName}</div>
                          <div className="commenttext">{r.text}</div>
                        </div>
                      </div>
                    ))}

                  </React.Fragment>
                );
              })}

              {reply&&(
                <div style={{fontSize:11,color:"#777",marginTop:7}}>
                  Replying to comment
                  <button className="action" onClick={()=>setReply(null)}>×</button>
                </div>
              )}

              <input
                className="commentinput"
                value={comment}
                onChange={e=>setComment(e.target.value)}
                onKeyDown={e=>{
                  if(e.key==="Enter"){
                    e.preventDefault();
                    addComment();
                  }
                }}
                placeholder={reply?"Write a reply...":"Write a comment..."}
              />

            </div>
          )}
        </>
      )}

    </article>
  );
}

/* =========================================================
   FEED
========================================================= */

function Feed({user,profile,data,onProfile,mode,setMode,refresh}){

  const[q,setQ]=useState("");

  const following=new Set(
    data.follows
      .filter(x=>x.followerId===user.uid)
      .map(x=>x.followingId)
  );

  const blocked=new Set(
    data.blocks
      .filter(x=>x.uid===user.uid)
      .map(x=>x.blockedId)
  );

  const muted=new Set(
    data.mutes
      .filter(x=>x.uid===user.uid)
      .map(x=>x.mutedId)
  );

  const saved=new Set(
    data.bookmarks
      .filter(x=>x.uid===user.uid)
      .map(x=>x.postId)
  );

  let posts=[...data.posts]
    .filter(p=>!blocked.has(p.authorId)&&!muted.has(p.authorId))
    .sort((a,b)=>ms(b.createdAt)-ms(a.createdAt));

  if(mode==="following")
    posts=posts.filter(p=>p.authorId===user.uid||following.has(p.authorId));

  if(mode==="saved")
    posts=posts.filter(p=>saved.has(p.id));

  if(q.trim()){

    const x=q.toLowerCase();

    posts=posts.filter(p=>
      (p.content||"").toLowerCase().includes(x)||
      (p.authorName||"").toLowerCase().includes(x)||
      (p.authorUsername||"").toLowerCase().includes(x)||
      (p.hashtags||[]).some(t=>t.includes(x))
    );
  }

  const pinned=posts.filter(x=>x.authorId===user.uid&&x.pinned);
  const rest=posts.filter(x=>!pinned.includes(x));

  return(
    <div>

      <div className="search">
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="🔎 Search users, posts, hashtags..."/>
      </div>

      <Stories user={user} profile={profile} data={data}/>

      <div className="tabs">
        {[
          ["foryou","For You"],
          ["following","Following"],
          ["saved","Saved"]
        ].map(([id,label])=>(
          <button key={id} className={mode===id?"active":""} onClick={()=>setMode(id)}>
            {label}
          </button>
        ))}
      </div>

      <Composer user={user} profile={profile} onPosted={refresh}/>

      {pinned.map(p=>(
        <Post key={p.id} post={p} user={user} profile={profile} data={data} onProfile={onProfile} refresh={refresh}/>
      ))}

      {rest.map(p=>(
        <Post key={p.id} post={p} user={user} profile={profile} data={data} onProfile={onProfile} refresh={refresh}/>
      ))}

      {!posts.length&&(
        <div className="empty">
          <div style={{fontSize:35}}>✨</div>
          No posts found.
        </div>
      )}

    </div>
  );
}

/* =========================================================
   PROFILE
========================================================= */

function Profile({profile,user,data,onProfile,refresh}){

  const[editing,setEditing]=useState(false);
  const[name,setName]=useState(profile.displayName||"");
  const[username,setUsername]=useState(profile.username||"");
  const[bio,setBio]=useState(profile.bio||"");

  const posts=data.posts
    .filter(x=>x.authorId===profile.uid)
    .sort((a,b)=>ms(b.createdAt)-ms(a.createdAt));

  const followers=data.follows.filter(x=>x.followingId===profile.uid).length;
  const following=data.follows.filter(x=>x.followerId===profile.uid).length;

  const blocked=data.blocks.some(x=>x.uid===user.uid&&x.blockedId===profile.uid);
  const muted=data.mutes.some(x=>x.uid===user.uid&&x.mutedId===profile.uid);

  async function save(){

    const u=username.trim().replace(/^@/,"")
      .replace(/\s+/g,"_")
      .replace(/[^a-zA-Z0-9_]/g,"")
      .toLowerCase();

    const updated={
      displayName:name.trim()||"Nexus User",
      username:u||"user_"+user.uid.slice(0,7),
      bio:bio.trim()
    };

    await col("users").doc(user.uid).update(updated);
    setEditing(false);
    refresh?.();
  }

  async function block(){

    const old=data.blocks.find(x=>x.uid===user.uid&&x.blockedId===profile.uid);

    if(old)
      await col("blocks").doc(old.id).delete();
    else
      await col("blocks").add({
        uid:user.uid,
        blockedId:profile.uid,
        createdAt:ts()
      });

    refresh?.();
  }

  async function mute(){

    const old=data.mutes.find(x=>x.uid===user.uid&&x.mutedId===profile.uid);

    if(old)
      await col("mutes").doc(old.id).delete();
    else
      await col("mutes").add({
        uid:user.uid,
        mutedId:profile.uid,
        createdAt:ts()
      });

    refresh?.();
  }

  return(
    <div>

      <div className="card profile">

        <div className="cover"/>

        <div className="profilemain">

          <div className="bigavatar">{initials(profile.displayName)}</div>

          <div className="profilename">{profile.displayName}</div>
          <div className="username">@{profile.username}</div>
          <div className="bio">{profile.bio||"No bio yet."}</div>

          <div className="stats">
            <div><strong>{followers}</strong><span>Followers</span></div>
            <div><strong>{following}</strong><span>Following</span></div>
            <div><strong>{posts.length}</strong><span>Posts</span></div>
          </div>

          <div className="row" style={{marginTop:15}}>

            {profile.uid===user.uid?(
              <button className="secondary" onClick={()=>setEditing(true)}>
                Edit profile
              </button>
            ):(
              <>
                <FollowButton me={user} target={profile} follows={data.follows}/>

                <button className="secondary" onClick={mute}>
                  {muted?"Unmute":"Mute"}
                </button>

                <button className="danger" onClick={block}>
                  {blocked?"Unblock":"Block"}
                </button>
              </>
            )}

          </div>

        </div>
      </div>

      {posts.map(p=>(
        <Post key={p.id} post={p} user={user} profile={profile} data={data} onProfile={onProfile} refresh={refresh}/>
      ))}

      {editing&&(
        <div className="modalbg">
          <div className="modal">
            <h2>Edit profile</h2>

            <div className="field">
              <label>Name</label>
              <input value={name} onChange={e=>setName(e.target.value)}/>
            </div>

            <div className="field">
              <label>Username</label>
              <input value={username} onChange={e=>setUsername(e.target.value)}/>
            </div>

            <div className="field">
              <label>Bio</label>
              <textarea value={bio} onChange={e=>setBio(e.target.value)}/>
            </div>

            <div className="modalactions">
              <button className="secondary" onClick={()=>setEditing(false)}>Cancel</button>
              <button className="primary" onClick={save}>Save</button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

   EXPLORE
========================================================= */

function Explore({data,onProfile}){

  const[q,setQ]=useState("");

  const users=data.users.filter(u=>{
    const x=q.toLowerCase();
    return !x||
      (u.displayName||"").toLowerCase().includes(x)||
      (u.username||"").toLowerCase().includes(x);
  }).slice(0,15);

  const posts=data.posts.filter(p=>{
    const x=q.toLowerCase();
    return !x||
      (p.content||"").toLowerCase().includes(x)||
      (p.authorUsername||"").toLowerCase().includes(x)||
      (p.hashtags||[]).some(t=>t.includes(x));
  }).sort((a,b)=>ms(b.createdAt)-ms(a.createdAt)).slice(0,30);

  const count={};

  data.posts.forEach(p=>
    (p.hashtags||[]).forEach(t=>count[t]=(count[t]||0)+1)
  );

  const trends=Object.entries(count).sort((a,b)=>b[1]-a[1]).slice(0,10);

  return(
    <div>

      <div className="search">
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search users, posts, hashtags..."/>
      </div>

      <div className="card" style={{marginBottom:15}}>
        <h3>🔥 Trending hashtags</h3>

        {trends.length?trends.map(([t,n])=>(
          <div key={t} style={{padding:"8px 0",borderBottom:"1px solid #222"}}>
            <span className="tag">{t}</span>
            <div style={{fontSize:11,color:"#666"}}>{n} post{n===1?"":"s"}</div>
          </div>
        )):<div style={{color:"#666"}}>No hashtags yet.</div>}

      </div>

      <div className="card" style={{marginBottom:15}}>
        <h3>People</h3>

        {users.map(u=>(
          <div className="person" key={u.uid}>
            <div className="avatar sm" onClick={()=>onProfile(u.uid)}>{initials(u.displayName)}</div>
            <div className="personinfo" onClick={()=>onProfile(u.uid)}>
              <div className="personname">{u.displayName}</div>
              <div className="personuser">@{u.username}</div>
            </div>
          </div>
        ))}

      </div>

      {posts.map(p=>(
        <Post
          key={p.id}
          post={p}
          user={{uid:""}}
          profile={{}}
          data={data}
          onProfile={onProfile}
          refresh={()=>{}}
        />
      ))}

    </div>
  );
}

    .filter(x=>x.uid===user.uid)

          <b>{n.actorName||"Someone"}</b>{" "}

          {n.type==="like"&&"liked your post ❤️"}
          {n.type==="comment"&&"commented on your post 💬"}
          {n.type==="follow"&&"followed you 👤"}

          </div>

        </div>

    </div>
  );
}

/* =========================================================
   MESSAGES / GROUPS
========================================================= */

function chatId(a,b){
  return [a,b].sort().join("_");
}

function Messages({user,profile,data}){

  const[active,setActive]=useState(null);
  const[search,setSearch]=useState("");
  const[text,setText]=useState("");
  const[reply,setReply]=useState(null);
  const[reaction,setReaction]=useState(null);
  const[groupModal,setGroupModal]=useState(false);
  const[groupName,setGroupName]=useState("");
  const[groupMembers,setGroupMembers]=useState([]);

  const chats=data.chats
    .filter(c=>c.members?.includes(user.uid))
    .sort((a,b)=>ms(b.updatedAt||b.createdAt)-ms(a.updatedAt||a.createdAt));

  const users=data.users.filter(u=>
    u.uid!==user.uid &&
    (
      !search||
      (u.displayName||"").toLowerCase().includes(search.toLowerCase())||
      (u.username||"").toLowerCase().includes(search.toLowerCase())
    )
  ).slice(0,10);

  const activeChat=chats.find(c=>c.id===active);

  const conversation=data.messages
    .filter(m=>m.conversationId===active)
    .sort((a,b)=>ms(a.createdAt)-ms(b.createdAt));

  async function openDM(u){

    const id=chatId(user.uid,u.uid);

    const ref=col("chats").doc(id);
    const snap=await ref.get();

    if(!snap.exists){

      await ref.set({
        type:"dm",
        name:u.displayName,
        members:[user.uid,u.uid],
        createdBy:user.uid,
        createdAt:ts(),
        updatedAt:ts()
      });

    }

    setActive(id);
    setSearch("");
  }

  async function createGroup(){

    const members=[user.uid,...groupMembers];

    if(!groupName.trim()||members.length<2)return;

    const ref=col("chats").doc();

    await ref.set({
      type:"group",
      name:groupName.trim(),
      members,
      createdBy:user.uid,
      createdAt:ts(),
      updatedAt:ts()
    });

    setGroupModal(false);
    setGroupName("");
    setGroupMembers([]);
    setActive(ref.id);
  }

  async function send(){

    if(!text.trim()||!activeChat)return;

    const id=activeChat.id;

    await col("messages").add({
      conversationId:id,
      members:activeChat.members,
      senderId:user.uid,
      senderName:profile.displayName,
      text:text.trim(),
      replyTo:reply||null,
      deleted:false,
      readBy:[user.uid],
      createdAt:ts()
    });

    await col("chats").doc(id).update({
      updatedAt:ts()
    });

    setText("");
    setReply(null);
  }

  async function deleteMessage(m){

    if(m.senderId!==user.uid)return;

    await col("messages").doc(m.id).update({
      deleted:true,
      text:"",
      deletedAt:ts()
    });
  }

  async function markRead(){

    if(!active)return;

    conversation
      .filter(m=>m.senderId!==user.uid&&!m.readBy?.includes(user.uid))
      .forEach(m=>
        col("messages").doc(m.id).update({
          readBy:firebase.firestore.FieldValue.arrayUnion(user.uid)
        }).catch(()=>{})
      );
  }

  useEffect(()=>{
    markRead();
  },[active,conversation.length]);

  async function toggleReaction(message,emoji){

    const old=data.messageReactions.find(x=>
      x.messageId===message.id&&x.uid===user.uid
    );

    if(old){

      if(old.emoji===emoji)
        await col("messageReactions").doc(old.id).delete();
      else
        await col("messageReactions").doc(old.id).update({emoji});

    }else{

      await col("messageReactions").add({
        messageId:message.id,
        uid:user.uid,
        emoji,
        createdAt:ts()
      });

    }

    setReaction(null);
  }

  function chatTitle(c){

    if(c.type==="group")return c.name;

    const id=c.members.find(x=>x!==user.uid);
    return data.users.find(x=>x.uid===id)?.displayName||"User";
  }

  return(
    <div className={"chat "+(active?"open":"")}>

      <div className="chatlist">

        <div className="chathead">
          <div className="spread">
            <h2>Messages</h2>
            <button className="secondary" onClick={()=>setGroupModal(true)}>＋ Group</button>
          </div>

          <input style={{width:"100%"}} value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search people..."/>
        </div>

        {search&&users.map(u=>(
          <button className="chatitem" key={u.uid} onClick={()=>openDM(u)}>
            <div className="avatar sm">{initials(u.displayName)}</div>
            <div className="chatinfo">
              <b>{u.displayName}</b>
              <div className="preview">@{u.username}</div>
            </div>
          </button>
        ))}

        {chats.map(c=>{

          const last=data.messages
            .filter(m=>m.conversationId===c.id)
            .sort((a,b)=>ms(b.createdAt)-ms(a.createdAt))[0];

          const unread=data.messages.filter(m=>
            m.conversationId===c.id&&
            m.senderId!==user.uid&&
            !m.readBy?.includes(user.uid)
          ).length;

          return(
            <button className={"chatitem "+(active===c.id?"sel":"")} key={c.id} onClick={()=>setActive(c.id)}>
              <div className="avatar sm">{c.type==="group"?"👥":initials(chatTitle(c))}</div>
              <div className="chatinfo">
                <b>{chatTitle(c)}</b>
                <div className="preview">{last?.deleted?"Message deleted":last?.text||"Start chatting"}</div>
              </div>
              {unread>0&&<b>{unread}</b>}
            </button>
          );
        })}

        {!chats.length&&!search&&(
          <div className="empty">Search for someone to start a chat.</div>
        )}

      </div>

      <div className="chatwindow">

        {!activeChat?(
          <div className="empty" style={{margin:"auto"}}>
            <div style={{fontSize:40}}>💬</div>
            Select a conversation.
          </div>
        ):(
          <>
            <div className="chatbar">

              <button className="secondary" onClick={()=>setActive(null)}>←</button>

              <div className="avatar sm">
                {activeChat.type==="group"?"👥":initials(chatTitle(activeChat))}
              </div>

              <div>
                <b>{chatTitle(activeChat)}</b>
                <div className="meta">
                  {activeChat.type==="group"
                    ?activeChat.members.length+" members"
                    :"Direct message"}
                </div>
              </div>

            </div>

            <div className="chatmessages">

              {conversation.map(m=>{

                const mine=m.senderId===user.uid;
                const reactions=data.messageReactions.filter(x=>x.messageId===m.id);

                const grouped={};
                reactions.forEach(r=>{
                  grouped[r.emoji]=(grouped[r.emoji]||0)+1;
                });

                const original=m.replyTo
                  ?conversation.find(x=>x.id===m.replyTo)
                  :null;

                return(
                  <div className={"msgrow "+(mine?"mine":"")} key={m.id}>

                    <div
                      className="bubble"
                      onContextMenu={e=>{
                        e.preventDefault();
                        setReaction(m.id);
                      }}
                    >

                      {!mine&&activeChat.type==="group"&&(
                        <div style={{fontSize:10,color:"#777",marginBottom:3}}>
                          {m.senderName}
                        </div>
                      )}

                      {original&&!original.deleted&&(
                        <div className="replyquote">
                          ↩ {original.text}
                        </div>
                      )}

                      <div style={{opacity:m.deleted?.6:1}}>
                        {m.deleted?"Message deleted":m.text}
                      </div>

                      <div className="msgmeta">
                        {ago(m.createdAt)}
                        {mine&&m.readBy?.some(x=>x!==user.uid)?" · read":""}
                      </div>

                      {Object.keys(grouped).length>0&&(
                        <div className="reactions">
                          {Object.entries(grouped).map(([e,n])=>(
                            <span key={e}>{e} {n} </span>
                          ))}
                        </div>
                      )}

                      {!m.deleted&&(
                        <div className="reactionbar">

                          {["❤️","😂","👍","😮","🔥"].map(e=>(
                            <button key={e} onClick={()=>toggleReaction(m,e)}>
                              {e}
                            </button>
                          ))}

                          <button onClick={()=>setReply(m.id)}>↩</button>

                          {mine&&(
                            <button onClick={()=>deleteMessage(m)}>🗑</button>
                          )}

                        </div>
                      )}

                    </div>
                  </div>
                );
              })}

            </div>

            {reply&&(
              <div style={{padding:"5px 10px",fontSize:11,color:"#777"}}>
                Replying to message
                <button className="action" onClick={()=>setReply(null)}>×</button>
              </div>
            )}

            <div className="chatinput">
              <input
                value={text}
                onChange={e=>setText(e.target.value)}
                onKeyDown={e=>{
                  if(e.key==="Enter"&&!e.shiftKey){
                    e.preventDefault();
                    send();
                  }
                }}
                placeholder="Write a message..."
                maxLength={2000}
              />
              <button disabled={!text.trim()} onClick={send}>Send</button>
            </div>

          </>
        )}

      </div>

      {groupModal&&(
        <div className="modalbg">
          <div className="modal">

            <h2>Create group</h2>

            <div className="field">
              <label>Group name</label>
              <input value={groupName} onChange={e=>setGroupName(e.target.value)} placeholder="My Nexus group"/>
            </div>

            <div className="field">
              <label>Select members</label>

              {data.users.filter(u=>u.uid!==user.uid).map(u=>{

                const checked=groupMembers.includes(u.uid);

                return(
                  <label key={u.uid} style={{display:"flex",gap:8,alignItems:"center",padding:7}}>
                    <input
                      type="checkbox"
                      checked={checked}
                      onChange={()=>{
                        setGroupMembers(x=>
                          checked
                            ?x.filter(id=>id!==u.uid)
                            :[...x,u.uid]
                        );
                      }}
                    />
                    {u.displayName} @{u.username}
                  </label>
                );
              })}

            </div>

            <div className="modalactions">
              <button className="secondary" onClick={()=>setGroupModal(false)}>Cancel</button>
              <button className="primary" disabled={!groupName.trim()||!groupMembers.length} onClick={createGroup}>
                Create group
              </button>
            </div>

          </div>
        </div>
      )}

    </div>
  );
}

/* =========================================================
   SETTINGS
========================================================= */

function Settings({user,data}){

  const settings=data.settings.find(x=>x.uid===user.uid)||{};

  const[notifications,setNotifications]=useState(settings.notifications!==false);
  const[compact,setCompact]=useState(!!settings.compact);

  async function save(field,value){

    await col("settings").doc(user.uid).set({
      uid:user.uid,
      notifications,
      compact,
      [field]:value,
      updatedAt:ts()
    },{merge:true});

  }

  return(
    <div className="card">

      <h2>⚙️ Settings</h2>

      <div className="settings-row">
        <div>
          <b>Notifications</b>
          <div className="meta">Receive Nexus notifications</div>
        </div>
        <input
          type="checkbox"
          checked={notifications}
          onChange={e=>{
            setNotifications(e.target.checked);
            save("notifications",e.target.checked);
          }}
        />
      </div>

      <div className="settings-row">
        <div>
          <b>Compact mode</b>
          <div className="meta">Use a denser interface</div>
        </div>
        <input
          type="checkbox"
          checked={compact}
          onChange={e=>{
            setCompact(e.target.checked);
            save("compact",e.target.checked);
          }}
        />
      </div>

      <div className="settings-row">
        <div>
          <b>Authentication</b>
          <div className="meta">Anonymous Firebase account</div>
        </div>
        <span className="online">Connected</span>
      </div>

      <div style={{marginTop:20,color:"#555",fontSize:11}}>
        Nexus • Made by Yash
      </div>

    </div>
  );
}

/* =========================================================
   RIGHT SIDEBAR
========================================================= */

function RightSidebar({user,profile,data,onProfile}){

  const candidates=data.users
    .filter(x=>x.uid!==user.uid)
    .slice(0,6);

  const trends={};

  data.posts.forEach(p=>
    (p.hashtags||[]).forEach(t=>trends[t]=(trends[t]||0)+1)
  );

  return(
    <div className="right side">

      <div className="card">

        <b>Who to follow</b>

        {candidates.map(p=>(
          <div className="person" key={p.uid}>

            <div className="avatar sm" onClick={()=>onProfile(p.uid)}>
              {initials(p.displayName)}
            </div>

            <div className="personinfo" onClick={()=>onProfile(p.uid)}>
              <div className="personname">{p.displayName}</div>
              <div className="personuser">@{p.username}</div>
            </div>

            <FollowButton me={user} target={p} follows={data.follows}/>

          </div>
        ))}

      </div>

      <div className="card" style={{marginTop:15}}>

        <b>Trending</b>

        {Object.entries(trends)
          .sort((a,b)=>b[1]-a[1])
          .slice(0,6)
          .map(([t,n])=>(
            <div key={t} style={{padding:"9px 0",borderBottom:"1px solid #222"}}>
              <div className="tag">{t}</div>
              <div className="meta">{n} posts</div>
            </div>
          ))
        }

      </div>

    </div>
  );
}

/* =========================================================
   REPORT MODAL
========================================================= */

function ReportModal({user,post,onClose}){

  const[reason,setReason]=useState("Spam");
  const[saving,setSaving]=useState(false);

  async function report(){

    setSaving(true);

    try{

      await col("reports").add({
        reporterId:user.uid,
        postId:post.id,
        targetUid:post.authorId,
        reason,
        status:"new",
        createdAt:ts()
      });

      alert("Report submitted.");
      onClose();

    }catch(e){
      alert(e.message);
    }finally{
      setSaving(false);
    }
  }

  return(
    <div className="modalbg">
      <div className="modal">

        <h2>🚩 Report post</h2>

        <div className="field">
          <label>Reason</label>
          <select value={reason} onChange={e=>setReason(e.target.value)}>
            <option>Spam</option>
            <option>Harassment</option>
            <option>Impersonation</option>
            <option>Inappropriate content</option>
            <option>Other</option>
          </select>
        </div>

        <div className="modalactions">
          <button className="secondary" onClick={onClose}>Cancel</button>
          <button className="danger" disabled={saving} onClick={report}>
            {saving?"Sending...":"Report"}
          </button>
        </div>

      </div>
    </div>
  );
}

/* =========================================================
   MAIN APP
========================================================= */

function Nexus(){

  const{
    user,profile,setProfile,
    loading,error,setup,setSetup
  }=useAuth();

  const{data,error:dataError}=useData(user?.uid);

  const[page,setPage]=useState("home");
  const[mode,setMode]=useState("foryou");
  const[selected,setSelected]=useState(null);
  const[report,setReport]=useState(null);
  const[refresh,setRefresh]=useState(0);

  function reload(){
    setRefresh(x=>x+1);
  }

  function openProfile(uid){

    const p=data.users.find(x=>x.uid===uid);

    if(p){
      setSelected(p);
      setPage("profile");
    }

  }

  useEffect(()=>{

    if(!user)return;

    const ref=col("presence").doc(user.uid);

    const update=()=>ref.set({
      uid:user.uid,
      online:true,
      lastSeen:ts()
    },{merge:true});

    update();

    const timer=setInterval(update,30000);

    const off=()=>{
      ref.set({
        uid:user.uid,
        online:false,
        lastSeen:ts()
      },{merge:true});
    };

    window.addEventListener("beforeunload",off);

    return()=>{
      clearInterval(timer);
      window.removeEventListener("beforeunload",off);
    };

  },[user?.uid]);

  if(loading)return null;

  if(error){
    return(
      <div className="empty" style={{minHeight:"100vh"}}>
        <h1>Firebase Error</h1>
        <p>{error.message}</p>
        <button className="primary" onClick={()=>location.reload()}>Retry</button>
      </div>
    );
  }

  if(!user||!profile){
    return null;
  }

  if(setup){
    return(
      <Setup
        user={user}
        profile={profile}
        done={p=>{
          setProfile(p);
          setSetup(false);
        }}
      />
    );
  }

  let content;

  if(page==="home"){
    content=(
      <Feed
        key={refresh}
        user={user}
        profile={profile}
        data={data}
        onProfile={openProfile}
        mode={mode}
        setMode={setMode}
        refresh={reload}
      />
    );
  }

  if(page==="explore"){
    content=<Explore data={data} onProfile={openProfile}/>;
  }

  if(page==="profile"){
    content=(
      <Profile
        key={selected?.uid||profile.uid}
        profile={selected||profile}
        user={user}
        data={data}
        onProfile={openProfile}
        refresh={reload}
      />
    );
  }

  if(page==="notifications"){
    content=<Notifications user={user} data={data}/>;
  }

  if(page==="messages"){
    content=<Messages user={user} profile={profile} data={data}/>;
  }

  if(page==="settings"){
    content=<Settings user={user} data={data}/>;
  }

  const unread=data.notifications
    .filter(x=>x.uid===user.uid&&!x.read).length;

  return(
    <div className="app">

      <header className="top">

        <div className="brand">
          <div className="logo">N</div>
          Nexus
        </div>

        <button className="secondary" onClick={()=>openProfile(user.uid)}>
          {initials(profile.displayName)}
        </button>

      </header>

      <div className="layout">

        <aside className="left side">

          <div className="card nav">

            <button className={page==="home"?"active":""} onClick={()=>setPage("home")}>
              🏠 Home
            </button>

            <button className={page==="explore"?"active":""} onClick={()=>setPage("explore")}>
              🔎 Explore
            </button>

            <button className={page==="profile"?"active":""} onClick={()=>openProfile(user.uid)}>
              👤 Profile
            </button>

            <button className={page==="notifications"?"active":""} onClick={()=>setPage("notifications")}>
              🔔 Notifications {unread>0&&`(${unread})`}
            </button>

            <button className={page==="messages"?"active":""} onClick={()=>setPage("messages")}>
              💬 Messages
            </button>

            <button className={page==="settings"?"active":""} onClick={()=>setPage("settings")}>
              ⚙️ Settings
            </button>

          </div>

        </aside>

        <main>

          {dataError&&(
            <div className="warn">
              Firestore warning: {dataError.collection} — {dataError.message}
            </div>
          )}

          {content}

        </main>

        <RightSidebar
          user={user}
          profile={profile}
          data={data}
          onProfile={openProfile}
        />

      </div>

      <nav className="mobile-nav">

        <button className={page==="home"?"active":""} onClick={()=>setPage("home")}>
          🏠<br/>Home
        </button>

        <button className={page==="explore"?"active":""} onClick={()=>setPage("explore")}>
          🔎<br/>Explore
        </button>

        <button className={page==="notifications"?"active":""} onClick={()=>setPage("notifications")}>
          🔔<br/>Alerts
        </button>

        <button className={page==="messages"?"active":""} onClick={()=>setPage("messages")}>
          💬<br/>Chat
        </button>

        <button className={page==="profile"?"active":""} onClick={()=>openProfile(user.uid)}>
          👤<br/>Me
        </button>

      </nav>

    </div>
  );
}

/* =========================================================
   START
========================================================= */

ReactDOM
  .createRoot(document.getElementById("root"))
  .render(<Nexus/>);

</script>
</body>
</html>
