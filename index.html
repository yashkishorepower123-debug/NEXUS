<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b0d10">
<title>Nexus — Social Platform</title>

<style>
*{box-sizing:border-box}
html,body,#root{margin:0;min-height:100%;width:100%}
body{
  background:#080a0d;
  color:#f2f4f7;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
a{text-decoration:none;color:inherit}

:root{
  --bg:#080a0d;
  --panel:#0f1217;
  --panel2:#151920;
  --panel3:#1b2028;
  --line:#252b34;
  --text:#f4f6f8;
  --muted:#8f98a5;
  --accent:#7c5cff;
  --accent2:#9a83ff;
  --danger:#ff5c70;
  --green:#35d07f;
  --yellow:#e7bd4d;
}

.app{min-height:100vh}
.layout{
  width:min(1380px,100%);
  margin:auto;
  display:grid;
  grid-template-columns:250px minmax(0,680px) 300px;
  gap:20px;
  padding:20px;
}
.left,.right{
  position:sticky;
  top:20px;
  height:max-content;
}
.main{min-width:0}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
  padding:5px 10px 25px;
}
.logo span{color:var(--accent)}

.nav{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.nav button{
  background:transparent;
  border:0;
  color:var(--muted);
  text-align:left;
  padding:13px 15px;
  border-radius:13px;
  font-weight:700;
  transition:.15s;
}
.nav button:hover,
.nav button.active{
  background:var(--panel2);
  color:#fff;
}
.nav button.active{color:var(--accent2)}

.card{
  background:rgba(15,18,23,.94);
  border:1px solid var(--line);
  border-radius:18px;
}
.pad{padding:18px}

.topbar{
  display:none;
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(8,10,13,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--line);
  padding:13px 16px;
  justify-content:space-between;
  align-items:center;
}

.feed-tabs{
  display:flex;
  gap:5px;
  padding:6px;
  margin-bottom:12px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
}
.feed-tabs button{
  flex:1;
  background:transparent;
  border:0;
  color:var(--muted);
  padding:9px;
  border-radius:10px;
  font-weight:800;
}
.feed-tabs button.active{
  background:var(--panel3);
  color:#fff;
}

.composer{
  padding:18px;
  margin-bottom:14px;
}
.composer-row{
  display:flex;
  gap:12px;
}
.avatar{
  width:43px;
  height:43px;
  min-width:43px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#7657ff,#bb9cff);
  color:#fff;
  font-weight:900;
  border:1px solid #ffffff18;
}
.avatar.small{
  width:35px;
  height:35px;
  min-width:35px;
  font-size:12px;
}
.avatar.large{
  width:88px;
  height:88px;
  min-width:88px;
  font-size:27px;
}

textarea,input,select{
  width:100%;
  background:#0a0d11;
  border:1px solid var(--line);
  color:var(--text);
  outline:none;
  border-radius:12px;
  padding:11px 12px;
}
textarea{
  min-height:100px;
  resize:vertical;
}
input:focus,textarea:focus,select:focus{
  border-color:#6650ca;
}

.composer-tools{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}
.btn{
  border:1px solid var(--line);
  background:var(--panel2);
  color:#fff;
  padding:8px 12px;
  border-radius:10px;
  font-weight:700;
}
.btn:hover{background:var(--panel3)}
.btn.primary{
  background:var(--accent);
  border-color:var(--accent);
}
.btn.danger{
  color:#ff7d8d;
}
.btn.green{color:#58e597}

.post{
  padding:18px;
  margin-bottom:12px;
}
.post-head{
  display:flex;
  gap:10px;
  align-items:flex-start;
}
.post-user{
  flex:1;
  min-width:0;
}
.name{
  font-weight:850;
}
.username,.muted{
  color:var(--muted);
}
.post-time{
  color:var(--muted);
  font-size:12px;
}
.post-menu{
  color:var(--muted);
}
.post-body{
  margin:13px 0 8px 53px;
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-word;
}
.hashtag,.mention{
  color:#a48fff;
  cursor:pointer;
}
.post-actions{
  margin-left:53px;
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}
.action{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:7px 9px;
  border-radius:9px;
}
.action:hover{background:var(--panel2);color:#fff}
.action.liked{color:#ff6680}
.action.saved{color:#e4bd54}
.action.reposted{color:#48d99a}

.comments{
  margin:12px 0 0 53px;
  border-top:1px solid var(--line);
  padding-top:10px;
}
.comment{
  padding:9px 0;
}
.comment-row{
  display:flex;
  gap:9px;
}
.comment-body{
  flex:1;
  min-width:0;
}
.comment-actions{
  display:flex;
  gap:5px;
  margin-top:5px;
}
.comment-actions button{
  background:transparent;
  border:0;
  color:var(--muted);
  font-size:12px;
}
.reply-list{
  margin-left:42px;
  border-left:1px solid var(--line);
  padding-left:10px;
}

.poll{
  margin:14px 0 8px 53px;
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
}
.poll-option{
  width:100%;
  position:relative;
  overflow:hidden;
  margin:7px 0;
  background:#0a0d11;
  border:1px solid var(--line);
  color:#fff;
  border-radius:10px;
  padding:10px;
  text-align:left;
}
.poll-bar{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  background:#7657ff22;
}
.poll-text{
  position:relative;
  display:flex;
  justify-content:space-between;
}

.story-strip{
  display:flex;
  gap:10px;
  overflow:auto;
  padding:3px 2px 14px;
}
.story{
  min-width:105px;
  padding:11px;
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:15px;
}
.story.active{border-color:var(--accent)}
.story-text{
  font-size:13px;
  margin-top:8px;
  height:50px;
  overflow:hidden;
}

.searchbox{
  display:flex;
  gap:8px;
}
.searchbox input{flex:1}

.section-title{
  font-size:21px;
  font-weight:900;
  margin:3px 0 15px;
}

.user-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid var(--line);
}
.user-row:last-child{border-bottom:0}
.user-row-main{flex:1;min-width:0}

.profile-head{
  padding:20px;
}
.profile-top{
  display:flex;
  gap:18px;
  align-items:center;
}
.profile-info{flex:1}
.profile-name{font-size:24px;font-weight:900}
.profile-bio{
  margin-top:8px;
  color:#c3c9d1;
  white-space:pre-wrap;
}
.stats{
  display:flex;
  gap:25px;
  margin-top:15px;
}
.stat strong{display:block;font-size:18px}
.stat span{color:var(--muted);font-size:12px}

.notification{
  display:flex;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid var(--line);
}
.notification:last-child{border-bottom:0}
.unread-dot{
  width:8px;
  height:8px;
  min-width:8px;
  border-radius:50%;
  background:var(--accent);
  margin-top:6px;
}

.message-layout{
  display:grid;
  grid-template-columns:230px 1fr;
  min-height:650px;
}
.chat-list{
  border-right:1px solid var(--line);
  padding:12px;
}
.chat-item{
  display:flex;
  gap:9px;
  padding:10px;
  border-radius:12px;
  cursor:pointer;
}
.chat-item:hover,.chat-item.active{background:var(--panel2)}
.chat-main{min-width:0;flex:1}
.chat-window{
  display:flex;
  flex-direction:column;
  min-width:0;
}
.chat-head{
  padding:13px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:10px;
}
.messages{
  flex:1;
  overflow:auto;
  min-height:420px;
  max-height:550px;
  padding:15px;
}
.msg{
  display:flex;
  margin:7px 0;
}
.msg.mine{justify-content:flex-end}
.bubble{
  max-width:75%;
  padding:9px 12px;
  border-radius:14px;
  background:var(--panel2);
  border:1px solid var(--line);
}
.mine .bubble{
  background:#382b70;
  border-color:#5642a2;
}
.msg-meta{
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
}
.msg-tools{
  display:flex;
  gap:4px;
  opacity:0;
  transition:.15s;
}
.msg:hover .msg-tools{opacity:1}
.chat-compose{
  display:flex;
  gap:8px;
  padding:12px;
  border-top:1px solid var(--line);
}
.chat-compose input{flex:1}

.right-card{
  padding:15px;
  margin-bottom:13px;
}
.trend{
  padding:9px 0;
  border-bottom:1px solid var(--line);
}
.trend:last-child{border:0}
.trend strong{display:block}
.trend span{font-size:12px;color:var(--muted)}

.empty{
  text-align:center;
  padding:45px 15px;
  color:var(--muted);
}

.loading-screen,.error-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:var(--bg);
}
.boot-box{
  width:min(600px,100%);
  padding:28px;
  border-radius:20px;
  border:1px solid var(--line);
  background:var(--panel);
  text-align:center;
}
.boot-box h1{margin-top:0}
.boot-error{
  text-align:left;
  padding:12px;
  border-radius:10px;
  background:#35151d;
  color:#ff9aa7;
  margin:15px 0;
  overflow:auto;
  white-space:pre-wrap;
}

.mobile-nav{
  display:none;
  position:fixed;
  z-index:50;
  bottom:0;
  left:0;
  right:0;
  background:rgba(10,12,16,.96);
  border-top:1px solid var(--line);
  padding:7px;
  grid-template-columns:repeat(5,1fr);
}
.mobile-nav button{
  background:transparent;
  border:0;
  color:var(--muted);
  font-size:11px;
  padding:7px 2px;
}
.mobile-nav button.active{color:#fff}

.modal-backdrop{
  position:fixed;
  z-index:100;
  inset:0;
  background:#000b;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal{
  width:min(560px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
}
.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.switch{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid var(--line);
}

.online{
  color:var(--green);
  font-size:11px;
}
.offline{color:var(--muted);font-size:11px}

@media(max-width:1050px){
  .layout{grid-template-columns:220px minmax(0,1fr)}
  .right{display:none}
}
@media(max-width:760px){
  .layout{
    display:block;
    padding:10px 10px 80px;
  }
  .left{display:none}
  .topbar{display:flex}
  .mobile-nav{display:grid}
  .post-body,.post-actions,.poll,.comments{margin-left:0}
  .message-layout{grid-template-columns:1fr}
  .chat-list{display:none}
  .message-layout{min-height:650px}
  .profile-top{align-items:flex-start}
  .avatar.large{width:70px;height:70px;min-width:70px}
}
</style>
</head>

<body>

<div id="root">
  <div class="loading-screen">
    <div class="boot-box">
      <h1>Nexus</h1>
      <p>Loading application…</p>
    </div>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>

<!-- React -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script>
/*
  NEXUS STARTUP CHECK
  -------------------
  This prevents the previous "blank screen" problem.
*/
(function(){
  const root=document.getElementById("root");

  window.NEXUS_BOOT_ERROR=null;

  function showError(title,message){
    root.innerHTML=
      '<div class="error-screen">'+
        '<div class="boot-box">'+
          '<h1>'+title+'</h1>'+
          '<div class="boot-error">'+
            String(message||"Unknown error").replace(/</g,"&lt;")+
          '</div>'+
          '<p style="color:#8f98a5">Check the setup steps below, then reload the page.</p>'+
          '<button class="btn primary" onclick="location.reload()">Reload Nexus</button>'+
        '</div>'+
      '</div>';
  }

  window.addEventListener("error",function(e){
    console.error("Nexus error:",e.error||e.message);
  });

  window.addEventListener("unhandledrejection",function(e){
    console.error("Nexus promise error:",e.reason);
  });

  setTimeout(function(){
    if(!window.React || !window.ReactDOM){
      showError(
        "React failed to load",
        "The React CDN could not be loaded. Check your internet connection or try again."
      );
      return;
    }

    if(!window.firebase){
      showError(
        "Firebase failed to load",
        "The Firebase SDK could not be loaded. Check your internet connection or try again."
      );
      return;
    }
  },2500);
})();
</script>

<script type="text/babel">

const {
  useState,
  useEffect,
  useMemo,
  useRef
}=React;

/* =========================================================
   FIREBASE CONFIG
   IMPORTANT: this is the corrected API key.
========================================================= */

const firebaseConfig={
  apiKey:"AIzaSyDTrvD7c1TUtPUUOSX7_-0VV9itC28LOg0",
  authDomain:"nexus-37600.firebaseapp.com",
  projectId:"nexus-37600",
  storageBucket:"nexus-37600.firebasestorage.app",
  messagingSenderId:"61496309341",
  appId:"1:61496309341:web:fdb3711264df47f318bfb4",
  measurementId:"G-41S50YF5RF"
};

const APP_ID="nexus-37600";
const ROOT="artifacts/"+APP_ID+"/public/data";

let db=null;
let auth=null;
let firebaseBootError=null;

try{
  if(!firebase.apps.length){
    firebase.initializeApp(firebaseConfig);
  }
  db=firebase.firestore();
  auth=firebase.auth();
}catch(err){
  firebaseBootError=err;
  console.error("Firebase initialization failed:",err);
}

/* =========================================================
   HELPERS
========================================================= */

function C(name){
  return db.collection(ROOT+"/"+name);
}

function now(){
  return firebase.firestore.FieldValue.serverTimestamp();
}

function uid(){
  return auth && auth.currentUser ? auth.currentUser.uid : null;
}

function safeText(v){
  return String(v||"").trim();
}

function initials(name){
  const s=safeText(name)||"User";
  return s.split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();
}

function timeAgo(ts){
  if(!ts)return "";
  const d=ts.toDate ? ts.toDate() : new Date(ts);
  const sec=Math.max(1,Math.floor((Date.now()-d.getTime())/1000));
  if(sec<60)return sec+"s";
  if(sec<3600)return Math.floor(sec/60)+"m";
  if(sec<86400)return Math.floor(sec/3600)+"h";
  if(sec<604800)return Math.floor(sec/86400)+"d";
  return d.toLocaleDateString();
}

function normalizeUsername(v){
  return safeText(v)
    .toLowerCase()
    .replace(/^@/,"")
    .replace(/[^a-z0-9_]/g,"")
    .slice(0,24);
}

function extractHashtags(text){
  const out=[];
  const re=/(^|\s)#([a-zA-Z0-9_]+)/g;
  let m;
  while((m=re.exec(text))){
    out.push(m[2].toLowerCase());
  }
  return [...new Set(out)];
}

function extractMentions(text){
  const out=[];
  const re=/(^|\s)@([a-zA-Z0-9_]+)/g;
  let m;
  while((m=re.exec(text))){
    out.push(m[2].toLowerCase());
  }
  return [...new Set(out)];
}

function formatText(text){
  const parts=String(text||"").split(/(\#[a-zA-Z0-9_]+|\@[a-zA-Z0-9_]+)/g);

  return parts.map((part,i)=>{
    if(/^#/.test(part)){
      return <span key={i} className="hashtag">{part}</span>;
    }
    if(/^@/.test(part)){
      return <span key={i} className="mention">{part}</span>;
    }
    return <React.Fragment key={i}>{part}</React.Fragment>;
  });
}

/* =========================================================
   AUTH
========================================================= */

function useAuth(){
  const [user,setUser]=useState(null);
  const [profile,setProfile]=useState(null);
  const [ready,setReady]=useState(false);
  const [error,setError]=useState(null);

  useEffect(()=>{
    if(firebaseBootError){
      setError(firebaseBootError);
      setReady(true);
      return;
    }

    if(!auth){
      setError(new Error("Firebase Auth is unavailable."));
      setReady(true);
      return;
    }

    let cancelled=false;

    const unsubscribe=auth.onAuthStateChanged(async u=>{
      if(cancelled)return;

      try{
        if(!u){
          try{
            await auth.signInAnonymously();
            return;
          }catch(err){
            setError(err);
            setReady(true);
            return;
          }
        }

        setUser(u);

        const ref=C("users").doc(u.uid);
        const snap=await ref.get();

        if(!snap.exists){
          const defaultUsername=
            "user_"+u.uid.slice(0,8).toLowerCase();

          const newProfile={
            uid:u.uid,
            displayName:"Nexus User",
            username:defaultUsername,
            bio:"",
            createdAt:now(),
            updatedAt:now(),
            followersCount:0,
            followingCount:0,
            postsCount:0
          };

          await ref.set(newProfile);
          if(!cancelled)setProfile(newProfile);
        }else{
          if(!cancelled)setProfile({
            uid:u.uid,
            ...snap.data()
          });
        }

        if(!cancelled)setReady(true);

      }catch(err){
        console.error(err);
        if(!cancelled){
          setError(err);
          setReady(true);
        }
      }
    });

    return ()=>{
      cancelled=true;
      unsubscribe();
    };
  },[]);

  return {user,profile,setProfile,ready,error};
}

/* =========================================================
   DATA HOOKS
========================================================= */

function useCollection(name,queryFn,deps=[]){
  const [items,setItems]=useState([]);
  const [error,setError]=useState(null);

  useEffect(()=>{
    if(!db)return;

    let q;

    try{
      q=queryFn(C(name));
    }catch(err){
      setError(err);
      return;
    }

    const unsub=q.onSnapshot(
      snap=>{
        const arr=snap.docs.map(d=>({
          id:d.id,
          ...d.data()
        }));
        setItems(arr);
      },
      err=>{
        console.error(name,err);
        setError(err);
      }
    );

    return unsub;
  },deps);

  return {items,error};
}

function useAppData(profile){
  const currentId=profile?.uid;

  const posts=useCollection(
    "posts",
    ref=>ref.orderBy("createdAt","desc").limit(300),
    []
  );

  const users=useCollection(
    "users",
    ref=>ref.orderBy("createdAt","desc").limit(500),
    []
  );

  const follows=useCollection(
    "follows",
    ref=>ref.where("followerId","==",currentId),
    [currentId]
  );

  const bookmarks=useCollection(
    "bookmarks",
    ref=>ref.where("userId","==",currentId),
    [currentId]
  );

  const likes=useCollection(
    "likes",
    ref=>ref.where("userId","==",currentId),
    [currentId]
  );

  const reposts=useCollection(
    "reposts",
    ref=>ref.where("userId","==",currentId),
    [currentId]
  );

  const notifications=useCollection(
    "notifications",
    ref=>ref
      .where("recipientId","==",currentId)
      .orderBy("createdAt","desc")
      .limit(100),
    [currentId]
  );

  const stories=useCollection(
    "stories",
    ref=>ref.orderBy("createdAt","desc").limit(300),
    []
  );

  const blocks=useCollection(
    "blocks",
    ref=>ref.where("blockerId","==",currentId),
    [currentId]
  );

  const mutes=useCollection(
    "mutes",
    ref=>ref.where("muterId","==",currentId),
    [currentId]
  );

  return {
    posts:posts.items,
    users:users.items,
    follows:follows.items,
    bookmarks:bookmarks.items,
    likes:likes.items,
    reposts:reposts.items,
    notifications:notifications.items,
    stories:stories.items,
    blocks:blocks.items,
    mutes:mutes.items
  };
}

async function notify(recipientId,type,message,extra={}){
  const me=uid();
  if(!recipientId || recipientId===me)return;

  try{
    await C("notifications").add({
      recipientId,
      actorId:me,
      type,
      message,
      createdAt:now(),
      read:false,
      ...extra
    });
  }catch(err){
    console.error("notification error",err);
  }
}

function FollowButton({targetId,following,onChange}){
  const [busy,setBusy]=useState(false);

  async function toggle(){
    if(!targetId || busy)return;

    setBusy(true);

    try{
      const existing=C("follows")
        .where("followerId","==",uid())
        .where("followingId","==",targetId);

      const snap=await existing.get();

      if(snap.empty){
        await C("follows").add({
          followerId:uid(),
          followingId:targetId,
          createdAt:now()
        });

        await C("users").doc(targetId).set({
          followersCount:firebase.firestore.FieldValue.increment(1)
        },{merge:true});

        await C("users").doc(uid()).set({
          followingCount:firebase.firestore.FieldValue.increment(1)
        },{merge:true});

        await notify(
          targetId,
          "follow",
          "started following you"
        );

        onChange?.(true);
      }else{
        const batch=db.batch();

        snap.docs.forEach(d=>{
          batch.delete(d.ref);
        });

        await batch.commit();

        await C("users").doc(targetId).set({
          followersCount:firebase.firestore.FieldValue.increment(-1)
        },{merge:true});

        await C("users").doc(uid()).set({
          followingCount:firebase.firestore.FieldValue.increment(-1)
        },{merge:true});

        onChange?.(false);
      }
    }catch(err){
      alert(err.message);
    }

    setBusy(false);
  }

  return (
    <button
      className={"btn "+(following?"":"primary")}
      onClick={toggle}
      disabled={busy}
    >
      {following?"Following":"Follow"}
    </button>
  );
}

/* =========================================================
   POLL
========================================================= */

function Poll({post}){
  const [options,setOptions]=useState(post.poll?.options||[]);
  const [voted,setVoted]=useState(false);

  useEffect(()=>{
    if(!post.poll)return;

    C("pollVotes")
      .where("pollId","==",post.id)
      .where("userId","==",uid())
      .limit(1)
      .get()
      .then(snap=>setVoted(!snap.empty))
      .catch(()=>{});
  },[post.id]);

  async function vote(index){
    if(voted)return;

    try{
      await C("pollVotes").add({
        pollId:post.id,
        postId:post.id,
        userId:uid(),
        option:index,
        createdAt:now()
      });

      const copy=options.map((x,i)=>{
        if(i===index){
          return {
            ...x,
            votes:Number(x.votes||0)+1
          };
        }
        return x;
      });

      await C("posts").doc(post.id).set({
        poll:{...post.poll,options:copy}
      },{merge:true});

      setOptions(copy);
      setVoted(true);
    }catch(err){
      alert(err.message);
    }
  }

  const total=options.reduce(
    (a,b)=>a+Number(b.votes||0),
    0
  );

  return (
    <div className="poll">
      <strong>{post.poll.question}</strong>

      {options.map((op,i)=>{
        const pct=total
          ?Math.round(Number(op.votes||0)*100/total)
          :0;

        return (
          <button
            key={i}
            className="poll-option"
            onClick={()=>vote(i)}
            disabled={voted}
          >
            <span
              className="poll-bar"
              style={{width:pct+"%"}}
            />

            <span className="poll-text">
              <span>{op.text}</span>
              <span>{pct}%</span>
            </span>
          </button>
        );
      })}

      <div className="muted">
        {total} vote{total===1?"":"s"}
        {voted?" · You voted":""}
      </div>
    </div>
  );
}

/* =========================================================
   COMMENTS
========================================================= */

function CommentTree({postId,users}){
  const [comments,setComments]=useState([]);
  const [text,setText]=useState("");
  const [replyTo,setReplyTo]=useState(null);

  useEffect(()=>{
    const unsub=C("comments")
      .where("postId","==",postId)
      .orderBy("createdAt","asc")
      .onSnapshot(
        snap=>{
          setComments(
            snap.docs.map(d=>({
              id:d.id,
              ...d.data()
            }))
          );
        },
        err=>{
          console.error("comments",err);
        }
      );

    return unsub;
  },[postId]);

  async function submit(){
    if(!safeText(text))return;

    try{
      await C("comments").add({
        postId,
        authorId:uid(),
        text:safeText(text),
        parentId:replyTo||null,
        createdAt:now()
      });

      await C("posts").doc(postId).set({
        commentsCount:firebase.firestore.FieldValue.increment(1)
      },{merge:true});

      const post=await C("posts").doc(postId).get();

      if(post.exists){
        await notify(
          post.data().authorId,
          "comment",
          "commented on your post",
          {postId}
        );
      }

      setText("");
      setReplyTo(null);
    }catch(err){
      alert(err.message);
    }
  }

  async function deleteComment(comment){
    if(comment.authorId!==uid())return;

    if(!confirm("Delete this comment?"))return;

    try{
      await C("comments").doc(comment.id).delete();

      await C("posts").doc(postId).set({
        commentsCount:firebase.firestore.FieldValue.increment(-1)
      },{merge:true});
    }catch(err){
      alert(err.message);
    }
  }

  const roots=comments.filter(x=>!x.parentId);

  function node(comment){
    const author=users.find(x=>x.uid===comment.authorId);
    const replies=comments.filter(
      x=>x.parentId===comment.id
    );

    return (
      <div className="comment" key={comment.id}>
        <div className="comment-row">
          <Avatar
            profile={author||{displayName:"User"}}
            size="small"
          />

          <div className="comment-body">
            <div>
              <strong>
                {author?.displayName||"User"}
              </strong>{" "}
              <span className="muted">
                @{author?.username||"user"}
              </span>
            </div>

            <div style={{
              whiteSpace:"pre-wrap",
              marginTop:3
            }}>
              {formatText(comment.text)}
            </div>

            <div className="comment-actions">
              <button
                onClick={()=>{
                  setReplyTo(comment.id);
                  setText("@"+(author?.username||"user")+" ");
                }}
              >
                Reply
              </button>

              {comment.authorId===uid() && (
                <button
                  onClick={()=>deleteComment(comment)}
                >
                  Delete
                </button>
              )}
            </div>
          </div>
        </div>

        {replies.length>0 && (
          <div className="reply-list">
            {replies.map(node)}
          </div>
        )}
      </div>
    );
  }

  return (
    <div className="comments">
      {roots.map(node)}

      <div style={{
        display:"flex",
        gap:7,
        marginTop:8
      }}>
        <input
          value={text}
          onChange={e=>setText(e.target.value)}
          placeholder={
            replyTo
              ?"Write a reply..."
              :"Write a comment..."
          }
          onKeyDown={e=>{
            if(e.key==="Enter"&&!e.shiftKey){
              e.preventDefault();
              submit();
            }
          }}
        />

        <button
          className="btn primary"
          onClick={submit}
        >
          Send
        </button>
      </div>
    </div>
  );
}

   POST
========================================================= */

function Post({
  post,
  profile,
  users,
  liked,
  saved,
  reposted,
  following,
  blocked,
  muted
}){
  const [commentsOpen,setCommentsOpen]=useState(false);
  const [menu,setMenu]=useState(false);
  const [busy,setBusy]=useState(false);

  const author=users.find(x=>x.uid===post.authorId);

  if(blocked||muted)return null;

  async function like(){
    if(busy)return;

    setBusy(true);

    try{
      const q=await C("likes")
        .where("postId","==",post.id)
        .where("userId","==",uid())
        .limit(1)
        .get();

      if(q.empty){
        await C("likes").add({
          postId:post.id,
          userId:uid(),
          createdAt:now()
        });

        await C("posts").doc(post.id).set({
          likesCount:firebase.firestore.FieldValue.increment(1)
        },{merge:true});

        await notify(
          post.authorId,
          "like",
          "liked your post",
          {postId:post.id}
        );
      }else{
        const batch=db.batch();

        q.docs.forEach(d=>batch.delete(d.ref));
        await batch.commit();

        await C("posts").doc(post.id).set({
          likesCount:firebase.firestore.FieldValue.increment(-1)
        },{merge:true});
      }
    }catch(err){
      alert(err.message);
    }

    setBusy(false);
  }

  async function bookmark(){
    try{
      const q=await C("bookmarks")
        .where("postId","==",post.id)
        .where("userId","==",uid())
        .limit(1)
        .get();

      if(q.empty){
        await C("bookmarks").add({
          postId:post.id,
          userId:uid(),
          createdAt:now()
        });
      }else{
        const batch=db.batch();
        q.docs.forEach(d=>batch.delete(d.ref));
        await batch.commit();
      }
    }catch(err){
      alert(err.message);
    }
  }

  async function repost(){
    try{
      const q=await C("reposts")
        .where("postId","==",post.id)
        .where("userId","==",uid())
        .limit(1)
        .get();

      if(q.empty){
        await C("reposts").add({
          postId:post.id,
          userId:uid(),
          createdAt:now()
        });

        await C("posts").doc(post.id).set({
          repostsCount:firebase.firestore.FieldValue.increment(1)
        },{merge:true});

        await notify(
          post.authorId,
          "repost",
          "reposted your post",
          {postId:post.id}
        );
      }else{
        const batch=db.batch();
        q.docs.forEach(d=>batch.delete(d.ref));
        await batch.commit();

        await C("posts").doc(post.id).set({
          repostsCount:firebase.firestore.FieldValue.increment(-1)
        },{merge:true});
      }
    }catch(err){
      alert(err.message);
    }
  }

  async function deletePost(){
    if(post.authorId!==uid())return;

    if(!confirm("Delete this post?"))return;

    try{
      await C("posts").doc(post.id).delete();
    }catch(err){
      alert(err.message);
    }
  }

  async function pin(){
    if(post.authorId!==uid())return;

    try{
      await C("users").doc(uid()).set({
        pinnedPostId:
          post.pinned
            ?null
            :post.id
      },{merge:true});

      await C("posts").doc(post.id).set({
        pinned:!post.pinned
      },{merge:true});
    }catch(err){
      alert(err.message);
    }
  }

  async function report(){
    const reason=prompt(
      "Why are you reporting this post?"
    );

    if(!safeText(reason))return;

    try{
      await C("reports").add({
        reporterId:uid(),
        targetType:"post",
        targetId:post.id,
        targetAuthorId:post.authorId,
        reason:safeText(reason),
        status:"open",
        createdAt:now()
      });

      alert("Report submitted.");
      setMenu(false);
    }catch(err){
      alert(err.message);
    }
  }

  async function mute(){
    try{
      const q=await C("mutes")
        .where("muterId","==",uid())
        .where("mutedId","==",post.authorId)
        .limit(1)
        .get();

      if(q.empty){
        await C("mutes").add({
          muterId:uid(),
          mutedId:post.authorId,
          createdAt:now()
        });
      }else{
        const batch=db.batch();
        q.docs.forEach(d=>batch.delete(d.ref));
        await batch.commit();
      }

      setMenu(false);
    }catch(err){
      alert(err.message);
    }
  }

  return (
    <article className="card post">
      <div className="post-head">
        <Avatar
          profile={author||{displayName:"Nexus User"}}
        />

        <div className="post-user">
          <div className="name">
            {author?.displayName||"Nexus User"}
            {post.pinned && (
              <span style={{
                color:"var(--yellow)",
                marginLeft:7,
                fontSize:12
              }}>
                PINNED
              </span>
            )}
          </div>

          <div className="username">
            @{author?.username||"user"}
          </div>
        </div>

        <div className="post-time">
          {timeAgo(post.createdAt)}
        </div>

        <button
          className="btn"
          onClick={()=>setMenu(!menu)}
        >
          •••
        </button>
      </div>

      {post.repostedFrom && (
        <div className="muted" style={{
          margin:"9px 0 0 53px"
        }}>
          ↻ Repost
        </div>
      )}

      <div className="post-body">
        {formatText(post.text)}
      </div>

      {post.poll && <Poll post={post}/>}

      <div className="post-actions">
        <button
          className={"action "+(liked?"liked":"")}
          onClick={like}
        >
          ♥ {post.likesCount||0}
        </button>

        <button
          className="action"
          onClick={()=>setCommentsOpen(!commentsOpen)}
        >
          💬 {post.commentsCount||0}
        </button>

        <button
          className={"action "+(reposted?"reposted":"")}
          onClick={repost}
        >
          ↻ {post.repostsCount||0}
        </button>

        <button
          className={"action "+(saved?"saved":"")}
          onClick={bookmark}
        >
          🔖
        </button>

        {author && author.uid!==uid() && (
          <FollowButton
            targetId={author.uid}
            following={following}
          />
        )}
      </div>

      {menu && (
        <div style={{
          display:"flex",
          flexWrap:"wrap",
          gap:7,
          marginTop:10,
          paddingTop:10,
          borderTop:"1px solid var(--line)"
        }}>
          {post.authorId===uid() && (
            <>
              <button className="btn" onClick={pin}>
                {post.pinned?"Unpin":"Pin"}
              </button>

              <button
                className="btn danger"
                onClick={deletePost}
              >
                Delete
              </button>
            </>
          )}

          {post.authorId!==uid() && (
            <>
              <button className="btn" onClick={mute}>
                {muted?"Unmute":"Mute"}
              </button>

              <button
                className="btn danger"
                onClick={report}
              >
                Report
              </button>
            </>
          )}
        </div>
      )}

      {commentsOpen && (
        <CommentTree
          postId={post.id}
          users={users}
        />
      )}
    </article>
  );
}

/* =========================================================
   COMPOSER
========================================================= */

function Composer({profile}){
  const [text,setText]=useState("");
  const [poll,setPoll]=useState(false);
  const [question,setQuestion]=useState("");
  const [options,setOptions]=useState(["",""]);
  const [busy,setBusy]=useState(false);

  async function publish(){
    const body=safeText(text);

    if(!body && !poll)return;

    setBusy(true);

    try{
      const data={
        authorId:uid(),
        text:body,
        createdAt:now(),
        likesCount:0,
        commentsCount:0,
        repostsCount:0,
        hashtags:extractHashtags(body),
        mentions:extractMentions(body)
      };

      if(poll){
        const clean=options
          .map(x=>safeText(x))
          .filter(Boolean);

        if(!safeText(question)||clean.length<2){
          alert("A poll needs a question and at least 2 options.");
          setBusy(false);
          return;
        }

        data.poll={
          question:safeText(question),
          options:clean.map(x=>({
            text:x,
            votes:0
          }))
        };
      }

      const ref=await C("posts").add(data);

      /* mention notifications */
      const mentions=extractMentions(body);

      for(const mention of mentions){
        const snap=await C("users")
          .where("username","==",mention)
          .limit(1)
          .get();

        if(!snap.empty){
          await notify(
            snap.docs[0].id,
            "mention",
            "mentioned you in a post",
            {postId:ref.id}
          );
        }
      }

      await C("users").doc(uid()).set({
        postsCount:
          firebase.firestore.FieldValue.increment(1)
      },{merge:true});

      setText("");
      setPoll(false);
      setQuestion("");
      setOptions(["",""]);
    }catch(err){
      alert(err.message);
    }

    setBusy(false);
  }

  function updateOption(i,v){
    setOptions(old=>{
      const copy=[...old];
      copy[i]=v;
      return copy;
    });
  }

  return (
    <div className="card composer">
      <div className="composer-row">
        <Avatar profile={profile}/>

        <div style={{flex:1}}>
          <textarea
            value={text}
            onChange={e=>setText(e.target.value)}
            placeholder="What's happening on Nexus?"
          />

          {poll && (
            <div style={{
              marginTop:10,
              border:"1px solid var(--line)",
              borderRadius:12,
              padding:10
            }}>
              <input
                value={question}
                onChange={e=>setQuestion(e.target.value)}
                placeholder="Poll question"
              />

              {options.map((op,i)=>(
                <div
                  key={i}
                  style={{
                    display:"flex",
                    gap:6,
                    marginTop:7
                  }}
                >
                  <input
                    value={op}
                    onChange={e=>updateOption(i,e.target.value)}
                    placeholder={"Option "+(i+1)}
                  />

                  {options.length>2 && (
                    <button
                      className="btn"
                      onClick={()=>{
                        setOptions(old=>
                          old.filter((_,n)=>n!==i)
                        );
                      }}
                    >
                      ×
                    </button>
                  )}
                </div>
              ))}

              <button
                className="btn"
                style={{marginTop:8}}
                onClick={()=>{
                  if(options.length<6){
                    setOptions(old=>[...old,""]);
                  }
                }}
              >
                + Option
              </button>
            </div>
          )}

          <div className="composer-tools">
            <button
              className={"btn "+(poll?"primary":"")}
              onClick={()=>setPoll(!poll)}
            >
              📊 Poll
            </button>

            <span className="muted" style={{
              padding:"8px 3px",
              fontSize:12
            }}>
              #hashtags · @mentions
            </span>

            <div style={{marginLeft:"auto"}}>
              <button
                className="btn primary"
                onClick={publish}
                disabled={busy}
              >
                {busy?"Posting...":"Post"}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

   FEED
========================================================= */

function Feed({
  mode,
  posts,
  users,
  follows,
  bookmarks,
  likes,
  reposts,
  blocks,
  mutes,
  profile
}){
  const followingIds=new Set(
    follows.map(x=>x.followingId)
  );

  const bookmarkIds=new Set(
    bookmarks.map(x=>x.postId)
  );

  const likeIds=new Set(
    likes.map(x=>x.postId)
  );

  const repostIds=new Set(
    reposts.map(x=>x.postId)
  );

  const blockedIds=new Set(
    blocks.map(x=>x.blockedId)
  );

  const mutedIds=new Set(
    mutes.map(x=>x.mutedId)
  );

  let visible=[...posts];

  if(mode==="following"){
    visible=visible.filter(
      p=>followingIds.has(p.authorId)||p.authorId===uid()
    );
  }

  if(mode==="saved"){
    visible=visible.filter(
      p=>bookmarkIds.has(p.id)
    );
  }

  visible=visible.filter(
    p=>!blockedIds.has(p.authorId)&&
       !mutedIds.has(p.authorId)
  );

  return (
    <>
      {visible.length===0 && (
        <div className="card empty">
          {mode==="saved"
            ?"You haven't saved any posts yet."
            :mode==="following"
              ?"Follow people to build your Following feed."
              :"No posts yet. Be the first to post."}
        </div>
      )}

      {visible.map(post=>(
        <Post
          key={post.id}
          post={post}
          profile={profile}
          users={users}
          liked={likeIds.has(post.id)}
          saved={bookmarkIds.has(post.id)}
          reposted={repostIds.has(post.id)}
          following={followingIds.has(post.authorId)}
          blocked={blockedIds.has(post.authorId)}
          muted={mutedIds.has(post.authorId)}
        />
      ))}
    </>
  );
}

function Notifications({notifications,users}){
  async function markRead(n){
    if(n.read)return;

    await C("notifications")
      .doc(n.id)
      .set({read:true},{merge:true});
  }

  async function markAll(){
    const unread=notifications.filter(x=>!x.read);

    const batch=db.batch();

    unread.forEach(n=>{
      batch.set(
        C("notifications").doc(n.id),
        {read:true},
        {merge:true}
      );
    });

    await batch.commit();
  }

  return (
    <div>
      <div style={{
        display:"flex",
        justifyContent:"space-between",
        alignItems:"center",
        marginBottom:14
      }}>
        <div className="section-title">
          Notifications
        </div>

        <button
          className="btn"
          onClick={markAll}
        >
          Mark all read
        </button>
      </div>

      <div className="card pad">
        {notifications.length===0 && (
          <div className="empty">
            No notifications yet.
          </div>
        )}

        {notifications.map(n=>{
          const actor=users.find(
            x=>x.uid===n.actorId
          );

          return (
            <button
              key={n.id}
              onClick={()=>markRead(n)}
              style={{
                width:"100%",
                border:0,
                background:"transparent",
                color:"#fff",
                textAlign:"left"
              }}
            >
              <div className="notification">
                {!n.read
                  ?<div className="unread-dot"/>
                  :<div style={{width:8}}/>
                }

                <Avatar
                  profile={actor||{displayName:"User"}}
                  size="small"
                />

                <div style={{flex:1}}>
                  <strong>
                    {actor?.displayName||"Someone"}
                  </strong>{" "}
                  <span>{n.message}</span>

                  <div className="muted">
                    {timeAgo(n.createdAt)}
                  </div>
                </div>
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* =========================================================
   MESSAGES
========================================================= */

function Messages({profile,users}){
  const [chats,setChats]=useState([]);
  const [selected,setSelected]=useState(null);
  const [messages,setMessages]=useState([]);
  const [text,setText]=useState("");
  const [reply,setReply]=useState(null);
  const [reactionMenu,setReactionMenu]=useState(null);

  /* direct chats */
  useEffect(()=>{
    if(!uid())return;

    const unsub=C("chats")
      .where("members","array-contains",uid())
      .orderBy("updatedAt","desc")
      .limit(100)
      .onSnapshot(
        snap=>{
          setChats(
            snap.docs.map(d=>({
              id:d.id,
              ...d.data()
            }))
          );
        },
        err=>{
          console.error("chat listener",err);
        }
      );

    return unsub;
  },[]);

  useEffect(()=>{
    if(!selected){
      setMessages([]);
      return;
    }

    const unsub=C("messages")
      .where("chatId","==",selected.id)
      .orderBy("createdAt","asc")
      .limit(500)
      .onSnapshot(
        snap=>{
          setMessages(
            snap.docs.map(d=>({
              id:d.id,
              ...d.data()
            }))
          );
        },
        err=>{
          console.error("messages",err);
        }
      );

    return unsub;
  },[selected?.id]);

  async function startChat(otherId){
    if(otherId===uid())return;

    const q=await C("chats")
      .where("members","array-contains",uid())
      .limit(100)
      .get();

    let found=null;

    q.docs.forEach(d=>{
      const x=d.data();

      if(
        !x.group &&
        Array.isArray(x.members) &&
        x.members.includes(otherId)
      ){
        found={id:d.id,...x};
      }
    });

    if(found){
      setSelected(found);
      return;
    }

    const other=users.find(x=>x.uid===otherId);

    const ref=await C("chats").add({
      members:[uid(),otherId],
      group:false,
      name:other?.displayName||"Chat",
      createdAt:now(),
      updatedAt:now()
    });

    setSelected({
      id:ref.id,
      members:[uid(),otherId],
      group:false,
      name:other?.displayName||"Chat"
    });
  }

  async function send(){
    if(!safeText(text)||!selected)return;

    try{
      const body=safeText(text);

      await C("messages").add({
        chatId:selected.id,
        senderId:uid(),
        text:body,
        createdAt:now(),
        readBy:[uid()],
        reactions:{},
        replyTo:reply?.id||null,
        replyPreview:reply?.text||null
      });

      await C("chats").doc(selected.id).set({
        lastMessage:body,
        updatedAt:now()
      },{merge:true});

      const recipients=(selected.members||[])
        .filter(x=>x!==uid());

      for(const r of recipients){
        await notify(
          r,
          "message",
          "sent you a message",
          {chatId:selected.id}
        );
      }

      setText("");
      setReply(null);
    }catch(err){
      alert(err.message);
    }
  }

  async function deleteMessage(m){
    if(m.senderId!==uid())return;

    try{
      await C("messages").doc(m.id).delete();
    }catch(err){
      alert(err.message);
    }
  }

  async function react(m,emoji){
    try{
      const reactions={
        ...(m.reactions||{})
      };

      const current=Array.isArray(
        reactions[emoji]
      )?reactions[emoji]:[];

      const exists=current.includes(uid());

      reactions[emoji]=exists
        ?current.filter(x=>x!==uid())
        :[...current,uid()];

      await C("messages").doc(m.id).set({
        reactions
      },{merge:true});
    }catch(err){
      alert(err.message);
    }

    setReactionMenu(null);
  }

  async function markRead(m){
    if((m.readBy||[]).includes(uid()))return;

    await C("messages").doc(m.id).set({
      readBy:[
        ...(m.readBy||[]),
        uid()
      ]
    },{merge:true});
  }

  return (
    <div>
      <div className="section-title">
        Messages
      </div>

      <div className="card message-layout">
        <div className="chat-list">
          <div style={{
            fontWeight:800,
            marginBottom:8
          }}>
            Conversations
          </div>

          <button
            className="btn"
            style={{
              width:"100%",
              marginBottom:10
            }}
            onClick={()=>{
              const name=prompt(
                "Enter exact username to message:"
              );

              const target=users.find(
                x=>x.username===
                  normalizeUsername(name)
              );

              if(target)startChat(target.uid);
              else if(name)alert("User not found.");
            }}
          >
            + New chat
          </button>

          {chats.map(chat=>{
            const otherId=(chat.members||[])
              .find(x=>x!==uid());

            const other=users.find(
              x=>x.uid===otherId
            );

            return (
              <div
                key={chat.id}
                className={
                  "chat-item "+
                  (selected?.id===chat.id?"active":"")
                }
                onClick={()=>setSelected(chat)}
              >
                <Avatar
                  profile={
                    chat.group
                      ?{displayName:chat.name||"Group"}
                      :(other||{displayName:"User"})
                  }
                  size="small"
                />

                <div className="chat-main">
                  <strong>
                    {chat.group
                      ?chat.name
                      :(other?.displayName||"User")}
                  </strong>

                  <div className="muted" style={{
                    whiteSpace:"nowrap",
                    overflow:"hidden",
                    textOverflow:"ellipsis"
                  }}>
                    {chat.lastMessage||"No messages"}
                  </div>
                </div>
              </div>
            );
          })}

          {chats.length===0 && (
            <div className="empty" style={{
              padding:"25px 5px"
            }}>
              No chats yet.
            </div>
          )}
        </div>

        <div className="chat-window">
          {!selected ? (
            <div className="empty">
              Select a conversation.
            </div>
          ):(
            <>
              <div className="chat-head">
                <strong>
                  {selected.group
                    ?selected.name
                    :(
                      users.find(x=>
                        x.uid===
                        (selected.members||[])
                          .find(y=>y!==uid())
                      )?.displayName||
                      "Chat"
                    )}
                </strong>
              </div>

              <div className="messages">
                {messages.map(m=>{
                  const mine=m.senderId===uid();

                  if(!mine)markRead(m);

                  return (
                    <div
                      key={m.id}
                      className={"msg "+(mine?"mine":"")}
                    >
                      <div>
                        {m.replyTo && (
                          <div
                            className="muted"
                            style={{
                              fontSize:11,
                              marginBottom:3
                            }}
                          >
                            ↪ {m.replyPreview||"Reply"}
                          </div>
                        )}

                        <div className="bubble">
                          <div style={{
                            whiteSpace:"pre-wrap",
                            wordBreak:"break-word"
                          }}>
                            {m.text}
                          </div>

                          <div className="msg-meta">
                            {timeAgo(m.createdAt)}
                            {" "}
                            {mine &&
                              (m.readBy?.length>1
                                ?"✓✓"
                                :"✓")}
                          </div>
                        </div>

                        <div className="msg-tools">
                          <button
                            className="btn"
                            onClick={()=>{
                              setReply(m);
                            }}
                          >
                            Reply
                          </button>

                          <button
                            className="btn"
                            onClick={()=>{
                              setReactionMenu(
                                reactionMenu===m.id
                                  ?null
                                  :m.id
                              );
                            }}
                          >
                            React
                          </button>

                          {mine && (
                            <button
                              className="btn danger"
                              onClick={()=>
                                deleteMessage(m)
                              }
                            >
                              Delete
                            </button>
                          )}
                        </div>

                        {reactionMenu===m.id && (
                          <div style={{
                            display:"flex",
                            gap:4,
                            marginTop:4
                          }}>
                            {["❤️","👍","😂","😮","😢"].map(e=>(
                              <button
                                key={e}
                                className="btn"
                                onClick={()=>
                                  react(m,e)
                                }
                              >
                                {e}
                              </button>
                            ))}
                          </div>
                        )}

                        {Object.entries(
                          m.reactions||{}
                        ).map(([emoji,list])=>{
                          if(!list?.length)return null;

                          return (
                            <span
                              key={emoji}
                              style={{
                                display:"inline-block",
                                marginTop:4,
                                marginRight:4,
                                padding:"2px 6px",
                                borderRadius:8,
                                background:"var(--panel3)",
                                fontSize:12
                              }}
                            >
                              {emoji} {list.length}
                            </span>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}

                {messages.length===0 && (
                  <div className="empty">
                    Start the conversation.
                  </div>
                )}
              </div>

              {reply && (
                <div style={{
                  padding:"7px 12px",
                  borderTop:"1px solid var(--line)",
                  color:"var(--muted)"
                }}>
                  Replying to: {reply.text}
                  <button
                    className="btn"
                    style={{marginLeft:8}}
                    onClick={()=>setReply(null)}
                  >
                    Cancel
                  </button>
                </div>
              )}

              <div className="chat-compose">
                <input
                  value={text}
                  onChange={e=>setText(e.target.value)}
                  placeholder="Write a message..."
                  onKeyDown={e=>{
                    if(e.key==="Enter"){
                      e.preventDefault();
                      send();
                    }
                  }}
                />

                <button
                  className="btn primary"
                  onClick={send}
                >
                  Send
                </button>
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function Settings({profile,setProfile,onLogout}){
  const [name,setName]=useState(profile.displayName||"");
  const [username,setUsername]=useState(profile.username||"");
  const [bio,setBio]=useState(profile.bio||"");
  const [showOnline,setShowOnline]=useState(
    profile.showOnline!==false
  );
  const [notifyLikes,setNotifyLikes]=useState(
    profile.notifyLikes!==false
  );
  const [notifyMessages,setNotifyMessages]=useState(
    profile.notifyMessages!==false
  );
  const [busy,setBusy]=useState(false);

  async function save(){
    const cleanUsername=normalizeUsername(username);

    if(!cleanUsername){
      alert("Username cannot be empty.");
      return;
    }

    setBusy(true);

    try{
      const collision=await C("users")
        .where("username","==",cleanUsername)
        .limit(2)
        .get();

      const other=collision.docs.find(
        d=>d.id!==uid()
      );

      if(other){
        alert("That username is already taken.");
        setBusy(false);
        return;
      }

      const update={
        displayName:safeText(name)||"Nexus User",
        username:cleanUsername,
        bio:safeText(bio),
        showOnline,
        notifyLikes,
        notifyMessages,
        updatedAt:now()
      };

      await C("users")
        .doc(uid())
        .set(update,{merge:true});

      setProfile({
        ...profile,
        ...update
      });

      alert("Profile saved.");
    }catch(err){
      alert(err.message);
    }

    setBusy(false);
  }

  return (
    <div>
      <div className="section-title">
        Settings
      </div>

      <div className="card pad">
        <h3>Profile</h3>

        <label className="muted">Display name</label>
        <input
          value={name}
          onChange={e=>setName(e.target.value)}
          style={{margin:"5px 0 12px"}}
        />

        <label className="muted">Username</label>
        <input
          value={username}
          onChange={e=>setUsername(e.target.value)}
          style={{margin:"5px 0 12px"}}
        />

        <label className="muted">Bio</label>
        <textarea
          value={bio}
          onChange={e=>setBio(e.target.value)}
          style={{marginTop:5}}
        />

        <div className="switch">
          <div>
            <strong>Show online status</strong>
            <div className="muted">
              Let other users see your activity status.
            </div>
          </div>

          <input
            type="checkbox"
            checked={showOnline}
            onChange={e=>setShowOnline(e.target.checked)}
            style={{width:20}}
          />
        </div>

        <div className="switch">
          <div>
            <strong>Like notifications</strong>
          </div>

          <input
            type="checkbox"
            checked={notifyLikes}
            onChange={e=>setNotifyLikes(e.target.checked)}
            style={{width:20}}
          />
        </div>

        <div className="switch">
          <div>
            <strong>Message notifications</strong>
          </div>

          <input
            type="checkbox"
            checked={notifyMessages}
            onChange={e=>setNotifyMessages(e.target.checked)}
            style={{width:20}}
          />
        </div>

        <div style={{
          display:"flex",
          gap:8,
          marginTop:15
        }}>
          <button
            className="btn primary"
            onClick={save}
            disabled={busy}
          >
            {busy?"Saving...":"Save settings"}
          </button>

          <button
            className="btn danger"
            onClick={onLogout}
          >
            Sign out
          </button>
        </div>
      </div>

      <div className="card pad" style={{marginTop:12}}>
        <h3>Account</h3>

        <div className="muted">
          Authentication: Anonymous
        </div>

        <div className="muted" style={{
          marginTop:5,
          wordBreak:"break-all"
        }}>
          User ID: {profile.uid}
        </div>
      </div>
    </div>
  );
}

/* =========================================================
   RIGHT SIDEBAR
========================================================= */

function RightSidebar({posts,users,onProfile}){
  const hashtags={};

  posts.forEach(p=>{
    (p.hashtags||[]).forEach(h=>{
      hashtags[h]=(hashtags[h]||0)+1;
    });
  });

  const trends=Object.entries(hashtags)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,6);

  const suggestions=users
    .filter(x=>x.uid!==uid())
    .slice(0,5);

  return (
    <aside className="right">
      <div className="card right-card">
        <strong>Trending</strong>

        {trends.length===0 && (
          <div className="muted" style={{marginTop:10}}>
            Nothing trending yet.
          </div>
        )}

        {trends.map(([h,count])=>(
          <div className="trend" key={h}>
            <strong>#{h}</strong>
            <span>{count} posts</span>
          </div>
        ))}
      </div>

      <div className="card right-card">
        <strong>People to discover</strong>

        {suggestions.map(u=>(
          <button
            key={u.uid}
            onClick={()=>onProfile(u.uid)}
            style={{
              display:"flex",
              width:"100%",
              gap:8,
              alignItems:"center",
              background:"transparent",
              border:0,
              color:"#fff",
              padding:"10px 0",
              textAlign:"left"
            }}
          >
            <Avatar profile={u} size="small"/>

            <div>
              <strong>{u.displayName}</strong>
              <div className="muted">
                @{u.username}
              </div>
            </div>
          </button>
        ))}
      </div>
    </aside>
  );
}

/* =========================================================
   PRESENCE
========================================================= */

function usePresence(profile){
  useEffect(()=>{
    if(!profile?.uid)return;

    let stopped=false;

    async function update(){
      if(stopped)return;

      try{
        await C("presence")
          .doc(profile.uid)
          .set({
            uid:profile.uid,
            online:true,
            lastSeen:now()
          },{merge:true});
      }catch(err){
        console.error("presence",err);
      }
    }

    update();

    const timer=setInterval(update,30000);

    function offline(){
      C("presence")
        .doc(profile.uid)
        .set({
          online:false,
          lastSeen:now()
        },{merge:true})
        .catch(()=>{});
    }

    window.addEventListener(
      "beforeunload",
      offline
    );

    return ()=>{
      stopped=true;
      clearInterval(timer);
      window.removeEventListener(
        "beforeunload",
        offline
      );
    };
  },[profile?.uid]);
}

        </div>
      </div>

  if(error){

        <div className="boot-box">
          <h1>Nexus couldn't start</h1>

            {error.code

              :""

          <div style={{

            color:"var(--muted)",
            lineHeight:1.6

            <p>
              1. Firebase Authentication → Sign-in method →
              Anonymous must be enabled.

            <p>
              2. If running locally, open Nexus through
              <b> http://localhost</b>, not directly through
              <b> file://</b>.
            </p>

            <p>
              3. Make sure the Firebase project is
              <b> nexus-37600</b>.
            </p>
          </div>

          <button
            className="btn primary"
            onClick={()=>location.reload()}
          >
            Try again
          </button>
        </div>
      </div>
    );
  }

  function openProfile(id){

      behavior:"smooth"
    });

      await auth.signOut();
    }catch(err){

    }
  }

    x=>!x.read
  ).length;

  return (
    <div className="app">
      <div className="topbar">
        <div className="logo" style={{
          padding:0
        }}>
          Nex<span>us</span>
        </div>

        <button
          className="btn"
          onClick={()=>navigate("notifications")}
        >
          🔔 {unread||""}
        </button>
      </div>

      <div className="layout">

        <aside className="left">
          <div className="logo">
            Nex<span>us</span>
          </div>

          <nav className="nav">
            <button
              className={page==="home"?"active":""}
              onClick={()=>navigate("home")}
            >
              🏠 Home
            </button>

            <button
              className={page==="explore"?"active":""}
              onClick={()=>navigate("explore")}
            >
              🔎 Explore
            </button>

            <button
              className={page==="notifications"?"active":""}

            >

                  color:"var(--accent)"
                }}>
                  {unread}
                </span>
              )}
            </button>

            <button
              className={page==="messages"?"active":""}
              onClick={()=>navigate("messages")}
            >
              💬 Messages
            </button>

            <button
              className={page==="profile"?"active":""}
              onClick={()=>{
                setProfileId(profile.uid);
                navigate("profile");
              }}
            >
              👤 Profile
            </button>

            <button
              className={page==="settings"?"active":""}
              onClick={()=>navigate("settings")}
            >
              ⚙ Settings
            </button>
          </nav>

          <div className="card pad" style={{
            marginTop:20
          }}>
            <div style={{
              display:"flex",
              gap:9,
              alignItems:"center"
            }}>
              <Avatar profile={profile} size="small"/>

              <div style={{
                minWidth:0
              }}>
                <strong>{profile.displayName}</strong>
                <div className="muted">
                  @{profile.username}
                </div>
              </div>
            </div>
          </div>
        </aside>

        <main className="main">

          {page==="home" && (
            <Home
              profile={profile}
              data={data}
              onStory={story=>{
                alert(
                  "@"+
                  (

                      x=>x.uid===story.authorId

            />

      <div className="mobile-nav">

        <button
          className={page==="home"?"active":""}
          onClick={()=>navigate("home")}
        >
          🏠<br/>Home
        </button>

        <button
          className={page==="explore"?"active":""}
          onClick={()=>navigate("explore")}
        >
          🔎<br/>Explore
        </button>

        <button
          className={page==="notifications"?"active":""}
          onClick={()=>navigate("notifications")}
        >
          🔔<br/>Alerts
        </button>

        <button

          onClick={()=>navigate("messages")}
