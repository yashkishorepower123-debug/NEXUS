<body>

<div id="root"></div>

<script type="text/babel">

const {
  useEffect,
  useMemo,
  useState
} = React;


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyDTrvD7c1TUtPUUOSX7_-0VV9itC28LOg0",
  authDomain: "nexus-37600.firebaseapp.com",
  projectId: "nexus-37600",
  storageBucket: "nexus-37600.firebasestorage.app",
  messagingSenderId: "61496309341",
  appId: "1:61496309341:web:fdb3711264df47f318bfb4",
  measurementId: "G-41S50YF5RF"
};

const APP_ID = "nexus-37600";

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const rootPath = name =>
  db
    .collection("artifacts")
    .doc(APP_ID)
    .collection("public")
    .doc("data")
    .collection(name);

const now = () =>
  firebase.firestore.FieldValue.serverTimestamp();

const avatarFor = seed =>
  `https://api.dicebear.com/9.x/initials/svg?seed=${encodeURIComponent(seed || "User")}`;


/* =========================================================
   REALTIME DATA
========================================================= */

function useRealtimeData(uid){

  const [data,setData] = useState({
    users:[],
    posts:[],
    comments:[],
    likes:[],
    follows:[],
    notifications:[],
    messages:[]
  });

  const [ready,setReady] = useState(false);

  useEffect(()=>{

    if(!uid) return;

    const unsubs = [];

    const loaded = new Set();

    const collections = [
      "users",
      "posts",
      "comments",
      "likes",
      "follows",
      "notifications",
      "messages"
    ];

    collections.forEach(name=>{

      let q = rootPath(name);

      if(name === "notifications"){
        q = q
          .where("recipientId","==",uid)
          .limit(200);
      }

      if(name === "messages"){
        q = q
          .where("participants","array-contains",uid)
          .limit(500);
      }

      const unsub = q.onSnapshot(
        snap=>{

          loaded.add(name);

          setData(old=>({
            ...old,
            [name]:snap.docs.map(doc=>({
              id:doc.id,
              ...doc.data()
            }))
          }));

          if(loaded.size === collections.length){
            setReady(true);
          }

        },
        error=>{
          console.error("Realtime error:",name,error);
          loaded.add(name);

          if(loaded.size === collections.length){
            setReady(true);
          }
        }
      );

      unsubs.push(unsub);

    });

    return ()=>{
      unsubs.forEach(fn=>fn());
    };

  },[uid]);

  return {
    data,
    ready
  };
}


/* =========================================================
   AUTH
========================================================= */

function ensureProfile(user,users){

  const existing = users.find(
    u=>u.uid === user.uid
  );

  if(existing){
    return Promise.resolve(existing);
  }

  const handle =
    `user${user.uid.slice(0,7)}`;

  const profile = {
    uid:user.uid,
    handle,
    displayName:"New User",
    bio:"",
    avatar:avatarFor(handle),
    createdAt:now()
  };

  return rootPath("users")
    .doc(user.uid)
    .set(profile)
    .then(()=>({
      id:user.uid,
      ...profile
    }));
}


function useAuth(){

  const [currentUser,setCurrentUser] =
    useState(null);

  const [profile,setProfile] =
    useState(null);

  const [loading,setLoading] =
    useState(true);

  useEffect(()=>{

    let cancelled = false;

    const unsub = auth.onAuthStateChanged(
      async user=>{

        if(cancelled) return;

        setCurrentUser(user);

        if(!user){

          setProfile(null);
          setLoading(false);
          return;

        }

        try{

          const snap =
            await rootPath("users")
              .doc(user.uid)
              .get();

          if(!snap.exists){

            const handle =
              `user${user.uid.slice(0,7)}`;

            const p = {
              uid:user.uid,
              handle,
              displayName:"New User",
              bio:"",
              avatar:avatarFor(handle),
              createdAt:now()
            };

            await rootPath("users")
              .doc(user.uid)
              .set(p);

            if(!cancelled){
              setProfile({
                id:user.uid,
                ...p
              });
            }

          }else{

            if(!cancelled){

              setProfile({
                id:snap.id,
                ...snap.data()
              });

            }

          }

        }catch(error){

          console.error(error);

        }

        if(!cancelled){
          setLoading(false);
        }

      }
    );

    (async()=>{

      try{

        if(!auth.currentUser){

          await auth.signInAnonymously();

        }

      }catch(error){

        console.error(error);
        setLoading(false);

      }

    })();

    return ()=>{
      cancelled = true;
      unsub();
    };

  },[]);

  return {
    currentUser,
    profile,
    loading
  };
}


/* =========================================================
   NOTIFICATIONS
========================================================= */

function notify(
  recipientId,
  type,
  actor,
  postId=null
){

  if(
    !recipientId ||
    recipientId === actor.uid
  ){
    return;
  }

  return rootPath("notifications").add({

    recipientId,
    type,
    actorId:actor.uid,
    postId,
    read:false,
    createdAt:now()

  });

}


/* =========================================================
   APP
========================================================= */

function App(){

  const {
    currentUser,
    profile,
    loading
  } = useAuth();

  if(loading){

    return (
      <div className="loading">
        ⚡ Connecting to Nexus...
      </div>
    );

  }

  if(!currentUser || !profile){

    return (
      <AuthScreen/>
    );

  }

  return (
    <Nexus
      user={currentUser}
      profile={profile}
    />
  );

}


/* =========================================================
   AUTH SCREEN
========================================================= */

function AuthScreen(){

  const login = async()=>{

    try{

      await auth.signInAnonymously();

    }catch(error){

      alert(error.message);

    }

  };

  return (

    <div className="auth">

      <div className="card">

        <div
          style={{
            fontSize:55,
            color:"#00ff9c"
          }}
        >
          ⚡
        </div>

        <h1 style={{
          color:"#00ff9c",
          marginBottom:5
        }}>
          NEXUS
        </h1>

        <p className="muted">
          Realtime social network
        </p>

        <button
          className="primary"
          onClick={login}
          style={{
            width:"100%",
            marginTop:15
          }}
        >
          Enter Nexus
        </button>

      </div>

    </div>

  );

}


/* =========================================================
   MAIN NEXUS
========================================================= */

function Nexus({
  user,
  profile
}){

  const {
    data,
    ready
  } = useRealtimeData(user.uid);

  const [view,setView] =
    useState("home");

  const [selectedUser,setSelectedUser] =
    useState(null);

  const [selectedPost,setSelectedPost] =
    useState(null);

  const [search,setSearch] =
    useState("");

  const unread =
    data.notifications.filter(
      n=>!n.read
    ).length;

  const trending =
    useMemo(()=>{

      const map = {};

      data.posts.forEach(post=>{

        (post.hashtags || [])
          .forEach(tag=>{

            map[tag] =
              (map[tag] || 0) + 1;

          });

      });

      return Object.entries(map)
        .sort((a,b)=>b[1]-a[1])
        .slice(0,8);

    },[data.posts]);


  const navigate = (
    target,
    payload=null
  )=>{

    if(target === "profile"){

      setSelectedUser(
        payload || user.uid
      );

      setView("profile");

    }

    else if(target === "messages"){

      setSelectedUser(payload || null);
      setView("messages");

    }

    else if(target === "post"){

      setSelectedPost(payload);
      setView("post");

    }

    else{

      setView(target);
      setSelectedPost(null);

    }

  };


  if(!ready){

    return (
      <div className="loading">
        ⚡ Loading Nexus data...
      </div>
    );

  }


  return (

    <div className="app">

      <header className="top">

        <div className="brand">
          NEXUS
        </div>

        <GlobalSearch
          search={search}
          setSearch={setSearch}
          data={data}
          user={user}
          navigate={navigate}
        />

        <button
          className="secondary"
          onClick={()=>auth.signOut()}
        >
          Sign out
        </button>

      </header>


      <div className="layout">

        {/* LEFT SIDEBAR */}

        <aside className="side card">

          <div className="profile-mini">

            <img
              className="avatar sm"
              src={
                profile.avatar ||
                avatarFor(profile.handle)
              }
            />

            <div>

              <b>
                {profile.displayName}
              </b>

              <div className="muted">
                @{profile.handle}
              </div>

   GLOBAL USER SEARCH
   SEARCH USER -> PROFILE + CHAT
========================================================= */

function GlobalSearch({
  search,
  setSearch,
  data,
  user,
  navigate
}){

  const [open,setOpen] =
    useState(false);

  const q =
    search.trim().toLowerCase();

  const users =
    q
      ? data.users
          .filter(u=>
            u.uid !== user.uid &&
            (
              (u.displayName || "")
                .toLowerCase()
                .includes(q) ||

              (u.handle || "")
                .toLowerCase()
                .includes(
                  q.replace("@","")
                )
            )
          )
          .slice(0,8)
      : [];


  const posts =
    q
      ? data.posts
          .filter(p=>
            (p.content || "")
              .toLowerCase()
              .includes(q)
          )
          .slice(0,5)
      : [];


  const show =
    open &&
    q &&
    (users.length || posts.length);


  return (

    <div className="search">

      <input
        value={search}
        onFocus={()=>{
          setOpen(true)
        }}
        onChange={e=>{
          setSearch(e.target.value);
          setOpen(true);
        }}
        onKeyDown={e=>{
          if(e.key==="Escape"){
            setOpen(false);
          }
        }}
        placeholder="Search people, posts, #hashtags..."
      />


      {show && (

        <div className="search-results">

          {/* USERS */}

          {users.length > 0 && (

            <>

              <div
                style={{
                  padding:"9px 11px",
                  color:"#00ff9c",
                  fontWeight:800,
                  fontSize:12
                }}
              >
                PEOPLE
              </div>


              {users.map(person=>(

                <div
                  className="search-result"
                  key={person.uid}
                >

                  <img
                    className="avatar xs"
                    src={
                      person.avatar ||
                      avatarFor(person.handle)
                    }
                  />


                  <div
                    className="search-result-main"
                    onClick={()=>{
                      setOpen(false);
                      setSearch("");
                      navigate(
                        "profile",
                        person.uid
                      );
                    }}
                  >

                    <b>
                      {person.displayName}
                    </b>

                    <div className="muted">
                      @{person.handle}
                    </div>

                  </div>


                  <div className="search-result-actions">

                    {/* THIS IS THE CHAT BUTTON */}
                    <button
                      className="chat-button"
                      onClick={()=>{
                        setOpen(false);
                        setSearch("");

                        navigate(
                          "messages",
                          person.uid
                        );
                      }}
                    >
                      💬 Chat
                    </button>


                    <button
                      className="profile-button"
                      onClick={()=>{
                        setOpen(false);
                        setSearch("");

                        navigate(
                          "profile",
                          person.uid
                        );
                      }}
                    >
                      Profile
                    </button>

                  </div>

                </div>

              ))}

            </>

          )}


          {/* POSTS */}

          {posts.length > 0 && (

            <>

              <div
                style={{
                  padding:"9px 11px",
                  color:"#00ff9c",
                  fontWeight:800,
                  fontSize:12
                }}
              >
                POSTS
              </div>


              {posts.map(post=>{

                const author =
                  data.users.find(
                    u=>u.uid===post.authorId
                  );

                return (

                  <div
                    className="search-result"
                    key={post.id}
                    onClick={()=>{
                      setOpen(false);
                      setSearch("");

                      navigate(
                        "post",
                        post.id
                      );
                    }}
                  >

                    <img
                      className="avatar xs"
                      src={
                        author?.avatar ||
                        avatarFor(
                          author?.handle ||
                          post.authorId
                        )
                      }
                    />

                    <div
                      className="search-result-main"
                    >

                      <b>
                        {author?.displayName ||
                          "User"}
                      </b>

                      <div
                        className="muted"
                        style={{
                          whiteSpace:"nowrap",
                          overflow:"hidden",
                          textOverflow:"ellipsis"
                        }}
                      >
                        {post.content}
                      </div>

                    </div>

                  </div>

                );

              })}

            </>

          )}

        </div>

      )}

    </div>

  );

}


/* =========================================================
   WHO TO FOLLOW
========================================================= */

function WhoToFollow({
  user,
  data,
  navigate
}){

  const [search,setSearch] =
    useState("");

  const followingIds =
    new Set(
      data.follows
        .filter(
          f=>f.followerId===user.uid
        )
        .map(
          f=>f.followingId
        )
    );


  const query =
    search.trim().toLowerCase();


  const people =
    data.users
      .filter(person=>{

        if(person.uid===user.uid){
          return false;
        }

        if(followingIds.has(person.uid)){
          return false;
        }

        if(!query){
          return true;
        }

        return (
          (person.displayName || "")
            .toLowerCase()
            .includes(query) ||

          (person.handle || "")
            .toLowerCase()
            .includes(
              query.replace("@","")
            )
        );

      })
      .slice(0,8);


  const follow = async person=>{

    const id =
      `${user.uid}_${person.uid}`;

    const ref =
      rootPath("follows").doc(id);

    const snap =
      await ref.get();

    if(snap.exists){

      await ref.delete();

    }else{

      await ref.set({

        followerId:user.uid,
        followingId:person.uid,
        createdAt:now()

      });

      await notify(
        person.uid,
        "follow",
        user
      );

    }

  };


  return (

    <div className="card right-card">

      <div
        style={{
          display:"flex",
          alignItems:"center",
          justifyContent:"space-between"
        }}
      >

        <b>👥 Who to follow</b>

      </div>


      <input
        className="who-search"
        value={search}
        onChange={e=>
          setSearch(e.target.value)
        }
        placeholder="Search people..."
      />


      {people.length ? (

        people.map(person=>(

          <div
            className="person"
            key={person.uid}
          >

            <img
              className="avatar xs"
              src={
                person.avatar ||
                avatarFor(person.handle)
              }
            />


            <div
              className="grow"
              style={{cursor:"pointer"}}
              onClick={()=>
                navigate(
                  "profile",
                  person.uid
                )
              }
            >

              <b>
                {person.displayName}
              </b>

              <div className="muted">
                @{person.handle}
              </div>

            </div>


            <button
              className="follow"
              onClick={()=>
                follow(person)
              }
            >
              Follow
            </button>

          </div>

        ))

      ) : (

        <div className="empty">
          No new people to follow.
        </div>

      )}

    </div>

  );

}


/* =========================================================
   FEED
========================================================= */

function FeedView({
  user,
  profile,
  data,
  search,
  navigate
}){

  const [tab,setTab] =
    useState("all");

  const [draft,setDraft] =
    useState("");

  const [editing,setEditing] =
    useState(null);


  const following =
    new Set(
      data.follows
        .filter(
          f=>f.followerId===user.uid
        )
        .map(
          f=>f.followingId
        )
    );


  const posts =
    data.posts
      .slice()
      .sort(
        (a,b)=>
          (b.createdAt?.seconds||0) -
          (a.createdAt?.seconds||0)
      );


  const filtered =
    posts.filter(post=>{

      if(
        tab==="following" &&
        !following.has(post.authorId) &&
        post.authorId!==user.uid
      ){
        return false;
      }

      if(!search.trim()){
        return true;
      }

      const q =
        search
          .toLowerCase()
          .replace("#","");

      return (
        (post.content || "")
          .toLowerCase()
          .includes(q) ||

        (post.hashtags || [])
          .some(
            tag=>
              tag
                .toLowerCase()
                .includes(q)
          )
      );

    });


  const create = async()=>{

    const text =
      draft.trim();

    if(!text) return;


    const hashtags =
      [
        ...new Set(
          (
            text.match(
              /#[\p{L}\p{N}_-]+/gu
            ) || []
          )
            .map(
              x=>x
                .slice(1)
                .toLowerCase()
            )
        )
      ];


    await rootPath("posts").add({

      authorId:user.uid,
      content:text,
      hashtags,
      createdAt:now(),
      updatedAt:now()

    });


    setDraft("");

  };


  const update = async()=>{

    if(!editing) return;

    const text =
      editing.content.trim();

    if(!text) return;


    const hashtags =
      [
        ...new Set(
          (
            text.match(
              /#[\p{L}\p{N}_-]+/gu
            ) || []
          )
            .map(
              x=>x
                .slice(1)
                .toLowerCase()
            )
        )
      ];


    await rootPath("posts")
      .doc(editing.id)
      .update({

        content:text,
        hashtags,
        updatedAt:now()

      });


    setEditing(null);

  };


  return (

    <>

      <div className="card composer">

        <div className="row">

          <img
            className="avatar sm"
            src={
              profile.avatar ||
              avatarFor(profile.handle)
            }
          />

          <b>
            {profile.displayName}
          </b>

        </div>


        <textarea
          value={draft}
          onChange={e=>
            setDraft(e.target.value)
          }
          placeholder="What's happening? Use #hashtags"
        />


        <div className="actions">

          <span className="muted">
            Posts update in realtime.
          </span>

          <button
            className="primary"
            onClick={create}
          >
            Post
          </button>

        </div>

      </div>


      <div
        className="row"
        style={{marginBottom:12}}
      >

        <button
          className={
            tab==="all"
              ?"primary"
              :"secondary"
          }
          onClick={()=>
            setTab("all")
          }
        >
          All posts
        </button>


        <button
          className={
            tab==="following"
              ?"primary"
              :"secondary"
          }
          onClick={()=>
            setTab("following")
          }
        >
          Following
        </button>

      </div>


      {filtered.map(post=>(

        <PostCard
          key={post.id}
          post={post}
          user={user}
          profile={profile}
          data={data}
          navigate={navigate}
          onEdit={setEditing}
        />

      ))}


      {!filtered.length && (

        <div className="card empty">
          No posts found.
        </div>

      )}


      {editing && (

        <Modal
          title="Edit post"
          onClose={()=>
            setEditing(null)
          }
        >

          <textarea
            value={editing.content}
            onChange={e=>
              setEditing({
                ...editing,
                content:e.target.value
              })
            }
          />


          <div className="modal-actions">

            <button
              className="secondary"
              onClick={()=>
                setEditing(null)
              }
            >
              Cancel
            </button>


            <button
              className="primary"
              onClick={update}
            >
              Save
            </button>

          </div>

        </Modal>

      )}

    </>

  );

}


/* =========================================================
   POST CARD
========================================================= */

function PostCard({
  post,
  user,
  profile,
  data,
  navigate,
  onEdit
}){

  const author =
    data.users.find(
      u=>u.uid===post.authorId
    ) || {
      uid:post.authorId,
      displayName:"User",
      handle:"user",
      avatar:avatarFor(
        post.authorId
      )
    };


  const liked =
    data.likes.some(
      like=>
        like.postId===post.id &&
        like.userId===user.uid
    );


  const comments =
    data.comments
      .filter(
        comment=>
          comment.postId===post.id
      )
      .sort(
        (a,b)=>
          (a.createdAt?.seconds||0) -
          (b.createdAt?.seconds||0)
      );


  const [comment,setComment] =
    useState("");


  const toggleLike = async()=>{

    const id =
      `${post.id}_${user.uid}`;

    const ref =
      rootPath("likes").doc(id);

    const snap =
      await ref.get();

    if(snap.exists){

      await ref.delete();

    }else{

      await ref.set({

        postId:post.id,
        userId:user.uid,
        createdAt:now()

      });

      await notify(
        post.authorId,
        "like",
        user,
        post.id
      );

    }

  };


  const addComment = async()=>{

    const text =
      comment.trim();

    if(!text) return;


    await rootPath("comments").add({

      postId:post.id,
      authorId:user.uid,
      content:text,
      createdAt:now()

    });


    await notify(
      post.authorId,
      "comment",
      user,
      post.id
    );


    setComment("");

  };


  const remove = async()=>{

    if(
      !confirm(
        "Delete this post?"
      )
    ){
      return;
    }


    await rootPath("posts")
      .doc(post.id)
      .delete();


    const batch =
      db.batch();


    data.likes
      .filter(
        x=>x.postId===post.id
      )
      .forEach(
        x=>
          batch.delete(
            rootPath("likes")
              .doc(x.id)
          )
      );


    data.comments
      .filter(
        x=>x.postId===post.id
      )
      .forEach(
        x=>
          batch.delete(
            rootPath("comments")
              .doc(x.id)
          )
      );


    await batch.commit();

  };


  return (

    <article className="card post">

      <div className="post-head">

        <img
          className="avatar sm"
          src={
            author.avatar ||
            avatarFor(author.handle)
          }
        />


        <div>

          <b
            style={{cursor:"pointer"}}
            onClick={()=>
              navigate(
                "profile",
                author.uid
              )
            }
          >
            {author.displayName}
          </b>

          <div className="muted">
            @{author.handle}
          </div>

        </div>


        {post.authorId===user.uid && (

          <div className="post-menu">

            <button
              className="secondary"
              onClick={()=>
                onEdit(post)
              }
            >
              Edit
            </button>


            <button
              className="danger"
              onClick={remove}
            >
              Delete
            </button>

          </div>

        )}

      </div>


      <div className="post-body">
        {post.content}
      </div>


      {(post.hashtags || []).length > 0 && (

        <div className="tags">

          {post.hashtags.map(tag=>(

            <span key={tag}>
              #{tag}{" "}
            </span>

          ))}

        </div>

      )}


      <div className="post-actions">

        <button
          className={
            liked ? "liked" : ""
          }
          onClick={toggleLike}
        >
          ♥{" "}
          {
            data.likes.filter(
              l=>l.postId===post.id
            ).length
          }
        </button>


        <button
          onClick={()=>
            document
              .getElementById(
                `comment-${post.id}`
              )
              ?.focus()
          }
        >
          💬 {comments.length}
        </button>


        <button
          onClick={()=>
            navigate(
              "post",
              post.id
            )
          }
        >
          Open
        </button>

      </div>


      <div>

        {comments
          .slice(-3)
          .map(comment=>{

            const commentUser =
              data.users.find(
                u=>
                  u.uid===
                  comment.authorId
              ) || {
                displayName:"User",
                avatar:avatarFor(
                  comment.authorId
                )
              };


            return (

              <div
                className="comment"
                key={comment.id}
              >

                <img
                  className="avatar xs"
                  src={commentUser.avatar}
                />

                <div className="comment-body">

                  <b>
                    {commentUser.displayName}
                  </b>{" "}

                  <span>
                    {comment.content}
                  </span>

                </div>

              </div>

            );

          })}

      </div>


      <div className="comment-form">

        <input
          id={`comment-${post.id}`}
          value={comment}
          onChange={e=>
            setComment(e.target.value)
          }
          onKeyDown={e=>{
            if(e.key==="Enter"){
              addComment();
            }
          }}
          placeholder="Write a comment..."
        />


        <button
          className="primary"
          onClick={addComment}
        >
          Send
        </button>

      </div>

    </article>

  );

}

                >
                  {following
                    ?"Unfollow"
                    :"Follow"}
                </button>


                <button
                  className="chat-button"
                  onClick={()=>
                    navigate(
                      "messages",
                      person.uid
                    )
                  }
                >
                  💬 Chat
                </button>

              </div>

            )}

          </div>

        </div>

      </div>


      <h3
        className="page-title"
        style={{marginTop:18}}
      >
        Posts
      </h3>


      {posts.map(post=>(

        <PostCard
          key={post.id}
          post={post}
          user={user}
          profile={profile}
          data={data}
          navigate={navigate}
          onEdit={()=>{}}
        />

      ))}


      {!posts.length && (

        <div className="card empty">
          No posts yet.
        </div>

      )}


      {edit && (

        <Modal
          title="Edit profile"
          onClose={()=>
            setEdit(false)
          }
        >

          <input
            style={{
              width:"100%",
              padding:10,
              marginBottom:8,
              borderRadius:9
            }}
            value={name}
            onChange={e=>
              setName(e.target.value)
            }
            placeholder="Display name"
          />


          <input
            style={{
              width:"100%",
              padding:10,
              marginBottom:8,
              borderRadius:9
            }}
            value={avatar}
            onChange={e=>
              setAvatar(e.target.value)
            }
            placeholder="Avatar image URL"
          />


          <textarea
            value={bio}
            onChange={e=>
              setBio(e.target.value)
            }
            placeholder="Bio"
          />


          <div className="modal-actions">

            <button
              className="secondary"
              onClick={()=>
                setEdit(false)
              }
            >
              Cancel
            </button>


            <button
              className="primary"
              onClick={save}
            >
              Save
            </button>

          </div>

        </Modal>

      )}

    </>

  );

}


/* =========================================================
   MESSAGING
   DIRECT CHAT FROM USER SEARCH
========================================================= */

function MessagingView({
  user,
  data,
  initialUserId
}){

  const people =
    data.users.filter(
      person=>
        person.uid!==user.uid
    );


  const [selected,setSelected] =
    useState(
      initialUserId ||
      people[0]?.uid ||
      null
    );


  const [text,setText] =
    useState("");


  const [search,setSearch] =
    useState("");


  const [mobileChat,setMobileChat] =
    useState(!!initialUserId);


  /*
     IMPORTANT FIX:
     When the user searches somebody
     and presses Chat, initialUserId changes.
     This effect switches the open conversation.
  */

  useEffect(()=>{

    if(initialUserId){

      setSelected(initialUserId);
      setMobileChat(true);

    }

  },[initialUserId]);


  const filteredPeople =
    people.filter(person=>{

      const q =
        search
          .trim()
          .toLowerCase();

      if(!q) return true;

      return (
        (person.displayName || "")
          .toLowerCase()
          .includes(q) ||

        (person.handle || "")
          .toLowerCase()
          .includes(
            q.replace("@","")
          )
      );

    });


  const partner =
    people.find(
      p=>p.uid===selected
    );


  const messages =
    selected
      ? data.messages
          .filter(
            message=>
              message.participants?.includes(
                user.uid
              ) &&
              message.participants?.includes(
                selected
              )
          )
          .sort(
            (a,b)=>
              (a.createdAt?.seconds||0) -
              (b.createdAt?.seconds||0)
          )
      : [];


  const send = async()=>{

    const value =
      text.trim();

    if(
      !value ||
      !selected
    ){
      return;
    }


    await rootPath("messages").add({

      senderId:user.uid,

      receiverId:selected,

      participants:[
        user.uid,
        selected
      ],

      content:value,

      createdAt:now(),

      read:false

    });


    setText("");

  };


  return (

    <>

      <h2 className="page-title">
        Messages
      </h2>


      <div
        className={
          "card messages " +
          (
            mobileChat
              ?"mobile-chat"
              :""
          )
        }
      >

        {/* PEOPLE */}

        <div className="users">

          <div className="messages-search">

            <input
              value={search}
              onChange={e=>
                setSearch(e.target.value)
              }
              placeholder="Search chats..."
            />

          </div>


          {filteredPeople.map(person=>(

            <div
              className={
                "user-item " +
                (
                  person.uid===selected
                    ?"active"
                    :""
                )
              }
              key={person.uid}
              onClick={()=>{

                setSelected(
                  person.uid
                );

                setMobileChat(true);

              }}
            >

              <img
                className="avatar xs"
                src={
                  person.avatar ||
                  avatarFor(
                    person.handle
                  )
                }
              />


              <div className="user-grow">

                <b>
                  {person.displayName}
                </b>

                <div className="muted">
                  @{person.handle}
                </div>

              </div>

            </div>

          ))}


          {!filteredPeople.length && (

            <div className="empty">
              No users found.
            </div>

          )}

        </div>


        {/* CHAT */}

        <div className="chat">

          {partner ? (

            <>

              <div className="chat-head">

                <button
                  className="secondary mobile-chat-back"
                  onClick={()=>
                    setMobileChat(false)
                  }
                >
                  ←
                </button>


                <img
                  className="avatar xs"
                  src={
                    partner.avatar ||
                    avatarFor(
                      partner.handle
                    )
                  }
                />


                <div className="chat-head-info">

                  <b>
                    {partner.displayName}
                  </b>

                  <div className="muted">
                    @{partner.handle}
                  </div>

                </div>


                <button
                  className="profile-button"
                  onClick={()=>{
                    // This button is intentionally
                    // handled by the parent search/profile
                    // navigation when needed.
                  }}
                >
                  Online
                </button>

              </div>


              <div className="chat-list">

                {messages.map(message=>(

                  <div
                    key={message.id}
                    className={
                      "bubble " +
                      (
                        message.senderId===user.uid
                          ?"mine"
                          :"theirs"
                      )
                    }
                  >
                    {message.content}
                  </div>

                ))}


                {!messages.length && (

                  <div className="empty">
                    Start the conversation with{" "}
                    <b>
                      {partner.displayName}
                    </b>
                    .
                  </div>

                )}

              </div>


              <div className="chat-form">

                <input
                  value={text}
                  onChange={e=>
                    setText(e.target.value)
                  }
                  onKeyDown={e=>{

                    if(e.key==="Enter"){
                      send();
                    }

                  }}
                  placeholder="Type a message..."
                />


                <button
                  className="primary"
                  onClick={send}
                >
                  Send
                </button>

              </div>

            </>

          ) : (

            <div className="empty">
              Select someone to start chatting.
            </div>

          )}

        </div>

      </div>

    </>

  );

}


/* =========================================================
   NOTIFICATIONS
========================================================= */

function NotificationsView({
  user,
  data,
  navigate
}){

  const notes =
    data.notifications
      .slice()
      .sort(
        (a,b)=>
          (b.createdAt?.seconds||0) -
          (a.createdAt?.seconds||0)
      );


  const mark = async note=>{

    if(!note.read){

      await rootPath("notifications")
        .doc(note.id)
        .update({
          read:true
        });

    }


    if(note.postId){

      navigate(
        "post",
        note.postId
      );

    }else if(
      note.type==="follow"
    ){

      navigate(
        "profile",
        note.actorId
      );

    }

  };


  const text = note=>{

    if(note.type==="like"){
      return "liked your post";
    }

    if(note.type==="comment"){
      return "commented on your post";
    }

    if(note.type==="follow"){
      return "followed you";
    }

    return "interacted with you";

  };


  return (

    <>

      <h2 className="page-title">
        Notifications
      </h2>


      <div className="card">

        {notes.map(note=>{

          const actor =
            data.users.find(
              u=>u.uid===note.actorId
            ) || {
              displayName:"Someone",
              avatar:avatarFor(
                note.actorId
              )
            };


          return (

            <div
              className={
                "notice " +
                (
                  !note.read
                    ?"unread"
                    :""
                )
              }
              key={note.id}
              onClick={()=>
                mark(note)
              }
            >

              <div className="row">

                <img
                  className="avatar xs"
                  src={
                    actor.avatar ||
                    avatarFor(
                      actor.handle
                    )
                  }
                />


                <span>

                  <b>
                    {actor.displayName}
                  </b>{" "}

                  {text(note)}.

                </span>

              </div>

            </div>

          );

        })}


        {!notes.length && (

          <div className="empty">
            No notifications yet.
          </div>

        )}

      </div>

    </>

  );

}


/* =========================================================
   MODAL
========================================================= */

function Modal({
  title,
  onClose,
  children
}){

  return (

    <div
      className="modal-bg"
      onMouseDown={e=>{

        if(
          e.target===
          e.currentTarget
        ){
          onClose();
        }

      }}
    >

      <div className="modal">

        <div className="row">

          <h3
            style={{
              margin:0,
              color:"#00ff9c"
            }}
          >
            {title}
          </h3>


          <button
            className="secondary"
            style={{
              marginLeft:"auto"
            }}
            onClick={onClose}
          >
            ✕
          </button>

        </div>


        <div style={{marginTop:14}}>
          {children}
        </div>

      </div>

    </div>

  );

}


/* =========================================================
   START APP
========================================================= */

ReactDOM
  .createRoot(
    document.getElementById("root")
  )
  .render(
    <App/>
  );

</script>
