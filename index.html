<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexus — Social Platform</title>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f7fb;
  color:#172033
}

button,input,textarea{font:inherit}
button{cursor:pointer;border:0}

.app{min-height:100vh}

.top{
  position:sticky;
  top:0;
  z-index:20;
  background:#fff;
  border-bottom:1px solid #e7eaf0;
  padding:12px 18px;
  display:flex;
  align-items:center;
  gap:16px
}

.brand{
  font-weight:900;
  font-size:22px;
  color:#5b5ce2
}

.search{
  flex:1;
  max-width:620px;
  margin:auto
}

.search input{
  width:100%;
  padding:11px 14px;
  border:1px solid #dfe3eb;
  border-radius:12px;
  outline:none
}

.layout{
  max-width:1200px;
  margin:0 auto;
  display:grid;
  grid-template-columns:210px minmax(0,1fr) 280px;
  gap:20px;
  padding:20px
}

.card{
  background:#fff;
  border:1px solid #e7eaf0;
  border-radius:16px;
  box-shadow:0 4px 18px rgba(30,40,70,.04)
}

.side{
  position:sticky;
  top:82px;
  height:max-content
}

.nav button{
  width:100%;
  background:none;
  text-align:left;
  padding:12px 15px;
  border-radius:10px;
  color:#4d5668
}

.nav button.active,
.nav button:hover{
  background:#eef0ff;
  color:#4d50d6;
  font-weight:700
}

.profile-mini{
  padding:16px;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid #eee
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd
}

.avatar.sm{
  width:36px;
  height:36px
}

.avatar.xs{
  width:30px;
  height:30px
}

.muted{
  color:#788294;
  font-size:13px
}

.main{
  min-width:0
}

.composer{
  padding:16px;
  margin-bottom:14px
}

.row{
  display:flex;
  align-items:center;
  gap:10px
}

.composer textarea{
  width:100%;
  border:1px solid #e1e5ed;
  border-radius:12px;
  padding:12px;
  resize:vertical;
  min-height:72px;
  outline:none
}

.actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:10px
}

.primary{
  background:#5b5ce2;
  color:#fff;
  padding:10px 15px;
  border-radius:10px;
  font-weight:700
}

.secondary{
  background:#eef0f5;
  color:#343b4b;
  padding:9px 13px;
  border-radius:10px
}

.danger{
  color:#d34a4a;
  background:#fff0f0;
  padding:8px 10px;
  border-radius:9px
}

.post{
  padding:16px;
  margin-bottom:14px
}

.post-head{
  display:flex;
  gap:10px;
  align-items:center
}

.post-menu{
  margin-left:auto
}

.post-body{
  white-space:pre-wrap;
  line-height:1.55;
  margin:13px 0
}

.tags{
  color:#5358d9
}

.post-actions{
  display:flex;
  gap:7px;
  border-top:1px solid #edf0f4;
  padding-top:10px
}

.post-actions button{
  background:none;
  color:#626b7b;
  padding:7px 9px;
  border-radius:8px
}

.post-actions button:hover{
  background:#f3f4f7
}

.liked{
  color:#d64b69!important
}

.comment{
  display:flex;
  gap:8px;
  margin-top:10px
}

.comment-body{
  background:#f3f5f8;
  border-radius:11px;
  padding:8px 10px;
  flex:1
}

.comment-form{
  display:flex;
  gap:8px;
  margin-top:10px
}

.comment-form input{
  flex:1;
  border:1px solid #e0e4eb;
  border-radius:10px;
  padding:9px
}

.right-card{
  padding:15px;
  margin-bottom:14px
}

.trend{
  padding:9px 0;
  border-bottom:1px solid #edf0f4
}

.trend:last-child{
  border-bottom:0
}

.person{
  display:flex;
  gap:9px;
  align-items:center;
  padding:9px 0
}

.person .grow{
  flex:1
}

.follow{
  background:#eef0ff;
  color:#5154d7;
  padding:7px 10px;
  border-radius:8px;
  font-weight:700
}

.following{
  background:#e9f7ef;
  color:#20814c
}

.page-title{
  margin:0 0 14px
}

.profile-cover{
  padding:20px
}

.profile-top{
  display:flex;
  gap:14px;
  align-items:center
}

.profile-big{
  width:82px;
  height:82px
}

.profile-edit{
  margin-left:auto
}

/* CHAT */

.messages{
  height:620px;
  display:grid;
  grid-template-columns:300px 1fr;
  overflow:hidden
}

.users{
  border-right:1px solid #e8ebf0;
  overflow:auto;
  background:#fff
}

.messages-title{
  padding:16px;
  border-bottom:1px solid #e8ebf0;
  font-weight:800
}

.user-item{
  padding:13px 14px;
  display:flex;
  gap:10px;
  align-items:center;
  cursor:pointer;
  border-bottom:1px solid #f0f2f5
}

.user-item.active,
.user-item:hover{
  background:#f1f3ff
}

.user-item .grow{
  min-width:0;
  flex:1
}

.chat-preview{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:190px
}

.chat-time{
  font-size:11px;
  color:#8a93a3;
  white-space:nowrap
}

.chat{
  display:flex;
  flex-direction:column;
  min-width:0;
  background:#fafbfe
}

.chat-head{
  padding:12px 14px;
  border-bottom:1px solid #e8ebf0;
  background:#fff;
  display:flex;
  align-items:center;
  gap:10px
}

.chat-back{
  display:none
}

.chat-list{
  flex:1;
  overflow:auto;
  padding:14px;
  background:#fafbfe
}

.bubble{
  max-width:72%;
  padding:9px 12px;
  border-radius:13px;
  margin:6px 0;
  word-break:break-word
}

.mine{
  background:#5b5ce2;
  color:#fff;
  margin-left:auto
}

.theirs{
  background:#eef1f5
}

.chat-form{
  display:flex;
  gap:8px;
  padding:12px;
  border-top:1px solid #e8ebf0;
  background:#fff
}

.chat-form input{
  flex:1;
  border:1px solid #dde2ea;
  border-radius:10px;
  padding:10px
}

.chat-error{
  padding:0 12px 10px;
  color:#d34a4a;
  font-size:13px
}

.notice{
  padding:12px;
  border-bottom:1px solid #edf0f4;
  cursor:pointer
}

.notice.unread{
  background:#f3f4ff
}

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(15,20,35,.45);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:50;
  padding:18px
}

.modal{
  background:#fff;
  width:min(520px,100%);
  border-radius:16px;
  padding:18px
}

.modal textarea{
  width:100%;
  min-height:150px;
  border:1px solid #dde2ea;
  border-radius:10px;
  padding:10px
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:12px
}

.empty{
  padding:35px;
  text-align:center;
  color:#7a8495
}

.loading{
  padding:50px;
  text-align:center
}

.auth{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px
}

.auth .card{
  width:min(460px,100%);
  padding:28px;
  text-align:center
}

.credit{
  margin-top:18px;
  color:#788294;
  font-size:12px
}

@media(max-width:980px){
  .layout{
    grid-template-columns:180px minmax(0,1fr)
  }

  .right{
    display:none
  }
}

@media(max-width:700px){
  .layout{
    display:block;
    padding:10px
  }

  .side{
    position:static;
    margin-bottom:10px
  }

  .nav{
    display:flex;
    overflow:auto
  }

  .nav button{
    white-space:nowrap;
    width:auto
  }

  .messages{
    height:70vh;
    display:block;
    position:relative
  }

  .messages.mobile-chat .users{
    display:none
  }

  .messages.mobile-chat .chat{
    display:flex
  }

  .messages:not(.mobile-chat) .chat{
    display:none
  }

  .messages:not(.mobile-chat) .users{
    display:block;
    height:100%;
    border-right:0
  }

  .messages-title{
    padding:13px 14px
  }

  .user-item{
    padding:13px
  }

  .chat-back{
    display:inline-flex
  }

  .chat-preview{
    max-width:calc(100vw - 150px)
  }

  .top{
    padding:10px
  }

  .brand{
    font-size:19px
  }

  .search{
    max-width:none
  }
}
</style>
</head>

/* =========================================================
   ONLY YASH KISHORE GETS THE UPLOADED PHOTO
========================================================= */

function isYashProfile(p){

  if(!p)return false;

  const name=String(
    p.displayName||
    p.name||
    ""
  ).trim().toLowerCase();

  const handle=String(
    p.handle||
    p.username||
    ""
  ).trim().toLowerCase();

  return(
    name==="yash kishore" ||
    name.includes("yash kishore") ||
    handle==="yashkishore" ||
    handle==="yash_kishore" ||
    handle==="yash-kishore"
  );
}

function profileAvatar(p){

  if(isYashProfile(p)){
    return YASH_AVATAR;
  }

  return p?.avatar ||
         avatarFor(
           p?.handle||
           p?.username||
           p?.displayName||
           "User"
         );
}


/* =========================================================
   REALTIME DATA
========================================================= */

function useRealtimeData(uid){

  const [data,setData]=useState({
    users:[],
    posts:[],
    comments:[],
    likes:[],
    follows:[],
    notifications:[],
    messages:[]
  });

  const [ready,setReady]=useState(false);

  useEffect(()=>{

    if(!uid)return;

    const unsubs=[];

    const collections=[
      "users",
      "posts",
      "comments",
      "likes",
      "follows",
      "notifications",
      "messages"
    ];

    collections.forEach(name=>{

      let q=rootPath(name);

      if(name==="notifications"){
        q=q.where(
          "recipientId",
          "==",
          uid
        );
      }

      if(name==="messages"){
        q=q.where(
          "participants",
          "array-contains",
          uid
        );
      }

      unsubs.push(
        q.onSnapshot(
          snapshot=>{

            const rows=snapshot.docs.map(
              doc=>({
                id:doc.id,
                ...doc.data()
              })
            );

            setData(old=>({
              ...old,
              [name]:rows
            }));

          },
          error=>{
            console.error(
              "Nexus "+name+" listener:",
              error
            );
          }
        )
      );

    });

    setReady(true);

    return()=>{
      unsubs.forEach(unsub=>{
        try{
          unsub();
        }catch(e){}
      });
    };

  },[uid]);

  return{
    data,
    ready
  };
}


/* =========================================================
   AUTH
========================================================= */

function useAuth(){

  const [user,setUser]=useState(null);
  const [profile,setProfile]=useState(null);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{

    let alive=true;

    const unsub=auth.onAuthStateChanged(
      async currentUser=>{

        if(!alive)return;

        setUser(currentUser);

        if(!currentUser){
          setProfile(null);
          setLoading(false);
          return;
        }

        try{

          const ref=rootPath(
            "users"
          ).doc(currentUser.uid);

          const snap=await ref.get();

          if(!snap.exists){

            const handle=
              "user"+
              currentUser.uid
                .slice(0,7);

            const newProfile={
              uid:currentUser.uid,
              handle,
              displayName:"New User",
              bio:"",
              avatar:avatarFor(handle),
              createdAt:now()
            };

            await ref.set(
              newProfile
            );

            setProfile(
              newProfile
            );

          }else{

            setProfile({
              id:snap.id,
              ...snap.data()
            });

          }

        }catch(error){

          console.error(
            "Profile error:",
            error
          );

        }

        setLoading(false);

      }
    );

    (async()=>{

      try{

        if(!auth.currentUser){

          await auth.signInAnonymously();

        }

      }catch(error){

        console.error(
          "Authentication error:",
          error
        );

        setLoading(false);

      }

    })();

    return()=>{
      alive=false;
      unsub();
    };

  },[]);

  return{
    user,
    profile,
    loading
  };
}


/* =========================================================
   NOTIFICATIONS
========================================================= */

function notify(
  recipientId,
  type,
  actor,
  postId,
  extra={}
){

  if(
    !recipientId||
    recipientId===actor.uid
  ){
    return Promise.resolve();
  }

  return rootPath(
    "notifications"
  ).add({

    recipientId,
    type,
    actorId:actor.uid,
    postId:postId||null,
    read:false,
    createdAt:now(),

    ...extra

  });

}


/* =========================================================
   APP
========================================================= */

function App(){

  const {
    user,
    profile,
    loading
  }=useAuth();

  if(loading){

    return(
      <div className="loading">
        Loading Nexus…
      </div>
    );

  }

  if(!user||!profile){

    return <AuthScreen/>;

  }

  return(
    <Nexus
      user={user}
      profile={profile}
    />
  );
}

/* =========================================================
   MAIN NEXUS
========================================================= */

function Nexus({
  user,
  profile
}){

  const {
    data,
    ready
  }=useRealtimeData(user.uid);

  const [
    view,
    setView
  ]=useState("home");

  const [
    selectedUser,
    setSelectedUser
  ]=useState(null);

  const [
    selectedPost,
    setSelectedPost
  ]=useState(null);

  const [
    search,
    setSearch
  ]=useState("");

  const unread=
    data.notifications.filter(
      n=>!n.read
    ).length;

  const trending=
    useMemo(()=>{

      const map={};

      data.posts.forEach(post=>{

        (post.hashtags||[])
          .forEach(tag=>{

            map[tag]=
              (map[tag]||0)+1;

          });

      });

      return Object
        .entries(map)
        .sort(
          (a,b)=>b[1]-a[1]
        )
        .slice(0,8);

    },[data.posts]);

  const navigate=(
    target,
    payload=null
  )=>{

    if(target==="profile"){

      setSelectedUser(
        payload||user.uid
      );

      setView("profile");

    }else if(target==="post"){

      setSelectedPost(payload);

      setView("post");

    }else{

      setView(target);

      setSelectedPost(null);

    }

  };

  if(!ready){

    return(
      <div className="loading">
        Connecting to Nexus…
      </div>
    );

  }

  return(

    <div className="app">

      <header className="top">

        <div className="brand">
          Nexus
        </div>

        <div className="search">

          <input
            value={search}
            onChange={e=>
              setSearch(e.target.value)
            }
            placeholder="Search people, posts, #hashtags…"
          />

        </div>

        <button
          className="secondary"
          onClick={()=>
            auth.signOut()
          }
        >
          Sign out
        </button>

      </header>


      <div className="layout">

        <aside className="side card">

          <div className="profile-mini">

            <img
              className="avatar sm"
              src={profileAvatar(profile)}
            />

            <div>

              <b>
                {profile.displayName}
              </b>

              <div className="muted">
                @{profile.handle}
              </div>

            </div>

          </div>


          <nav className="nav">

            <button
              className={
                view==="home"
                  ?"active"
                  :""
              }
              onClick={()=>
                navigate("home")
              }
            >
              🏠 Home
            </button>

            <button
              className={
                view==="notifications"
                  ?"active"
                  :""
              }
              onClick={()=>
                navigate("notifications")
              }
            >
              🔔 Notifications
              {unread>0&&
                ` (${unread})`
              }
            </button>

            <button
              className={
                view==="messages"
                  ?"active"
                  :""
              }
              onClick={()=>
                navigate("messages")
              }
            >
              💬 Messages
            </button>

            <button
              className={
                view==="profile"
                  ?"active"
                  :""
              }
              onClick={()=>
                navigate(
                  "profile",
                  user.uid
                )
              }
            >
              👤 Profile
            </button>

          </nav>

        </aside>


        <main className="main">

          {view==="home"&&
            <FeedView
              user={user}
              profile={profile}
              data={data}
              search={search}
              trending={trending}
              navigate={navigate}
            />
          }

          {view==="profile"&&
            <ProfileView
              user={user}
              profile={profile}
              data={data}
              profileId={
                selectedUser||
                user.uid
              }
              navigate={navigate}
            />
          }

          {view==="messages"&&
            <MessagingView
              user={user}
              profile={profile}
              data={data}
            />
          }

          {view==="notifications"&&
            <NotificationsView

function WhoToFollow({
  user,
  data
}){

  const following=data.follows
    .filter(
      f=>f.followerId===user.uid
    )
    .map(
      f=>f.followingId
    );

  const people=data.users
    .filter(
      u=>
        u.uid!==user.uid &&
        !following.includes(u.uid)
    )
    .slice(0,5);

  const toggle=async target=>{

    const id=
      `${user.uid}_${target.uid}`;

    const ref=
      rootPath("follows")
        .doc(id);

    const snap=
      await ref.get();

    if(snap.exists){

      await ref.delete();

    }else{

      await ref.set({
        followerId:user.uid,
        followingId:target.uid,
        createdAt:now()
      });

      await notify(
        target.uid,
        "follow",
        user
      );

    }

  };

  return(

    <div className="card right-card">

      <b>Who to follow</b>

      {people.length?

        people.map(person=>(

          <div
            className="person"
            key={person.uid}
          >

            <img
              className="avatar xs"
              src={profileAvatar(person)}
            />

            <div className="grow">

              <b>
                {person.displayName}
              </b>

              <div className="muted">
                @{person.handle}
              </div>

            </div>

            <button
              className="follow"
              onClick={()=>
                toggle(person)
              }
            >
              Follow
            </button>

          </div>

        ))

        :

        <div className="empty">
          You're following everyone shown.
        </div>

      }

    </div>

  );
}


/* =========================================================
   FEED
========================================================= */

function FeedView({
  user,
  profile,
  data,
  search,
  navigate
}){

  const [tab,setTab]=useState("all");

  const [draft,setDraft]=useState("");

  const [editing,setEditing]=
    useState(null);

  const following=new Set(
    data.follows
      .filter(
        f=>f.followerId===user.uid
      )
      .map(
        f=>f.followingId
      )
  );

  const posts=data.posts
    .slice()
    .sort(
      (a,b)=>
        (b.createdAt?.seconds||0)-
        (a.createdAt?.seconds||0)
    );

  const filtered=posts.filter(post=>{

    if(
      tab==="following" &&
      !following.has(post.authorId) &&
      post.authorId!==user.uid
    ){
      return false;
    }

    if(!search.trim()){
      return true;
    }

    const q=
      search
        .toLowerCase()
        .trim();

    return(
      (post.content||"")
        .toLowerCase()
        .includes(q)
      ||
      (post.hashtags||[])
        .some(tag=>
          tag
            .toLowerCase()
            .includes(
              q.replace("#","")
            )
        )
    );

  });


  const create=async()=>{

    const text=draft.trim();

    if(!text)return;

    const hashtags=[
      ...new Set(
        (
          text.match(
            /#[\p{L}\p{N}_-]+/gu
          )||[]
        )
        .map(
          x=>x.slice(1).toLowerCase()
        )
      )
    ];

    await rootPath("posts").add({

      authorId:user.uid,

      authorName:
        profile.displayName,

      authorUsername:
        profile.handle,

      content:text,

      hashtags,

      createdAt:now(),

      updatedAt:now()

    });

    setDraft("");

  };


  const update=async()=>{

    if(!editing)return;

    const text=
      editing.content.trim();

    if(!text)return;

    const hashtags=[
      ...new Set(
        (
          text.match(
            /#[\p{L}\p{N}_-]+/gu
          )||[]
        )
        .map(
          x=>x.slice(1).toLowerCase()
        )
      )
    ];

    await rootPath("posts")
      .doc(editing.id)
      .update({

        content:text,

        hashtags,

        updatedAt:now()

      });

    setEditing(null);

  };


  return(

    <>

      <div className="card composer">

        <div className="row">

          <img
            className="avatar sm"
            src={profileAvatar(profile)}
          />

          <b>
            {profile.displayName}
          </b>

        </div>

        <textarea
          value={draft}
          onChange={e=>
            setDraft(e.target.value)
          }
          placeholder="What's happening? Use #hashtags"
        />

        <div className="actions">

          <span className="muted">
            Posts update in realtime.
          </span>

          <button
            className="primary"
            onClick={create}
          >
            Post
          </button>

        </div>

      </div>


      <div
        className="row"
        style={{marginBottom:12}}
      >

        <button
          className={
            tab==="all"
              ?"primary"
              :"secondary"
          }
          onClick={()=>
            setTab("all")
          }
        >
          All posts
        </button>

        <button
          className={
            tab==="following"
              ?"primary"
              :"secondary"
          }
          onClick={()=>
            setTab("following")
          }
        >
          Following
        </button>

      </div>


      {filtered.map(post=>

        <PostCard
          key={post.id}
          post={post}
          user={user}
          profile={profile}
          data={data}
          navigate={navigate}
          onEdit={setEditing}
        />

      )}


      {!filtered.length&&

        <div className="card empty">
          No posts found.
        </div>

      }


      {editing&&

        <Modal
          title="Edit post"
          onClose={()=>
            setEditing(null)
          }
        >

          <textarea
            value={editing.content}
            onChange={e=>
              setEditing({
                ...editing,
                content:e.target.value
              })
            }
          />

          <div className="modal-actions">

            <button
              className="secondary"
              onClick={()=>
                setEditing(null)
              }
            >
              Cancel
            </button>

            <button
              className="primary"
              onClick={update}
            >
              Save
            </button>

          </div>

        </Modal>

      }

    </>

  );
}

   POST

function PostCard({
  post,
  user,
  data,
  navigate,
  onEdit
}){

  const author=
    data.users.find(
      u=>u.uid===(
        post.authorId||
        post.uid||
        post.authorUid
      )
    )||
    {
      uid:
        post.authorId||
        post.uid||
        post.authorUid,

      displayName:
        post.authorName||
        post.displayName||
        post.name||
        "Nexus User",

      handle:
        post.authorUsername||
        post.username||
        post.handle||
        "user"
    };


  const liked=
    data.likes.some(
      like=>
        like.postId===post.id &&
        like.userId===user.uid
    );


  const comments=
    data.comments
      .filter(
        comment=>
          comment.postId===post.id
      )
      .sort(
        (a,b)=>
          (a.createdAt?.seconds||0)-
          (b.createdAt?.seconds||0)
      );


  const [comment,setComment]=
    useState("");


  const toggleLike=async()=>{

    const id=
      `${post.id}_${user.uid}`;

    const ref=
      rootPath("likes")
        .doc(id);

    const snap=
      await ref.get();

    if(snap.exists){

      await ref.delete();

    }else{

      await ref.set({

        postId:post.id,

        userId:user.uid,

        createdAt:now()

      });

      await notify(
        post.authorId,
        "like",
        user,
        post.id
      );

    }

  };


  const addComment=async()=>{

    const text=comment.trim();

    if(!text)return;

    await rootPath("comments").add({

      postId:post.id,

      authorId:user.uid,

      content:text,

      createdAt:now()

    });

    await notify(
      post.authorId,
      "comment",
      user,
      post.id
    );

    setComment("");

  };


  const remove=async()=>{

    if(!confirm(
      "Delete this post?"
    )){
      return;
    }

    await rootPath("posts")
      .doc(post.id)
      .delete();

    const batch=db.batch();

    data.likes
      .filter(
        x=>x.postId===post.id
      )
      .forEach(x=>
        batch.delete(
          rootPath("likes")
            .doc(x.id)
        )
      );

    data.comments
      .filter(
        x=>x.postId===post.id
      )
      .forEach(x=>
        batch.delete(
          rootPath("comments")
            .doc(x.id)
        )
      );

    await batch.commit();

  };


  return(

    <article className="card post">

      <div className="post-head">

        <img
          className="avatar sm"
          src={profileAvatar(author)}
        />

        <div>

          <b
            onClick={()=>
              navigate(
                "profile",
                author.uid
              )
            }
            style={{
              cursor:"pointer"
            }}
          >
            {author.displayName}
          </b>

          <div className="muted">
            @{author.handle}
          </div>

        </div>


        {post.authorId===user.uid&&

          <div className="post-menu">

            <button
              className="secondary"
              onClick={()=>
                onEdit(post)
              }
            >
              Edit
            </button>

            {" "}

            <button
              className="danger"
              onClick={remove}
            >
              Delete
            </button>

          </div>

        }

      </div>


      <div className="post-body">
        {post.content}
      </div>


      {(post.hashtags||[]).length>0&&

        <div className="tags">

          {post.hashtags.map(tag=>
            <span key={tag}>
              #{tag}{" "}
            </span>
          )}

        </div>

      }


      <div className="post-actions">

        <button
          className={
            liked
              ?"liked"
              :""
          }
          onClick={toggleLike}
        >
          ♥ {
            data.likes.filter(
              like=>
                like.postId===post.id
            ).length
          }
        </button>


        <button
          onClick={()=>
            document
              .getElementById(
                `comment-${post.id}`
              )
              ?.focus()
          }
        >
          💬 {comments.length}
        </button>


        <button
          onClick={()=>
            navigate(
              "post",
              post.id
            )
          }
        >
          Open
        </button>

      </div>


      <div>

        {comments
          .slice(-3)
          .map(comment=>{

            const commenter=
              data.users.find(
                u=>
                  u.uid===
                  comment.authorId
              )||
              {
                displayName:
                  "User",

                handle:
                  "user",

                avatar:
                  avatarFor(
                    comment.authorId
                  )
              };

            return(

              <div
                className="comment"
                key={comment.id}
              >

                <img
                  className="avatar xs"
                  src={
                    profileAvatar(
                      commenter
                    )
                  }
                />

                <div className="comment-body">

                  <b>
                    {commenter.displayName}
                  </b>

                  {" "}

                  <span>
                    {comment.content}
                  </span>

                </div>

              </div>

            );

          })}

      </div>


      <div className="comment-form">

        <input
          id={`comment-${post.id}`}
          value={comment}
          onChange={e=>
            setComment(e.target.value)
          }
          onKeyDown={e=>{

            if(e.key==="Enter"){
              addComment();
            }

          }}
          placeholder="Write a comment…"
        />

        <button
          className="primary"
          onClick={addComment}
        >
          Send
        </button>

      </div>

    </article>

  );
}

function ProfileView({

    data.follows.some(

    );

  const followers=
    data.follows.filter(

/* =========================================================
   FIXED CHAT
========================================================= */

function MessagingView({
  user,
  data
}){

  const people=
    data.users.filter(
      u=>u.uid!==user.uid
    );


  const [
    selected,
    setSelected
  ]=useState(null);


  const [
    text,
    setText
  ]=useState("");


  const [
    mobileChat,
    setMobileChat
  ]=useState(false);


  const [
    chatError,
    setChatError
  ]=useState("");


  /*
    Supports both the new message format
    and older Nexus messages.
  */

  const conversationFor=uid=>{

    return data.messages

      .filter(message=>{

        const participants=
          Array.isArray(
            message.participants
          )
            ?message.participants
            :Array.isArray(
              message.participantIds
            )
              ?message.participantIds
              :[];


        return(
          participants.includes(
            user.uid
          )
          &&
          participants.includes(
            uid
          )
        );

      })

      .sort(
        (a,b)=>
          (a.createdAt?.seconds||0)-
          (b.createdAt?.seconds||0)
      );

  };


  const conversations=
    people

      .map(person=>{

        const messages=
          conversationFor(
            person.uid
          );

        return{
          ...person,

          lastMessage:
            messages[
              messages.length-1
            ]||null
        };

      })

      .filter(
        person=>
          person.lastMessage
      )

      .sort(
        (a,b)=>
          (b.lastMessage?.createdAt?.seconds||0)-
          (a.lastMessage?.createdAt?.seconds||0)
      );


  const peopleWithoutChats=
    people.filter(
      person=>
        !conversations.some(
          chat=>
            chat.uid===person.uid
        )
    );


  const orderedPeople=[
    ...conversations,

    ...peopleWithoutChats.map(
      person=>({
        ...person,
        lastMessage:null
      })
    )
  ];


  const partner=
    people.find(
      person=>
        person.uid===selected
    );


  const messages=
    selected
      ?conversationFor(selected)
      :[];


  const openChat=uid=>{

    setSelected(uid);

    setMobileChat(true);

    setChatError("");

  };


  const backToChats=()=>{

    setMobileChat(false);

  };


  /*
    This is the important chat fix.
    It writes both participants and participantIds
    and uses content + text so old/new chat
    structures remain compatible.
  */

  const send=async()=>{

    const messageText=
      text.trim();

    if(
      !messageText||
      !selected
    ){
      return;
    }


    setChatError("");


    try{

      const payload={

        senderId:user.uid,

        receiverId:selected,

        participants:[
          user.uid,
          selected
        ],

        participantIds:[
          user.uid,
          selected
        ],

        content:messageText,

        text:messageText,

        createdAt:now(),

        read:false

      };


      await rootPath(
        "messages"
      ).add(payload);


      setText("");

    }catch(error){

      console.error(
        "Message send error:",
        error
      );

      setChatError(
        error?.message||
        "Message could not be sent."
      );

    }

  };


  const getMessageText=message=>
    message.content||
    message.text||
    message.message||
    "";


  const timeLabel=stamp=>{

    if(!stamp?.seconds){
      return "";
    }

    return new Date(
      stamp.seconds*1000
    ).toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  };


  return(

    <div
      className={
        "card messages "+
        (
          mobileChat
            ?"mobile-chat"
            :""
        )
      }
    >


      {/* CHAT LIST */}

      <div className="users">

        <div className="messages-title">
          Chats
        </div>


        {orderedPeople.map(person=>(

          <div
            className={
              "user-item "+
              (
                person.uid===selected
                  ?"active"
                  :""
              )
            }
            key={person.uid}
            onClick={()=>
              openChat(person.uid)
            }
          >

            <img
              className="avatar sm"
              src={profileAvatar(person)}
            />


            <div className="grow">

              <div
                className="row"
                style={{
                  justifyContent:
                    "space-between"
                }}
              >

                <b>
                  {person.displayName}
                </b>


                {person.lastMessage&&

                  <span className="chat-time">
                    {timeLabel(
                      person
                        .lastMessage
                        .createdAt
                    )}
                  </span>

                }

              </div>


              <div className="muted chat-preview">

                {person.lastMessage

                  ?

                  (
                    person
                      .lastMessage
                      .senderId===user.uid
                      ?"You: "
                      :""
                  )+
                  getMessageText(
                    person.lastMessage
                  )

                  :

                  "Start a new chat"

                }

              </div>

            </div>

          </div>

        ))}


        {!people.length&&

          <div className="empty">
            No other users yet.
          </div>

        }

      </div>


      {/* CHAT WINDOW */}

      <div className="chat">

        {partner?

          <>

            <div className="chat-head">

              <button
                className="secondary chat-back"
                onClick={backToChats}
              >
                ←
              </button>


              <img
                className="avatar sm"
                src={profileAvatar(partner)}
              />


              <div>

                <b>
                  {partner.displayName}
                </b>

                <div className="muted">
                  @{partner.handle}
                </div>

              </div>

            </div>


            <div className="chat-list">

              {messages.map(message=>

                <div
                  key={message.id}
                  className={
                    "bubble "+
                    (
                      message.senderId===
                      user.uid
                        ?"mine"
                        :"theirs"
                    )
                  }
                >

                  {getMessageText(
                    message
                  )}

                </div>

              )}


              {!messages.length&&

                <div className="empty">
                  Start the conversation.
                </div>

              }

            </div>


            <div className="chat-form">

              <input
                value={text}
                onChange={e=>
                  setText(
                    e.target.value
                  )
                }
                onKeyDown={e=>{

                  if(
                    e.key==="Enter" &&
                    !e.shiftKey
                  ){

                    e.preventDefault();

                    send();

                  }

                }}
                placeholder={
                  "Message "+
                  partner.displayName+
                  "…"
                }
              />


              <button
                className="primary"
                onClick={send}
              >
                Send
              </button>

            </div>


            {chatError&&

              <div className="chat-error">
                {chatError}
              </div>

            }

          </>

          :

          <div className="empty">
            Select a chat to start messaging.
          </div>

        }

      </div>

    </div>

  );
}


/* =========================================================
   NOTIFICATIONS
========================================================= */

function NotificationsView({
  user,
  data,
  navigate
}){

  const notes=
    data.notifications
      .slice()
      .sort(
        (a,b)=>
          (b.createdAt?.seconds||0)-
          (a.createdAt?.seconds||0)
      );


  const mark=async notification=>{

    if(!notification.read){

      await rootPath(
        "notifications"
      )
      .doc(notification.id)
      .update({
        read:true
      });

    }


    if(notification.postId){

      navigate(
        "post",
        notification.postId
      );

    }

  };


  const text=notification=>{

    if(
      notification.type==="like"
    ){
      return "liked your post";
    }

    if(
      notification.type==="comment"
    ){
      return "commented on your post";
    }

    return "followed you";

  };


  return(

    <>

      <h2 className="page-title">
        Notifications
      </h2>


      <div className="card">

        {notes.map(notification=>{

          const actor=
            data.users.find(
              u=>
                u.uid===
                notification.actorId
            )||
            {
              displayName:"Someone",
              handle:"user",
              avatar:
                avatarFor(
                  notification.actorId
                )
            };


          return(

            <div
              className={
                "notice "+
                (
                  !notification.read
                    ?"unread"
                    :""
                )
              }
              key={notification.id}
              onClick={()=>
                mark(notification)
              }
            >

              <div className="row">

                <img
                  className="avatar xs"
                  src={profileAvatar(actor)}
                />

                <span>

                  <b>
                    {actor.displayName}
                  </b>

                  {" "}

                  {text(notification)}.

                </span>

              </div>

            </div>

          );

        })}


        {!notes.length&&

          <div className="empty">
            No notifications yet.
          </div>

        }

      </div>

    </>

  );
}


/* =========================================================
   MODAL
========================================================= */

function Modal({
  title,
  onClose,
  children
}){

  return(

    <div
      className="modal-bg"
      onMouseDown={e=>{

        if(
          e.target===
          e.currentTarget
        ){
          onClose();
        }

      }}
    >

      <div className="modal">

        <div className="row">

          <h3 style={{
            margin:0
          }}>
            {title}
          </h3>

          <button
            className="secondary"
            style={{
              marginLeft:"auto"
            }}
            onClick={onClose}
          >
            ✕
          </button>

        </div>


        <div style={{
          marginTop:14
        }}>
          {children}
        </div>

      </div>

    </div>

  );
}


/* =========================================================
   GLOBAL ERROR HANDLING
========================================================= */

window.addEventListener(
  "error",
  event=>{
    console.error(
      "Nexus error:",
      event.error||
      event.message
    );
  }
);

window.addEventListener(
  "unhandledrejection",
  event=>{
    console.error(
      "Nexus promise error:",
      event.reason
    );
  }
);


/* =========================================================
   START
========================================================= */

ReactDOM
  .createRoot(
    document.getElementById("root")
  )
  .render(
    <App/>
  );

</script>

</body>
</html>
