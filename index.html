<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050807" />
  <title>NEXUS // Social Network</title>

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg: #030504;
      --bg-2: #07100b;
      --panel: rgba(7, 16, 11, 0.86);
      --panel-2: rgba(10, 22, 15, 0.95);

      --green: #00ff9d;
      --green-2: #00c878;
      --cyan: #00e5ff;
      --blue: #4da6ff;
      --red: #ff4567;
      --yellow: #ffd166;

      --text: #e7fff3;
      --muted: #789b89;
      --border: rgba(0, 255, 157, 0.18);
      --border-bright: rgba(0, 255, 157, 0.42);

      --shadow:
        0 0 0 1px rgba(0, 255, 157, 0.04),
        0 15px 45px rgba(0, 0, 0, 0.45);

      --radius: 16px;
      --font: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 0%, rgba(0, 255, 157, 0.08), transparent 28%),
        radial-gradient(circle at 90% 20%, rgba(0, 229, 255, 0.05), transparent 25%),
        linear-gradient(135deg, #020403, #050807 50%, #020504);
      color: var(--text);
      font-family: var(--font);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.035;
      background:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(0, 255, 157, 0.35) 4px
        );
    }

    body::after {
      content: "";
      position: fixed;
      width: 550px;
      height: 550px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: -1;
      background: radial-gradient(
        circle,
        rgba(0, 255, 157, 0.045),
        transparent 68%
      );
      filter: blur(10px);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    ::selection {
      background: rgba(0, 255, 157, 0.25);
      color: white;
    }

    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }

    ::-webkit-scrollbar-track {
      background: #020403;
    }

    ::-webkit-scrollbar-thumb {
      background: #124b35;
      border-radius: 99px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--green-2);
    }

    /* ---------- BOOT ---------- */

    .boot-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at center, rgba(0, 255, 157, 0.08), transparent 45%),
        #020403;
    }

    .boot-terminal {
      width: min(680px, 100%);
      border: 1px solid var(--border-bright);
      border-radius: 14px;
      background: rgba(2, 7, 4, 0.95);
      box-shadow:
        0 0 35px rgba(0, 255, 157, 0.09),
        inset 0 0 40px rgba(0, 255, 157, 0.025);
      overflow: hidden;
      font-family: var(--mono);
    }

    .terminal-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 15px;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 255, 157, 0.025);
    }

    .terminal-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #204b38;
    }

    .terminal-dot.active {
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
    }

    .terminal-title {
      margin-left: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .boot-content {
      padding: 28px;
    }

    .boot-logo {
      color: var(--green);
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 5px;
      text-shadow: 0 0 18px rgba(0, 255, 157, 0.55);
      margin-bottom: 22px;
    }

    .boot-line {
      color: #a8d9bd;
      font-size: 13px;
      margin: 8px 0;
    }

    .boot-line span {
      color: var(--green);
    }

    .loading-bar {
      height: 4px;
      margin-top: 25px;
      overflow: hidden;
      background: #0b2016;
      border-radius: 99px;
    }

    .loading-bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      background: var(--green);
      box-shadow: 0 0 15px var(--green);
      animation: loading 1.2s infinite ease-in-out;
    }

    @keyframes loading {
      0% {
        transform: translateX(-110%);
      }
      100% {
        transform: translateX(350%);
      }
    }

    /* ---------- ERROR ---------- */

    .error-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .error-card {
      max-width: 650px;
      width: 100%;
      padding: 30px;
      border: 1px solid rgba(255, 69, 103, 0.4);
      border-radius: 16px;
      background: rgba(20, 4, 8, 0.9);
      box-shadow: 0 0 40px rgba(255, 69, 103, 0.08);
    }

    .error-card h2 {
      margin-top: 0;
      color: var(--red);
    }

    .error-card code {
      display: block;
      margin-top: 18px;
      padding: 14px;
      overflow-x: auto;
      color: #ff9aaa;
      background: rgba(255, 69, 103, 0.06);
      border-radius: 9px;
      font-family: var(--mono);
      font-size: 12px;
    }

    /* ---------- APP ---------- */

    .app {
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      height: 66px;
      border-bottom: 1px solid var(--border);
      background: rgba(2, 6, 4, 0.88);
      backdrop-filter: blur(18px);
    }

    .topbar-inner {
      width: min(1450px, calc(100% - 32px));
      height: 100%;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 205px;
      cursor: pointer;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid var(--green);
      border-radius: 9px;
      color: var(--green);
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 900;
      box-shadow:
        0 0 14px rgba(0, 255, 157, 0.18),
        inset 0 0 12px rgba(0, 255, 157, 0.06);
    }

    .brand-name {
      color: white;
      font-family: var(--mono);
      font-weight: 900;
      letter-spacing: 3px;
    }

    .brand-name span {
      color: var(--green);
    }

    .brand-status {
      color: #4c7763;
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      max-width: 620px;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--green);
      font-family: var(--mono);
      font-size: 12px;
    }

    .search-input {
      width: 100%;
      height: 39px;
      padding: 0 15px 0 37px;
      border: 1px solid var(--border);
      outline: none;
      border-radius: 10px;
      background: rgba(0, 255, 157, 0.025);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      transition: 0.2s;
    }

    .search-input:focus {
      border-color: var(--border-bright);
      box-shadow: 0 0 18px rgba(0, 255, 157, 0.08);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-left: auto;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      background: rgba(0, 255, 157, 0.025);
      transition: 0.2s;
      position: relative;
    }

    .icon-btn:hover,
    .icon-btn.active {
      color: var(--green);
      border-color: var(--border-bright);
      background: rgba(0, 255, 157, 0.07);
      box-shadow: 0 0 15px rgba(0, 255, 157, 0.08);
    }

    .notification-dot {
      position: absolute;
      right: 7px;
      top: 6px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 7px var(--green);
    }

    .avatar {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--border-bright);
      border-radius: 10px;
      color: var(--green);
      background:
        linear-gradient(135deg, rgba(0, 255, 157, 0.13), rgba(0, 229, 255, 0.04));
      font-family: var(--mono);
      font-weight: 900;
      flex-shrink: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ---------- LAYOUT ---------- */

    .main-layout {
      width: min(1450px, calc(100% - 32px));
      margin: 0 auto;
      display: grid;
      grid-template-columns: 230px minmax(0, 680px) 310px;
      gap: 22px;
      padding: 24px 0 90px;
      align-items: start;
    }

    .left-sidebar,
    .right-sidebar {
      position: sticky;
      top: 90px;
    }

    .side-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .side-label {
      padding: 12px 15px;
      color: #527b66;
      border-bottom: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .nav-list {
      padding: 8px;
    }

    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      border: 1px solid transparent;
      border-radius: 10px;
      color: #89a896;
      background: transparent;
      text-align: left;
      transition: 0.18s;
    }

    .nav-item:hover {
      color: var(--text);
      border-color: var(--border);
      background: rgba(0, 255, 157, 0.04);
    }

    .nav-item.active {
      color: var(--green);
      border-color: rgba(0, 255, 157, 0.16);
      background: rgba(0, 255, 157, 0.065);
      box-shadow: inset 2px 0 var(--green);
    }

    .nav-icon {
      width: 22px;
      text-align: center;
      font-family: var(--mono);
    }

    .nav-text {
      font-size: 13px;
      font-weight: 600;
    }

    .side-profile {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .side-profile-main {
      display: flex;
      gap: 11px;
      align-items: center;
    }

    .side-profile-name {
      color: white;
      font-size: 13px;
      font-weight: 700;
    }

    .side-profile-username {
      margin-top: 3px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
    }

    .side-footer {
      padding: 14px 16px;
      color: #466855;
      font-family: var(--mono);
      font-size: 9px;
      line-height: 1.7;
    }

    /* ---------- CENTER ---------- */

    .page-header {
      margin-bottom: 16px;
    }

    .page-kicker {
      color: var(--green);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    .page-title {
      margin: 0;
      font-size: 23px;
      letter-spacing: -0.5px;
    }

    .page-subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .composer {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background:
        linear-gradient(
          135deg,
          rgba(0, 255, 157, 0.045),
          rgba(0, 229, 255, 0.012)
        ),
        var(--panel);
      box-shadow: var(--shadow);
      padding: 17px;
      margin-bottom: 16px;
    }

    .composer-row {
      display: flex;
      gap: 12px;
    }

    .composer textarea {
      width: 100%;
      min-height: 72px;
      resize: vertical;
      border: 0;
      outline: none;
      color: var(--text);
      background: transparent;
      font-size: 14px;
      line-height: 1.55;
    }

    .composer textarea::placeholder {
      color: #476653;
    }

    .composer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-top: 9px;
    }

    .composer-hint {
      color: #456653;
      font-family: var(--mono);
      font-size: 9px;
    }

    .primary-btn {
      border: 1px solid rgba(0, 255, 157, 0.5);
      border-radius: 9px;
      padding: 9px 15px;
      color: #00170e;
      background: var(--green);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 900;
      transition: 0.18s;
    }

    .primary-btn:hover {
      box-shadow: 0 0 20px rgba(0, 255, 157, 0.22);
      transform: translateY(-1px);
    }

    .primary-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .ghost-btn {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 11px;
      color: var(--muted);
      background: transparent;
      font-size: 11px;
      transition: 0.18s;
    }

    .ghost-btn:hover {
      color: var(--green);
      border-color: var(--border-bright);
      background: rgba(0, 255, 157, 0.045);
    }

    .danger-btn {
      color: var(--red);
      border-color: rgba(255, 69, 103, 0.2);
    }

    .danger-btn:hover {
      border-color: rgba(255, 69, 103, 0.45);
      background: rgba(255, 69, 103, 0.05);
    }

    /* ---------- POST ---------- */

    .post {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      overflow: hidden;
      transition: 0.18s;
    }

    .post:hover {
      border-color: rgba(0, 255, 157, 0.25);
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 16px 16px 10px;
    }

    .post-user {
      min-width: 0;
      flex: 1;
    }

    .post-user-name {
      color: white;
      font-size: 13px;
      font-weight: 750;
    }

    .post-user-name:hover {
      color: var(--green);
    }

    .post-username {
      margin-top: 2px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
    }

    .post-time {
      color: #42634f;
      font-family: var(--mono);
      font-size: 9px;
    }

    .post-menu {
      color: #4d705c;
      background: transparent;
      border: 0;
      padding: 4px;
    }

    .post-menu:hover {
      color: var(--green);
    }

    .post-content {
      padding: 5px 16px 15px 65px;
      color: #c5dfd0;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      line-height: 1.65;
    }

    .hashtag {
      color: var(--cyan);
    }

    .post-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
    }

    .post-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 7px 9px;
      color: #547966;
      background: transparent;
      font-size: 11px;
    }

    .post-action:hover {
      color: var(--text);
      background: rgba(0, 255, 157, 0.04);
      border-color: var(--border);
    }

    .post-action.liked {
      color: var(--red);
    }

    .post-action.liked:hover {
      color: #ff6c87;
    }

    .comment-section {
      border-top: 1px solid var(--border);
      padding: 12px 16px;
    }

    .comment {
      display: flex;
      gap: 9px;
      margin-bottom: 10px;
    }

    .comment:last-child {
      margin-bottom: 0;
    }

    .comment-body {
      flex: 1;
      padding: 8px 10px;
      border-radius: 9px;
      background: rgba(0, 255, 157, 0.025);
    }

    .comment-name {
      color: var(--green);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
    }

    .comment-text {
      margin-top: 3px;
      color: #9bb9a8;
      font-size: 12px;
      line-height: 1.45;
    }

    .comment-input-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .small-input {
      min-width: 0;
      flex: 1;
      height: 35px;
      padding: 0 11px;
      outline: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      background: rgba(0, 0, 0, 0.18);
      font-size: 12px;
    }

    .small-input:focus {
      border-color: var(--border-bright);
    }

    /* ---------- RIGHT SIDEBAR ---------- */

    .right-section {
      margin-bottom: 16px;
    }

    .follow-card,
    .trend-card,
    .status-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .section-title {
      padding: 13px 15px;
      color: #6b947d;
      border-bottom: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 1.6px;
      text-transform: uppercase;
    }

    .follow-user {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(0, 255, 157, 0.07);
    }

    .follow-user:last-child {
      border-bottom: 0;
    }

    .follow-info {
      min-width: 0;
      flex: 1;
    }

    .follow-name {
      color: white;
      font-size: 12px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .follow-username {
      color: #527662;
      font-family: var(--mono);
      font-size: 9px;
      margin-top: 2px;
    }

    .follow-btn {
      border: 1px solid rgba(0, 255, 157, 0.32);
      border-radius: 7px;
      padding: 6px 9px;
      color: var(--green);
      background: rgba(0, 255, 157, 0.035);
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 700;
    }

    .follow-btn:hover {
      background: rgba(0, 255, 157, 0.1);
    }

    .follow-btn.following {
      color: #6d907d;
      border-color: var(--border);
    }

    .trend {
      display: block;
      width: 100%;
      padding: 12px 15px;
      border: 0;
      border-bottom: 1px solid rgba(0, 255, 157, 0.07);
      background: transparent;
      color: inherit;
      text-align: left;
    }

    .trend:last-child {
      border-bottom: 0;
    }

    .trend:hover {
      background: rgba(0, 255, 157, 0.04);
    }

    .trend-tag {
      color: var(--cyan);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
    }

    .trend-count {
      margin-top: 4px;
      color: #456653;
      font-size: 10px;
    }

    .status-card {
      padding: 14px;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #6c937d;
      font-family: var(--mono);
      font-size: 9px;
      margin-bottom: 7px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    .status-value {
      margin-left: auto;
      color: var(--green);
    }

    /* ---------- PROFILE ---------- */

    .profile-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 16px;
    }

    .profile-cover {
      height: 145px;
      position: relative;
      background:
        linear-gradient(
          135deg,
          rgba(0, 255, 157, 0.13),
          rgba(0, 229, 255, 0.035)
        ),
        repeating-linear-gradient(
          45deg,
          transparent,
          transparent 16px,
          rgba(0, 255, 157, 0.025) 17px,
          rgba(0, 255, 157, 0.025) 18px
        ),
        #06100a;
    }

    .profile-cover::before {
      content: "NEXUS://PROFILE";
      position: absolute;
      right: 20px;

<body>
  <div id="root"></div>

  <script type="text/babel">
    const {
      useState,
      useEffect,
      useMemo,
      useRef
    } = React;

    /* ============================================================
       FIREBASE
    ============================================================ */

    const firebaseConfig = {
      apiKey: "AIzaSyDTrvD7c1TUtPUUOSX7_-0VV9itC28LOg0",
      authDomain: "nexus-37600.firebaseapp.com",
      projectId: "nexus-37600",
      storageBucket: "nexus-37600.firebasestorage.app",
      messagingSenderId: "61496309341",
      appId: "1:61496309341:web:fdb3711264df47f318bfb4",
      measurementId: "G-41S50YF5RF"
    };

    const APP_ID = "nexus-37600";

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const db = firebase.firestore();

    const COLLECTIONS = [
      "users",
      "posts",
      "comments",
      "likes",
      "follows",
      "notifications",
      "messages"
    ];

    const collectionRef = (name) =>
      db.collection("artifacts")
        .doc(APP_ID)
        .collection("public")
        .doc("data")
        .collection(name);

    /* ============================================================
       HELPERS
    ============================================================ */

    function uid() {
      return Math.random().toString(36).slice(2) + Date.now().toString(36);
    }

    function formatDate(timestamp) {
      if (!timestamp) return "";

      try {
        const date =
          timestamp.toDate
            ? timestamp.toDate()
            : new Date(timestamp);

        const diff = Date.now() - date.getTime();

        if (diff < 60 * 1000) return "now";
        if (diff < 60 * 60 * 1000)
          return Math.floor(diff / 60000) + "m";
        if (diff < 24 * 60 * 60 * 1000)
          return Math.floor(diff / 3600000) + "h";
        if (diff < 7 * 24 * 60 * 60 * 1000)
          return Math.floor(diff / 86400000) + "d";

        return date.toLocaleDateString();
      } catch {
        return "";
      }
    }

    function getInitials(name) {
      if (!name) return "?";

      return name
        .split(" ")
        .filter(Boolean)
        .slice(0, 2)
        .map((x) => x[0])
        .join("")
        .toUpperCase();
    }

    function getUsername(user) {
      if (!user) return "unknown";

      return (
        user.username ||
        user.displayName?.replace(/\s+/g, "").toLowerCase() ||
        "user"
      );
    }

    function makeUsername(name) {
      return (
        String(name || "user")
          .toLowerCase()
          .replace(/[^a-z0-9_]/g, "")
          .slice(0, 20) || "user"
      );
    }

    function escapeHashtags(text) {
      const parts = String(text || "").split(/(#[a-zA-Z0-9_]+)/g);

      return parts.map((part, index) => {
        if (/^#[a-zA-Z0-9_]+$/.test(part)) {
          return (
            <span className="hashtag" key={index}>
              {part}
            </span>
          );
        }

        return part;
      });
    }

    function normalizeMessage(m) {
      return {
        ...m,
        id: m.id || uid()
      };
    }

    /* ============================================================
       REALTIME HOOK
    ============================================================ */

    function useRealtimeData() {
      const [data, setData] = useState({
        users: [],
        posts: [],
        comments: [],
        likes: [],
        follows: [],
        notifications: [],
        messages: []
      });

      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      useEffect(() => {
        let loaded = 0;
        const unsubscribers = [];

        COLLECTIONS.forEach((name) => {
          const unsubscribe = collectionRef(name)
            .onSnapshot(
              (snapshot) => {
                const rows = snapshot.docs.map((doc) => ({
                  id: doc.id,
                  ...doc.data()
                }));

                setData((prev) => ({
                  ...prev,
                  [name]: rows
                }));

                loaded++;

                if (loaded >= COLLECTIONS.length) {
                  setLoading(false);
                }
              },
              (err) => {
                console.error(name, err);

                setError(err.message || String(err));
                loaded++;

                if (loaded >= COLLECTIONS.length) {
                  setLoading(false);
                }
              }
            );

          unsubscribers.push(unsubscribe);
        });

        return () => {
          unsubscribers.forEach((unsubscribe) => unsubscribe());
        };
      }, []);

      return {
        data,
        loading,
        error
      };
    }

    /* ============================================================
       AUTH
    ============================================================ */

    function useFirebaseAuth() {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged(async (currentUser) => {
          try {
            if (!currentUser) {
              await auth.signInAnonymously();
            } else {
              setUser(currentUser);
              setAuthLoading(false);
            }
          } catch (error) {
            console.error(error);
            setAuthLoading(false);
          }
        });

        return unsubscribe;
      }, []);

      return {
        user,
        authLoading
      };
    }

    /* ============================================================
       AVATAR
    ============================================================ */

    function Avatar({ user, sizeClass = "" }) {
      if (!user) {
        return <div className={"avatar " + sizeClass}>?</div>;
      }

      return (
        <div className={"avatar " + sizeClass}>
          {user.photoURL ? (
            <img src={user.photoURL} alt="" />
          ) : (
            getInitials(user.displayName || user.username)
          )}
        </div>
      );
    }

    /* ============================================================
       NAVIGATION
    ============================================================ */

    function Sidebar({
      page,
      setPage,
      profile,
      unreadNotifications
    }) {
      const items = [
        ["home", "⌂", "Home"],
        ["messages", "⌁", "Messages"],
        ["notifications", "◈", "Notifications"],
        ["profile", "◎", "Profile"]
      ];

      return (
        <aside className="left-sidebar">
          <div className="side-card">
            <div
              className="side-profile"
              onClick={() => setPage("profile")}
            >
              <div className="side-profile-main">
                <Avatar user={profile} />
                <div>
                  <div className="side-profile-name">
                    {profile?.displayName || "Nexus User"}
                  </div>

                  <div className="side-profile-username">
                    @{getUsername(profile)}
                  </div>
                </div>
              </div>
            </div>

            <div className="nav-list">
              {items.map(([key, icon, label]) => (
                <button
                  key={key}
                  className={"nav-item " + (page === key ? "active" : "")}
                  onClick={() => setPage(key)}
                >
                  <span className="nav-icon">{icon}</span>
                  <span className="nav-text">{label}</span>

                  {key === "notifications" &&
                    unreadNotifications > 0 && (
                      <span
                        style={{
                          marginLeft: "auto",
                          color: "var(--green)",
                          fontFamily: "var(--mono)",
                          fontSize: 9
                        }}
                      >
                        {unreadNotifications}
                      </span>
                    )}
                </button>
              ))}
            </div>

            <div className="side-footer">
              NEXUS CORE<br />
              connection: <span style={{ color: "var(--green)" }}>ONLINE</span>
              <br />
              protocol: realtime
            </div>
          </div>
        </aside>
      );
    }

    /* ============================================================
       TOPBAR
    ============================================================ */

    function Topbar({
      profile,
      page,
      setPage,
      search,
      setSearch,
      unreadNotifications
    }) {
      return (
        <header className="topbar">
          <div className="topbar-inner">
            <div
              className="brand"
              onClick={() => setPage("home")}
            >
              <div className="brand-mark">&gt;_</div>

              <div>
                <div className="brand-name">
                  NEXUS<span>.</span>
                </div>

                <div className="brand-status">
                  SOCIAL NETWORK // ONLINE
                </div>
              </div>
            </div>

            <div className="search-wrap">
              <span className="search-icon">&gt;_</span>

              <input
                className="search-input"
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                placeholder="search users, posts, #hashtags..."
              />
            </div>

            <div className="top-actions">
              <button
                className={
                  "icon-btn " +
                  (page === "messages" ? "active" : "")
                }
                onClick={() => setPage("messages")}
                title="Messages"
              >
                ⌁
              </button>

              <button
                className={
                  "icon-btn hide-mobile " +
                  (page === "notifications" ? "active" : "")
                }
                onClick={() => setPage("notifications")}
                title="Notifications"
              >
                ◈

                {unreadNotifications > 0 && (
                  <span className="notification-dot" />
                )}
              </button>

              <button
                className="avatar"
                onClick={() => setPage("profile")}
                title="Profile"
              >
                {profile?.photoURL ? (
                  <img src={profile.photoURL} alt="" />
                ) : (
                  getInitials(profile?.displayName)
                )}
              </button>
            </div>
          </div>
        </header>
      );
    }

    /* ============================================================
       FOLLOW SYSTEM
    ============================================================ */

    function isFollowing(follows, currentUserId, targetUserId) {
      return follows.some(
        (follow) =>
          follow.followerId === currentUserId &&
          follow.followingId === targetUserId
      );
    }

    async function toggleFollow(
      currentUser,
      targetUserId,
      follows
    ) {
      if (!currentUser || !targetUserId) return;
      if (currentUser.uid === targetUserId) return;

      const existing = follows.find(
        (follow) =>
          follow.followerId === currentUser.uid &&
          follow.followingId === targetUserId
      );

      try {
        if (existing) {
          await collectionRef("follows")
            .doc(existing.id)
            .delete();

          return;
        }

        await collectionRef("follows")
          .doc(uid())
          .set({
            followerId: currentUser.uid,
            followingId: targetUserId,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
      } catch (error) {
        console.error("Follow error:", error);
      }
    }

    /* ============================================================
       WHO TO FOLLOW
    ============================================================ */

    function WhoToFollow({
      currentUser,
      profile,
      users,
      follows
    }) {
      const suggestions = users
        .filter(
          (u) =>
            u.id !== currentUser?.uid &&
            u.id !== profile?.id
        )

    /* ============================================================
       TRENDING
    ============================================================ */

    function Trending({ posts }) {
      const hashtags = useMemo(() => {
        const counts = {};

        posts.forEach((post) => {
          const matches =
            String(post.content || "").match(
              /#[a-zA-Z0-9_]+/g
            ) || [];

          matches.forEach((tag) => {
            const key = tag.toLowerCase();
            counts[key] = (counts[key] || 0) + 1;
          });
        });

        return Object.entries(counts)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 6);
      }, [posts]);

      return (
        <div className="right-section">
          <div className="trend-card">
            <div className="section-title">
              // TRENDING_NODES
            </div>

            {hashtags.length === 0 ? (
              <div className="empty">
                NO SIGNALS DETECTED
              </div>
            ) : (
              hashtags.map(([tag, count]) => (
                <button
                  className="trend"
                  key={tag}
                >
                  <div className="trend-tag">
                    {tag}
                  </div>

                  <div className="trend-count">
                    {count} {count === 1 ? "post" : "posts"}
                  </div>
                </button>
              ))
            )}
          </div>
        </div>
      );
    }

    /* ============================================================
       POST COMPOSER
    ============================================================ */

    function Composer({ currentUser, profile }) {
      const [content, setContent] = useState("");
      const [posting, setPosting] = useState(false);

      async function createPost() {
        const text = content.trim();

        if (!text || !currentUser || posting) return;

        setPosting(true);

        try {
          await collectionRef("posts")
            .doc(uid())
            .set({
              authorId: currentUser.uid,
              authorName:
                profile?.displayName ||
                currentUser.displayName ||
                "Nexus User",
              authorUsername:
                getUsername(profile),
              content: text,
              createdAt:
                firebase.firestore.FieldValue.serverTimestamp()
            });

          setContent("");
        } catch (error) {
          console.error(error);
          alert("Could not publish post.");
        } finally {
          setPosting(false);
        }
      }

      return (
        <div className="composer">
          <div className="composer-row">
            <Avatar user={profile} />

            <textarea
              value={content}
              onChange={(e) => setContent(e.target.value)}
              placeholder="broadcast something to the Nexus..."
              maxLength={5000}
            />
          </div>

          <div className="composer-bottom">
            <div className="composer-hint">
              {content.length}/5000 // PUBLIC_BROADCAST
            </div>

            <button
              className="primary-btn"
              disabled={!content.trim() || posting}
              onClick={createPost}
            >
              {posting ? "UPLOADING..." : "PUBLISH →"}
            </button>
          </div>
        </div>
      );
    }

    /* ============================================================
       POST CARD
    ============================================================ */

    function PostCard({
      post,
      currentUser,
      profile,
      users,
      comments,
      likes,
      follows
    }) {
      const author =
        users.find((u) => u.id === post.authorId) || {
          id: post.authorId,
          displayName:
            post.authorName || "Nexus User",
          username:
            post.authorUsername || "user"
        };

      const postLikes = likes.filter(
        (like) => like.postId === post.id
      );

      const liked = postLikes.some(
        (like) =>
          like.userId === currentUser?.uid
      );

      const canEdit =
        post.authorId === currentUser?.uid;

      async function toggleLike() {
        if (!currentUser) return;

        const existing = postLikes.find(
          (like) =>
            like.userId === currentUser.uid
        );

        try {
          if (existing) {
            await collectionRef("likes")
              .doc(existing.id)
              .delete();
          } else {
            await collectionRef("likes")
              .doc(uid())
              .set({
                postId: post.id,
                userId: currentUser.uid,
                createdAt:
                  firebase.firestore.FieldValue.serverTimestamp()
              });
          }
        } catch (error) {
          console.error(error);
        }
      }

      async function deletePost() {
        if (!canEdit) return;

        const confirmed = confirm(
          "Delete this post?"
        );

        if (!confirmed) return;

        try {
          await collectionRef("posts")
            .doc(post.id)
            .delete();

          const relatedLikes =
            likes.filter(
              (x) => x.postId === post.id
            );

          const relatedComments =
            comments.filter(
              (x) => x.postId === post.id
            );

          await Promise.all([
            ...relatedLikes.map((x) =>
              collectionRef("likes")
                .doc(x.id)
                .delete()
            ),
            ...relatedComments.map((x) =>
              collectionRef("comments")
                .doc(x.id)
                .delete()
            )
          ]);
        } catch (error) {
          console.error(error);
        }
      }

      async function editPost() {
        if (!canEdit) return;

        const newContent = prompt(
          "Edit post:",
          post.content
        );

        if (
          newContent === null ||
          !newContent.trim()
        ) {
          return;
        }

        try {
          await collectionRef("posts")
            .doc(post.id)
            .update({
              content: newContent.trim(),
              updatedAt:
                firebase.firestore.FieldValue.serverTimestamp()
            });
        } catch (error) {
          console.error(error);
        }
      }

      async function sharePost() {
        const text =
          post.content +
          "\n\n— via NEXUS";

        try {
          if (navigator.share) {
            await navigator.share({
              title: "NEXUS post",
              text
            });
          } else {
            await navigator.clipboard.writeText(
              text
            );

            alert("Post copied.");
          }
        } catch {}
      }

      return (
        <article className="post">
          <div className="post-header">
            <Avatar user={author} />

            <div className="post-user">
              <div className="post-user-name">
                {author.displayName ||
                  "Nexus User"}
              </div>

              <div className="post-username">
                @{getUsername(author)}
              </div>
            </div>

            <div className="post-time">
              {formatDate(post.createdAt)}
            </div>

            {canEdit && (
              <button
                className="post-menu"
                onClick={editPost}
                title="Edit"
              >
                ✎
              </button>
            )}

            {canEdit && (
              <button
                className="post-menu"
                onClick={deletePost}
                title="Delete"
              >
                ×
              </button>
            )}
          </div>

          <div className="post-content">
            {escapeHashtags(post.content)}
          </div>

          <div className="post-actions">
            <button
              className={
                "post-action " +
                (liked ? "liked" : "")
              }
              onClick={toggleLike}
            >
              {liked ? "♥" : "♡"} {postLikes.length}
            </button>

            <Comments
              post={post}
              comments={comments}
              users={users}
              currentUser={currentUser}
              profile={profile}
            />

            <button
              className="post-action"
              onClick={sharePost}
            >
              ↗ SHARE
            </button>
          </div>
        </article>
      );
    }

              String(post.content || "")
                .toLowerCase()
                .includes(query) ||

                .toLowerCase()
                .includes(query) ||
              String(
                author?.username || ""

        return posts;

                            : "+FOLLOW"}

                  }
                  placeholder="https://..."
                />
              </div>
            </div>

            <div className="modal-footer">
              <button
                className="ghost-btn"
                onClick={onClose}
              >
                CANCEL
              </button>

              <button
                className="primary-btn"
                disabled={saving || !name.trim()}
                onClick={save}
              >
                {saving
                  ? "SAVING..."
                  : "SAVE_CHANGES →"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* ============================================================
       NOTIFICATIONS
    ============================================================ */

    function NotificationsPage({
      currentUser,
      data
    }) {
      const notifications = data.notifications
        .filter(
          (n) =>
            n.userId === currentUser?.uid ||
            n.recipientId === currentUser?.uid
        )
        .sort(
          (a, b) =>
            (b.createdAt?.seconds || 0) -
            (a.createdAt?.seconds || 0)
        );

      async function markRead(notification) {
        try {
          await collectionRef("notifications")
            .doc(notification.id)
            .update({
              read: true
            });
        } catch (error) {
          console.error(error);
        }
      }

      return (
        <>
          <div className="page-header">
            <div className="page-kicker">
              // EVENT_STREAM
            </div>

            <h1 className="page-title">
              Notifications
            </h1>

            <div className="page-subtitle">
              Activity related to your Nexus node.
            </div>
          </div>

          <div className="notification-list">
            {notifications.length === 0 ? (
              <div className="empty">
                NO EVENTS DETECTED
              </div>
            ) : (
              notifications.map((notification) => {
                const actor =
                  data.users.find(
                    (u) =>
                      u.id ===
                      notification.actorId
                  );

                return (
                  <div
                    className={
                      "notification " +
                      (!notification.read
                        ? "unread"
                        : "")
                    }
                    key={notification.id}
                    onClick={() =>
                      markRead(notification)
                    }
                  >
                    <Avatar user={actor} />

                    <div className="notification-text">
                      <strong>
                        {actor?.displayName ||
                          notification.actorName ||
                          "Nexus User"}
                      </strong>{" "}
                      {notification.type ===
                        "follow"
                        ? "started following you."
                        : notification.type ===
                          "like"
                        ? "liked your post."
                        : notification.type ===
                          "comment"
                        ? "commented on your post."
                        : notification.text ||
                          "interacted with you."}
                    </div>

                    <div className="notification-time">
                      {formatDate(
                        notification.createdAt
                      )}
                    </div>
                  </div>
                );
              })
            )}
          </div>
        </>
      );
    }

    /* ============================================================
       MESSAGES
    ============================================================ */

    function conversationKey(a, b) {
      return [a, b].sort().join("_");
    }

    function MessagesPage({
      currentUser,
      profile,
      users,
      messages
    }) {
      const [selectedUserId, setSelectedUserId] =
        useState(null);

      const [search, setSearch] =
        useState("");

      const [newUsername, setNewUsername] =
        useState("");

      const [messageText, setMessageText] =
        useState("");

      const messagesEndRef = useRef(null);

      const selectedUser =
        users.find(
          (u) => u.id === selectedUserId
        ) || null;

      const visibleUsers = users
        .filter(
          (u) => u.id !== currentUser?.uid
        )
        .filter((u) => {
          const q = search.toLowerCase();

          return (
            !q ||
            String(
              u.displayName || ""
            )
              .toLowerCase()
              .includes(q) ||
            String(
              u.username || ""
            )
              .toLowerCase()
              .includes(q)
          );
        });

      const conversationMessages =
        selectedUser
          ? messages
              .filter(
                (m) =>
                  m.conversationId ===
                  conversationKey(
                    currentUser.uid,
                    selectedUser.id
                  )
              )
              .sort(
                (a, b) =>
                  (a.createdAt?.seconds || 0) -
                  (b.createdAt?.seconds || 0)
              )
          : [];

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({
          behavior: "smooth"
        });
      }, [conversationMessages.length]);

      function startChat() {
        const query = newUsername
          .trim()
          .replace(/^@/, "")
          .toLowerCase();

        if (!query) return;

        const user = users.find(
          (u) =>
            String(u.username || "")
              .toLowerCase() === query
        );

        if (!user) {
          alert("User not found.");
          return;
        }

        setSelectedUserId(user.id);
        setNewUsername("");
      }

      async function sendMessage() {
        const text = messageText.trim();

        if (
          !text ||
          !selectedUser ||
          !currentUser
        ) {
          return;
        }

        const conversationId =
          conversationKey(
            currentUser.uid,
            selectedUser.id
          );

        try {
          await collectionRef("messages")
            .doc(uid())
            .set({
              senderId: currentUser.uid,
              receiverId: selectedUser.id,
              conversationId,
              text,
              createdAt:
                firebase.firestore.FieldValue.serverTimestamp()
            });

          setMessageText("");
        } catch (error) {
          console.error(error);
        }
      }

      return (
        <>
          <div className="page-header">
            <div className="page-kicker">
              // SECURE_CHANNEL
            </div>

            <h1 className="page-title">
              Messages
            </h1>
          </div>

          <div className="messages-shell">
            <aside className="chat-list">
              <div className="new-chat">
                <div className="new-chat-title">
                  NEW_CONNECTION
                </div>

                <div className="new-chat-row">
                  <input
                    className="small-input"
                    value={newUsername}
                    onChange={(e) =>
                      setNewUsername(
                        e.target.value
                      )
                    }
                    onKeyDown={(e) => {
                      if (e.key === "Enter") {
                        startChat();
                      }
                    }}
                    placeholder="@username"
                  />

                  <button
                    className="ghost-btn"
                    onClick={startChat}
                  >
                    OPEN
                  </button>
                </div>
              </div>

              <div className="chat-search">
                <input
                  className="small-input"
                  value={search}
                  onChange={(e) =>
                    setSearch(e.target.value)
                  }
                  placeholder="search connections..."
                />
              </div>

              {visibleUsers.map((user) => (
                <button
                  className={
                    "chat-item " +
                    (selectedUserId === user.id
                      ? "active"
                      : "")
                  }
                  key={user.id}
                  onClick={() =>
                    setSelectedUserId(user.id)
                  }
                >
                  <Avatar user={user} />

                  <div className="chat-info">
                    <div className="chat-name">
                      {user.displayName ||
                        "Nexus User"}
                    </div>

                    <div className="chat-preview">
                      @{getUsername(user)}
                    </div>
                  </div>
                </button>
              ))}
            </aside>

            <section className="chat-window">
              {!selectedUser ? (
                <div
                  style={{
                    flex: 1,
                    display: "grid",
                    placeItems: "center"
                  }}
                >
                  <div className="empty">
                    SELECT A CONNECTION
                    <br />
                    <br />
                    <span
                      style={{
                        color: "var(--green)"
                      }}
                    >
                      &gt;_
                    </span>{" "}
                    encrypted channel ready
                  </div>
                </div>
              ) : (
                <>
                  <div className="chat-header">
                    <Avatar user={selectedUser} />

                    <div className="chat-header-info">
                      <div className="chat-header-name">
                        {selectedUser.displayName ||
                          "Nexus User"}
                      </div>

                      <div className="chat-header-status">
                        ● CHANNEL ACTIVE
                      </div>
                    </div>
                  </div>

                  <div className="messages">
                    {conversationMessages.length ===
                    0 ? (
                      <div
                        className="empty"
                        style={{
                          margin: "auto"
                        }}
                      >
                        NO MESSAGES
                        <br />
                        START THE CHANNEL
                      </div>
                    ) : (
                      conversationMessages.map(
                        (message) => (
                          <div
                            key={message.id}
                            className={
                              "message " +
                              (message.senderId ===
                              currentUser.uid
                                ? "mine"
                                : "")
                            }
                          >
                            {message.text}

                            <span className="message-time">
                              {formatDate(
                                message.createdAt
                              )}
                            </span>
                          </div>
                        )
                      )
                    )}

                    <div
                      ref={messagesEndRef}
                    />
                  </div>

                  <div className="message-input">
                    <input
                      value={messageText}
                      onChange={(e) =>
                        setMessageText(
                          e.target.value
                        )
                      }
                      onKeyDown={(e) => {
                        if (e.key === "Enter") {
                          sendMessage();
                        }
                      }}
                      placeholder="transmit message..."
                    />

                    <button
                      className="primary-btn"
                      onClick={sendMessage}
                      disabled={!messageText.trim()}
                    >
                      SEND →
                    </button>
                  </div>
                </>
              )}
            </section>
          </div>
        </>
      );
    }

    /* ============================================================
       RIGHT SIDEBAR
    ============================================================ */

    function RightSidebar({
      currentUser,
      profile,
      data
    }) {
      return (
        <aside className="right-sidebar">
          <WhoToFollow
            currentUser={currentUser}
            profile={profile}
            users={data.users}
            follows={data.follows}
          />

          <Trending posts={data.posts} />

          <SystemStatus />
        </aside>
      );
    }

    /* ============================================================
       MOBILE NAV
    ============================================================ */

    function MobileNav({
      page,
      setPage,
      unreadNotifications
    }) {
      const items = [
        ["home", "⌂"],
        ["messages", "⌁"],
        ["notifications", "◈"],
        ["profile", "◎"]
      ];

      return (
        <nav className="mobile-nav">
          {items.map(([key, icon]) => (
            <button
              key={key}
              className={
                page === key ? "active" : ""
              }
              onClick={() => setPage(key)}
            >
              {icon}

              {key === "notifications" &&
                unreadNotifications > 0 && (
                  <span
                    style={{
                      position: "absolute",
                      marginLeft: -7,
                      marginTop: -17,
                      width: 6,
                      height: 6,
                      background:
                        "var(--green)",
                      borderRadius: "50%"
                    }}
                  />
                )}
            </button>
          ))}
        </nav>
      );
    }

    /* ============================================================
       PROFILE INITIALIZATION
    ============================================================ */

    async function ensureProfile(firebaseUser, users) {
      if (!firebaseUser) return null;

      const existing = users.find(
        (u) => u.id === firebaseUser.uid
      );

      if (existing) {
        return existing;
      }

      const baseName =
        firebaseUser.displayName ||
        "Nexus User";

      const username =
        makeUsername(baseName) +
        "_" +
        firebaseUser.uid
          .slice(0, 5)
          .toLowerCase();

      const newProfile = {
        displayName: baseName,
        username,
        bio: "Connected to the Nexus.",
        photoURL:
          firebaseUser.photoURL || "",
        createdAt:
          firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        await collectionRef("users")
          .doc(firebaseUser.uid)
          .set(newProfile);

        return {
          id: firebaseUser.uid,
          ...newProfile
        };
      } catch (error) {
        console.error(error);

        return {
          id: firebaseUser.uid,
          ...newProfile
        };
      }
    }

    /* ============================================================
       APP
    ============================================================ */

    function App() {
      const {
        user: currentUser,
        authLoading
      } = useFirebaseAuth();

      const {
        data,
        loading,
        error
      } = useRealtimeData();

      const [page, setPage] =
        useState("home");

      const [search, setSearch] =
        useState("");

      const [profile, setProfile] =
        useState(null);

      const [profileReady, setProfileReady] =
        useState(false);

      /* Initialize profile */
      useEffect(() => {
        let cancelled = false;

        async function init() {
          if (!currentUser) return;

          if (data.users.length === 0) {
            return;
          }

          const result =
            await ensureProfile(
              currentUser,
              data.users
            );

          if (!cancelled) {
            setProfile(result);
            setProfileReady(true);
          }
        }

        init();

        return () => {
          cancelled = true;
        };
      }, [currentUser, data.users.length]);

      /* Keep profile synced */
      useEffect(() => {
        if (!currentUser) return;

        const liveProfile =
          data.users.find(
            (u) => u.id === currentUser.uid
          );

        if (liveProfile) {
          setProfile(liveProfile);
          setProfileReady(true);
        }
      }, [data.users, currentUser]);

      if (authLoading || loading || !profileReady) {
        return (
          <div className="boot-screen">
            <div className="boot-terminal">
              <div className="terminal-header">
                <span className="terminal-dot active" />
                <span className="terminal-dot" />
                <span className="terminal-dot" />

                <span className="terminal-title">
                  nexus_boot_sequence
                </span>
              </div>

              <div className="boot-content">
                <div className="boot-logo">
                  NEXUS
                </div>

                <div className="boot-line">
                  <span>[OK]</span>{" "}
                  initializing core...
                </div>

                <div className="boot-line">
                  <span>[OK]</span>{" "}
                  establishing Firebase connection...
                </div>

                <div className="boot-line">
                  <span>[OK]</span>{" "}
                  loading realtime data streams...
                </div>

                <div className="boot-line">
                  <span>[..]</span>{" "}
                  authenticating user node...
                </div>

                <div className="loading-bar" />
              </div>
            </div>
          </div>
        );
      }

      if (error) {
        return (
          <div className="error-screen">
            <div className="error-card">
              <h2>
                CONNECTION_FAILURE
              </h2>

              <p>
                Nexus could not connect to the
                realtime database.
              </p>

              <code>{error}</code>

              <button
                className="primary-btn"
                style={{ marginTop: 18 }}
                onClick={() =>
                  window.location.reload()
                }
              >
                RETRY_CONNECTION
              </button>
            </div>
          </div>
        );
      }

      const unreadNotifications =
        data.notifications.filter(
          (n) =>
            (n.userId === currentUser?.uid ||
              n.recipientId ===
                currentUser?.uid) &&
            !n.read
        ).length;

      function renderPage() {
        switch (page) {
          case "messages":
            return (
              <MessagesPage
                currentUser={currentUser}
                profile={profile}
                users={data.users}
                messages={data.messages}
              />
            );

          case "notifications":
            return (
              <NotificationsPage
                currentUser={currentUser}
                data={data}
              />
            );

          case "profile":
            return (
              <ProfilePage
                currentUser={currentUser}
                profile={profile}
                users={data.users}
                posts={data.posts}
                comments={data.comments}
                likes={data.likes}
                follows={data.follows}
              />
            );

          case "home":
          default:
            return (
              <HomePage
                currentUser={currentUser}
                profile={profile}
                data={data}
                search={search}
              />
            );
        }
      }

      return (
        <div className="app">
          <Topbar
            profile={profile}
            page={page}
            setPage={setPage}
            search={search}
            setSearch={setSearch}
            unreadNotifications={
              unreadNotifications
            }
          />

          <div className="main-layout">
            <Sidebar
              page={page}
              setPage={setPage}
              profile={profile}
              unreadNotifications={
                unreadNotifications
              }
            />

            <main>{renderPage()}</main>

            <RightSidebar
              currentUser={currentUser}
              profile={profile}
              data={data}
            />
          </div>

          <MobileNav
            page={page}
            setPage={setPage}
            unreadNotifications={
              unreadNotifications
            }
          />
        </div>
      );
    }

    /* ============================================================
       START
    ============================================================ */

    ReactDOM.createRoot(
      document.getElementById("root")
    ).render(<App />);
  </script>
</body>
</html>
