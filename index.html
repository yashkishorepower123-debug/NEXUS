<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>NEXUS — Social Platform</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body,
    #root {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #050505;
      color: #fff;
    }

    body {
      min-height: 100vh;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* BOOT */

    #boot-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background:
        radial-gradient(circle at top, #1c1c1c, #090909 40%, #000);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity .4s ease, visibility .4s ease;
    }

    #boot-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .boot-box {
      text-align: center;
    }

    .boot-logo {
      min-width: 120px;
      height: 78px;
      padding: 0 16px;
      margin: auto auto 18px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg,#fff,#888);
      color: #000;
    }

    .boot-title {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .boot-made {
      color: #aaa;
      margin-top: 6px;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .boot-spinner {
      width: 26px;
      height: 26px;
      border: 3px solid #333;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 25px auto 12px;
    }

    .boot-loading {
      color: #777;
      font-size: 13px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* APP */

    .app {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -10%,#1c1c1c,#080808 35%,#050505 70%);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 64px;
      border-bottom: 1px solid #222;
      background: rgba(5,5,5,.9);
      backdrop-filter: blur(18px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: #fff;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: 1px solid #292929;
      background: #111;
      color: #fff;
      border-radius: 12px;
    }

    .layout {
      width: min(1180px,100%);
      margin: auto;
      display: grid;
      grid-template-columns: 230px minmax(0,650px) 260px;
      gap: 22px;
      padding: 24px 16px;
    }

    .sidebar {
      position: sticky;
      top: 88px;
      height: fit-content;
    }

    .nav-card,
    .side-card {
      background: rgba(15,15,15,.85);
      border: 1px solid #242424;
      border-radius: 18px;
      padding: 10px;
    }

    .nav-item {
      width: 100%;
      border: 0;
      background: transparent;
      color: #aaa;
      padding: 12px;
      border-radius: 12px;
      text-align: left;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .nav-item:hover,
    .nav-item.active {
      background: #1b1b1b;
      color: #fff;
    }

    main,
    .feed {
      min-width: 0;
    }

    /* COMPOSER */

    .composer {
      background: #101010;
      border: 1px solid #252525;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .composer textarea {
      width: 100%;
      min-height: 90px;
      resize: vertical;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font-size: 16px;
    }

    .composer-bottom {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .primary {
      border: 0;
      background: #fff;
      color: #000;
      padding: 10px 17px;
      border-radius: 11px;
      font-weight: 800;
    }

    .primary:hover {
      background: #ddd;
    }

    .secondary {
      border: 1px solid #303030;
      background: #151515;
      color: #fff;
      padding: 9px 15px;
      border-radius: 11px;
    }

    /* SEARCH */

    .search-box {
      margin-bottom: 17px;
    }

    .search-box input {
      width: 100%;
      background: #111;
      color: #fff;
      border: 1px solid #282828;
      border-radius: 13px;
      padding: 12px 14px;
      outline: none;
    }

    /* POSTS */

    .post {
      background: #101010;
      border: 1px solid #252525;
      border-radius: 18px;
      padding: 17px;
      margin-bottom: 15px;
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg,#fff,#777);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      flex-shrink: 0;
    }

    .avatar.small {
      width: 34px;
      height: 34px;
      font-size: 13px;
    }

    .post-author {
      font-weight: 800;
    }

    .post-time {
      color: #666;
      font-size: 12px;
      margin-top: 2px;
    }

    .post-content {
      white-space: pre-wrap;
      word-break: break-word;
      margin: 15px 0;
      line-height: 1.55;
      color: #eee;
    }

    .hashtag {
      color: #8ab4ff;
    }

    .post-actions {
      display: flex;
      gap: 5px;
      border-top: 1px solid #202020;
      padding-top: 11px;
    }

    .action-btn {
      border: 0;
      background: transparent;
      color: #888;
      padding: 8px 10px;
      border-radius: 9px;
    }

    .action-btn:hover {
      background: #1b1b1b;
      color: #fff;
    }

    .action-btn.liked {
      color: #ff6b8a;
    }

    .post-menu {
      border: 0;
      background: transparent;
      color: #777;
      font-size: 19px;
    }

    /* COMMENTS */

    .comments {
      margin-top: 12px;
      border-top: 1px solid #202020;
      padding-top: 12px;
    }

    .comment {
      display: flex;
      gap: 9px;
      margin-bottom: 10px;
    }

    .comment-body {
      background: #181818;
      border-radius: 12px;
      padding: 8px 11px;
      flex: 1;
    }

    .comment-name {
      font-size: 12px;
      font-weight: 800;
      color: #aaa;
    }

    .comment-text {
      font-size: 14px;
      margin-top: 3px;
      line-height: 1.4;
    }

    .comment-input {
      width: 100%;
      background: #181818;
      border: 1px solid #292929;
      border-radius: 11px;
      padding: 10px;
      color: #fff;
      outline: none;
      margin-top: 7px;
    }

    /* PROFILE */

    .profile-card {
      background: #101010;
      border: 1px solid #252525;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .profile-cover {
      height: 150px;
      background:
        radial-gradient(circle at 20% 20%,#555,transparent 35%),
        linear-gradient(135deg,#292929,#050505);
    }

    .profile-main {
      padding: 0 20px 20px;
    }

    .profile-avatar {
      width: 86px;
      height: 86px;
      margin-top: -43px;
      border: 5px solid #101010;
      border-radius: 50%;
      background: linear-gradient(135deg,#fff,#777);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 900;
    }

    .profile-name {
      font-size: 24px;
      font-weight: 900;
      margin-top: 12px;
    }

    .profile-username {
      color: #777;
      margin-top: 3px;
    }

    .profile-bio {
      color: #ccc;
      margin-top: 13px;
      line-height: 1.5;
    }

    .profile-stats {
      display: flex;
      gap: 25px;
      margin-top: 18px;
    }

    .stat strong {
      display: block;
      font-size: 18px;
    }

    .stat span {
      color: #777;
      font-size: 12px;
    }

    /* SIDE */

    .side-title {
      font-weight: 800;
      margin-bottom: 13px;
    }

    .person {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 12px;
    }

    .person-info {
      min-width: 0;
      flex: 1;
    }

    .person-name {
      font-weight: 700;
      font-size: 14px;
    }

    .person-user {
      color: #666;
      font-size: 12px;
    }

    .follow-btn {
      border: 1px solid #333;
      background: #fff;
      color: #000;
      padding: 6px 10px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 800;
    }

    /* MODAL */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(0,0,0,.75);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal {
      width: min(500px,100%);
      background: #111;
      border: 1px solid #303030;
      border-radius: 20px;
      padding: 20px;
    }

    .field {
      margin-bottom: 13px;
    }

    .field label {
      display: block;
      color: #888;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .field input,
    .field textarea {
      width: 100%;
      background: #181818;
      border: 1px solid #303030;
      border-radius: 11px;
      padding: 11px;
      color: #fff;
      outline: none;
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }

    /* =====================================================
       CHAT
    ===================================================== */

    .chat-app {
      height: calc(100vh - 112px);
      min-height: 560px;
      display: grid;
      grid-template-columns: 230px minmax(0,1fr);
      background: #0c0c0c;
      border: 1px solid #252525;
      border-radius: 18px;
      overflow: hidden;
    }

    .chat-list {
      border-right: 1px solid #252525;
      background: #0e0e0e;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-list-header {
      padding: 15px;
      border-bottom: 1px solid #252525;
    }

    .chat-list-title {
      font-size: 19px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .chat-search {
      width: 100%;
      background: #181818;
      border: 1px solid #292929;
      color: #fff;
      border-radius: 11px;
      padding: 10px 11px;
      outline: none;
    }

    .chat-users {
      overflow-y: auto;
      flex: 1;
    }

    .chat-item {
      width: 100%;
      border: 0;
      border-bottom: 1px solid #1c1c1c;
      background: transparent;
      color: #fff;
      padding: 11px;
      display: flex;
      align-items: center;
      gap: 9px;
      text-align: left;
    }

    .chat-item:hover,
    .chat-item.active {
      background: #1a1a1a;
    }

    .chat-item-info {
      min-width: 0;
      flex: 1;
    }

    .chat-item-name {
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-item-last {
      color: #666;
      font-size: 11px;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-window {
      min-width: 0;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 50% 0%,#171717,#0a0a0a 65%);
    }

    .chat-header {
      height: 67px;
      flex-shrink: 0;
      padding: 10px 14px;
      border-bottom: 1px solid #252525;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-header-info {
      min-width: 0;
    }

    .chat-header-name {
      font-weight: 900;
    }

    .chat-status {
      color: #777;
      font-size: 11px;
      margin-top: 3px;
    }

    .chat-status.online {
      color: #72d572;
    }

    .chat-back {
      display: none;
      border: 0;
      background: transparent;
      color: #aaa;
      font-size: 21px;
      padding: 5px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 15px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .chat-empty {
      margin: auto;
      text-align: center;
      color: #555;
      padding: 30px;
    }

    .chat-bubble-row {
      display: flex;
      width: 100%;
    }

    .chat-bubble-row.mine {
      justify-content: flex-end;
    }

    .chat-bubble {
      max-width: min(75%,420px);
      padding: 9px 12px;
      border-radius: 15px;
      background: #202020;
      color: #eee;
      word-break: break-word;
      line-height: 1.4;
      font-size: 14px;
    }

    .chat-bubble.mine {
      background: #fff;
      color: #000;
      border-bottom-right-radius: 5px;
    }

    .chat-bubble:not(.mine) {
      border-bottom-left-radius: 5px;
    }

    .chat-time {
      font-size: 9px;
      opacity: .5;
      margin-top: 4px;
      text-align: right;
    }

    .typing-indicator {
      color: #777;
      font-size: 11px;
      min-height: 17px;
      padding: 0 15px 5px;
    }

    .chat-composer {
      border-top: 1px solid #252525;
      padding: 10px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: #0d0d0d;
    }

    .chat-composer textarea {
      flex: 1;
      min-height: 42px;
      max-height: 120px;
      resize: none;
      background: #181818;
      border: 1px solid #292929;
      border-radius: 13px;
      padding: 11px 12px;
      color: #fff;
      outline: none;
    }

    .chat-send {
      width: 45px;
      height: 42px;
      border: 0;
      border-radius: 12px;
      background: #fff;
      color: #000;
      font-weight: 900;
      flex-shrink: 0;
    }

    .presence-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #444;
      border: 2px solid #111;
      position: absolute;
      right: -1px;
      bottom: -1px;
    }

    .presence-dot.online {
      background: #55d66a;
    }

    .avatar-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .chat-start-hint {
      margin: auto;
      text-align: center;
      padding: 30px;
      color: #555;
    }

    /* ERROR */

    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #050505;
    }

    .error-card {
      width: min(650px,100%);
      background: #111;
      border: 1px solid #3b2222;
      border-radius: 20px;
      padding: 25px;
    }

    .error-message {
      background: #190d0d;
      border: 1px solid #3c1d1d;
      border-radius: 12px;
      padding: 12px;
      color: #ffb5b5;
      font-family: monospace;
      word-break: break-word;
      margin: 15px 0;
    }

    .setup-list {
      color: #bbb;
      line-height: 1.7;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      color: #666;
    }

    .status {
      font-size: 12px;
      color: #555;
      margin: -8px 0 15px;
    }

    /* MOBILE */

    @media(max-width:950px) {
      .layout {
        grid-template-columns: 190px minmax(0,1fr);
      }

      .right-sidebar {
        display: none;
      }

      .chat-app {
        grid-template-columns: 210px minmax(0,1fr);
      }
    }

    @media(max-width:700px) {
      .layout {
        display: block;
        padding: 15px 10px 80px;
      }

      .sidebar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        top: auto;
        z-index: 200;
        padding: 7px;
        background: rgba(5,5,5,.94);
        border-top: 1px solid #222;
      }

      .nav-card {
        display: flex;
        justify-content: space-around;
        padding: 3px;
      }

      .nav-item {
        width: auto;
        margin: 0;
        text-align: center;
        font-size: 12px;
      }

      .topbar {
        height: 58px;
      }

      .post,
      .composer,
      .profile-card {
        border-radius: 14px;
      }

      .chat-app {
        height: calc(100vh - 133px);
        min-height: 500px;
        display: block;
        position: relative;
      }

      .chat-list {
        height: 100%;
        border-right: 0;
      }

      .chat-window {
        position: absolute;
        inset: 0;
        display: none;
      }

      .chat-app.chat-open .chat-list {
        display: none;
      }

      .chat-app.chat-open .chat-window {
        display: flex;
      }

      .chat-back {
        display: block;
      }

      .chat-bubble {
        max-width: 82%;
      }
    }
  </style>
</head>

    <div class="boot-logo">NEXUS</div>

    <div class="boot-loading">Connecting to Firebase...</div>
  </div>
</div>

<div id="root"></div>

<script type="text/babel">

const {
  useState,
  useEffect,
  useMemo
} = React;


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyDTrvD7c1TUtPUUOSX7_-0VV9itC28LOg0",
  authDomain: "nexus-37600.firebaseapp.com",
  projectId: "nexus-37600",
  storageBucket: "nexus-37600.firebasestorage.app",
  messagingSenderId: "61496309341",
  appId: "1:61496309341:web:fdb3711264df47f318bfb4",
  measurementId: "G-41S50YF5RF"
};

const APP_ID = "nexus-37600";

let auth = null;
let db = null;

try {
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }

  auth = firebase.auth();
  db = firebase.firestore();

} catch (error) {
  console.error("Firebase initialization failed:", error);
}


function collectionPath(name) {
  if (!db) {
    throw new Error("Firestore is not initialized.");
  }

  return db
    .collection("artifacts")
    .doc(APP_ID)
    .collection("public")
    .doc("data")
    .collection(name);
}


/* =========================================================
   HELPERS
========================================================= */

function timestampMillis(value) {

  if (!value) return 0;

  try {

    if (typeof value.toMillis === "function") {
      return value.toMillis();
    }

    if (typeof value.seconds === "number") {
      return value.seconds * 1000;
    }

    if (value instanceof Date) {
      return value.getTime();
    }

    const date = new Date(value);

    return Number.isFinite(date.getTime())
      ? date.getTime()
      : 0;

  } catch {
    return 0;
  }
}


function formatTime(timestamp) {

  const time = timestampMillis(timestamp);

  if (!time) return "now";

  const diff = Math.max(0, Date.now() - time);

  const seconds = Math.floor(diff / 1000);

  if (seconds < 60) {
    return `${seconds}s`;
  }

  const minutes = Math.floor(seconds / 60);

  if (minutes < 60) {
    return `${minutes}m`;
  }

  const hours = Math.floor(minutes / 60);

  if (hours < 24) {
    return `${hours}h`;
  }

  const days = Math.floor(hours / 24);

  if (days < 30) {
    return `${days}d`;
  }

  return new Date(time).toLocaleDateString();
}


function getInitials(name) {

  if (!name) return "N";

  return name
    .trim()
    .split(/\s+/)
    .filter(Boolean)
    .slice(0,2)
    .map(x => x[0])
    .join("")
    .toUpperCase() || "N";
}


function makeHashtags(text) {

  if (!text) return [];

  return [
    ...new Set(
      (text.match(/#[a-zA-Z0-9_]+/g) || [])
        .map(x => x.toLowerCase())
    )

/* =========================================================
   AUTH
========================================================= */

function useAuth() {

  const [user,setUser] = useState(null);
  const [profile,setProfile] = useState(null);
  const [loading,setLoading] = useState(true);
  const [error,setError] = useState(null);

  useEffect(() => {

    if (!auth || !db) {

      setError({
        code: "firebase/init-failed",
        message: "Firebase could not initialize."
      });

      setLoading(false);

      return;
    }

    let cancelled = false;

    const unsubscribe =
      auth.onAuthStateChanged(async currentUser => {

        if (cancelled) return;

        try {

          if (!currentUser) {

            await auth.signInAnonymously();

            return;
          }

          setUser(currentUser);

          const userRef =
            collectionPath("users")
              .doc(currentUser.uid);

          const snapshot =
            await userRef.get();

          if (!snapshot.exists) {

            const newProfile = {
              uid: currentUser.uid,
              displayName: "Yash",
              username:
                "yash_" +
                currentUser.uid.slice(0,6),
              bio: "Welcome to Nexus 👋",
              followers: 0,
              following: 0,
              online: true,
              lastSeen:
                firebase.firestore.FieldValue
                  .serverTimestamp(),
              createdAt:
                firebase.firestore.FieldValue
                  .serverTimestamp()
            };

            await userRef.set(newProfile);

            setProfile({
              ...newProfile,
              uid: currentUser.uid
            });

          } else {

            setProfile({
              uid: currentUser.uid,
              ...snapshot.data()
            });
          }

          setError(null);
          setLoading(false);

          setTimeout(() => {

            const screen =
              document.getElementById("boot-screen");

            if (screen) {
              screen.classList.add("hide");
            }

          },300);

        } catch (error) {

          console.error(error);

          setError({
            code: error.code || "firebase/error",
            message:
              error.message ||
              "Could not connect to Firebase."
          });

          setLoading(false);

          const screen =
            document.getElementById("boot-screen");

          if (screen) {
            screen.classList.add("hide");
          }
        }

      });

    return () => {

      cancelled = true;

      if (unsubscribe) {
        unsubscribe();
      }

    };

  },[]);

  return {
    user,
    profile,
    setProfile,
    loading,
    error
  };
}


/* =========================================================
   PRESENCE
========================================================= */

function usePresence(user) {

  useEffect(() => {

    if (!user || !db) return;

    const userRef =
      collectionPath("users")
        .doc(user.uid);

    const setOnline = () => {

      userRef.update({
        online: true,
        lastSeen:
          firebase.firestore.FieldValue
            .serverTimestamp()
      }).catch(error => {
        console.warn("Presence update failed:", error);
      });

    };

    setOnline();

    const interval =
      setInterval(setOnline,15000);

    const handleVisibility = () => {

      if (document.visibilityState === "visible") {
        setOnline();
      }

    };

    document.addEventListener(
      "visibilitychange",
      handleVisibility
    );

    window.addEventListener(
      "focus",
      setOnline
    );

    return () => {

      clearInterval(interval);

      document.removeEventListener(
        "visibilitychange",
        handleVisibility
      );

      window.removeEventListener(
        "focus",
        setOnline
      );

      userRef.update({
        online: false,
        lastSeen:
          firebase.firestore.FieldValue
            .serverTimestamp()
      }).catch(() => {});

    };

  },[user?.uid]);

}


/* =========================================================
   REALTIME DATA
========================================================= */

const COLLECTIONS = [
  "users",
  "posts",
  "comments",
  "likes",
  "follows",
  "notifications",
  "messages",
  "chats"
];


function useRealtimeData(uid) {

  const [data,setData] = useState({
    users: [],
    posts: [],
    comments: [],
    likes: [],
    follows: [],
    notifications: [],
    messages: [],
    chats: []
  });

  const [ready,setReady] = useState(false);
  const [firestoreError,setFirestoreError] = useState(null);

  useEffect(() => {

    if (!uid || !db) {
      return;
    }

    setReady(false);
    setFirestoreError(null);

    const loaded = new Set();
    const unsubscribers = [];

    COLLECTIONS.forEach(name => {

      const unsubscribe =
        collectionPath(name)
          .onSnapshot(

            snapshot => {

              const items =
                snapshot.docs.map(doc => ({
                  id: doc.id,
                  ...doc.data()
                }));

              setData(previous => ({
                ...previous,
                [name]: items
              }));

              loaded.add(name);

              if (
                loaded.size ===
                COLLECTIONS.length
              ) {
                setReady(true);
              }

            },

            error => {

              console.error(
                `Firestore ${name} error:`,
                error
              );

              setFirestoreError({
                collection: name,
                code: error.code,
                message: error.message
              });

              loaded.add(name);

              if (
                loaded.size ===
                COLLECTIONS.length
              ) {
                setReady(true);
              }
            }
          );

      unsubscribers.push(unsubscribe);

    });

    return () => {

      unsubscribers.forEach(
        unsubscribe => unsubscribe()
      );

    };

  },[uid]);

  return {
    data,
    ready,
    firestoreError
  };
}

/* =========================================================
   POST CARD
========================================================= */

function PostCard({
  post,
  currentUser,
  profile,
  comments,
  likes,
  onProfile,
  onEdit
}) {

  const [commentText,setCommentText] = useState("");
  const [showComments,setShowComments] = useState(false);
  const [sending,setSending] = useState(false);

  const postLikes =
    likes.filter(x => x.postId === post.id);

  const liked =
    postLikes.some(
      x => x.userId === currentUser?.uid
    );

  const postComments =
    comments
      .filter(x => x.postId === post.id)
      .sort(
        (a,b) =>
          timestampMillis(a.createdAt) -
          timestampMillis(b.createdAt)
      );

  async function toggleLike() {

    if (!currentUser) return;

    try {

      const existing =
        postLikes.find(
          x =>
            x.userId === currentUser.uid
        );

      if (existing) {

        await collectionPath("likes")
          .doc(existing.id)
          .delete();

      } else {

        await collectionPath("likes").add({

          postId: post.id,

          userId: currentUser.uid,

          createdAt:
            firebase.firestore.FieldValue
              .serverTimestamp()

        });

        if (
          post.authorId &&
          post.authorId !== currentUser.uid
        ) {

          await collectionPath("notifications").add({

            userId: post.authorId,

            actorId: currentUser.uid,

            actorName:
              profile?.displayName || "Someone",

            type: "like",

            postId: post.id,

            read: false,

            createdAt:
              firebase.firestore.FieldValue
                .serverTimestamp()

          });

        }
      }

    } catch(error) {

      alert(
        "Like failed:\n\n" +
        error.message
      );

    }
  }


  async function addComment() {

    const clean = commentText.trim();

    if (!clean || !currentUser || sending) {
      return;
    }

    setSending(true);

    try {

      await collectionPath("comments").add({

        postId: post.id,

        userId: currentUser.uid,

        userName:
          profile?.displayName || "Yash",

        text: clean,

        createdAt:
          firebase.firestore.FieldValue
            .serverTimestamp()

      });

      if (
        post.authorId &&
        post.authorId !== currentUser.uid
      ) {

        await collectionPath("notifications").add({

          userId: post.authorId,

          actorId: currentUser.uid,

          actorName:
            profile?.displayName || "Someone",

          type: "comment",

          postId: post.id,

          read: false,

          createdAt:
            firebase.firestore.FieldValue
              .serverTimestamp()

        });

      }

      setCommentText("");

    } catch(error) {

      alert(
        "Comment failed:\n\n" +
        error.message
      );

    } finally {

      setSending(false);

    }
  }


  async function deletePost() {

    if (
      !confirm("Delete this post?")
    ) {
      return;
    }

    try {

      await collectionPath("posts")
        .doc(post.id)
        .delete();

      const relatedLikes =
        likes.filter(
          x => x.postId === post.id
        );

      const relatedComments =
        comments.filter(
          x => x.postId === post.id
        );

      await Promise.all([
        ...relatedLikes.map(
          x =>
            collectionPath("likes")
              .doc(x.id)
              .delete()
        ),
        ...relatedComments.map(
          x =>
            collectionPath("comments")
              .doc(x.id)
              .delete()
        )
      ]);

    } catch(error) {

      alert(
        "Delete failed:\n\n" +
        error.message
      );

    }
  }


  return (
    <article className="post">

      <div className="post-header">

        <div
          className="avatar"
          onClick={() => onProfile?.(post.authorId)}
          style={{cursor:"pointer"}}
        >
          {getInitials(post.authorName)}
        </div>

        <div
          onClick={() => onProfile?.(post.authorId)}
          style={{cursor:"pointer"}}
        >

          <div className="post-author">
            {post.authorName || "User"}
          </div>

          <div className="post-time">
            @{post.authorUsername || "user"}
            {" · "}
            {formatTime(post.createdAt)}
            {post.editedAt ? " · edited" : ""}
          </div>

        </div>

        {post.authorId === currentUser?.uid && (

          <div
            style={{
              marginLeft:"auto",
              display:"flex",
              gap:5
            }}
          >

            <button
              className="post-menu"
              onClick={() => onEdit?.(post)}
              title="Edit"
            >
              ✎
            </button>

            <button
              className="post-menu"
              onClick={deletePost}
              title="Delete"
            >
              🗑
            </button>

          </div>

        )}

      </div>


      <div className="post-content">

        {(post.content || "")
          .split(/(#[a-zA-Z0-9_]+)/g)
          .map((part,index) =>
            part.startsWith("#")
              ? (
                <span
                  className="hashtag"
                  key={index}
                >
                  {part}
                </span>
              )
              : part
          )}

      </div>


      <div className="post-actions">

        <button
          className={
            "action-btn " +
            (liked ? "liked" : "")
          }
          onClick={toggleLike}
        >
          {liked ? "♥" : "♡"} {postLikes.length}
        </button>

        <button
          className="action-btn"
          onClick={() =>
            setShowComments(x => !x)
          }
        >
          💬 {postComments.length}
        </button>

        <button
          className="action-btn"
          onClick={() => {

            if (navigator.clipboard) {

              navigator.clipboard
                .writeText(post.content || "")
                .then(() => {
                  alert("Post copied.");
                })
                .catch(() => {});
            }

          }}
        >
          ↗ Share
        </button>

      </div>


      {showComments && (

        <div className="comments">

          {postComments.map(comment => (

            <div
              className="comment"
              key={comment.id}
            >

              <div className="avatar small">
                {getInitials(comment.userName)}
              </div>

              <div className="comment-body">

                <div className="comment-name">
                  {comment.userName || "User"}
                </div>

                <div className="comment-text">
                  {comment.text}
                </div>

              </div>

            </div>

          ))}


          <input
            className="comment-input"
            value={commentText}
            onChange={e =>
              setCommentText(e.target.value)
            }
            onKeyDown={e => {

              if (
                e.key === "Enter" &&
                !e.shiftKey
              ) {

                e.preventDefault();
                addComment();

              }

            }}
            placeholder="Write a comment..."
          />

        </div>

      )}

    </article>
  );
}

========================================================= */

function WhoToFollow({
  users,
  currentUser,
  follows
}) {

  const candidates =
    users
      .filter(
        x => x.uid !== currentUser?.uid
      )
      .slice(0,5);

  async function toggleFollow(person) {

    if (!currentUser) return;

    const existing =
      follows.find(
        x =>
          x.followerId === currentUser.uid &&
          x.followingId === person.uid
      );

    try {

      if (existing) {

        await collectionPath("follows")
          .doc(existing.id)
          .delete();

      } else {

        await collectionPath("follows").add({

          followerId: currentUser.uid,

          followingId: person.uid,

          createdAt:
            firebase.firestore.FieldValue
              .serverTimestamp()

        });

        await collectionPath("notifications").add({

          userId: person.uid,

          actorId: currentUser.uid,

          actorName:
            currentUser.displayName ||
            "Someone",

          type: "follow",

          read: false,

          createdAt:
            firebase.firestore.FieldValue
              .serverTimestamp()

        });

      }

    } catch(error) {

      alert(
        "Follow failed:\n\n" +
        error.message
      );

    }
  }

  return (
    <div className="side-card">

      <div className="side-title">
        Who to follow
      </div>

      {candidates.length === 0 && (

        <div style={{
          color:"#666",
          fontSize:13
        }}>
          No suggestions yet.
        </div>

      )}

      {candidates.map(person => {

        const following =
          follows.some(
            x =>
              x.followerId === currentUser?.uid &&
              x.followingId === person.uid
          );

        return (

          <div
            className="person"
            key={person.uid}
          >

            <div className="avatar small">
              {getInitials(person.displayName)}
            </div>

            <div className="person-info">

              <div className="person-name">
                {person.displayName}
              </div>

              <div className="person-user">
                @{person.username}
              </div>

            </div>

            <button
              className="follow-btn"
              onClick={() =>
                toggleFollow(person)
              }
            >
              {following ? "Following" : "Follow"}
            </button>

          </div>

        );

      })}

    </div>
  );
}


/* =========================================================
   FEED
========================================================= */

function FeedView({
  user,
  profile,
  data,
  onProfile,
  onEdit,
  firestoreError
}) {

  const [query,setQuery] = useState("");

  const posts =
    useMemo(() => {

      const q = query.trim().toLowerCase();

      return [...data.posts]
        .sort(
          (a,b) =>
            timestampMillis(b.createdAt) -
            timestampMillis(a.createdAt)
        )
        .filter(post => {

          if (!q) return true;

          return (
            post.content?.toLowerCase().includes(q) ||
            post.authorName?.toLowerCase().includes(q) ||
            post.authorUsername?.toLowerCase().includes(q) ||
            (post.hashtags || []).some(
              tag => tag.toLowerCase().includes(q)
            )
          );

        });

    },[data.posts,query]);


  return (
    <div className="feed">

      <FirestoreErrorBanner
        error={firestoreError}
      />

      <div className="search-box">

        <input
          placeholder="Search Nexus..."
          value={query}
          onChange={e => setQuery(e.target.value)}
        />

      </div>

      <Composer
        user={user}
        profile={profile}
      />

      <div className="status">
        {posts.length} post{posts.length === 1 ? "" : "s"} loaded
      </div>

      {posts.length === 0 ? (

        <div className="empty">

          <div style={{fontSize:35}}>
            ✨
          </div>

          <div>
            {query
              ? "No matching posts."
              : "No posts yet."}
          </div>

          <div
            style={{
              fontSize:13,
              marginTop:5
            }}
          >
            {query
              ? "Try another search."
              : "Be the first person to post."}
          </div>

        </div>

      ) : (

        posts.map(post => (

          <PostCard
            key={post.id}
            post={post}
            currentUser={user}
            profile={profile}
            comments={data.comments}
            likes={data.likes}
            onProfile={onProfile}
            onEdit={onEdit}
          />

        ))

      )}

    </div>
  );
}

        (a,b) =>
          timestampMillis(b.createdAt) -
          timestampMillis(a.createdAt)
      );

  const followers =
    data.follows.filter(
      x => x.followingId === profile?.uid
    ).length;

  const following =
    data.follows.filter(
      x => x.followerId === profile?.uid
    ).length;

  if (!profile) {
    return (
      <div className="empty">
        Profile not found.
      </div>
    );
  }

  return (
    <div className="feed">

      <div className="profile-card">

        <div className="profile-cover"></div>

        <div className="profile-main">

          <div className="profile-avatar">
            {getInitials(profile.displayName)}
          </div>

          <div className="profile-name">
            {profile.displayName}
          </div>

          <div className="profile-username">
            @{profile.username}
          </div>

          <div className="profile-bio">
            {profile.bio || "No bio yet."}
          </div>

          <div className="profile-stats">

            <div className="stat">
              <strong>{followers}</strong>
              <span>Followers</span>
            </div>

            <div className="stat">
              <strong>{following}</strong>
              <span>Following</span>
            </div>

            <div className="stat">
              <strong>{userPosts.length}</strong>
              <span>Posts</span>
            </div>

          </div>

          {profile.uid === user.uid && (

            <button
              className="secondary"
              style={{marginTop:18}}
              onClick={onEditProfile}
            >
              Edit profile
            </button>

          )}

        </div>

      </div>

      {userPosts.map(post => (

        <PostCard
          key={post.id}
          post={post}
          currentUser={user}
          profile={profile}
          comments={data.comments}
          likes={data.likes}
          onProfile={onProfile}
          onEdit={() => {}}
        />

      ))}

      {userPosts.length === 0 && (

        <div className="empty">
          No posts yet.
        </div>

      )}

    </div>
  );
}

/* =========================================================
   CHAT HELPERS
========================================================= */

function makeChatId(uid1,uid2) {

  return [uid1,uid2]
    .sort()
    .join("_");

}


function isUserOnline(person) {

  if (!person?.online) {
    return false;
  }

  const lastSeen =
    timestampMillis(person.lastSeen);

  if (!lastSeen) {
    return true;
  }

  return Date.now() - lastSeen < 30000;
}


function getOtherParticipant(chat,userId) {

  if (!chat?.participants) return null;

  return chat.participants.find(
    id => id !== userId
  ) || null;

}


/* =========================================================
   MESSAGING
========================================================= */

function MessagingView({
  user,
  profile,
  data
}) {

  const [activeChat,setActiveChat] = useState(null);
  const [search,setSearch] = useState("");
  const [messageText,setMessageText] = useState("");
  const [messages,setMessages] = useState([]);
  const [typingUsers,setTypingUsers] = useState([]);
  const [sending,setSending] = useState(false);
  const [chatOpen,setChatOpen] = useState(false);

  const typingTimeout =
    React.useRef(null);


  /*
    Keep active chat synced with updated user/chat data.
  */

  useEffect(() => {

    if (!activeChat) return;

    const latest =
      data.chats.find(
        chat => chat.id === activeChat.id
      );

    if (latest) {
      setActiveChat(latest);
    }

  },[data.chats]);


  /*
    Real-time messages listener.
  */

  useEffect(() => {

    if (!activeChat || !db) {

      setMessages([]);
      return;
    }

    const unsubscribe =
      collectionPath("chats")
        .doc(activeChat.id)
        .collection("messages")
        .orderBy("createdAt","asc")
        .onSnapshot(

          snapshot => {

            const items =
              snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
              }));

            setMessages(items);

            setTimeout(() => {

              const box =
                document.getElementById(
                  "nexus-chat-messages"
                );

              if (box) {
                box.scrollTop =
                  box.scrollHeight;
              }

            },50);

          },

          error => {

            console.error(
              "Chat messages listener failed:",
              error
            );

          }

        );

    return () => unsubscribe();

  },[activeChat?.id]);


  /*
    Real-time typing listener.
  */

  useEffect(() => {

    if (!activeChat || !db) {

      setTypingUsers([]);
      return;
    }

    const unsubscribe =
      collectionPath("chats")
        .doc(activeChat.id)
        .collection("typing")
        .onSnapshot(

          snapshot => {

            const now = Date.now();

            const users =
              snapshot.docs
                .map(doc => ({
                  id: doc.id,
                  ...doc.data()
                }))
                .filter(person =>
                  person.uid !== user.uid &&
                  person.typing === true &&
                  (
                    !person.updatedAt ||
                    now -
                    timestampMillis(person.updatedAt)
                    < 5000
                  )
                );

            setTypingUsers(users);

          },

          error => {
            console.warn(
              "Typing listener failed:",
              error
            );
          }

        );

    return () => unsubscribe();

  },[activeChat?.id,user.uid]);


  /*
    Search users.
  */

  const searchResults =
    useMemo(() => {

      const q =
        search
          .trim()
          .replace(/^@/,"")
          .toLowerCase();

      if (!q) return [];

      return data.users
        .filter(person =>
          person.uid !== user.uid &&
          (
            String(person.displayName || "")
              .toLowerCase()
              .includes(q) ||
            String(person.username || "")
              .toLowerCase()
              .includes(q)
          )
        )
        .slice(0,10);

    },[search,data.users,user.uid]);


  /*
    Existing chats for the current user.
  */

  const myChats =
    useMemo(() => {

      return data.chats
        .filter(chat =>
          Array.isArray(chat.participants) &&
          chat.participants.includes(user.uid)
        )
        .sort(
          (a,b) =>
            timestampMillis(b.updatedAt) -
            timestampMillis(a.updatedAt)
        );

    },[data.chats,user.uid]);


  /*
    Get user profile from participant ID.
  */

  function getPerson(uid) {

    if (!uid) return null;

    return data.users.find(
      person => person.uid === uid
    ) || null;

  }


  /*
    Start or open a dedicated chat.
  */

  async function startChat(person) {

    if (!person || !user) return;

    const chatId =
      makeChatId(
        user.uid,
        person.uid
      );

    let chat =
      data.chats.find(
        item => item.id === chatId
      );

    try {

      if (!chat) {

        const participants =
          [user.uid,person.uid].sort();

        const participantNames = {
          [user.uid]:
            profile?.displayName || "Yash",

          [person.uid]:
            person.displayName || "User"
        };

        const chatData = {

          participants,

          participantNames,

          lastMessage: "",

          lastMessageSenderId: "",

          createdAt:
            firebase.firestore.FieldValue
              .serverTimestamp(),

          updatedAt:
            firebase.firestore.FieldValue
              .serverTimestamp()

        };

        await collectionPath("chats")
          .doc(chatId)
          .set(chatData);

        chat = {
          id: chatId,
          ...chatData,
          participants,
          participantNames
        };

      }

      setActiveChat(chat);
      setSearch("");
      setMessageText("");
      setChatOpen(true);

    } catch(error) {

      console.error(error);

      alert(
        "Could not open chat:\n\n" +
        error.message
      );

    }

  }


  /*
    Open existing chat.
  */

  function openExistingChat(chat) {

    setActiveChat(chat);
    setSearch("");
    setMessageText("");
    setChatOpen(true);

  }


  /*
    Update typing state.
  */

  async function updateTyping(value) {

    if (!activeChat || !user) return;

    const typingRef =
      collectionPath("chats")
        .doc(activeChat.id)
        .collection("typing")
        .doc(user.uid);

    try {

      if (value.trim()) {

        await typingRef.set({

          uid: user.uid,

          displayName:
            profile?.displayName || "Yash",

          typing: true,

          updatedAt:
            firebase.firestore.FieldValue
              .serverTimestamp()

        });

      } else {

        await typingRef.delete();

      }

    } catch(error) {

      console.warn(
        "Typing update failed:",
        error
      );

    }

  }


  /*
    Handle typing with a small debounce.
  */

  function handleMessageChange(value) {

    setMessageText(value);

    updateTyping(value);

    clearTimeout(
      typingTimeout.current
    );

    typingTimeout.current =
      setTimeout(() => {

        updateTyping("");

      },2000);

  }


  /*
    Send message.
  */

  async function sendMessage() {

    const clean =
      messageText.trim();

    if (
      !clean ||
      !activeChat ||
      !user ||
      sending
    ) {
      return;
    }

    setSending(true);

    try {

      const messagesRef =
        collectionPath("chats")
          .doc(activeChat.id)
          .collection("messages");

      await messagesRef.add({

        text: clean,

        senderId: user.uid,

        senderName:
          profile?.displayName || "Yash",

        createdAt:
          firebase.firestore.FieldValue
            .serverTimestamp()

      });

      await collectionPath("chats")
        .doc(activeChat.id)
        .set({

          participants:
            activeChat.participants,

          participantNames:
            activeChat.participantNames || {},

          lastMessage: clean,

          lastMessageSenderId:
            user.uid,

          updatedAt:
            firebase.firestore.FieldValue
              .serverTimestamp()

        },{
          merge:true
        });

      setMessageText("");

      clearTimeout(
        typingTimeout.current
      );

      await updateTyping("");

    } catch(error) {

      console.error(error);

      alert(
        "Message failed:\n\n" +
        error.message
      );

    } finally {

      setSending(false);

    }

  }


  /*
    Enter = send.
  */

  function handleKeyDown(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();
      sendMessage();

    }

  }


  /*
    Cleanup typing on unmount.
  */

  useEffect(() => {

    return () => {

      clearTimeout(
        typingTimeout.current
      );

    };

  },[]);


  const activePerson =
    activeChat
      ? getPerson(
          getOtherParticipant(
            activeChat,
            user.uid
          )
        )
      : null;


  const activeOnline =
    activePerson
      ? isUserOnline(activePerson)
      : false;


  return (
    <div
      className={
        "chat-app " +
        (chatOpen ? "chat-open" : "")
      }
    >

      {/* CHAT LIST */}

      <div className="chat-list">

        <div className="chat-list-header">

          <div className="chat-list-title">
            Messages
          </div>

          <input
            className="chat-search"
            value={search}
            onChange={e =>
              setSearch(e.target.value)
            }
            placeholder="Search users..."
          />

        </div>


        <div className="chat-users">

          {/* SEARCH RESULTS */}

          {search.trim() && searchResults.length > 0 && (

            <>

              <div
                style={{
                  padding:"10px 12px 6px",
                  color:"#555",
                  fontSize:10,
                  textTransform:"uppercase",
                  letterSpacing:1,
                  fontWeight:800
                }}
              >
                Users
              </div>

              {searchResults.map(person => (

                <button
                  className="chat-item"
                  key={person.uid}
                  onClick={() =>
                    startChat(person)
                  }
                >

                  <div className="avatar-wrap">

                    <div className="avatar small">
                      {getInitials(
                        person.displayName
                      )}
                    </div>

                    <div
                      className={
                        "presence-dot " +
                        (
                          isUserOnline(person)
                            ? "online"
                            : ""
                        )
                      }
                    />

                  </div>

                  <div className="chat-item-info">

                    <div className="chat-item-name">
                      {person.displayName || "User"}
                    </div>

                    <div className="chat-item-last">
                      @{person.username || "user"}
                    </div>

                  </div>

                </button>

              ))}

            </>

          )}


          {/* NO SEARCH RESULTS */}

          {search.trim() &&
            searchResults.length === 0 && (

              <div
                style={{
                  padding:25,
                  color:"#555",
                  textAlign:"center",
                  fontSize:13
                }}
              >
                No users found.
              </div>

            )}


          {/* EXISTING CHATS */}

          {!search.trim() && myChats.length > 0 && (

            <>

              <div
                style={{
                  padding:"10px 12px 6px",
                  color:"#555",
                  fontSize:10,
                  textTransform:"uppercase",
                  letterSpacing:1,
                  fontWeight:800
                }}
              >
                Chats
              </div>

              {myChats.map(chat => {

                const otherId =
                  getOtherParticipant(
                    chat,
                    user.uid
                  );

                const person =
                  getPerson(otherId);

                const name =
                  person?.displayName ||
                  chat.participantNames?.[otherId] ||
                  "User";

                const online =
                  person
                    ? isUserOnline(person)
                    : false;

                return (

                  <button
                    className={
                      "chat-item " +
                      (
                        activeChat?.id === chat.id
                          ? "active"
                          : ""
                      )
                    }
                    key={chat.id}
                    onClick={() =>
                      openExistingChat(chat)
                    }
                  >

                    <div className="avatar-wrap">

                      <div className="avatar small">
                        {getInitials(name)}
                      </div>

                      <div
                        className={
                          "presence-dot " +
                          (
                            online
                              ? "online"
                              : ""
                          )
                        }
                      />

                    </div>

                    <div className="chat-item-info">

                      <div className="chat-item-name">
                        {name}
                      </div>

                      <div className="chat-item-last">
                        {chat.lastMessage ||
                          "Start chatting"}
                      </div>

                    </div>

                  </button>

                );

              })}

            </>

          )}


          {/* EMPTY */}

          {!search.trim() &&
            myChats.length === 0 && (

              <div className="chat-start-hint">

                <div style={{
                  fontSize:30,
                  marginBottom:10
                }}>
                  💬
                </div>

                Search a username above
                to start a chat.

              </div>

            )}

        </div>

      </div>


      {/* CHAT WINDOW */}

      <div className="chat-window">

        {!activeChat ? (

          <div className="chat-start-hint">

            <div style={{
              fontSize:45,
              marginBottom:12
            }}>
              💬
            </div>

            <div style={{
              fontSize:18,
              fontWeight:800,
              color:"#aaa"
            }}>
              Your messages
            </div>

            <div style={{
              marginTop:7,
              lineHeight:1.5
            }}>
              Search for another Nexus user
              and start chatting.

            </div>

          </div>

        ) : (

          <>

            {/* HEADER */}

            <div className="chat-header">

              <button
                className="chat-back"
                onClick={() => {
                  setChatOpen(false);
                }}
              >
                ‹
              </button>

              <div className="avatar-wrap">

                <div className="avatar small">
                  {getInitials(
                    activePerson?.displayName ||
                    activeChat
                      .participantNames?.[
                        getOtherParticipant(
                          activeChat,
                          user.uid
                        )
                      ] ||
                    "User"
                  )}
                </div>

                <div
                  className={
                    "presence-dot " +
                    (
                      activeOnline
                        ? "online"
                        : ""
                    )
                  }
                />

              </div>

              <div className="chat-header-info">

                <div className="chat-header-name">

                  {activePerson?.displayName ||
                    activeChat
                      .participantNames?.[
                        getOtherParticipant(
                          activeChat,
                          user.uid
                        )
                      ] ||
                    "User"}

                </div>

                <div
                  className={
                    "chat-status " +
                    (
                      activeOnline
                        ? "online"
                        : ""
                    )
                  }
                >

                  {activeOnline
                    ? "online"
                    : activePerson?.lastSeen
                    ? "last seen " +
                      formatTime(
                        activePerson.lastSeen
                      ) +
                      " ago"
                    : "offline"}

                </div>

              </div>

            </div>


            {/* MESSAGES */}

            <div
              id="nexus-chat-messages"
              className="chat-messages"
            >

              {messages.length === 0 ? (

                <div className="chat-empty">

                  <div style={{
                    fontSize:30,
                    marginBottom:8
                  }}>
                    👋
                  </div>

                  No messages yet.
                  Say hello!

                </div>

              ) : (

                messages.map(message => {

                  const mine =
                    message.senderId === user.uid;

                  return (

                    <div
                      className={
                        "chat-bubble-row " +
                        (mine ? "mine" : "")
                      }
                      key={message.id}
                    >

                      <div
                        className={
                          "chat-bubble " +
                          (mine ? "mine" : "")
                        }
                      >

                        <div>
                          {message.text}
                        </div>

                        <div className="chat-time">
                          {formatTime(
                            message.createdAt
                          )}
                        </div>

                      </div>

                    </div>

                  );

                })

              )}

            </div>


            {/* TYPING */}

            <div className="typing-indicator">

              {typingUsers.length > 0
                ? (
                  typingUsers.length === 1
                    ? (
                      <>
                        {typingUsers[0].displayName ||
                          "Someone"} is typing...
                      </>
                    )
                    : "Several people are typing..."
                )
                : ""}

            </div>


            {/* COMPOSER */}

            <div className="chat-composer">

              <textarea
                value={messageText}
                onChange={e =>
                  handleMessageChange(
                    e.target.value
                  )
                }
                onKeyDown={handleKeyDown}
                placeholder="Type a message..."
                maxLength={2000}
              />

              <button
                className="chat-send"
                disabled={
                  sending ||
                  !messageText.trim()
                }
                onClick={sendMessage}
              >
                {sending ? "…" : "➤"}
              </button>

            </div>

          </>

        )}

      </div>

    </div>
  );
}

   MAIN

function Nexus() {

  const {
    user,
    profile,
    setProfile,
    loading,
    error
  } = useAuth();

  usePresence(user);

  const {
    data,
    ready,
    firestoreError
  } = useRealtimeData(user?.uid);

  const [page,setPage] = useState("home");
  const [selectedProfile,setSelectedProfile] = useState(null);
  const [editingProfile,setEditingProfile] = useState(false);
  const [editingPost,setEditingPost] = useState(null);


  function retry() {
    window.location.reload();
  }


  function openProfile(uid) {

    if (!uid) return;

    const target =
      data.users.find(
        x => x.uid === uid
      );

    if (!target) {

      if (uid === user?.uid && profile) {
        setSelectedProfile(profile);
        setPage("profile");
      }

      return;
    }

    setSelectedProfile(target);
    setPage("profile");
  }


  function openMyProfile() {

    if (!profile) return;

    setSelectedProfile(profile);
    setPage("profile");
  }


  if (loading) {
    return null;
  }


  if (error) {

    return (
      <FirebaseErrorScreen
        error={error}
        retry={retry}
      />
    );
  }


  if (!user || !profile) {

    return (
      <FirebaseErrorScreen
        error={{
          code:"auth/no-user",
          message:
            "Firebase did not return a signed-in user."
        }}
        retry={retry}
      />
    );
  }


  if (!ready) {

    return (
      <div
        style={{
          minHeight:"100vh",
          display:"flex",
          alignItems:"center",
          justifyContent:"center",
          background:"#050505",
          color:"#777"
        }}
      >
        Loading NEXUS data...
      </div>
    );
  }


  let content = null;


  if (page === "home") {

    content = (
      <FeedView
        user={user}
        profile={profile}
        data={data}
        onProfile={openProfile}
        onEdit={setEditingPost}
        firestoreError={firestoreError}
      />
    );
  }


  if (page === "profile") {

    content = (
      <ProfileView
        profile={
          selectedProfile || profile
        }
        user={user}
        data={data}
        onEditProfile={() =>
          setEditingProfile(true)
        }
        onProfile={openProfile}
      />
    );
  }


  if (page === "notifications") {

    content = (
      <NotificationsView
        user={user}
        data={data}
      />
    );
  }


  if (page === "messages") {

    content = (
      <MessagingView
        user={user}
        profile={profile}
        data={data}
      />
    );
  }


  return (

    <div className="app">

      <header className="topbar">

        <div className="brand">

          <div className="brand-logo">
            N
          </div>

          NEXUS

        </div>

        <button
          className="icon-btn"
          onClick={openMyProfile}
          title="Profile"
        >
          {getInitials(profile.displayName)}
        </button>

      </header>


      <div className="layout">

        <aside className="sidebar">

          <div className="nav-card">

            <button
              className={
                "nav-item " +
                (page === "home"
                  ? "active"
                  : "")
              }
              onClick={() => {
                setPage("home");
                setSelectedProfile(null);
              }}
            >
              🏠 Home
            </button>

            <button
              className={
                "nav-item " +
                (page === "profile"
                  ? "active"
                  : "")
              }
              onClick={openMyProfile}
            >
              👤 Profile
            </button>

            <button
              className={
                "nav-item " +
                (page === "notifications"
                  ? "active"
                  : "")
              }
              onClick={() =>
                setPage("notifications")
              }
            >
              🔔 Notifications
            </button>

            <button
              className={
                "nav-item " +
                (page === "messages"
                  ? "active"
                  : "")
              }
              onClick={() =>
                setPage("messages")
              }
            >
              💬 Messages
            </button>

          </div>

        </aside>


        <main>
          {content}
        </main>


        <aside className="right-sidebar">

          <WhoToFollow
            users={data.users}
            currentUser={user}
            follows={data.follows}
          />


          <div
            className="side-card"
            style={{marginTop:15}}
          >

            <div className="side-title">
              Trending
            </div>

            {(() => {

              const counts = {};

              data.posts.forEach(post => {

                (post.hashtags || [])
                  .forEach(tag => {

                    counts[tag] =
                      (counts[tag] || 0) + 1;

                  });

              });

              const trending =
                Object.entries(counts)
                  .sort(
                    (a,b) => b[1] - a[1]
                  )
                  .slice(0,5);

              if (!trending.length) {

                return (
                  <div
                    style={{
                      color:"#666",
                      fontSize:13
                    }}
                  >
                    Start posting with hashtags
                    to create trends.
                  </div>
                );
              }

              return trending.map(
                ([tag,count]) => (

                  <div
                    key={tag}
                    style={{padding:"8px 0"}}
                  >

                    <div
                      style={{
                        color:"#8ab4ff",
                        fontWeight:700
                      }}
                    >
                      {tag}
                    </div>

                    <div
                      style={{
                        color:"#666",
                        fontSize:12
                      }}
                    >
                      {count} post
                      {count === 1 ? "" : "s"}
                    </div>

                  </div>

                )
              );

            })()}

          </div>


          <div
            style={{
              color:"#444",
              fontSize:11,
              marginTop:20,
              textAlign:"center"
            }}
          >
            NEXUS • MADE BY YASH KISHORE
          </div>

        </aside>

      </div>


      {editingProfile && (

        <EditProfileModal
          user={user}
          profile={profile}
          onSave={updated => {

            setProfile(updated);
            setSelectedProfile(updated);

          }}
          onClose={() =>
            setEditingProfile(false)
          }
        />

      )}


      {editingPost && (

        <EditPostModal
          post={editingPost}
          onClose={() =>
            setEditingPost(null)
          }
        />

      )}

    </div>
  );
}


/* =========================================================
   START
========================================================= */

const root =
  ReactDOM.createRoot(
    document.getElementById("root")
  );

root.render(
  <Nexus />
);

</script>

</body>
</html>
