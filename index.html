<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#080a0d">
<title>Nexus — Social Platform</title>

<style>
*{box-sizing:border-box}
html,body,#root{margin:0;min-height:100%;width:100%}

body{
  background:#080a0d;
  color:#f4f6f8;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}

:root{
  --bg:#080a0d;
  --panel:#101318;
  --panel2:#171b22;
  --panel3:#1e242d;
  --line:#292f38;
  --text:#f4f6f8;
  --muted:#9099a7;
  --accent:#7c5cff;
  --accent2:#a18cff;
  --green:#38d486;
  --red:#ff6175;
  --yellow:#e9bf55;
}

.app{min-height:100vh}

.layout{
  width:min(1380px,100%);
  margin:auto;
  display:grid;
  grid-template-columns:240px minmax(0,680px) 290px;
  gap:20px;
  padding:20px;
}

.left,.right{
  position:sticky;
  top:20px;
  height:max-content;
}

.main{min-width:0}

.logo{
  font-size:27px;
  font-weight:950;
  letter-spacing:-1.5px;
  padding:5px 10px 25px;
}

.logo span{color:var(--accent)}

.nav{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.nav button{
  border:0;
  background:transparent;
  color:var(--muted);
  text-align:left;
  padding:13px 15px;
  border-radius:13px;
  font-weight:800;
}

.nav button:hover,
.nav button.active{
  background:var(--panel2);
  color:#fff;
}

.nav button.active{color:var(--accent2)}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
}

.pad{padding:18px}

.topbar{
  display:none;
  position:sticky;
  top:0;
  z-index:30;
  padding:12px 15px;
  background:#080a0df2;
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--line);
  align-items:center;
  justify-content:space-between;
}

.btn{
  border:1px solid var(--line);
  background:var(--panel2);
  color:#fff;
  border-radius:10px;
  padding:8px 12px;
  font-weight:750;
}

.btn:hover{background:var(--panel3)}

.btn.primary{
  background:var(--accent);
  border-color:var(--accent);
}

.btn.danger{color:#ff7e8d}

.muted{color:var(--muted)}

.avatar{
  width:44px;
  height:44px;
  min-width:44px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#7252ff,#ba9eff);
  color:white;
  font-weight:950;
  border:1px solid #ffffff18;
}

.avatar.small{
  width:36px;
  height:36px;
  min-width:36px;
  font-size:12px;
}

.avatar.large{
  width:88px;
  height:88px;
  min-width:88px;
  font-size:27px;
}

.feed-tabs{
  display:flex;
  gap:5px;
  padding:5px;
  margin-bottom:12px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
}

.feed-tabs button{
  flex:1;
  border:0;
  background:transparent;
  color:var(--muted);
  padding:9px;
  border-radius:10px;
  font-weight:800;
}

.feed-tabs button.active{
  background:var(--panel3);
  color:#fff;
}

.composer{
  padding:18px;
  margin-bottom:13px;
}

.composer-row{
  display:flex;
  gap:12px;
}

textarea,input,select{
  width:100%;
  background:#0b0e12;
  color:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px 12px;
  outline:none;
}

textarea{
  min-height:100px;
  resize:vertical;
}

textarea:focus,input:focus{
  border-color:#6c55d7;
}

.composer-tools{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:9px;
}

.post{
  padding:18px;
  margin-bottom:12px;
}

.post-head{
  display:flex;
  gap:10px;
  align-items:flex-start;
}

.post-user{
  flex:1;
  min-width:0;
}

.name{font-weight:900}

.username{
  color:var(--muted);
  font-size:14px;
}

.post-time{
  color:var(--muted);
  font-size:12px;
}

.post-body{
  margin:13px 0 8px 54px;
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-word;
}

.hashtag,.mention{
  color:#a693ff;
}

.post-actions{
  margin-left:54px;
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.action{
  border:0;
  background:transparent;
  color:var(--muted);
  border-radius:9px;
  padding:7px 9px;
}

.action:hover{
  background:var(--panel2);
  color:#fff;
}

.action.liked{color:#ff6680}
.action.saved{color:#e4bd54}
.action.reposted{color:#49dc9a}

.poll{
  margin:13px 0 8px 54px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:14px;
}

.poll-option{
  width:100%;
  position:relative;
  overflow:hidden;
  margin:7px 0;
  padding:10px;
  text-align:left;
  border:1px solid var(--line);
  background:#0b0e12;
  color:#fff;
  border-radius:10px;
}

.poll-bar{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  background:#7657ff24;
}

.poll-content{
  position:relative;
  display:flex;
  justify-content:space-between;
}

.comments{
  margin:12px 0 0 54px;
  padding-top:10px;
  border-top:1px solid var(--line);
}

.comment{
  padding:9px 0;
}

.comment-row{
  display:flex;
  gap:8px;
}

.comment-body{
  flex:1;
  min-width:0;
}

.reply-list{
  margin-left:42px;
  padding-left:10px;
  border-left:1px solid var(--line);
}

.story-box{
  padding:15px;
  margin-bottom:12px;
}

.story-strip{
  display:flex;
  gap:9px;
  overflow:auto;
}

.story{
  min-width:105px;
  border:1px solid var(--line);
  background:var(--panel2);
  color:#fff;
  border-radius:14px;
  padding:10px;
  text-align:left;
}

.story-text{
  margin-top:7px;
  height:50px;
  overflow:hidden;
  font-size:13px;
}

.section-title{
  font-size:22px;
  font-weight:950;
  margin-bottom:14px;
}

.empty{
  padding:45px 15px;
  text-align:center;
  color:var(--muted);
}

.searchbox{
  display:flex;
  gap:8px;
}

.searchbox input{flex:1}

.user-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid var(--line);
}

.user-row:last-child{border-bottom:0}

.user-row-main{
  flex:1;
  min-width:0;
}

.profile-head{
  padding:20px;
}

.profile-top{
  display:flex;
  gap:18px;
  align-items:center;
}

.profile-info{
  flex:1;
  min-width:0;
}

.profile-name{
  font-size:25px;
  font-weight:950;
}

.profile-bio{
  margin-top:8px;
  color:#c4cad2;
  white-space:pre-wrap;
}

.stats{
  display:flex;
  gap:25px;
  margin-top:15px;
}

.stat strong{
  display:block;
  font-size:18px;
}

.stat span{
  color:var(--muted);
  font-size:12px;
}

.notification{
  display:flex;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid var(--line);
}

.notification:last-child{border-bottom:0}

.dot{
  width:8px;
  height:8px;
  min-width:8px;
  margin-top:7px;
  border-radius:50%;
  background:var(--accent);
}

.message-layout{
  display:grid;
  grid-template-columns:225px 1fr;
  min-height:650px;
}

.chat-list{
  border-right:1px solid var(--line);
  padding:12px;
}

.chat-item{
  display:flex;
  gap:9px;
  padding:10px;
  border-radius:12px;
}

.chat-item:hover,
.chat-item.active{
  background:var(--panel2);
}

.chat-main{
  flex:1;
  min-width:0;
}

.chat-window{
  display:flex;
  flex-direction:column;
  min-width:0;
}

.chat-head{
  padding:14px;
  border-bottom:1px solid var(--line);
}

.messages{
  flex:1;
  overflow:auto;
  min-height:430px;
  max-height:550px;
  padding:15px;
}

.msg{
  display:flex;
  margin:7px 0;
}

.msg.mine{
  justify-content:flex-end;
}

.bubble{
  max-width:75%;
  padding:9px 12px;
  border:1px solid var(--line);
  background:var(--panel2);
  border-radius:14px;
}

.mine .bubble{
  background:#382d72;
  border-color:#5543a1;
}

.msg-meta{
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
}

.chat-compose{
  display:flex;
  gap:8px;
  padding:12px;
  border-top:1px solid var(--line);
}

.chat-compose input{flex:1}

.right-card{
  padding:15px;
  margin-bottom:13px;
}

.trend{
  padding:10px 0;
  border-bottom:1px solid var(--line);
}

.trend:last-child{border-bottom:0}

.loading-screen,
.error-screen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:var(--bg);
}

.boot-box{
  width:min(600px,100%);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:20px;
  padding:30px;
  text-align:center;
}

.boot-box h1{
  font-size:35px;
  margin:0 0 10px;
}

.boot-error{
  margin:15px 0;
  padding:13px;
  background:#38151d;
  color:#ff9ba7;
  border-radius:10px;
  text-align:left;
  white-space:pre-wrap;
  word-break:break-word;
}

.mobile-nav{
  display:none;
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:50;
  background:#0b0d11f5;
  border-top:1px solid var(--line);
  padding:7px;
  grid-template-columns:repeat(5,1fr);
}

.mobile-nav button{
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:11px;
  padding:7px 2px;
}

.mobile-nav button.active{
  color:#fff;
}

.modal-bg{
  position:fixed;
  inset:0;
  z-index:100;
  background:#000c;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal{
  width:min(560px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
}

@media(max-width:1050px){
  .layout{
    grid-template-columns:210px minmax(0,1fr);
  }

  .right{display:none}
}

@media(max-width:760px){
  .layout{
    display:block;
    padding:10px 10px 80px;
  }

  .left{display:none}

  .topbar{display:flex}

  .mobile-nav{display:grid}

  .post-body,
  .post-actions,
  .poll,
  .comments{
    margin-left:0;
  }

  .message-layout{
    grid-template-columns:1fr;
  }

  .chat-list{display:none}

  .profile-top{
    align-items:flex-start;
  }

  .avatar.large{
    width:70px;
    height:70px;
    min-width:70px;
  }
}
</style>
</head>

<script>

  const root=document.getElementById("root");

  if(!window.React || !window.ReactDOM){
    root.innerHTML=`
      <div class="error-screen">

<script type="text/babel">

const {
  useState,
  useEffect
}=React;


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig={
  apiKey:"AIzaSyDTrvD7c1TUtPUUOSX7_-0VV9itC28LOg0",
  authDomain:"nexus-37600.firebaseapp.com",
  projectId:"nexus-37600",

  messagingSenderId:"61496309341",
  appId:"1:61496309341:web:fdb3711264df47f318bfb4",
  measurementId:"G-41S50YF5RF"
};

const APP_ID="nexus-37600";
const ROOT="artifacts/"+APP_ID+"/public/data";

let db=null;
let auth=null;
let firebaseError=null;

try{

  if(!firebase.apps.length){
    firebase.initializeApp(firebaseConfig);
  }

  db=firebase.firestore();
  auth=firebase.auth();

}catch(e){

  firebaseError=e;
  console.error(e);
}


/* =========================================================
   HELPERS
========================================================= */

function C(name){
  return db.collection(ROOT+"/"+name);
}

function serverTime(){
  return firebase.firestore.FieldValue.serverTimestamp();
}

function currentUid(){
  return auth?.currentUser?.uid||null;
}

function text(v){
  return String(v||"").trim();
}

function initials(name){

  return text(name||"User")
    .split(/\s+/)
    .slice(0,2)
    .map(x=>x[0])
    .join("")
    .toUpperCase();
}

function timeAgo(value){

  if(!value)return "";

  let d;

  if(value.toDate){
    d=value.toDate();
  }else if(value.seconds){
    d=new Date(value.seconds*1000);
  }else{
    d=new Date(value);
  }

  if(isNaN(d.getTime()))return "";

  const seconds=Math.max(
    1,
    Math.floor(
      (Date.now()-d.getTime())/1000
    )
  );

  if(seconds<60)return seconds+"s";
  if(seconds<3600)return Math.floor(seconds/60)+"m";
  if(seconds<86400)return Math.floor(seconds/3600)+"h";
  if(seconds<604800)return Math.floor(seconds/86400)+"d";

  return d.toLocaleDateString();
}

function username(v){

  return text(v)
    .toLowerCase()
    .replace(/^@/,"")
    .replace(/[^a-z0-9_]/g,"")
    .slice(0,24);
}

function hashtags(v){

  const result=[];
  const re=/(^|\s)#([a-zA-Z0-9_]+)/g;
  let m;

  while((m=re.exec(v))){
    result.push(m[2].toLowerCase());
  }

  return [...new Set(result)];
}

function mentions(v){

  const result=[];
  const re=/(^|\s)@([a-zA-Z0-9_]+)/g;
  let m;

  while((m=re.exec(v))){
    result.push(m[2].toLowerCase());
  }

  return [...new Set(result)];
}

function renderText(v){

  return text(v)
    .split(
      /(\#[a-zA-Z0-9_]+|\@[a-zA-Z0-9_]+)/
    )
    .map((p,i)=>{

      if(p.startsWith("#")){
        return (
          <span
            className="hashtag"
            key={i}
          >
            {p}
          </span>
        );
      }

      if(p.startsWith("@")){
        return (
          <span
            className="mention"
            key={i}
          >
            {p}
          </span>
        );
      }

      return (
        <React.Fragment key={i}>
          {p}
        </React.Fragment>
      );
    });
}


/* =========================================================
   AUTH
========================================================= */

function useAuth(){

  const [profile,setProfile]=useState(null);
  const [user,setUser]=useState(null);
  const [ready,setReady]=useState(false);
  const [error,setError]=useState(null);

  useEffect(()=>{

    if(firebaseError){
      setError(firebaseError);
      setReady(true);
      return;
    }

    let stopped=false;

    const unsubscribe=auth.onAuthStateChanged(
      async u=>{

        try{

          if(!u){

            await auth.signInAnonymously();

            return;
          }

          if(stopped)return;

          setUser(u);

          const ref=C("users").doc(u.uid);
          const snap=await ref.get();

          if(!snap.exists){

            const newProfile={
              uid:u.uid,
              displayName:"Nexus User",
              username:"user_"+u.uid.slice(0,8),
              bio:"",
              followersCount:0,
              followingCount:0,
              postsCount:0,
              showOnline:true,
              notifyLikes:true,
              notifyMessages:true,
              createdAt:serverTime(),
              updatedAt:serverTime()
            };

            await ref.set(newProfile);

            setProfile({
              ...newProfile,
              createdAt:null,
              updatedAt:null
            });

          }else{

            setProfile({
              uid:u.uid,
              ...snap.data()
            });
          }

          setReady(true);

        }catch(e){

          console.error(e);

          if(!stopped){
            setError(e);
            setReady(true);
          }
        }
      },
      e=>{
        setError(e);
        setReady(true);
      }
    );

    return ()=>{
      stopped=true;
      unsubscribe();
    };

  },[]);

  return {
    user,
    profile,
    setProfile,
    ready,
    error
  };
}


/* =========================================================
   COLLECTION LISTENER
========================================================= */

function useCollection(
  name,
  makeQuery,
  deps=[]
){

  const [items,setItems]=useState([]);
  const [error,setError]=useState(null);

  useEffect(()=>{

    if(!db)return;

    let query;

    try{
      query=makeQuery(C(name));
    }catch(e){
      setError(e);
      return;
    }

    const unsubscribe=query.onSnapshot(
      snap=>{

        const result=snap.docs.map(d=>({
          id:d.id,
          ...d.data()
        }));

        result.sort((a,b)=>{

          function timestamp(x){

            if(!x)return 0;

            if(x.toDate){
              return x.toDate().getTime();
            }

            if(x.seconds){
              return x.seconds*1000;
            }

            const d=new Date(x);

            return isNaN(d.getTime())
              ?0
              :d.getTime();
          }

          return timestamp(b.createdAt)-
                 timestamp(a.createdAt);
        });

        setItems(result);
        setError(null);
      },
      e=>{

        console.error(
          "Nexus "+name+" error:",
          e
        );

        setError(e);
      }
    );

    return unsubscribe;

  },deps);

  return {
    items,
    error
  };
}


/* =========================================================
   DATA
========================================================= */

function useData(profile){

  const id=profile?.uid;

  const posts=useCollection(
    "posts",
    ref=>ref.limit(500),
    []
  );

  const users=useCollection(
    "users",
    ref=>ref.limit(500),
    []
  );

  const follows=useCollection(
    "follows",
    ref=>ref.where(
      "followerId",
      "==",
      id
    ),
    [id]
  );

  const likes=useCollection(
    "likes",
    ref=>ref.where(
      "userId",
      "==",
      id
    ),
    [id]
  );

  const bookmarks=useCollection(
    "bookmarks",
    ref=>ref.where(
      "userId",
      "==",
      id
    ),
    [id]
  );

  const reposts=useCollection(
    "reposts",
    ref=>ref.where(
      "userId",
      "==",
      id
    ),
    [id]
  );

  const blocks=useCollection(
    "blocks",
    ref=>ref.where(
      "blockerId",
      "==",
      id
    ),
    [id]
  );

  const mutes=useCollection(
    "mutes",
    ref=>ref.where(
      "muterId",
      "==",
      id
    ),
    [id]
  );

  const notifications=useCollection(
    "notifications",
    ref=>ref.where(
      "recipientId",
      "==",
      id
    ).limit(100),
    [id]
  );

  const stories=useCollection(
    "stories",
    ref=>ref.limit(300),
    []
  );

  return {
    posts:posts.items,
    users:users.items,
    follows:follows.items,
    likes:likes.items,
    bookmarks:bookmarks.items,
    reposts:reposts.items,
    blocks:blocks.items,
    mutes:mutes.items,
    notifications:notifications.items,
    stories:stories.items
  };
}

/* =========================================================
   FOLLOW
========================================================= */

function FollowButton({
  targetId,
  following
}){

  const [busy,setBusy]=useState(false);

  async function toggle(){

    if(
      busy ||
      !targetId ||
      targetId===currentUid()
    ){
      return;
    }

    setBusy(true);

    try{

      const snap=await C("follows")
        .where(
          "followerId",
          "==",
          currentUid()
        )
        .where(
          "followingId",
          "==",
          targetId
        )
        .limit(1)
        .get();

      if(snap.empty){

        await C("follows").add({
          followerId:currentUid(),
          followingId:targetId,
          createdAt:serverTime()
        });

        await C("users")
          .doc(targetId)
          .set({
            followersCount:
              firebase.firestore.FieldValue
                .increment(1)
          },{merge:true});

        await C("users")
          .doc(currentUid())
          .set({
            followingCount:
              firebase.firestore.FieldValue
                .increment(1)
          },{merge:true});

        await notify(
          targetId,
          "started following you",
          "follow"
        );

      }else{

        const batch=db.batch();

        snap.docs.forEach(d=>{
          batch.delete(d.ref);
        });

        await batch.commit();

        await C("users")
          .doc(targetId)
          .set({
            followersCount:
              firebase.firestore.FieldValue
                .increment(-1)
          },{merge:true});

        await C("users")
          .doc(currentUid())
          .set({
            followingCount:
              firebase.firestore.FieldValue
                .increment(-1)
          },{merge:true});
      }

    }catch(e){
      alert(e.message);
    }

    setBusy(false);
  }

  return (
    <button
      className={
        "btn "+(!following?"primary":"")
      }
      onClick={toggle}
      disabled={busy}
    >
      {following?"Following":"Follow"}
    </button>
  );
}


/* =========================================================
   COMPOSER
========================================================= */

function Composer({profile}){

  const [value,setValue]=useState("");
  const [poll,setPoll]=useState(false);
  const [question,setQuestion]=useState("");
  const [options,setOptions]=useState([
    "",
    ""
  ]);
  const [busy,setBusy]=useState(false);

  async function publish(){

    const body=text(value);

    if(!body && !poll)return;

    setBusy(true);

    try{

      const data={
        authorId:currentUid(),

        /*
          Store author information directly in the
          post too. This makes old/missing user records
          much safer and lets posts always display
          their author correctly.
        */
        authorName:
          profile.displayName||"Nexus User",

        authorUsername:
          profile.username||"user",

        text:body,
        createdAt:serverTime(),
        likesCount:0,
        commentsCount:0,
        repostsCount:0,
        hashtags:hashtags(body),
        mentions:mentions(body)
      };

      if(poll){

        const clean=options
          .map(text)
          .filter(Boolean);

        if(
          !text(question) ||
          clean.length<2
        ){

          alert(
            "A poll needs a question and at least 2 options."
          );

          setBusy(false);
          return;
        }

        data.poll={
          question:text(question),
          options:clean.map(x=>({
            text:x,
            votes:0
          }))
        };
      }

      const ref=await C("posts").add(data);

      for(
        const mention of mentions(body)
      ){

        const users=await C("users")
          .where(
            "username",
            "==",
            mention
          )
          .limit(1)
          .get();

        if(!users.empty){

          await notify(
            users.docs[0].id,
            "mentioned you in a post",
            "mention",
            {
              postId:ref.id
            }
          );
        }
      }

      await C("users")
        .doc(currentUid())
        .set({
          postsCount:
            firebase.firestore.FieldValue
              .increment(1)
        },{merge:true});

      setValue("");
      setPoll(false);
      setQuestion("");
      setOptions([
        "",
        ""
      ]);

    }catch(e){

      alert(e.message);
    }

    setBusy(false);
  }

  return (
    <div className="card composer">

      <div className="composer-row">

        <Avatar profile={profile}/>

        <div style={{flex:1}}>

          <textarea
            value={value}
            onChange={e=>
              setValue(e.target.value)
            }
            placeholder="What's happening on Nexus?"
          />

          {poll && (
            <div style={{
              marginTop:10,
              border:"1px solid var(--line)",
              borderRadius:12,
              padding:10
            }}>

              <input
                value={question}
                onChange={e=>
                  setQuestion(e.target.value)
                }
                placeholder="Poll question"
              />

              {options.map((x,i)=>(
                <div
                  key={i}
                  style={{
                    display:"flex",
                    gap:6,
                    marginTop:7
                  }}
                >

                  <input
                    value={x}
                    onChange={e=>{

                      const copy=[
                        ...options
                      ];

                      copy[i]=e.target.value;

                      setOptions(copy);
                    }}
                    placeholder={
                      "Option "+(i+1)
                    }
                  />

                  {options.length>2 && (
                    <button
                      className="btn"
                      onClick={()=>{
                        setOptions(
                          options.filter(
                            (_,n)=>n!==i
                          )
                        );
                      }}
                    >
                      ×
                    </button>
                  )}

                </div>
              ))}

              <button
                className="btn"
                style={{
                  marginTop:8
                }}
                onClick={()=>{

                  if(options.length<6){

                    setOptions([
                      ...options,
                      ""
                    ]);
                  }
                }}
              >
                + Option
              </button>

            </div>
          )}

          <div className="composer-tools">

            <button
              className={
                "btn "+(poll?"primary":"")
              }
              onClick={()=>
                setPoll(!poll)
              }
            >
              📊 Poll
            </button>

            <span
              className="muted"
              style={{
                padding:"8px 2px",
                fontSize:12
              }}
            >
              #hashtags · @mentions
            </span>

            <div style={{
              marginLeft:"auto"
            }}>

              <button
                className="btn primary"
                disabled={busy}
                onClick={publish}
              >
                {busy
                  ?"Posting..."
                  :"Post"}
              </button>

            </div>

          </div>

        </div>
      </div>
    </div>
  );
}


/* =========================================================
   POLL
========================================================= */

function Poll({post}){

  const [options,setOptions]=useState(
    post.poll?.options||[]
  );

  const [voted,setVoted]=useState(false);

  useEffect(()=>{

    C("pollVotes")
      .where(
        "pollId",
        "==",
        post.id
      )
      .where(
        "userId",
        "==",
        currentUid()
      )
      .limit(1)
      .get()
      .then(snap=>{
        setVoted(!snap.empty);
      })
      .catch(()=>{});

  },[post.id]);

  async function vote(index){

    if(voted)return;

    try{

      await C("pollVotes").add({
        pollId:post.id,
        postId:post.id,
        userId:currentUid(),
        option:index,
        createdAt:serverTime()
      });

      const next=options.map(
        (x,i)=>{

          if(i===index){

            return {
              ...x,
              votes:
                Number(x.votes||0)+1
            };
          }

          return x;
        }
      );

      await C("posts")
        .doc(post.id)
        .set({
          poll:{
            ...post.poll,
            options:next
          }
        },{merge:true});

      setOptions(next);
      setVoted(true);

    }catch(e){
      alert(e.message);
    }
  }

  const total=options.reduce(
    (a,x)=>
      a+Number(x.votes||0),
    0
  );

  return (
    <div className="poll">

      <strong>
        {post.poll.question}
      </strong>

      {options.map((x,i)=>{

        const percent=total
          ?Math.round(
            Number(x.votes||0)*
            100/
            total
          )
          :0;

        return (
          <button
            className="poll-option"
            key={i}
            disabled={voted}
            onClick={()=>
              vote(i)
            }
          >

            <span
              className="poll-bar"
              style={{
                width:
                  percent+"%"
              }}
            />

            <span className="poll-content">

              <span>
                {x.text}
              </span>

              <span>
                {percent}%
              </span>

            </span>

          </button>
        );
      })}

      <div className="muted">
        {total} votes
        {voted
          ?" · You voted"
          :""
        }
      </div>

    </div>
  );
}


/* =========================================================
   COMMENTS
========================================================= */

function Comments({
  postId,
  users
}){

  const [comments,setComments]=useState([]);
  const [value,setValue]=useState("");
  const [reply,setReply]=useState(null);

  useEffect(()=>{

    const unsubscribe=C("comments")
      .where(
        "postId",
        "==",
        postId
      )
      .limit(500)
      .onSnapshot(
        snap=>{

          const arr=snap.docs.map(
            d=>({
              id:d.id,
              ...d.data()
            })
          );

          arr.sort((a,b)=>{

            function t(x){

              if(!x)return 0;

              if(x.toDate){
                return x.toDate().getTime();
              }

              if(x.seconds){
                return x.seconds*1000;
              }

              return (
                new Date(x).getTime()||0
              );
            }

            return t(a.createdAt)-
                   t(b.createdAt);
          });

          setComments(arr);
        },
        e=>console.error(e)
      );

    return unsubscribe;

  },[postId]);

  async function send(){

    if(!text(value))return;

    try{

      await C("comments").add({
        postId,
        authorId:currentUid(),
        text:text(value),
        parentId:reply||null,
        createdAt:serverTime()
      });

      await C("posts")
        .doc(postId)
        .set({
          commentsCount:
            firebase.firestore.FieldValue
              .increment(1)
        },{merge:true});

      const post=
        await C("posts")
          .doc(postId)
          .get();

      if(post.exists){

        await notify(
          post.data().authorId,
          "commented on your post",
          "comment",
          {
            postId
          }
        );
      }

      setValue("");
      setReply(null);

    }catch(e){
      alert(e.message);
    }
  }

  function renderComment(c){

    const author=users.find(
      u=>u.uid===c.authorId
    );

    const replies=comments.filter(
      x=>x.parentId===c.id
    );

    return (
      <div
        className="comment"
        key={c.id}
      >

        <div className="comment-row">

          <Avatar
            profile={
              author||{
                displayName:"User"
              }
            }
            size="small"
          />

          <div className="comment-body">

            <strong>
              {author?.displayName||"User"}
            </strong>

            <span className="muted">
              {" "}
              @{author?.username||"user"}
            </span>

            <div style={{
              marginTop:3,
              whiteSpace:"pre-wrap"
            }}>
              {renderText(c.text)}
            </div>

            <div style={{
              display:"flex",
              gap:8,
              marginTop:5
            }}>

              <button
                className="btn"
                onClick={()=>{

                  setReply(c.id);

                  setValue(
                    "@"+
                    (
                      author?.username||
                      "user"
                    )+
                    " "
                  );
                }}
              >
                Reply
              </button>

            </div>

          </div>
        </div>

        {replies.length>0 && (
          <div className="reply-list">
            {replies.map(renderComment)}
          </div>
        )}

      </div>
    );
  }

  return (
    <div className="comments">

      {comments
        .filter(x=>!x.parentId)
        .map(renderComment)}

      <div style={{
        display:"flex",
        gap:7,
        marginTop:8
      }}>

        <input
          value={value}
          onChange={e=>
            setValue(e.target.value)
          }
          placeholder={
            reply
              ?"Write a reply..."
              :"Write a comment..."
          }
          onKeyDown={e=>{

            if(e.key==="Enter"){

              e.preventDefault();

              send();
            }
          }}
        />

        <button
          className="btn primary"
          onClick={send}
        >
          Send
        </button>

      </div>

    </div>
  );
}


/* =========================================================
   POST
   AUTHOR DISPLAY FIX
========================================================= */

function Post({
  post,
  users,
  liked,
  saved,
  reposted,
  following
}){

  const [
    commentsOpen,
    setCommentsOpen
  ]=useState(false);

  const [
    menu,
    setMenu
  ]=useState(false);


  /*
    IMPORTANT FIX

    Different versions of Nexus may have stored the
    author ID under different field names.

    We support all of these:
      authorId
      authorUid
      uid
  */

  const authorId=
    post.authorId||
    post.authorUid||
    post.uid||
    null;


  /*
    First try to find the complete user profile.
  */

  const author=users.find(
    u=>u.uid===authorId
  );


  /*
    If the user document is unavailable, use
    information stored directly on the post.
  */

  const authorName=
    author?.displayName||
    post.authorName||
    post.authorDisplayName||
    post.displayName||
    post.name||
    "Nexus User";


  const authorUsername=
    author?.username||
    post.authorUsername||
    post.authorUserName||
    post.username||
    "user";


  /*
    This profile is used by Avatar.
    Therefore even an old post with a missing
    user document gets a proper avatar/name.
  */

  const authorProfile=
    author||
    {
      uid:authorId,
      displayName:authorName,
      username:authorUsername
    };


  async function like(){

    try{

      const snap=await C("likes")
        .where(
          "postId",
          "==",
          post.id
        )
        .where(
          "userId",
          "==",
          currentUid()
        )
        .limit(1)
        .get();

      if(snap.empty){

        await C("likes").add({
          postId:post.id,
          userId:currentUid(),
          createdAt:serverTime()
        });

        await C("posts")
          .doc(post.id)
          .set({
            likesCount:
              firebase.firestore.FieldValue
                .increment(1)
          },{merge:true});

        await notify(
          authorId,
          "liked your post",
          "like",
          {
            postId:post.id
          }
        );

      }else{

        const batch=db.batch();

        snap.docs.forEach(d=>{
          batch.delete(d.ref);
        });

        await batch.commit();

        await C("posts")
          .doc(post.id)
          .set({
            likesCount:
              firebase.firestore.FieldValue
                .increment(-1)
          },{merge:true});
      }

    }catch(e){
      alert(e.message);
    }
  }


  async function save(){

    try{

      const snap=await C("bookmarks")
        .where(
          "postId",
          "==",
          post.id
        )
        .where(
          "userId",
          "==",
          currentUid()
        )
        .limit(1)
        .get();

      if(snap.empty){

        await C("bookmarks").add({
          postId:post.id,
          userId:currentUid(),
          createdAt:serverTime()
        });

      }else{

        const batch=db.batch();

        snap.docs.forEach(d=>{
          batch.delete(d.ref);
        });

        await batch.commit();
      }

    }catch(e){
      alert(e.message);
    }
  }


  async function repost(){

    try{

      const snap=await C("reposts")
        .where(
          "postId",
          "==",
          post.id
        )
        .where(
          "userId",
          "==",
          currentUid()
        )
        .limit(1)
        .get();

      if(snap.empty){

        await C("reposts").add({
          postId:post.id,
          userId:currentUid(),
          createdAt:serverTime()
        });

        await C("posts")
          .doc(post.id)
          .set({
            repostsCount:
              firebase.firestore.FieldValue
                .increment(1)
          },{merge:true});

      }else{

        const batch=db.batch();

        snap.docs.forEach(d=>{
          batch.delete(d.ref);
        });

        await batch.commit();

        await C("posts")
          .doc(post.id)
          .set({
            repostsCount:
              firebase.firestore.FieldValue
                .increment(-1)
          },{merge:true});
      }

    }catch(e){
      alert(e.message);
    }
  }


  async function deletePost(){

    if(authorId!==currentUid())return;

    if(!confirm("Delete this post?"))return;

    try{

      await C("posts")
        .doc(post.id)
        .delete();

    }catch(e){
      alert(e.message);
    }
  }


  async function pin(){

    if(authorId!==currentUid())return;

    try{

      await C("posts")
        .doc(post.id)
        .set({
          pinned:!post.pinned
        },{merge:true});

    }catch(e){
      alert(e.message);
    }
  }


  async function report(){

    const reason=prompt(
      "Reason for reporting:"
    );

    if(!text(reason))return;

    try{

      await C("reports").add({
        reporterId:currentUid(),
        targetType:"post",
        targetId:post.id,
        targetAuthorId:authorId,
        reason:text(reason),
        status:"open",
        createdAt:serverTime()
      });

      alert("Report submitted.");

    }catch(e){
      alert(e.message);
    }
  }


  return (
    <article className="card post">

      <div className="post-head">

        <Avatar
          profile={authorProfile}
        />

        <div className="post-user">

          <div className="name">

            {authorName}

            {post.pinned && (
              <span style={{
                color:"var(--yellow)",
                fontSize:11,
                marginLeft:7
              }}>
                PINNED
              </span>
            )}

          </div>

          <div className="username">
            @{authorUsername}
          </div>

        </div>

        <div className="post-time">
          {timeAgo(post.createdAt)}
        </div>

        <button
          className="btn"
          onClick={()=>
            setMenu(!menu)
          }
        >
          •••
        </button>

      </div>


      <div className="post-body">
        {renderText(post.text)}
      </div>


      {post.poll && (
        <Poll post={post}/>
      )}


      <div className="post-actions">

        <button
          className={
            "action "+
            (liked?"liked":"")
          }
          onClick={like}
        >
          ♥ {post.likesCount||0}
        </button>


        <button
          className="action"
          onClick={()=>
            setCommentsOpen(
              !commentsOpen
            )
          }
        >
          💬 {post.commentsCount||0}
        </button>


        <button
          className={
            "action "+
            (reposted?"reposted":"")
          }
          onClick={repost}
        >
          ↻ {post.repostsCount||0}
        </button>


        <button
          className={
            "action "+
            (saved?"saved":"")
          }
          onClick={save}
        >
          🔖
        </button>


        {authorId &&
         authorId!==currentUid() && (
          <FollowButton
            targetId={authorId}
            following={following}
          />
        )}

      </div>


      {menu && (
        <div style={{
          display:"flex",
          gap:7,
          flexWrap:"wrap",
          marginTop:10,
          paddingTop:10,
          borderTop:
            "1px solid var(--line)"
        }}>

          {authorId===currentUid() && (
            <>

              <button
                className="btn"
                onClick={pin}
              >
                {post.pinned
                  ?"Unpin"
                  :"Pin"}
              </button>

              <button
                className="btn danger"
                onClick={deletePost}
              >
                Delete
              </button>

            </>
          )}


          {authorId!==currentUid() && (
            <button
              className="btn danger"
              onClick={report}
            >
              Report
            </button>
          )}

        </div>
      )}


      {commentsOpen && (
        <Comments
          postId={post.id}
          users={users}
        />
      )}

    </article>
  );
}


/* =========================================================
   FEED
========================================================= */

function Feed({
  mode,
  data,
  profile
}){

  const following=new Set(
    data.follows.map(
      x=>x.followingId
    )
  );

  const liked=new Set(
    data.likes.map(
      x=>x.postId
    )
  );

  const saved=new Set(
    data.bookmarks.map(
      x=>x.postId
    )
  );

  const reposted=new Set(
    data.reposts.map(
      x=>x.postId
    )
  );

  let posts=[...data.posts];

  if(mode==="following"){

    posts=posts.filter(p=>{

      const authorId=
        p.authorId||
        p.authorUid||
        p.uid;

      return (
        following.has(authorId)||
        authorId===currentUid()
      );
    });
  }

  if(mode==="saved"){

    posts=posts.filter(
      p=>saved.has(p.id)
    );
  }

  if(posts.length===0){

    return (
      <div className="card empty">

        {mode==="saved"
          ?"No saved posts yet."
          :mode==="following"
            ?"Follow people to see their posts here."
            :"No posts yet. Create the first post!"
        }

      </div>
    );
  }

  return (
    <>
      {posts.map(post=>{

        const authorId=
          post.authorId||
          post.authorUid||
          post.uid;

        return (
          <Post
            key={post.id}
            post={post}
            users={data.users}
            liked={liked.has(post.id)}
            saved={saved.has(post.id)}
            reposted={reposted.has(post.id)}
            following={
              following.has(authorId)
            }
          />
        );
      })}
    </>
  );
}


/* =========================================================
   STORIES
========================================================= */

function Stories({
  stories,
  users
}){

  const active=stories.filter(s=>{

    if(!s.expiresAt)return true;

    const d=s.expiresAt.toDate
      ?s.expiresAt.toDate()
      :new Date(s.expiresAt);

    return d.getTime()>Date.now();
  });

  const unique=[
    ...new Map(
      active.map(s=>[
        s.authorId||
        s.authorUid||
        s.uid,
        s
      ])
    ).values()
  ];

  return (
    <div className="card story-box">

      <div style={{
        display:"flex",
        justifyContent:"space-between",
        marginBottom:10
      }}>

        <strong>
          Stories
        </strong>

        <span className="muted">
          24 hours
        </span>

      </div>

      <div className="story-strip">

        {unique.length===0 && (
          <span className="muted">
            No active stories.
          </span>
        )}

        {unique.map(s=>{

          const author=users.find(
            u=>u.uid===(
              s.authorId||
              s.authorUid||
              s.uid
            )
          );

          const storyName=
            author?.username||
            s.authorUsername||
            s.username||
            "user";

          return (
            <button
              key={s.id}
              className="story"
              onClick={()=>{

                alert(
                  "@"+
                  storyName+
                  "\n\n"+
                  s.text
                );
              }}
            >

              <Avatar
                profile={
                  author||{
                    displayName:
                      s.authorName||
                      "User"
                  }
                }
                size="small"
              />

              <div style={{
                fontSize:12,
                marginTop:5
              }}>
                @{storyName}
              </div>

              <div className="story-text">
                {s.text}
              </div>

            </button>
          );
        })}

      </div>
    </div>
  );
}


/* =========================================================
   STORY CREATOR
========================================================= */

function StoryCreator(){

  const [open,setOpen]=useState(false);
  const [value,setValue]=useState("");

  async function publish(){

    if(!text(value))return;

    try{

      await C("stories").add({
        authorId:currentUid(),
        text:text(value),
        createdAt:serverTime(),
        expiresAt:new Date(
          Date.now()+
          24*60*60*1000
        )
      });

      setValue("");
      setOpen(false);

    }catch(e){
      alert(e.message);
    }
  }

  if(!open){

    return (
      <button
        className="btn"
        onClick={()=>
          setOpen(true)
        }
      >
        + Story
      </button>
    );
  }

  return (
    <div className="modal-bg">

      <div className="modal">

        <h3>
          Create Story
        </h3>

        <textarea
          value={value}
          onChange={e=>
            setValue(e.target.value)
          }
          placeholder="Share something..."
        />

        <div style={{
          display:"flex",
          gap:8,
          justifyContent:"flex-end",
          marginTop:10
        }}>

          <button
            className="btn"
            onClick={()=>
              setOpen(false)
            }
          >
            Cancel
          </button>

          <button
            className="btn primary"
            onClick={publish}
          >
            Publish
          </button>

        </div>

      </div>
    </div>
  );
}

function Explore({

  onProfile
}){

  const [
    query,
    setQuery
  ]=useState("");

  const [
    tab,
    setTab
  ]=useState("users");

  const q=query
    .toLowerCase()
    .trim();

  const users=data.users.filter(u=>
    !q||
    String(u.displayName||"")
      .toLowerCase()
      .includes(q)||
    String(u.username||"")
      .toLowerCase()
      .includes(q)
  );

  const posts=data.posts.filter(p=>{

    const postText=
      String(p.text||"")
        .toLowerCase();

    const postHashtags=
      p.hashtags||[];

    return (
      !q||
      postText.includes(q)||
      postHashtags.some(
        h=>h.includes(
          q.replace(/^#/,"")
        )
      )
    );
  });

  const trend={};

  data.posts.forEach(p=>{

    (p.hashtags||[])
      .forEach(h=>{
        trend[h]=(trend[h]||0)+1;

  const trends=Object.entries(trend)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,30);

  return (

      <div className="section-title">

        <div
          className="feed-tabs"
          style={{
            marginTop:12,

        >

          {[
            ["users","Users"],

            ["hashtags","Hashtags"]

            <button
              key={x[0]}

                  :""
              }

                setTab(x[0])
              }

          ))}

        </div>

      </div>


      {tab==="users" && (
        <div
          className="card pad"
          style={{marginTop:12}}
        >

          {users.length===0 && (
            <div className="empty">
              No users found.
            </div>
          )}

          {users.map(u=>(
            <div
              className="user-row"
              key={u.uid}
            >

              <Avatar
                profile={u}
              />

              <div className="user-row-main">

                <strong>
                  {u.displayName}
                </strong>

                <div className="muted">
                  @{u.username}
                </div>

                {u.bio && (
                  <div className="muted">
                    {u.bio}
                  </div>
                )}

              </div>

              {u.uid!==currentUid() && (
                <FollowButton
                  targetId={u.uid}
                  following={data.follows.some(
                    x=>
                      x.followingId===u.uid
                  )}
                />
              )}

              <button
                className="btn"
                onClick={()=>
                  onProfile(u.uid)
                }
              >
                View
              </button>

            </div>
          ))}

        </div>
      )}


      {tab==="posts" && (
        <div style={{
          marginTop:12
        }}>

          {posts.length===0 && (
            <div className="card empty">
              No posts found.
            </div>
          )}

          {posts.map(p=>{

            const authorId=
              p.authorId||
              p.authorUid||
              p.uid;

            return (
              <Post
                key={p.id}
                post={p}
                users={data.users}
                liked={data.likes.some(
                  x=>x.postId===p.id
                )}
                saved={data.bookmarks.some(
                  x=>x.postId===p.id
                )}
                reposted={data.reposts.some(
                  x=>x.postId===p.id

  );

function Notifications({
  notifications,
  users
}){

  async function mark(id){

    await C("notifications")
      .doc(id)
      .set({
        read:true
      },{merge:true});
  }

  async function all(){

    const batch=db.batch();

    notifications
      .filter(x=>!x.read)
      .forEach(x=>{

        batch.set(
          C("notifications")
            .doc(x.id),
          {read:true},
          {merge:true}
        );
      });

    await batch.commit();
  }

  return (
    <div>

      <div style={{
        display:"flex",
        justifyContent:"space-between",
        alignItems:"center"
      }}>

        <div className="section-title">
          Notifications
        </div>

        <button
          className="btn"
          onClick={all}
        >
          Mark all read
        </button>

      </div>


      <div className="card pad">

        {notifications.length===0 && (
          <div className="empty">
            No notifications yet.
          </div>
        )}

        {notifications.map(n=>{

          const actor=users.find(

          return (

                  }}/>

                  profile={
                    actor||{
                      displayName:
                        "User"
                    }
                  }

                />

                <div>

                  <strong>
                    {actor?.displayName||
                     n.actorName||

          );
        })}

    </div>
  );
}


/* =========================================================
   MESSAGES
========================================================= */

function Messages({users}){

  const [chats,setChats]=useState([]);
  const [selected,setSelected]=useState(null);
  const [messages,setMessages]=useState([]);
  const [value,setValue]=useState("");

  useEffect(()=>{

    const unsub=C("chats")
      .where(
        "members",
        "array-contains",
        currentUid()
      )
      .limit(100)
      .onSnapshot(
        snap=>{

          const arr=snap.docs.map(
            d=>({
              id:d.id,
              ...d.data()
            })
          );

          arr.sort((a,b)=>{

            const at=
              a.updatedAt?.seconds||0;

            const bt=
              b.updatedAt?.seconds||0;

            return bt-at;
          });

          setChats(arr);
        },
        e=>console.error(e)
      );

    return unsub;

  },[]);


  useEffect(()=>{

    if(!selected){

      setMessages([]);

      return;
    }

    const unsub=C("messages")
      .where(
        "chatId",
        "==",
        selected.id
      )
      .limit(500)
      .onSnapshot(
        snap=>{

          const arr=snap.docs.map(
            d=>({
              id:d.id,
              ...d.data()
            })
          );

          arr.sort((a,b)=>{

            const at=
              a.createdAt?.seconds||0;

            const bt=
              b.createdAt?.seconds||0;

            return at-bt;
          });

          setMessages(arr);
        },
        e=>console.error(e)
      );

    return unsub;

  },[selected?.id]);


  async function newChat(){

    const value=prompt(
      "Enter username:"
    );

    if(!value)return;

    const name=username(value);

    const snap=await C("users")
      .where(
        "username",
        "==",
        name
      )
      .limit(1)
      .get();

    if(snap.empty){

      alert(
        "User not found."
      );

      return;
    }

    const target=snap.docs[0];

    if(target.id===currentUid()){

      alert(
        "You cannot message yourself."
      );

      return;
    }

    const existing=await C("chats")
      .where(
        "members",
        "array-contains",
        currentUid()
      )
      .limit(100)
      .get();

    for(
      const d of existing.docs
    ){

      const x=d.data();

      if(
        !x.group &&
        x.members?.includes(
          target.id
        )
      ){

        setSelected({
          id:d.id,
          ...x
        });

        return;
      }
    }

    const ref=await C("chats").add({
      members:[
        currentUid(),
        target.id
      ],
      group:false,
      name:
        target.data().displayName,
      lastMessage:"",
      createdAt:serverTime(),
      updatedAt:serverTime()
    });

    setSelected({
      id:ref.id,
      members:[
        currentUid(),
        target.id
      ],
      group:false,
      name:
        target.data().displayName
    });
  }


  async function send(){

    if(
      !selected||
      !text(value)
    ){
      return;
    }

    try{

      await C("messages").add({
        chatId:selected.id,
        senderId:currentUid(),
        text:text(value),
        createdAt:serverTime(),
        readBy:[
          currentUid()
        ],
        reactions:{}
      });

      await C("chats")
        .doc(selected.id)
        .set({
          lastMessage:text(value),
          updatedAt:serverTime()
        },{merge:true});

      for(
        const member of
        selected.members||[]
      ){

        if(
          member!==currentUid()
        ){

          await notify(
            member,
            "sent you a message",
            "message",
            {
              chatId:
                selected.id
            }
          );
        }
      }

      setValue("");

    }catch(e){
      alert(e.message);
    }
  }


  async function deleteMessage(m){

    if(
      m.senderId!==currentUid()
    ){
      return;
    }

    await C("messages")
      .doc(m.id)
      .delete();
  }


  async function react(
    m,
    emoji
  ){

    const reactions={
      ...(m.reactions||{})
    };

    const list=
      Array.isArray(
        reactions[emoji]
      )
        ?reactions[emoji]
        :[];

    reactions[emoji]=
      list.includes(
        currentUid()
      )
        ?list.filter(
          x=>x!==currentUid()
        )
        :[
          ...list,
          currentUid()
        ];

    await C("messages")
      .doc(m.id)
      .set(
        {reactions},
        {merge:true}
      );
  }


  return (
    <div>

      <div className="section-title">
        Messages
      </div>

      <div className="card message-layout">

        <div className="chat-list">

          <button
            className="btn primary"
            style={{
              width:"100%",
              marginBottom:10
            }}
            onClick={newChat}
          >
            + New chat
          </button>

          {chats.map(chat=>{

            const otherId=
              chat.members?.find(
                x=>x!==currentUid()
              );

            const other=users.find(
              u=>u.uid===otherId
            );

            return (
              <div
                key={chat.id}
                className={
                  "chat-item "+
                  (
                    selected?.id===
                    chat.id
                      ?"active"
                      :""
                  )
                }
                onClick={()=>
                  setSelected(chat)
                }
              >

                <Avatar
                  profile={
                    other||{
                      displayName:
                        chat.name||
                        "Chat"
                    }
                  }
                  size="small"
                />

                <div className="chat-main">

                  <strong>
                    {other?.displayName||
                     chat.name||
                     "Chat"}
                  </strong>

                  <div
                    className="muted"
                    style={{
                      whiteSpace:
                        "nowrap",
                      overflow:
                        "hidden",
                      textOverflow:
                        "ellipsis"
                    }}
                  >
                    {chat.lastMessage||
                     "No messages"}
                  </div>

                </div>

              </div>
            );
          })}

          {chats.length===0 && (
            <div className="empty">
              No chats yet.
            </div>
          )}

        </div>


        <div className="chat-window">

          {!selected ? (

            <div className="empty">
              Select a conversation.
            </div>

          ):(
            <>

              <div className="chat-head">

                <strong>
                  {selected.name||
                   "Chat"}
                </strong>

              </div>


              <div className="messages">

                {messages.length===0 && (
                  <div className="empty">
                    Start the conversation.
                  </div>
                )}

                {messages.map(m=>{

                  const mine=
                    m.senderId===
                    currentUid();

                  return (
                    <div
                      className={
                        "msg "+
                        (
                          mine
                            ?"mine"
                            :""
                        )
                      }
                      key={m.id}
                    >

                      <div>

                        <div className="bubble">

                          <div style={{
                            whiteSpace:
                              "pre-wrap",
                            wordBreak:
                              "break-word"
                          }}>
                            {m.text}
                          </div>

                          <div className="msg-meta">

                            {timeAgo(
                              m.createdAt
                            )}

                            {" "}

                            {mine
                              ?"✓"
                              :" "
                            }

                          </div>

                        </div>


                        <div style={{
                          display:"flex",
                          gap:4,
                          marginTop:3
                        }}>

                          {[
                            "❤️",
                            "👍",
                            "😂"
                          ].map(
                            emoji=>(
                              <button
                                key={emoji}
                                className="btn"
                                style={{
                                  padding:
                                    "3px 6px"
                                }}
                                onClick={()=>
                                  react(
                                    m,
                                    emoji
                                  )
                                }
                              >
                                {emoji}
                              </button>
                            )
                          )}


                          {mine && (
                            <button
                              className="btn danger"
                              style={{
                                padding:
                                  "3px 6px"
                              }}
                              onClick={()=>
                                deleteMessage(m)
                              }
                            >
                              Delete
                            </button>
                          )}

                        </div>

                      </div>

                    </div>
                  );
                })}

              </div>


              <div className="chat-compose">

                <input
                  value={value}
                  onChange={e=>
                    setValue(
                      e.target.value
                    )
                  }
                  placeholder="Write a message..."
                  onKeyDown={e=>{

                    if(
                      e.key==="Enter"
                    ){

                      e.preventDefault();

                      send();
                    }
                  }}
                />

                <button
                  className="btn primary"
                  onClick={send}
                >
                  Send
                </button>

              </div>

            </>
          )}

        </div>

      </div>
    </div>
  );
}

  const [name,setName]=useState(

    setUserName
  ]=useState(

  );

    profile.bio||""
  );

  const [
    online,
    setOnline
  ]=useState(
    profile.showOnline!==false
  );


  async function save(){

    const clean=username(
      userName
    );

    if(!clean){

      alert(
        "Username cannot be empty."
      );

      return;
    }

    try{

      const existing=await C("users")
        .where(
          "username",
          "==",
          clean
        )
        .limit(5)
        .get();

      const taken=
        existing.docs.some(
          d=>d.id!==currentUid()
        );

      if(taken){

        alert(
          "Username already taken."
        );

        return;
      }

      const update={
        displayName:
          text(name)||
          "Nexus User",

        username:clean,

        bio:text(bio),

        showOnline:online,

        updatedAt:serverTime()
      };

      await C("users")
        .doc(currentUid())
        .set(
          update,
          {merge:true}
        );

      setProfile({
        ...profile,
        ...update
      });

      alert(
        "Profile updated."
      );

    }catch(e){
      alert(e.message);
    }
  }


  async function logout(){

    try{

      await auth.signOut();

    }catch(e){

      alert(e.message);
    }
  }


  return (
    <div>

      <div className="section-title">
        Settings
      </div>

      <div className="card pad">

        <h3>
          Profile
        </h3>


        <label className="muted">

        </label>

        <input

          onChange={e=>
            setName(e.target.value)
          }
          style={{
            margin:"5px 0 12px"
          }}
        />


        <label className="muted">
          Username
        </label>

        <input
          value={userName}
          onChange={e=>
            setUserName(
              e.target.value
            )
          }
          style={{
            margin:"5px 0 12px"
          }}
        />


        <label className="muted">
          Bio
        </label>

        <textarea
          value={bio}
          onChange={e=>
            setBio(e.target.value)
          }
          style={{
            marginTop:5
          }}
        />


        <div style={{
          display:"flex",
          justifyContent:
            "space-between",
          padding:"15px 0",
          borderBottom:
            "1px solid var(--line)"
        }}>

          <div>

            <strong>
              Show online status
            </strong>

            <div className="muted">
              Let others see your status.
            </div>

          </div>

          <input
            type="checkbox"
            checked={online}
            onChange={e=>
              setOnline(
                e.target.checked
              )
            }
            style={{
              width:20
            }}
          />

        </div>


        <div style={{
          display:"flex",
          gap:8,
          marginTop:15
        }}>

          <button

            onClick={save}

          </button>

          <button

            onClick={logout}

          </button>

        </div>

      </div>


      <div
        className="card pad"
        style={{
          marginTop:12
        }}
      >

        <strong>
          Made by YASH KISHORE Michalite
        </strong>

        <div
          className="muted"
          style={{
            marginTop:6,
            wordBreak:"break-all"
          }}
        >
          Nexus Social Platform
        </div>

      </div>

    </div>

}


/* =========================================================
   RIGHT SIDEBAR
========================================================= */

function RightSidebar({
  data,
  onProfile
}){

  const trends={};

  data.posts.forEach(p=>{

    (p.hashtags||[])
      .forEach(h=>{

        trends[h]=
          (trends[h]||0)+1;
      });
  });

  const top=
    Object.entries(trends)
      .sort((a,b)=>b[1]-a[1])
      .slice(0,6);

  const people=
    data.users
      .filter(
        u=>u.uid!==currentUid()
      )
      .slice(0,5);

  return (
    <aside className="right">

      <div className="card right-card">

        <strong>
          Trending
        </strong>

        {top.length===0 && (
          <div
            className="muted"
            style={{
              marginTop:10
            }}
          >
            No trends yet.
          </div>
        )}

        {top.map(
          ([h,count])=>(
            <div
              className="trend"
              key={h}
            >

              <strong>
                #{h}
              </strong>

              <div className="muted">
                {count} posts
              </div>

            </div>
          )
        )}

      </div>


      <div className="card right-card">

        <strong>
          Discover people
        </strong>

        {people.map(u=>(
          <button
            key={u.uid}
            onClick={()=>
              onProfile(u.uid)
            }
            style={{
              width:"100%",
              display:"flex",
              gap:8,
              alignItems:"center",
              background:"transparent",
              border:0,
              color:"#fff",
              textAlign:"left",
              padding:"10px 0"
            }}
          >

            <Avatar
              profile={u}
              size="small"
            />

            <div>

              <strong>
                {u.displayName}
              </strong>

              <div className="muted">
                @{u.username}
              </div>

            </div>

          </button>
        ))}

      </div>

    </aside>
  );
}


/* =========================================================
   PRESENCE
========================================================= */

function usePresence(profile){

  useEffect(()=>{

    if(!profile?.uid)return;

    async function online(){

      try{

        await C("presence")
          .doc(profile.uid)
          .set({
            uid:profile.uid,
            online:true,
            lastSeen:serverTime()
          },{merge:true});

      }catch(e){

        console.error(e);
      }
    }

    online();

    const timer=setInterval(
      online,
      30000
    );

    return ()=>{
      clearInterval(timer);
    };

  },[profile?.uid]);
}
